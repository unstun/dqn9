            - text: proposes CoRelNet, a simple architecture based on ‘similarity scores’ which aims to distill the relational inductive biases discovered in previous work into a minimal architecture.
          - paragraph [ref=e119]: We aim to contribute to this literature by proposing a framework for learning hierarchical relational representations in a natural, interpretable, sample-efficient, and parameter-efficient manner.
