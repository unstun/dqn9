            - text: ", with two players competing to find a ‘set’ first). This task is deceptively challenging, and is representative of the type of relational reasoning that humans excel at but machine learning systems still struggle with. To solve the task, one must process the sensory information of individual cards to identify the values of each attribute, then somehow search over combinations of cards and reason about the relations between them. Importantly, this type of relational reasoning requires attending over several attributes and relations simultaneously while representing some notion of ‘groups’. The construct of relational convolutions proposed in this paper is a step towards developing machine learning systems which can perform this kind of relational reasoning."
