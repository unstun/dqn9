          - paragraph [ref=e2016]: On the ‘match pattern’ task, however, RelConvNet is significantly more sample-efficient. We attribute this to the fact that RelConvNet is able to model higher-order relations through its relational convolution module. The ‘match pattern’ task can be thought of as a simple second-order relational task—it involves computing relations between two groups of objects, and comparing the relations within the two groups. The relational convolution module naturally models this kind of situation since it learns representations of the relations among subsets of objects.
