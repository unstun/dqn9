              - text: )
            - text: .
          - paragraph [ref=e99]: In GNNs, the ‘relations’ are given to the model via edges in a graph. In contrast, our architecture, as well as the explicitly relational architectures described below, operate on collections of objects without any relations given as input. Instead, such relational architectures must infer the relevant relations from the objects themselves. Still, graph neural networks can be applied to relational tasks by passing in the collection of objects along with a complete graph. A Transformer Encoder can be thought of as a special case of this architecture, and hence is the representative baseline we compare against in our experiments.
          - paragraph [ref=e101]:
            - text: Attention as modeling relations Several works have proposed architectures with the ability to model relations by incorporating an attention mechanism
            - generic [ref=e102]:
              - text: (Vaswani et al.,,
              - link "2017" [ref=e103] [cursor=pointer]:
                - /url: "#bib.bib16"
              - text: ; Locatello et al.,,
              - link "2020" [ref=e104] [cursor=pointer]:
                - /url: "#bib.bib9"
              - text: ; Santoro et al.,,
              - link "2018" [ref=e105] [cursor=pointer]:
                - /url: "#bib.bib12"
              - text: ; Zambaldi et al.,,
              - link "2018" [ref=e106] [cursor=pointer]:
                - /url: "#bib.bib20"
              - text: ; Veličković et al.,,
              - link "2017" [ref=e107] [cursor=pointer]:
                - /url: "#bib.bib17"
              - text: )
            - text: . Attention mechanisms model relations between objects implicitly as an intermediate step in a form of neural message-passing in order to update the representation of each object as a function of its context.
          - paragraph [ref=e109]:
            - text: Emerging literature on “explicitly relational” architectures. There exists a growing literature on neural architectures which aim to explicitly model relational information between objects. An early example is
