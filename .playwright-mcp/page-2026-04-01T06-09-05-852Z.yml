    - article [ref=e56]:
      - generic [ref=e57]:
        - heading "Abstract" [level=6] [ref=e58]
        - paragraph [ref=e59]: A maturing area of research in deep learning is the development of architectures that can learn explicit representations of relational features. In this paper, we focus on the problem of learning representations of hierarchical relations, proposing an architectural framework we call “relational convolutional networks”. Given a sequence of objects, a “multi-dimensional inner product relation” module produces a relation tensor describing all pairwise relations. A “relational convolution” layer then transforms the relation tensor into a sequence of new objects, each describing the relations within some group of objects at the previous layer. Graphlet filters, analogous to filters in convolutional neural networks, represent a template of relations against which the relation tensor is compared at each grouping. Repeating this yields representations of higher-order, hierarchical relations. We present the motivation and details of the architecture, together with a set of experiments to demonstrate how relational convolutional networks can provide an effective framework for modeling relational tasks that have hierarchical structure.
      - paragraph [ref=e61]:
        - generic [ref=e62]:
          - text: "Relational Convolutional Networks: A framework for learning"
          - text: representations of hierarchical relations
      - generic [ref=e63]:
        - heading "1 Introduction" [level=2] [ref=e64]
        - paragraph [ref=e66]: Modeling of relations between objects is important to a range of machine learning problems. For instance, an image analysis application might rely on comparing objects in terms of relations that extract color, size, or texture features; a natural language task may use relations that are based on syntactic or semantic features of pairs of words. To enable efficient learning of relational information, it is important to explore learning architectures that support processing of relations in a natural, expressive, and efficient manner. In this paper we propose a framework we call “relational convolutional networks.” Our framework provides for relational representation learning what standard convolutional neural networks provide for typical image processing applications—a natural, expressive architecture for extracting hierarchical features of the raw data that can be used for building flexible prediction algorithms.
        - paragraph [ref=e68]:
          - text: A schematic of the proposed architecture to support hierarchical relational learning is shown in
          - link "Figure 1" [ref=e69] [cursor=pointer]:
            - /url: "#S1.F1"
          - text: . The key idea involves formalizing a notion of “convolving” a relation tensor, describing the pairwise relations in a sequence of objects, with a “graphlet filter” which represents a template of relations between subsets of objects. Each composition of those operations computes relational features of a higher order. This is analogous to the manner in which convolutional layers in a CNN can be composed to construct a chain of feature maps.
        - 'figure "Figure 1: Proposed architecture for relational convolutional networks. Hierarchical relations are modeled by iteratively computing pairwise relations between objects and convolving the resultant relation tensor with graphlet filters representing templates of relations between subsets of objects." [ref=e70]':
          - img "Refer to caption" [ref=e71]
          - generic [ref=e72]:
            - generic [ref=e73]: "Figure 1:"
            - text: Proposed architecture for relational convolutional networks. Hierarchical relations are modeled by iteratively computing pairwise relations between objects and convolving the resultant relation tensor with graphlet filters representing templates of relations between subsets of objects.
        - paragraph [ref=e75]:
          - text: In a series of experiments, we show how relational convolutional neural networks provide an effective framework (and inductive bias) for relational learning. We first carry out experiments on “relational games” proposed as a benchmark for relational reasoning by
          - generic [ref=e76]:
            - text: (Shanahan et al.,,
            - link "2020" [ref=e77] [cursor=pointer]:
              - /url: "#bib.bib15"
            - text: )
          - text: . This consists of a suite of binary classification tasks for identifying abstract relational rules between a set of objects represented as images. We next carry out experiments on a version of the SET game, which requires processing of higher-order relations between multiple attributes on a set of cards. For both tasks, relational convolutional networks are able to achieve more sample efficient learning compared to Transformers, as well as other architectures that have been specifically developed for relational learning.
        - generic [ref=e78]:
          - heading "1.1 Related Work" [level=3] [ref=e79]
          - paragraph [ref=e81]:
            - text: Several previous works have considered the design of machine learning architectures which support the representation of relational information, in various forms
