        - paragraph [ref=e2220]:
          - text: Limitations and future work. One aspect of the architecture that our empirical evaluations miss is the use of grouping layers and relational convolutions with learnable soft groups. Explicitly modeling groups was unnecessary in the experiments we considered since the number of objects
          - math [ref=e2221]:
            - generic [ref=e2223]: m
          - text: "was small, so considering all possible combinations was feasible. Hence, a research question for future work is: when"
          - math [ref=e2224]:
            - generic [ref=e2226]: m
          - text: is large, how effective are grouping layers at identifying the relevant groups? How does this approach compare to considering a random sample of discrete groups?
        - paragraph [ref=e2228]:
          - text: In addition, the tasks considered here are solvable by modeling only second-order relations at most. We observe that the relational convolutional networks architecture saturates the relational games benchmark of
          - generic [ref=e2229]:
            - text: (Shanahan et al.,,
            - link "2020" [ref=e2230] [cursor=pointer]:
              - /url: "#bib.bib15"
            - text: )
          - text: . A more thorough evaluation of the relational convolutional networks architecture, and future architectures for modeling hierarchical relations, requires the development of new benchmark tasks and datasets which involve a larger number of objects and higher-order relations. This is a non-trivial task that we leave for future work.
        - paragraph [ref=e2232]: Finally, the experiments considered here are synthetic relational tasks designed for a controlled evaluation. In more realistic settings, we envision relational convolutional networks as modules embedded in a broader architecture. For example, the relational convolutions framework can be naturally integrated into a graph neural network by using the relational convolution outputs as the node inputs and the relation tensor as the graph inputs. Similarly, the framework can be integrated into a Transformer-based model for general sequence modeling tasks by having the decoder attend to the sequence of relational objects produced by relational convolutions.
