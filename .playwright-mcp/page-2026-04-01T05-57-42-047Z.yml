                            - generic [ref=e3709]: Figure 3. Two scenarios used to collect collision avoidance experiences for multiple robots, where the blue digital circles represent the target goals of the robot with the corresponding number, red lines specify the straight paths from the current position to the target for robots and other black pixels represent various obstacles. Blue boxes on the right illustrate egocentric local grid maps of each robot.
                          - generic [ref=e3710]:
                            - text: Following the idea of curriculum learning, we decompose our train process into two stages. In the first stage, we train the policy in environments of the random scenario (illustrated in
                            - link "Figure 3" [ref=e3711] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-20-04836-f003"
                            - text: a) with eight robots and four obstacles. This allows robots to find a policy to avoid obstacles quickly. Once the policy has achieved an acceptable performance, we fix the trained policy and move to the second stage. In the second state, we continue to train the policy in environments of both the random scenario and circular scenario (illustrated in
                            - link "Figure 3" [ref=e3712] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-20-04836-f003"
                            - text: b), where the number of robots is increased to 16.
                          - generic [ref=e3713]:
                            - link "Figure 4" [ref=e3714] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-20-04836-f004"
                            - text: a shows the learning curve for an ablation study to illustrate the effect of two-stage curriculum learning, where “Stage-1” denotes the expected return for the training process in the first stage, “Stage-2” denotes the expected return for the training process in the second stage, and “From scratch” denotes the expected return for the training process without using two-stage curriculum learning. Note that two-stage curriculum learning helps the policy to converge with a higher expected return, i.e., a better collision avoidance performance.
