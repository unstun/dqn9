                      - generic [ref=e266]:
                        - text: With the rapid development of autonomous mobile robots in recent years, more and more attentions have been paid to multi-robot collision avoidance, which is crucial in many applications, such as multi-robot search and rescue [
                        - link "1" [ref=e267] [cursor=pointer]:
                          - /url: "#B1-sensors-20-04836"
                        - text: "], multi-robot intelligent warehouse system ["
                        - link "2" [ref=e268] [cursor=pointer]:
                          - /url: "#B2-sensors-20-04836"
                        - text: "], autonomous navigation through human crowds ["
                        - link "3" [ref=e269] [cursor=pointer]:
                          - /url: "#B3-sensors-20-04836"
                        - text: "] and autonomous driving ["
                        - link "4" [ref=e270] [cursor=pointer]:
                          - /url: "#B4-sensors-20-04836"
                        - text: "]. Multi-robot collision avoidance allows each robot to reach its target position from a starting place while avoiding collisions with other robots and obstacles. The dynamic interactions between diverse autonomous robots and the uncertainty in the environment make the problem highly challenging."
                      - generic [ref=e271]:
                        - text: "Multi-robot collision avoidance methods can generally be classified into two categories: centralized methods and decentralized methods. A centralized method usually provides a center server to determine each robot’s action using an optimization algorithm after collecting all the relevant information, which has been widely applied in many applications, such as task allocation ["
                        - link "5" [ref=e272] [cursor=pointer]:
                          - /url: "#B5-sensors-20-04836"
                        - text: "], formation control ["
                        - link "6" [ref=e273] [cursor=pointer]:
                          - /url: "#B6-sensors-20-04836"
                        - text: "] and object transportation ["
                        - link "7" [ref=e274] [cursor=pointer]:
                          - /url: "#B7-sensors-20-04836"
                        - text: ","
                        - link "8" [ref=e275] [cursor=pointer]:
                          - /url: "#B8-sensors-20-04836"
                        - text: "]. These centralized methods assume that the actions of every robot are determined by a central server with knowledge of every robots’ intents, like initial states and goals, and their surrounding environments. Based on this knowledge, the central server would compute collision avoidance actions by planning optimal paths for every robot simultaneously. Note that centralized methods can generally guarantee safety, completeness and approximate optimality. However, these methods are fragile and difficult to scale to systems with a large number of robots, which is mainly due to the following reasons. Firstly, it becomes more and more challenging for centralized control and scheduling when the number of robots increases. Secondly, a reliable synchronized communication is required between the central server and every robot, which is either uneconomical or not feasible for large-scale systems. Thirdly, the centralized system is vulnerable to various failures, like disturbances of the central server, communication between robots or robots’ motors and sensors. Furthermore, these centralized methods are inapplicable when multiple robots are deployed in an unknown and unstructured environment, especially in a human–robot coexisting environment."
                      - generic [ref=e276]: Different from the centralized method, a decentralized method allows each robot to perform collision avoidance relying on its local perception of the surrounding environment, which no longer requires a central server. Here, mobile robots would need to cooperate without necessarily having knowledge of other robot’s intents. Decentralized methods can be roughly divided into two groups, i.e., agent-level and sensor-level, on information specified in each robot’s local perception. In particular, an agent-level method takes into account positions and the movement data, like velocities, accelerations and paths, of other robots. A sensor-level method uses the sensor data directly.
                      - generic [ref=e277]:
                        - text: Existing work on agent-level decentralized collision avoidance can be further divided into three categories, i.e., reaction-based, trajectory-based and learning-based. In particular, a reaction-based agent-level decentralized method specifies one-step interaction rules for the current geometric configuration. Velocity Obstacles (VO) [
                        - link "9" [ref=e278] [cursor=pointer]:
                          - /url: "#B9-sensors-20-04836"
                        - text: "] are widely used to specify such geometric configurations, which require positions and velocities of other robots to induce the VO for the selection of collision-free motion. Optimal reciprocal collision avoidance (ORCA) ["
                        - link "10" [ref=e279] [cursor=pointer]:
                          - /url: "#B10-sensors-20-04836"
                        - text: "] is one of the most successful VO-based approaches, which guarantees collision-free trajectories except for densely packed conditions. Specifically, ORCA provides a sufficient condition for multiple robots to avoid collisions with each other in a short time horizon, and can easily be scaled to large systems with many robots. ORCA and its variants ["
                        - link "11" [ref=e280] [cursor=pointer]:
                          - /url: "#B11-sensors-20-04836"
                        - text: ","
                        - link "12" [ref=e281] [cursor=pointer]:
                          - /url: "#B12-sensors-20-04836"
                        - text: "] have been widely used in crowd simulation and multi-agent systems. However, these methods use heuristics to construct parametric collision avoidance models, which are tedious to be tuned for satisfactory performance. These methods also require the perfect sensing of surrounding robots’ positions, velocities and shapes, which is difficult to achieve in real-world applications. Extensions in ["
                        - link "13" [ref=e282] [cursor=pointer]:
                          - /url: "#B13-sensors-20-04836"
                        - text: ","
                        - link "14" [ref=e283] [cursor=pointer]:
                          - /url: "#B14-sensors-20-04836"
                        - text: ","
                        - link "15" [ref=e284] [cursor=pointer]:
                          - /url: "#B15-sensors-20-04836"
                        - text: "] require communication networks to share robots’ positions and velocities, which hurt the robustness and flexibility of the system. By using a motion caption system as the global localization infrastructure, Zhou et al. ["
                        - link "16" [ref=e285] [cursor=pointer]:
                          - /url: "#B16-sensors-20-04836"
                        - text: "] only require positions of surrounding robots using their buffered Voronoi cells. ORCA has also been extended to non-holonomic robots. ORCA-DD ["
                        - link "17" [ref=e286] [cursor=pointer]:
                          - /url: "#B17-sensors-20-04836"
                        - text: "] doubles the effective radius of each robot to ensure collision-free and smooth paths for robots under differential constraints, which has troubles in narrow passages and unstructured environments. NH-ORCA ["
                        - link "18" [ref=e287] [cursor=pointer]:
                          - /url: "#B18-sensors-20-04836"
                        - text: ","
                        - link "19" [ref=e288] [cursor=pointer]:
                          - /url: "#B19-sensors-20-04836"
                        - text: "] enables a differential drive robot to follow the desired speed command within an error, which only slightly increases the effective radius of a robot and outperforms ORCA-DD in collision avoidance."
                      - generic [ref=e289]:
                        - text: On the other hand, a trajectory-based agent-level decentralized method explicitly evaluates the future joint states of robots by anticipating other robots’ future trajectories. A subclass of non-cooperative methods [
                        - link "20" [ref=e290] [cursor=pointer]:
                          - /url: "#B20-sensors-20-04836"
                        - text: ","
                        - link "21" [ref=e291] [cursor=pointer]:
                          - /url: "#B21-sensors-20-04836"
                        - text: "] first estimates predicted paths of other robots, then plans a collision-free path for the ego robot. However, these predicted paths usually mark a large portion of the space to be unsafe in crowded environments, which leads to the freezing robot problem ["
                        - link "22" [ref=e292] [cursor=pointer]:
                          - /url: "#B22-sensors-20-04836"
                        - text: "]. To overcome this problem, a subclass of cooperative methods ["
                        - link "23" [ref=e293] [cursor=pointer]:
                          - /url: "#B23-sensors-20-04836"
                        - text: ","
                        - link "24" [ref=e294] [cursor=pointer]:
                          - /url: "#B24-sensors-20-04836"
                        - text: ","
                        - link "25" [ref=e295] [cursor=pointer]:
                          - /url: "#B25-sensors-20-04836"
                        - text: ","
                        - link "26" [ref=e296] [cursor=pointer]:
                          - /url: "#B26-sensors-20-04836"
                        - text: "] was proposed to take into account the interactions between robots. A cooperative trajectory-based method first infers other robots’ intents, computes jointly feasible paths of all nearby robots, then chooses paths with better quality, e.g., shorter time for every robot to reach their corresponding goals. However, it is hard to estimate other robots’ intents and computationally expensive to generate paths for every robot. Furthermore, the difference between the predicted path and the actual path of each robot grows greater when the time increases, which requires a rapid update for the method."
                      - generic [ref=e297]:
                        - text: Decentralized collision avoidance approaches discussed above may require extensive computational efforts or a set of assumptions that may not be met in practice. These approaches also involve a lot of parameters that need to be adjusted manually rather than being able to learn automatically from past experience, which makes them harder to handle unpredictable situations. Learning-based approaches try to optimize a parameterized policy for collision avoidance from experiences in various environments. Deep neural networks have been widely applied in the supervised learning paradigm to train a collision avoidance policy that maps sensor input to the robot’s control commands to navigate a robot in environments with static obstacles [
                        - link "27" [ref=e298] [cursor=pointer]:
                          - /url: "#B27-sensors-20-04836"
                        - text: ","
                        - link "28" [ref=e299] [cursor=pointer]:
                          - /url: "#B28-sensors-20-04836"
                        - text: "]. Giusti et al. ["
                        - link "29" [ref=e300] [cursor=pointer]:
                          - /url: "#B29-sensors-20-04836"
                        - text: "] apply neural networks to classify the input color images and determines actions that would keep the quadrotor on the trail. To obtain the large number of training samples, some hikers were equipped with three head-mounted cameras and were required to walk on the mountain path to collect the data. Gandhi et al. ["
                        - link "30" [ref=e301] [cursor=pointer]:
                          - /url: "#B30-sensors-20-04836"
                        - text: "] create one of the largest crash datasets for drones to train unmanned aerial vehicles to fly. Tai et al. ["
                        - link "31" [ref=e302] [cursor=pointer]:
                          - /url: "#B31-sensors-20-04836"
                        - text: "] propose a hierarchical structure that combines the decision-making process with a convolutional neural network. Pfeiffer et al. ["
                        - link "32" [ref=e303] [cursor=pointer]:
                          - /url: "#B32-sensors-20-04836"
                        - text: "] propose a model that is capable to learn complex mappings directly from the 2D laser range results to corresponding control commands of a mobile indoor robot. However, these methods require a massive labeled dataset for the training and suffer from the distribution mismatch between the training dataset and the testing environment, which limits their applications in the real world. Some of them are just able to avoid simple static obstacles in empty corridors."
                      - generic [ref=e304]:
                        - text: On the other hand, deep reinforcement learning (DRL) approaches have achieved significant success in many challenging tasks, such as Go game [
                        - link "33" [ref=e305] [cursor=pointer]:
                          - /url: "#B33-sensors-20-04836"
                        - text: ","
                        - link "34" [ref=e306] [cursor=pointer]:
                          - /url: "#B34-sensors-20-04836"
                        - text: "], video games ["
                        - link "35" [ref=e307] [cursor=pointer]:
                          - /url: "#B35-sensors-20-04836"
                        - text: ","
                        - link "36" [ref=e308] [cursor=pointer]:
                          - /url: "#B36-sensors-20-04836"
                        - text: "] and robotics ["
                        - link "37" [ref=e309] [cursor=pointer]:
                          - /url: "#B37-sensors-20-04836"
                        - text: ","
                        - link "38" [ref=e310] [cursor=pointer]:
                          - /url: "#B38-sensors-20-04836"
                        - text: "]. In contrast, a DRL-based method is able to learn from a large number of trials and corresponding feedbacks (rewards). In order to learn sophisticated control strategies through DRL, the robot needs to interact with the training environment for a long time to accumulate experience about the consequences of taking different actions in different states. However, collecting such interactive data in the real world is very expensive, time-consuming and sometimes impossible due to security issues ["
                        - link "39" [ref=e311] [cursor=pointer]:
                          - /url: "#B39-sensors-20-04836"
                        - text: "]. Inspired by VO-based approaches, Chen et al. ["
                        - link "40" [ref=e312] [cursor=pointer]:
                          - /url: "#B40-sensors-20-04836"
                        - text: "] provide a DRL-based method to train an agent-level collision avoidance policy, where the network still requires the expensive movement data of the ego robot, its neighbors and moving obstacles as its inputs. In their extension ["
                        - link "41" [ref=e313] [cursor=pointer]:
                          - /url: "#B41-sensors-20-04836"
                        - text: "], multiple perception tasks, like segmentation, recognition and tracking, are performed on multiple sensors to estimate the movement data of nearby robots and moving obstacles. However, these perception tasks require extensive computational efforts for online utilization. Notice that, though agent-level methods have the disadvantage of requiring a precise and complex front-end perception procedure, they have the advantages of adaptable to various sensors, easy to be trained in simulation environments and easy to be deployed to a real robot."
                      - generic [ref=e314]:
                        - text: To alleviate the disadvantage of the agent-level decentralized collision avoidance methods, Long et al. [
                        - link "42" [ref=e315] [cursor=pointer]:
                          - /url: "#B42-sensors-20-04836"
                        - text: "] and Fan et al. ["
                        - link "43" [ref=e316] [cursor=pointer]:
                          - /url: "#B43-sensors-20-04836"
                        - text: "] provide sensor-level decentralized collision avoidance policies that directly map raw sensor data, i.e., 2D laser scan data, to robot’s control commands. Notice that the difference between the laser data in a simulator and the real world is limited. Then these collision avoidance policies can be trained in various simulation environments and can later be deployed to robots in the real world. However, these methods are only restricted to specific sensors, i.e., 2D laser sensors. Moreover, multiple sensors and their fusion are required for mobile robots to navigate autonomously and safely ["
                        - link "44" [ref=e317] [cursor=pointer]:
                          - /url: "#B44-sensors-20-04836"
                        - text: "]. For instance, a 2D laser sensor has troubles to handle 3D collision avoidance in an office-like environment, where an RGB-D camera, like Kinect, can be helpful."
                      - generic [ref=e318]:
                        - text: In this paper, we propose a decentralized map-based DRL approach for multi-robot collision avoidance in a distributed and communication-free environment. Compared to agent-level [
                        - link "41" [ref=e319] [cursor=pointer]:
                          - /url: "#B41-sensors-20-04836"
                        - text: "] and sensor-level ["
                        - link "43" [ref=e320] [cursor=pointer]:
                          - /url: "#B43-sensors-20-04836"
                        - text: "] methods, we use the egocentric local grid map of a robot to represent the environmental information around it including its shape and observable appearances of other robots and obstacles, which can be easily generated by using multiple sensors or sensor fusion. Then we apply the distributed proximal policy optimization (DPPO) algorithm to train a convolutional neural network that directly maps three frames of egocentric local grid maps and the robot’s relative local goal positions into low-level robot control commands. Our map-based method has the advantages of both agent-level and sensor-level methods, the map-based approach is adaptable to various sensors, easy to be trained in simulation environments, more robust to noisy sensor data, does not require robots’ movement data and a precise and complex front-end perception procedure, and considers sizes and shapes of related robots, which make it to be more efficient, robust and easier to be deployed to real robots. We first train the neural network in a specified simulator of multiple mobile robots using DPPO, where a two-stage curriculum learning strategy for two scenarios is used to improve the performance. Then we deploy the trained model to real robots to perform collision avoidance in their navigation without tedious parameter tuning. We evaluate the approach with multiple scenarios both in the simulator and on four differential-drive mobile robots in the real world. Both qualitative and quantitative experiments show that our approach is efficient and outperforms existing DRL-based approaches in many indicators. We also conduct ablation studies showing the positive effects of using egocentric grid maps and multi-stage curriculum learning."
                      - generic [ref=e321]: "Our main contributions are summarized as follow:"
                      - list [ref=e323]:
                        - listitem [ref=e324]:
                          - generic [ref=e325]: We propose a map-based DRL multi-robot collision avoidance approach in a communication-free environment, where egocentric local grid maps are used to represent the environmental information around the robot, which can be easily generated by using multiple sensors or sensor fusion.
                        - listitem [ref=e326]:
                          - generic [ref=e327]: We train the collision avoidance policy in multiple simulation environments using DPPO, which can be deployed to real robots without tedious parameter tuning, where the network considers egocentric local grid maps as inputs and directly outputs low-level robot control commands.
                        - listitem [ref=e328]:
                          - generic [ref=e329]: We evaluate our approach with multiple scenarios both in the simulator and on many differential-drive mobile robots in the real world. Both qualitative and quantitative experiments show that our approach is efficient and outperforms existing related approaches in many indicators.
                        - listitem [ref=e330]:
                          - generic [ref=e331]: We conduct ablation studies that specify the positive effects of using egocentric grid maps and multi-stage curriculum learning.
                      - generic [ref=e332]:
                        - text: The rest of this paper is organized as follows. The formulation of multi-robot collision avoidance is presented in
