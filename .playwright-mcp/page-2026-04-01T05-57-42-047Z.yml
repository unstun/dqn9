                          - generic [ref=e4189]: Figure 16. (a) The basic static scenario, where some paper boxes are places as static obstacles to block the robot’s path from its starting position to its target. (b) The extended static scenario, where two obstacles are added to the front and the rear of the narrow opening of a line of obstacles. (c) The basic dynamic scenario, where cardboard appears suddenly in the moving path of the robot. (d) The extended dynamic scenario, where cardboard appears suddenly and a luggage moves across the path of the robot. Subfigures on the left show the trajectories and the grid maps of the robot. Subfigures on the right show the environments in the real world, which correspond to situations that the robot is at the place of the red circle in corresponding left figures. Yellow bounding boxes in the figures denote corresponding dynamic obstacles in the environments.
                        - generic [ref=e4190]: More demonstrations on these static and dynamic scenarios can be found in the demonstration video. These experiments show that the robot using our learned collision avoidance policy performs well in these scenarios.
                      - generic [ref=e4191]:
                        - heading "5.3. Multi-Robot Scenarios" [level=3] [ref=e4192]
                        - generic [ref=e4193]: In this section, we introduce a serious of real-world scenarios for multiple robots to evaluate the performance of the multi-robot collision avoidance policy generated by our map-based DPPO approach. Moreover, both static obstacles and dynamic pedestrians are also added in these scenarios.
                        - generic [ref=e4194]:
                          - text: We first introduce a real-world swap scenario where two robots are required to move towards each other and swap their positions.
                          - link "Figure 17" [ref=e4195] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f017"
                          - text: a illustrates the performance of the robots in this scenario, in which both robots successfully reach their targets without collision. Next, we extend the two-robot cross scenario by randomly placing some static obstacles to increase the difficulty.
                          - link "Figure 17" [ref=e4196] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f017"
                          - text: b illustrates the performance of the robots in the new scenario, in which both robots still successfully reach their targets without collision.
                          - link "Figure 17" [ref=e4197] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f017"
                          - text: b also shows that the robot can automatically wait for a moment and avoid the narrow opening when it observes that the other robot is going through the opening. Then, we further extend the scenario by asking a pedestrian to walk across the paths of both robots.
                          - link "Figure 17" [ref=e4198] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f017"
                          - text: c illustrates the performance of the robots in this extended scenario, in which both robots adaptively slow down their speed and wait for the pass of the pedestrian before they each their targets successfully. Notice that pedestrians are not introduced in the training procedure of the collision avoidance policy in our approach and the shape and dynamic characteristics of pedestrians are quite different from other robots and static obstacles. However, the learned policy still performs well in the scenario with pedestrians. Later, we extend the two-robot scenario to involve three robots. We introduce the three-robot circle scenario where three robots are placed on a circle and their targets are set at opposite positions on the circle.
                          - link "Figure 17" [ref=e4199] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f017"
                          - text: d illustrates the performance of the robots in this scenario, in which all robots successfully reach their targets without collision. At last, we extend these scenarios to involve four robots.
                          - link "Figure 18" [ref=e4200] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f018"
                          - text: illustrates the performances of four robots in these scenarios, in which all robots still successfully reach their targets without collision. In the four-robot cross scenario shown in
                          - link "Figure 18" [ref=e4201] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f018"
                          - text: a, two groups of robots cross each other and reach their respective target points.
