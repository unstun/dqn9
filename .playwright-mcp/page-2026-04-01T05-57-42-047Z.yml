                        - heading "4.5. Robustness Evaluation" [level=3] [ref=e4079]
                        - generic [ref=e4080]: In addition to the generalization and the navigation efficiency, the learned policy is also preferred to be stable and robust to model uncertainty and input noises. We are to verify the robustness of our learned policy by multiple experiments in this section.
                        - generic [ref=e4081]:
                          - heading "4.5.1. Different Sensor Noise" [level=4] [ref=e4082]
                          - generic [ref=e4083]:
                            - text: Sensor noise and perceptual errors are common in robot systems. To verify the ability of different approaches to resist noise, we gradually increase the error of laser sensing distance data for Sensor-level policy and our Map-based (Stage-2) policy, and gradually increase the perception error of surrounding robots’ positions and velocities for NH-ORCA policy.
                            - link "Figure 11" [ref=e4084] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-20-04836-f011"
                            - text: depicts that the success rate of all three policies in both the circle scenario with 12 robots and the new random scenario with 10 robots when the variance of Gaussian noise increases. The results show that DRL-based policies, i.e., Map-based and Sensor-level polices, are resilient to noise, which sensor noise affects the success rate of NH-ORCA policy greatly.
                          - generic [ref=e4085]:
                            - generic [ref=e4087] [cursor=pointer]:
                              - img "Sensors 20 04836 g011" [ref=e4088]
                              - link [ref=e4089]:
                                - /url: "#fig_body_display_sensors-20-04836-f011"
                            - generic [ref=e4090]: Figure 11. (a) Comparison of the success rate of NH-ORCA policy, Sensor-level policy and Map-based policy in the circle scenario with 12 robots, when the standard deviation of sensor noise increases. (b) Comparison of success rates between the Map-based policy, Sensor-level policy and NH-ORCA in the new random scenario with 10 robots, when the standard deviation of sensor noise increases.
                        - generic [ref=e4091]:
                          - heading "4.5.2. Different FOV Limits" [level=4] [ref=e4092]
                          - generic [ref=e4093]:
                            - text: Different sensors have different FOVs, which also affects the performance of the collision avoidance policy greatly. We consider five laser sensors with different FOVs and apply our Map-based DPPO approach on their sensor data to train corresponding Map-based policies.
                            - link "Figure 12" [ref=e4094] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-20-04836-f012"
                            - text: a shows the learning curves of these Map-based policies and
                            - link "Figure 12" [ref=e4095] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-20-04836-f012"
                            - text: b shows the success rate of these policies in the new random scenario. Moreover, we also test the Map-based policy trained by the sensor with 180-degree FOV on robots with restricted FOVs. The result shows that the policy performs better when robots have the same FOV in both training and testing scenarios.
                          - generic [ref=e4096]:
                            - generic [ref=e4098] [cursor=pointer]:
