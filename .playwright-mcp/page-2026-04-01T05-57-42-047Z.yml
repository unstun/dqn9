                      - /url: mailto:?&subject=From%20MDPI%3A%20%22Distributed%20Non-Communicating%20Multi-Robot%20Collision%20Avoidance%20via%20Map-Based%20Deep%20Reinforcement%20Learning"&body=https://www.mdpi.com/809410%3A%0A%0ADistributed%20Non-Communicating%20Multi-Robot%20Collision%20Avoidance%20via%20Map-Based%20Deep%20Reinforcement%20Learning%0A%0AAbstract%3A%20It%20is%20challenging%20to%20avoid%20obstacles%20safely%20and%20efficiently%20for%20multiple%20robots%20of%20different%20shapes%20in%20distributed%20and%20communication-free%20scenarios%2C%20where%20robots%20do%20not%20communicate%20with%20each%20other%20and%20only%20sense%20other%20robots%26rsquo%3B%20positions%20and%20obstacles%20around%20them.%20Most%20existing%20multi-robot%20collision%20avoidance%20systems%20either%20require%20communication%20between%20robots%20or%20require%20expensive%20movement%20data%20of%20other%20robots%2C%20like%20velocities%2C%20accelerations%20and%20paths.%20In%20this%20paper%2C%20we%20propose%20a%20map-based%20deep%20reinforcement%20learning%20approach%20for%20multi-robot%20collision%20avoidance%20in%20a%20distributed%20and%20communication-free%20environment.%20We%20use%20the%20egocentric%20local%20grid%20map%20of%20a%20robot%20to%20represent%20the%20environmental%20information%20around%20it%20including%20its%20shape%20and%20observable%20appearances%20of%20other%20robots%20and%20obstacles%2C%20which%20can%20be%20easily%20generated%20by%20using%20multiple%20sensors%20or%20sensor%20fusion.%20Then%20we%20apply%20the%20distributed%20proximal%20policy%20optimization%20%28DPPO%29%20algorithm%20to%20train%20a%20convolutional%20neural%20network%20that%20directly%20maps%20three%20frames%20of%20egocentric%20local%20grid%20maps%20and%20the%20robot%26rsquo%3Bs%20relative%20local%20goal%20positions%20into%20low-level%20robot%20control%20commands.%20Compared%20to%20other%20methods%2C%20the%20map-based%20approach%20is%20more%20robust%20to%20noisy%20sensor[...]
