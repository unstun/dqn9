                          - text: We deploy the Map-based policy to four robots to perform multi-robot obstacle avoidance in the real world. As shown in
                          - link "Figure 15" [ref=e4131] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f015"
                          - text: ", each robot is based on TurtleBot 2 with Kobuki base. Then the robot has a circular shape with a radius of 0.17 m. The laser sensor used in each robot is either a Hokuyo UTM-30LX 2D LiDAR or a Hokuyo URG-04LX 2D LiDAR (which has a lower price). The details of the Hokuyo 2D LiDAR sensors are listed in"
                          - link "Table 4" [ref=e4132] [cursor=pointer]:
                            - /url: "#table_body_display_sensors-20-04836-t004"
                          - text: . All of these sensors provide a 180-degree FOV observation of the surrounding environment in front of the robot. The robot applies an NVIDIA Jetson TX2 as its computing platform. In specific, we implemented four versions of such a robot, where two of them are equipped with Hokuyo UTM-30LX 2D LiDARs and two of them are Hokuyo URG-04LX 2D LiDARs.
