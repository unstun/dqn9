                          - text: b shows the experimental results of the four-robot circle scenario, where four robots are placed on a circle and their targets are set at opposite positions. In order to further prove the generalization ability of our model in more complex environments, we added three static obstacles or two pedestrians to the four-robot circle scenario. The experimental results are shown in
                          - link "Figure 18" [ref=e4203] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f018"
                          - text: c,d. All robots can reach their respective target points without collision in such a dynamic and crowded environment.
