                        - heading "5.2. Static and Dynamic Scenarios" [level=3] [ref=e4176]
                        - generic [ref=e4177]: In this section, we introduce a series of real-world scenarios for a single robot to evaluate the performance of the collision avoidance policy generated by our map-based DPPO approach.
                        - generic [ref=e4178]:
                          - text: We first introduce a basic static scenario where some paper boxes are places as static obstacles to block the robot’s path from its starting position to its target.
                          - link "Figure 16" [ref=e4179] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f016"
                          - text: a illustrates an environment of this scenario, in which the robot can successfully pass through a line of obstacles with a narrow opening. Next, we extend the scenario by adding obstacles to the front and the rear of the opening to increase the difficulty.
                          - link "Figure 16" [ref=e4180] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f016"
                          - text: b illustrates an environment of such scenario, in which the robot can still successfully pass through the narrow opening. Then we introduce dynamic scenarios by allowing some obstacles to appear suddenly. In specific,
                          - link "Figure 16" [ref=e4181] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f016"
                          - text: c illustrates an environment in which a cardboard appears suddenly in the moving path of the robot.
                          - link "Figure 16" [ref=e4182] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f016"
                          - text: d illustrates an environment extended from the situation in
                          - link "Figure 16" [ref=e4183] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-20-04836-f016"
                          - text: c, where a luggage moves across the path of the robot. In both environments, the robot successfully detects the dynamic obstacles and adjusts its movement in time to avoid the collision.
                        - generic [ref=e4184]:
                          - generic [ref=e4186] [cursor=pointer]:
                            - img "Sensors 20 04836 g016" [ref=e4187]
