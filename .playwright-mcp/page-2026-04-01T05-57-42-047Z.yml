                    - generic [ref=e4120]:
                      - heading "5. Real-World Experiments" [level=2] [ref=e4121]
                      - generic [ref=e4122]:
                        - text: In this section, we deploy the trained Map-based policy to real robots to perform multi-robot obstacle avoidance in the real world. As discussed in
                        - link "Section 1" [ref=e4123] [cursor=pointer]:
                          - /url: "#sec1-sensors-20-04836"
                        - text: ", the map-based approach is more robust to noisy sensor data, does not require robots’ movement data and considers sizes and shapes of related robots, which make it more efficient and easier to be deployed to real robots. However, there are more challenges in deploying the learned collision avoidance policy from simulation to the real world. As discussed in ["
                        - link "43" [ref=e4124] [cursor=pointer]:
                          - /url: "#B43-sensors-20-04836"
                        - text: "], besides noisy sensor data, the clocks of each individual robot are not synchronized with each other, which results in an asynchronous distributed system hard to control, and robots cannot provide consistent behavior with the same control command, due to many realistic factors such as mechanical details, motor characteristics and the approximation with friction model. In addition to the generalization capabilities and robustness on simulation environments as discussed in"
                        - link "Section 4" [ref=e4125] [cursor=pointer]:
                          - /url: "#sec4-sensors-20-04836"
                        - text: ", the real-world experiments show that the map-based approach can be easily deployed to real robots and performs well in the real world. For the specific performance of the robots in the experiments, please refer to the demonstration video at"
                        - link "https://youtu.be/KOb1q23L7-U" [ref=e4126] [cursor=pointer]:
                          - /url: https://youtu.be/KOb1q23L7-U
                        - text: .
                      - generic [ref=e4127]: In the following, we first introduce the hardware setup of real robots. Then, we evaluate the performance of these robots in multiple scenarios in the real world. At last, we demonstrate long-range navigation of the robot with our learned map-based collision avoidance policy in a corridor environment.
                      - generic [ref=e4128]:
                        - heading "5.1. Hardware Setup" [level=3] [ref=e4129]
