                            - generic [ref=e4101]: Figure 12. (a) Comparison of expected returns of the trained Map-based policies for sensors with different Fields of View (FOVs). (b) Comparison of the success rate between the trained Map-based policy with specific restricted FOVs and that with 180-degree FOV. training with specific restricted FOV and the Map-based policy training with 180-degree FOV in the new random scenario.
                        - generic [ref=e4102]:
                          - heading "4.5.3. Different Sensor Types" [level=4] [ref=e4103]
                          - generic [ref=e4104]:
                            - text: As discussed in
                            - link "Section 1" [ref=e4105] [cursor=pointer]:
                              - /url: "#sec1-sensors-20-04836"
                            - text: ", the map-based approach can be easily deployed to robots with different sensors. Here we illustrate such an example by applying the approach to a robot with only a depth camera. Since our customized simulator lacks 3D information, we choose Gazebo, a more realistic 3D simulator, to test the generalization ability of our model. In specific, we implement a differential robot with a depth camera with a 120-degree horizontal FOV and 640 × 480 resolution in Gazebo. We are to convert the point cloud data generated by the depth camera into corresponding grid maps. We first down-sample the point cloud data to the resolution of the map, remove outliers, refine the result by eliminating the ceiling, then generate the grid map from the bird’s eye view of the resulting point cloud."
                            - link "Figure 13" [ref=e4106] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-20-04836-f013"
                            - text: illustrates the procedure of how to generate such a grid map from the point cloud data. An example of the Using the generated grid map, we can construct the corresponding egocentric local grid map, which can later be used to train the collision avoidance policy by our map-based approach.
                            - link "Figure 14" [ref=e4107] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-20-04836-f014"
                            - text: shows the performance of Map-based policy using the depth camera in environments with 8 randomly placed obstacles. Note that the robot successfully avoids all obstacles and reaches its target the depth camera only.
