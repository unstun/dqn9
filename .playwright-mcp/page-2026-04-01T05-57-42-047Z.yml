                          - generic [ref=e3687]: "Increasing entropy means more diversity of training examples, and we want the weights of specific examples to increase as they are “added” to the training set. The curriculum strategy can be completed in two steps in the usual tasks: first a set of simple examples, and then the target training set."
                          - generic [ref=e3688]:
                            - text: In this paper, we introduce a two-stage training process for curriculum learning. Specifically, we propose two scenarios, i.e., the random scenario and the circular scenario, that generate random environments in our customized simulator (as illustrated in
                            - link "Figure 3" [ref=e3689] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-20-04836-f003"
                            - text: ) to collect collision avoidance experiences for multiple robots.
                            - link "Figure 3" [ref=e3690] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-20-04836-f003"
                            - text: a illustrates environments that randomly choose locations for obstacles, the starting and target positions of robots, which would help the robot to be able to avoid obstacles, a.k.a., random scenario. Environments in the random scenario are constructed in a
                            - math [ref=e3692]:
                              - generic [ref=e3694]:
                                - generic [ref=e3695]: "6"
                                - generic [ref=e3696]: ×
                                - generic [ref=e3697]: "6"
                            - text: m
                            - math [ref=e3699]:
                              - generic [ref=e3702]: "2"
                            - text: space with eight robots and four obstacles, where the target position of each robot is randomly generated within the range of 2 m to 4 m from its starting point.
                            - link "Figure 3" [ref=e3703] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-20-04836-f003"
                            - text: b illustrates environments that randomly place robots on a circle with a random radius, a.k.a., circular scenario, which helps the robot to be able to interact with other robots. Environments in the circular scenario randomly place eight robots on a circle with a varying radius in the range of 1.8 m to 3.0 m. These rich and complex training environments enable robots to explore their high-dimensional observation space and improve the quality and robustness of the learned policy. Combining with the centralized learning and the decentralized execution mechanism, the collision avoidance policy is effectively optimized at each iteration over these environments.
