          - heading "Abstract" [level=6] [ref=e100]
          - paragraph [ref=e101]: This paper introduces novel deep reinforcement learning (Deep-RL) techniques using parallel distributional actor-critic networks for navigating terrestrial mobile robots. Our approaches use laser range findings, relative distance, and angle to the target to guide the robot. We trained agents in the Gazebo simulator and deployed them in real scenarios. Results show that parallel distributional Deep-RL algorithms enhance decision-making and outperform non-distributional and behavior-based approaches in navigation and spatial generalization.
        - generic [ref=e102]:
          - heading "keywords:" [level=6] [ref=e103]
          - text: Parallel Distributional Deep Reinforcement Learning, Terrestrial Mobile Robot, Mapless Navigation
