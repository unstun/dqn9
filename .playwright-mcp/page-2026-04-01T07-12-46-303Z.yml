                - generic [ref=e946]:
                  - generic [ref=e947]: "15"
                  - generic [ref=e948]: ∘
              - text: . The input angles serve to direct the vehicle towards the target and enhance the learning process, while the target distance encourages the network to minimize it. Meanwhile, the outputs are the linear and angular velocities that enable control of the vehicle. As a point of comparison with the Deep-RL approaches, we employed a traditional technique BBA, which uses hardcoded navigation procedures. It is important to note that the BBA uses the same amount of sensor distance information as the other approaches for a fair comparison.
            - paragraph [ref=e950]:
              - text: The neural networks employed in all approaches have three hidden fully-connected layers, with 256 neurons each. These layers are connected through ReLU activation. The range of action is between
              - math [ref=e951]:
                - generic [ref=e953]:
                  - generic [ref=e954]: −
                  - generic [ref=e955]: "1"
              - text: and
              - math [ref=e956]:
                - generic [ref=e958]: "1"
              - text: ", and the activation function for the actor-network is the hyperbolic tangent function (Tanh). The outputs for the linear velocity are scaled between"
              - math [ref=e959]:
                - generic [ref=e961]:
                  - generic [ref=e962]: −
                  - generic [ref=e963]: "0.12"
              - text: and
              - math [ref=e964]:
                - generic [ref=e966]: "0.15"
              - text: meters, while the outputs for the angular velocity are scaled between
              - math [ref=e967]:
                - generic [ref=e969]:
                  - generic [ref=e970]: −
                  - generic [ref=e971]: "0.1"
              - math [ref=e972]:
                - generic [ref=e974]:
                  - generic [ref=e975]: m
                  - generic [ref=e976]: /
                  - generic [ref=e977]: s
              - text: and
              - math [ref=e978]:
                - generic [ref=e980]: "0.1"
              - math [ref=e981]:
                - generic [ref=e983]:
                  - generic [ref=e984]: m
                  - generic [ref=e985]: /
                  - generic [ref=e986]: s
              - text: . In both approaches, the critic network predicts the Q-value of the current state, while the actor-network predicts the current state. During the training phase of the parallel approaches, four agents were employed for training, and one agent was employed for evaluation. The training process is depicted in Fig.
              - link "2" [ref=e987] [cursor=pointer]:
                - /url: https://arxiv.org/html/2408.05744v1#S3.F2
              - text: .
