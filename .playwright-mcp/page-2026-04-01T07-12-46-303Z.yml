              - text: "]"
            - text: . Distributed Deep-RL approaches offer promising solutions to the training time issue in limited simulated environments
            - generic [ref=e123]:
              - text: "["
              - link "7" [ref=e124] [cursor=pointer]:
                - /url: https://arxiv.org/html/2408.05744v1#bib.bib7
