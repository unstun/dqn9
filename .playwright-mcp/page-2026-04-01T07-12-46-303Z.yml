          - generic [ref=e1012]:
            - heading "3.5 Simulation and Real Scenarios" [level=3] [ref=e1013]:
              - generic [ref=e1014]: "3.5"
              - text: Simulation and Real Scenarios
            - paragraph [ref=e1016]:
              - text: The simulations of the robot and the scenario use the Gazebo simulator
              - generic [ref=e1017]:
                - text: "["
                - link "20" [ref=e1018] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2408.05744v1#bib.bib20
                - text: "]"
              - text: . The connection between the robot and the agents was made using Robot Operating System (ROS). For distributing the agents, multiple instances of the Gazebo simulator are created in parallel and the data acquired are published to the replay buffer. The robot chosen here is the TurtleBot3 Burger version. The real and simulated Turtlebot3 Burger used can be seen in Fig.
              - link "3" [ref=e1019] [cursor=pointer]:
                - /url: https://arxiv.org/html/2408.05744v1#S3.F3
              - text: .
            - paragraph [ref=e1021]:
              - text: Four simulation scenarios were employed in this study. The first scenario represents a navigable area for the robot to move, with the walls being the only obstacle that could cause the robot to collide. In the event of a collision with the wall or any obstacle, a negative reward is issued for the action, and the current episode is terminated. The second scenario features four fixed cylinder-shaped obstacles with a radius of 25 centimeters each. The third and fourth scenarios were built in order to create more challenging paths for the robot to reach the final goal. The third scenario includes a “U”-shaped object that presents the agent with two possible trajectories of equal cost, with the obstacle creating a dead-end in the middle. The fourth scenario is asymmetrical and more complex, requiring the intelligent agent to develop better strategies to avoid collisions. Both real and simulated scenarios are appropriately labeled in Fig.
              - link "3" [ref=e1022] [cursor=pointer]:
                - /url: https://arxiv.org/html/2408.05744v1#S3.F3
              - text: .
            - paragraph [ref=e1024]:
              - text: After training the approaches through simulation, we evaluated our approaches in real scenarios. Some of the necessary data in the real scenario were obtained by image processing using OpenCV. All four real scenarios resembled the simulated ones, but their geometry is not equal. The differences of each one are more visually demonstrated in Section
              - link "4" [ref=e1025] [cursor=pointer]:
                - /url: https://arxiv.org/html/2408.05744v1#S4
              - text: .
