          - paragraph [ref=e126]:
            - text: "We present two new Deep-RL approaches using parallel distributional techniques: Parallel Distributional Deterministic Reinforcement Learning (PDDRL) and Parallel Distributional Stochastic Reinforcement Learning (PDSRL), incorporating prioritized memory replay for enhanced navigation in complex scenarios. As shown in Fig."
            - link "1" [ref=e127] [cursor=pointer]:
