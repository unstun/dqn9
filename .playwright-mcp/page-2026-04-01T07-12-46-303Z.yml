          - paragraph [ref=e1820]:
            - text: We proposed a novel scenario where pre-trained models from scenario 3 were evaluated in an unseen environment. Fig.
            - link "8" [ref=e1821] [cursor=pointer]:
              - /url: https://arxiv.org/html/2408.05744v1#S4.F8
            - text: and Table
            - link "2" [ref=e1822] [cursor=pointer]:
              - /url: https://arxiv.org/html/2408.05744v1#S4.T2
            - text: show the results. DDPG had high crash rates, while PDSRL minimized crashes but didn’t always achieve rewards. DDPG-P, PDDRL, and PDSRL-P achieved
            - math [ref=e1823]:
              - generic [ref=e1825]:
                - generic [ref=e1826]: "100"
                - generic [ref=e1827]: "%"
            - text: accuracy, demonstrating strong spatial generalization.
          - paragraph [ref=e1829]: Our extensive validation shows the proposed approaches perform well in all scenarios, including the novel one. Deep-RL approaches outperformed traditional algorithms in real-world challenges. Prioritized versions achieved the best success rates, particularly PDSRL-P. Evaluation in a novel scenario confirmed the approaches’ learning capabilities and spatial generalization.
        - generic [ref=e1830]:
          - heading "5 Conclusion" [level=2] [ref=e1831]:
            - generic [ref=e1832]: "5"
            - text: Conclusion
          - paragraph [ref=e1834]: This work introduces novel Deep Reinforcement Learning (Deep-RL) techniques for terrestrial mobile robots to perform mapless navigation, demonstrating their learning capabilities in simulation and potential for real-world implementation. The results highlight that parallel distributional Deep-RL approaches can effectively tackle complex real-world robotics problems that non-learning-based and non-distributional approaches without prioritized memory replay cannot address.
