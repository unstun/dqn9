            - text: ).
          - paragraph [ref=e1671]: The results showed that stochastic distributional approaches outperformed others in all scenarios, despite a slower start. DDPG had similar reward means to the top approaches. In more complex scenarios, approaches without prioritized memory had slower knowledge acquisition.
