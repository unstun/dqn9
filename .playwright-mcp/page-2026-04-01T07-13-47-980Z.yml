        - generic [ref=e64]: (October 30, 2025)
        - generic [ref=e65]:
          - heading "Abstract" [level=6] [ref=e66]
          - paragraph [ref=e67]: This paper proposes a hierarchical path planning and control framework that integrates the strategic decision-making capability of Deep Q-Network (DQN) for discrete subgoal selection with the precise continuous control execution of Twin Delayed Deep Deterministic Policy Gradient (TD3). By leveraging DQN’s strength in high-level discrete decision-making and TD3’s sample efficiency and stability in continuous motion domains, the proposed approach achieves robust policy generalization and enhanced adaptive performance in dynamic and uncertain environments, effectively overcoming limitations of conventional single-algorithm solutions in complex robotic applications.
        - generic [ref=e68]:
          - heading "I INTRODUCTION" [level=2] [ref=e69]:
            - generic [ref=e70]: I
            - text: INTRODUCTION
          - paragraph [ref=e72]:
            - text: Traditional path planning algorithms, such as A* and Dijkstra, are predicated on prior environmental modeling (i.e. pre-constructed maps or graph structures). While they demonstrate efficacy in static environments, they exhibit inherent limitations in dynamic and unstructured scenarios. In such contexts, frequent global path replanning is necessitated, resulting in exponential degradation of computational efficiency
            - generic [ref=e73]:
              - text: "["
              - link "1" [ref=e74] [cursor=pointer]:
                - /url: https://arxiv.org/html/2510.26646v1#bib.bib1
              - text: "]"
            - text: ", coupled with non-negligible latency and performance overhead."
          - paragraph [ref=e76]:
            - text: On the other hand, single reinforcement learning methods have their own limitations. Deep Q-Network (DQN) excels at making discrete decisions such as direction or path selection, but lacks the ability to handle fine-grained continuous control. Twin Delayed Deep Deterministic Policy Gradient (TD3) performs well in continuous action spaces, offering stable and efficient control, but is less effective in handling high-level, discrete navigation strategies.
            - generic [ref=e77]:
              - text: "["
              - link "2" [ref=e78] [cursor=pointer]:
                - /url: https://arxiv.org/html/2510.26646v1#bib.bib2
              - text: "]"
            - text: .
          - paragraph [ref=e80]: This research aims to develop a hybrid reinforcement learning architecture that combines DQN for high-level decision-making and TD3 for continuous control. The framework is designed to enhance navigation accuracy and obstacle avoidance in dynamic environments, ultimately achieving an adaptive and efficient autonomous navigation system.
          - paragraph [ref=e82]:
            - text: This work draws inspiration from hierarchical reinforcement learning (HRL) literature, where high-level and low-level policies often share a unified reward structure for consistent optimization
            - generic [ref=e83]:
