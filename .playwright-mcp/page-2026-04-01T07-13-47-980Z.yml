            - paragraph [ref=e1095]: "Future Research Directions: Building upon its hierarchical structure and inherent scalability, the framework is well-suited for extension to multi-robot coordination and complex navigation tasks. It holds strong potential for applications in logistics, surveillance, and search-and-rescue in high-dimensional and 3D environments."
        - generic [ref=e1096]:
          - heading "VI Conclusion" [level=2] [ref=e1097]:
            - generic [ref=e1098]: VI
            - text: Conclusion
          - paragraph [ref=e1100]: This study evaluated the performance of the TD3 algorithm and the hierarchical DQN+TD3 framework in a ROS+Gazebo navigation simulation. TD3 alone demonstrated stable learning, effective convergence, and reliable navigation behavior. Although the DQN+TD3 hierarchical framework showed qualitative potential, it currently remains unstable and requires further tuning before meaningful quantitative evaluation. Future work will focus on stabilizing the DQN+TD3 framework and extending hierarchical reinforcement learning to multi-agent coordination and real-world deployment scenarios.
