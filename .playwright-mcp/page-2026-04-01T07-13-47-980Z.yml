            - paragraph [ref=e102]:
              - text: Traditional planners provide deterministic solutions but lack adaptability. To improve the performance of automatic navigation in dynamic and complex environments, prior works have applied deep reinforcement learning (DRL), particularly single algorithms such as DQN or TD3
              - generic [ref=e103]:
