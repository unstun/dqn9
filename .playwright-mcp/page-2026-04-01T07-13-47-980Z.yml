            - paragraph [ref=e939]: This hierarchical framework facilitates the integration of long-term strategic planning (e.g., selecting optimal waypoints) and short-term reactive control (e.g., dynamic obstacle avoidance). The high-level DQN planner leverages reward signals for state-action value estimation, while the low-level TD3 controller utilizes reward gradients for precise policy optimization in continuous motion tasks.
          - generic [ref=e940]:
            - heading "III-C Environments" [level=3] [ref=e941]:
              - generic [ref=e942]: III-C
              - text: Environments
            - paragraph [ref=e944]:
              - text: In this project, we primarily utilize the Gazebo environment with ROS1 while integrating selected analyzer functionalities from PathBench
              - generic [ref=e945]:
                - text: "["
                - link "15" [ref=e946] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2510.26646v1#bib.bib15
                - text: "]"
              - text: for evaluation purposes. Additional resources include the OpenAI Gymnasium (Gym)
              - generic [ref=e947]:
                - text: "["
                - link "16" [ref=e948] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2510.26646v1#bib.bib16
                - text: "]"
              - text: interface.
            - paragraph [ref=e950]: Gazebo serves as a powerful 3D robotics simulation environment, offering high-fidelity physics and sensor modeling. Integrated with ROS1 Noetic, it enables seamless development, testing, and deployment of robotic algorithms within realistic and complex environments. Additionally, Rviz is utilized for real-time visualization of robot states and sensor data, supporting advanced experimentation for reinforcement learning and motion planning.
            - paragraph [ref=e952]:
              - text: We build upon DRL-robot-navigation
              - generic [ref=e953]:
                - text: "["
                - link "17" [ref=e954] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2510.26646v1#bib.bib17
                - text: "]"
              - text: ", a repository for mobile robot navigation in the Gazebo simulator. The framework provides pre-configured robot models, Gazebo environment setups, and essential utilities including map construction and graph-based path planning algorithms, streamlining the development of our environment. Training is performed in the ROS Gazebo simulator with PyTorch, ROS Noetic on Ubuntu. Our primary implementation task involves creating a custom Gym interface for Gazebo environment to facilitate DRL algorithm training within this physical simulation environment."
            - paragraph [ref=e956]: OpenAI Gym establishes the API standard for reinforcement learning, offering a versatile interface that can be easily implemented across various Python environments while being capable of representing general RL problems. Since Stable-baselines3’s DRL algorithms require Gym environments for training, our implementation ensures full compatibility with this standard, defining appropriate observation spaces, action spaces, and reward structures for the motion planning task.
          - generic [ref=e957]:
            - heading "III-D Benchmarks" [level=3] [ref=e958]:
              - generic [ref=e959]: III-D
              - text: Benchmarks
            - paragraph [ref=e961]: To rigorously evaluate the performance of our hierarchical reinforcement learning (HRL) framework, we employ a comprehensive set of benchmarking metrics tailored for motion planning in autonomous robotic systems. Key evaluation criteria include path optimality, computational efficiency, success rate, and smoothness of the generated trajectories. In our HRL architecture, the high-level planner utilizes the DQN algorithm for strategic decision-making, while the low-level controller employs the TD3 algorithm for precise motion execution. In our implementation, we adopt a TD3 implementation based on Stable-baselines3 as the baseline method, with all experimental evaluations conducted within the ROS-GAZEBO simulation platform.
        - generic [ref=e962]:
          - heading "IV EXPERIMENT" [level=2] [ref=e963]:
            - generic [ref=e964]: IV
            - text: EXPERIMENT
          - generic [ref=e965]:
            - heading "IV-A Experiment Setup" [level=3] [ref=e966]:
              - generic [ref=e967]: IV-A
              - text: Experiment Setup
            - paragraph [ref=e969]: Simulation Environment and Hardware
            - paragraph [ref=e971]: We test the capabilities of hybrid DRL (DQN and TD3) with the ROS-GAZEBO simulation environment, leveraging pytorch and tensorboard. All training and simulation experiments were conducted in the Gazebo simulator, with ROS1 Noetic and RViz for visualization. We use Docker as a containerization platform. Note that this project does not mainly rely on GPU acceleration due to high environment I/O overhead, which limits GPU utilization efficiency.
            - paragraph [ref=e973]: "In our experiment, training is conducted for approximately 10,000 episodes (5 million timesteps). Each training episode was terminated under one of three conditions: the robot successfully reached the goal, a collision occurred, or a maximum of 500 time steps was consumed."
            - paragraph [ref=e975]: The maximum linear and angular velocities of the robot were set to [0, 1] m/s and [-1, 1] rad/s, respectively. The neural network parameters are updated every 100 timesteps for both high-level and low-level agents to ensure training stability.
            - paragraph [ref=e977]: Evaluation Metrics
            - paragraph [ref=e979]: 1) Success rate (goal reached).
            - paragraph [ref=e981]: We will ensure that a valid path exists in the current map. When a path exists, this metric measures the probability of successfully reaching the goal point within the maximum time limit.
            - paragraph [ref=e983]: 2) Collision rate.
            - paragraph [ref=e985]: With realistic velocity conditions in the simulation environment, DRL models may still collide with obstacles. We aim to minimize the collision rate through adjustments to the reward function.
            - paragraph [ref=e987]: 3) Time cost to goal point.
            - paragraph [ref=e989]: For cases where the goal is successfully reached, we will measure the time cost across different algorithms, including time spent on path planning, time to reach the goal, and other relevant factors.
            - paragraph [ref=e991]: 4) Path efficiency (distance/optimal).
            - paragraph [ref=e993]: We will use the Euclidean distance as a reference and compare it with the efficiency of paths planned by the models.
            - paragraph [ref=e995]: 5) Trajectory Smoothness.
