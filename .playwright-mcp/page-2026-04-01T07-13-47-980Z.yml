          - generic [ref=e89]:
            - heading "I-A Practical Implication" [level=3] [ref=e90]:
              - generic [ref=e91]: I-A
              - text: Practical Implication
            - paragraph [ref=e93]: In real-world applications, mobile robots are widely used in warehouse logistics, indoor service, security patrol, and search-and-rescue tasks. These environments are often highly dynamic, featuring moving obstacles (e.g., humans or other robots), incomplete or constantly changing map information, and conditions where GPS signals are weak or entirely unavailable.
            - paragraph [ref=e95]: Traditional path planning methods such as A* and Dijkstra rely on static map s and deterministic graph structures, making them poorly suited for fast adaptation in changing environments. However, real-world scenarios demand that robots possess the ability to perceive, decide, and act autonomously in real time, even in unknown or partially observable environments.
            - paragraph [ref=e97]: Therefore, developing an adaptive navigation method based on reinforcement learning not only enhances the robot’s robustness and environmental adaptability but also addresses key limitations of classical planners, such as map dependency and limited reactivity. This is crucial for enabling reliable and intelligent robotic systems in complex, dynamic, and uncertain real-world settings.
