        - generic [ref=e141]:
          - region "Abstract" [ref=e142]:
            - generic [ref=e143]:
              - heading "Abstract" [level=2] [ref=e144]
              - paragraph [ref=e146]:
                - text: The theory of reinforcement learning provides a normative account
                - superscript [ref=e147]:
                  - link "Reference 1" [ref=e148] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR1
                    - text: "1"
                - text: ", deeply rooted in psychological"
                - superscript [ref=e149]:
                  - link "Reference 2" [ref=e150] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR2
                    - text: "2"
                - text: and neuroscientific
                - superscript [ref=e151]:
                  - link "Reference 3" [ref=e152] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR3
                    - text: "3"
                - text: "perspectives on animal behaviour, of how agents may optimize their control of an environment. To use reinforcement learning successfully in situations approaching real-world complexity, however, agents are confronted with a difficult task: they must derive efficient representations of the environment from high-dimensional sensory inputs, and use these to generalize past experience to new situations. Remarkably, humans and other animals seem to solve this problem through a harmonious combination of reinforcement learning and hierarchical sensory processing systems"
                - superscript [ref=e153]:
                  - link "Reference 4" [ref=e154] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR4
                    - text: "4"
                  - text: ","
                  - link "Reference 5" [ref=e155] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR5
                    - text: "5"
                - text: ", the former evidenced by a wealth of neural data revealing notable parallels between the phasic signals emitted by dopaminergic neurons and temporal difference reinforcement learning algorithms"
                - superscript [ref=e156]:
                  - link "Reference 3" [ref=e157] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR3
                    - text: "3"
                - text: . While reinforcement learning agents have achieved some successes in a variety of domains
                - superscript [ref=e158]:
                  - link "Reference 6" [ref=e159] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR6
                    - text: "6"
                  - text: ","
                  - link "Reference 7" [ref=e160] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR7
                    - text: "7"
                  - text: ","
                  - link "Reference 8" [ref=e161] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR8
                    - text: "8"
                - text: ", their applicability has previously been limited to domains in which useful features can be handcrafted, or to domains with fully observed, low-dimensional state spaces. Here we use recent advances in training deep neural networks"
                - superscript [ref=e162]:
                  - link "Reference 9" [ref=e163] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR9
                    - text: "9"
                  - text: ","
                  - link "Reference 10" [ref=e164] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR10
                    - text: "10"
                  - text: ","
                  - link "Reference 11" [ref=e165] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR11
                    - text: "11"
                - text: to develop a novel artificial agent, termed a deep Q-network, that can learn successful policies directly from high-dimensional sensory inputs using end-to-end reinforcement learning. We tested this agent on the challenging domain of classic Atari 2600 games
                - superscript [ref=e166]:
                  - link "Reference 12" [ref=e167] [cursor=pointer]:
                    - /url: /articles/nature14236#ref-CR12
                    - text: "12"
                - text: . We demonstrate that the deep Q-network agent, receiving only the pixels and the game score as inputs, was able to surpass the performance of all previous algorithms and achieve a level comparable to that of a professional human games tester across a set of 49 games, using the same algorithm, network architecture and hyperparameters. This work bridges the divide between high-dimensional sensory inputs and actions, resulting in the first artificial agent that is capable of learning to excel at a diverse array of challenging tasks.
