              - generic [ref=e689]:
                - heading "4 Experiments" [level=2] [ref=e690]: 4 Experiments
                - paragraph [ref=e691]: In this section, we conduct a suite of simulated experiments for AUV path planning, utilizing the proposed ND3QN algorithm with partial real-world ocean current data and topographical information. The outcomes of the experiments validate the efficacy of the proposed algorithm.
                - generic [ref=e692]:
                  - heading "4.1 Environmental settings and evaluation indicators" [level=3] [ref=e693]
                  - paragraph [ref=e694]:
                    - text: The training environment was established within a rectangular area of 100 nautical miles by 70 nautical miles, encompassing 11 red circular obstacles, each with a radius of 3 nautical miles, as depicted in
                    - link "Figure 5" [ref=e695] [cursor=pointer]:
                      - /url: "#F5"
                    - text: . Historical ocean current data from the southern region of Brazil (29.50°S to 31.83°S, 33.41°W to 37.37°W, 750 m below the sea surface) recorded on August 12, 2021 (IRI/LDEO,
                    - link "2022" [ref=e696] [cursor=pointer]:
                      - /url: "#B18"
                    - text: ), were chosen to simulate the ocean currents within the environment. The AUV's speed in still water was set to 1 kn, with a control interval of 0.1 h. The starting and goal points were designated as (90, 5) and (20, 60), respectively. Further training parameters are delineated in
                    - link "Table 1" [ref=e697] [cursor=pointer]:
                      - /url: "#T1"
                    - text: .
