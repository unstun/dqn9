                      - text: − 1)/2, and
                      - emphasis [ref=e515]: "n"
                      - text: indicates the count of detection sonars. The AUV's detection weight is maximum in the current heading direction and decreases gradually toward both sides. Combining the obstacle information and the degree of impact in the detection matrix
