                      - link "Figure 4 🔍" [ref=e651] [cursor=pointer]:
                        - /url: https://www.ncbi.nlm.nih.gov/core/lw/2.0/html/tileshop_pmc/tileshop_pmc_inline.html?title=Click%20on%20image%20to%20zoom&p=PMC3&id=11513341_fnbot-18-1466571-g0004.jpg
                        - img "Figure 4" [ref=e652]
                        - text: 🔍
                    - link "Open in a new tab" [ref=e654] [cursor=pointer]:
                      - /url: figure/F4/
                    - paragraph [ref=e656]: Decision-making process of the ND3QN algorithm.
                  - paragraph [ref=e657]: "Simultaneously, we also integrated the ε-decay strategy into the training process. Decaying the exploration probability of random actions means starting with a high exploration rate and gradually decreasing it until it converges to a lower value. This process is achieved by setting an initial exploration rate, a final exploration rate, and a decay function. The specific formula is as follows:"
                  - table [ref=e658]:
                    - rowgroup [ref=e659]:
                      - row "(21)" [ref=e660]:
                        - cell [ref=e661]
                        - cell "(21)" [ref=e662]
                  - paragraph [ref=e663]:
                    - text: where ε
                    - subscript [ref=e664]: initial
                    - text: represents the initial degree of exploration, ε
                    - subscript [ref=e665]: final
                    - text: denotes the final level of exploration,
                    - emphasis [ref=e666]: C
                    - subscript [ref=e667]: step
                    - text: "is the global step count, and Γ represents a constant parameter that governs the pace at which the exploration rate evolves throughout training iterations. The action selection is then as follows:"
                  - table [ref=e668]:
                    - rowgroup [ref=e669]:
                      - row "(22)" [ref=e670]:
                        - cell [ref=e671]
                        - cell "(22)" [ref=e672]
                  - paragraph [ref=e673]: "The loss of the ND3QN formed by combining the D3QN and the noisy network is calculated as follows:"
                  - table [ref=e674]:
                    - rowgroup [ref=e675]:
                      - row "(23)" [ref=e676]:
                        - cell [ref=e677]
                        - cell "(23)" [ref=e678]
                  - paragraph [ref=e679]:
                    - text: ND3QN introduces the noisy network approach to D3QN while using the ε-decay mechanism for action selection. This allows the network to automatically adjust the degree of exploration during training, while the ε-decay strategy provides additional randomness to avoid local optima. This combination enhances the algorithm's exploratory prowess, facilitating a more effective equilibrium between exploration and exploitation throughout training, thereby enhancing the algorithm's efficacy and robustness. The step-by-step procedure of ND3QN is delineated in
                    - link "Algorithm 1" [ref=e680] [cursor=pointer]:
                      - /url: "#T8"
                    - text: .
