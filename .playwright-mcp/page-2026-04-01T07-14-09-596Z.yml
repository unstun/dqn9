              - generic [ref=e93]:
                - heading "Abstract" [level=2] [ref=e94]: Abstract
                - paragraph [ref=e95]: How to improve the success rate of autonomous underwater vehicle (AUV) path planning and reduce travel time as much as possible is a very challenging and crucial problem in the practical applications of AUV in the complex ocean current environment. Traditional reinforcement learning algorithms lack exploration of the environment, and the strategies learned by the agent may not generalize well to other different environments. To address these challenges, we propose a novel AUV path planning algorithm named the Noisy Dueling Double Deep Q-Network (ND3QN) algorithm by modifying the reward function and introducing a noisy network, which generalizes the traditional D3QN algorithm. Compared with the classical algorithm [e.g., Rapidly-exploring Random Trees Star (RRT*), DQN, and D3QN], with simulation experiments conducted in realistic terrain and ocean currents, the proposed ND3QN algorithm demonstrates the outstanding characteristics of a higher success rate of AUV path planning, shorter travel time, and smoother paths.
                - paragraph [ref=e97]:
                  - strong [ref=e98]: "Keywords:"
                  - text: AUV, path planning, deep reinforcement learning, ND3QN, noisy network
              - generic [ref=e99]:
                - heading "1 Introduction" [level=2] [ref=e100]: 1 Introduction
                - paragraph [ref=e101]:
                  - text: With the rapid advancement of artificial intelligence, the autonomous underwater vehicle (AUV) is utilized across a multitude of fields, such as environmental monitoring (Bayat et al.,
                  - link "2016" [ref=e102] [cursor=pointer]:
                    - /url: "#B4"
                  - text: ), deep-ocean exploration (Zhang et al.,
                  - link "2022" [ref=e103] [cursor=pointer]:
                    - /url: "#B47"
                  - text: ), seabed mapping (Ambastha et al.,
                  - link "2014" [ref=e104] [cursor=pointer]:
                    - /url: "#B2"
                  - text: ), etc. To guarantee that an AUV can execute its missions efficiently in complex marine environments, successful path planning is the primary process. The optimization objectives of path planning encompass enhancing the success rate of AUV path planning and reducing travel time while considering energy consumption (Sun et al.,
                  - link "2022" [ref=e105] [cursor=pointer]:
                    - /url: "#B34"
                  - text: ). However, in real ocean environments, ocean currents tend to be complex and variable, and comprehensive information about all obstacles is often unavailable. AUV can only rely on locally detectable information for path planning. Therefore, how to improve the success rate of AUV path planning and reduce the travel time as much as possible is a very challenging and crucial problem.
                - paragraph [ref=e106]:
                  - text: Over the past few decades, researchers have developed numerous path-planning algorithms, which can generally be categorized into traditional and intelligent methods (Kot,
                  - link "2022" [ref=e107] [cursor=pointer]:
                    - /url: "#B22"
                  - text: ). Traditional algorithms, such as Dijkstra's (Wenzheng et al.,
                  - link "2019" [ref=e108] [cursor=pointer]:
                    - /url: "#B40"
                  - text: ) and A* (Qian et al.,
                  - link "2024" [ref=e109] [cursor=pointer]:
                    - /url: "#B30"
                  - text: ), are well-known for their ability to find reasonably short paths in fully known environments. However, their effectiveness diminishes in unknown or dynamic environments where complete environmental information is unavailable. To address this, local path planners like the Artificial Potential Field (APF) method (Liu et al.,
                  - link "2020" [ref=e110] [cursor=pointer]:
                    - /url: "#B27"
                  - text: ) have been employed to avoid unknown obstacles by simulating natural forces. Despite its effectiveness in certain scenarios, APF is prone to getting stuck in local minima. Alternatively, the Rapidly-exploring Random Tree (RRT) algorithm (Zeng et al.,
                  - link "2023" [ref=e111] [cursor=pointer]:
                    - /url: "#B45"
                  - text: ) can generate collision-free paths in unknown environments through random sampling, but this randomness often leads to non-smooth paths, increasing the control difficulty and energy consumption of AUVs. Karaman and Frazzoli (
                  - link "2011" [ref=e112] [cursor=pointer]:
                    - /url: "#B19"
                  - text: ) propose the rapid-exploring random tree star (RRT*) algorithm, which modifies the node expansion strategy. It effectively solves the suboptimal trajectory problem of RRT, planning smoother paths and increasing the success rate of path planning. Fu et al. (
                  - link "2019" [ref=e113] [cursor=pointer]:
                    - /url: "#B10"
                  - text: ) apply the RRT* algorithm to AUV path planning and approach an optimal path with less travel time more quickly in varying terrain and scattered floating obstacles. The BI-RRT* algorithm proposed by Fan et al. (
                  - link "2024" [ref=e114] [cursor=pointer]:
                    - /url: "#B8"
                  - text: ) exhibits superior path planning capabilities to the RRT* algorithms by extending the obstacle region, employing a bidirectional search strategy. Nevertheless, when obstacles and other factors in the environment change, the RRT* algorithm needs to re-plan the path and is not sufficiently adaptable to different environments (Khattab et al.,
                  - link "2023" [ref=e115] [cursor=pointer]:
                    - /url: "#B20"
                  - text: ).
                - paragraph [ref=e116]:
                  - text: Reinforcement learning (RL) is an emerging intelligent method that offers a more flexible and adaptive solution for AUV path planning. It mimics the human learning process by letting agents continuously engage with the environment, gain experience, and discover the optimal strategy. The learning process is guided by reward functions, making this approach particularly suitable for executing specific tasks [e.g., selecting actions that follow ocean currents (Li et al.,
                  - link "2023" [ref=e117] [cursor=pointer]:
                    - /url: "#B26"
                  - text: )]. After trained, RL can apply their learned knowledge to different unknown environments. Deep Q-Network (DQN) (Mnih et al.,
                  - link "2015" [ref=e118] [cursor=pointer]:
                    - /url: "#B28"
                  - text: ) is a classical reinforcement learning algorithm that combines Q-learning (Soni et al.,
                  - link "2022" [ref=e119] [cursor=pointer]:
                    - /url: "#B33"
                  - text: ) and deep neural networks (Krizhevsky et al.,
                  - link "2012" [ref=e120] [cursor=pointer]:
                    - /url: "#B23"
                  - text: ) to address problems with continuous state spaces. Yang et al. (
                  - link "2023b" [ref=e121] [cursor=pointer]:
                    - /url: "#B43"
                  - text: ) successfully employed DQN to achieve efficient path planning with varying numbers of obstacles, improving the success rate of AUV path planning across different environments. Zhang and Shi (
                  - link "2023" [ref=e122] [cursor=pointer]:
                    - /url: "#B46"
                  - text: ) combine DQN with Quantum Particle Swarm Optimization to create the DQN-QPSO algorithm. By considering both path length and ocean currents in the fitness function, this algorithm effectively identifies energy-efficient paths in underwater environments. Despite significant advancements, DQN tends to overestimate Q-values during training. Hasselt et al. (
                  - link "2016" [ref=e123] [cursor=pointer]:
                    - /url: "#B16"
                  - text: ) propose the Double DQN (Double Deep Q-Network) to address the issue in DQN and enhance the algorithm's performance. Chu et al. (
                  - link "2023" [ref=e124] [cursor=pointer]:
                    - /url: "#B6"
                  - text: ) improve the DDQN algorithm and used the NURBS algorithm to smooth the path. Yang et al. (
                  - link "2023b" [ref=e125] [cursor=pointer]:
                    - /url: "#B43"
                  - text: ) propose an N-step Priority Double DQN (NPDDQN) path planning algorithm, to make better use of high-value experience to speed up the convergence of the training process. Wang et al. (
                  - link "2016" [ref=e126] [cursor=pointer]:
                    - /url: "#B39"
                  - text: ) propose the Dueling Double Deep Q-Network (D3QN), which combines Double DQN and Dueling DQN. Xi et al. (
                  - link "2022" [ref=e127] [cursor=pointer]:
                    - /url: "#B41"
                  - text: ) optimize the reward function within the D3QN algorithm to account for ocean currents. Although this adaptation enables the planning of paths with shorter travel times, the resulting paths are not always smooth. While these RL algorithms have made progress in AUV path planning, they still have limitations in exploration. The uncertain environment requires the agent to not only utilize existing knowledge but also to continuously explore unknown areas to avoid getting stuck in a suboptimal path. DQN and D3QN algorithms typically use an ε-greedy strategy for action selection, where actions are chosen randomly with a probability of ε, and 1-ε to choose optimal action by the current model. The approach might lead to inadequate exploration in the initial phases of learning and an excessive degree of exploration as learning progresses (Sharma et al.,
                  - link "2017" [ref=e128] [cursor=pointer]:
                    - /url: "#B31"
                  - text: ).
                - paragraph [ref=e129]:
                  - text: To address the exploration deficiencies caused by the ε-greedy strategy, some researchers have proposed the ε-decay strategy (Astudillo et al.,
                  - link "2020" [ref=e130] [cursor=pointer]:
                    - /url: "#B3"
                  - text: ). This method initializes with a high ε at the outset of the reinforcement learning training, prompting the agent to engage in random actions and thoroughly investigate the environment. As training progresses, the ε value gradually decreases, allowing the agent to rely more on learned experiences for decision-making. Although this approach is successful, it necessitates manual adjustment of parameters and might not guarantee enough exploration in the final stages of training. In 2015, Fortunato et al. (
                  - link "2017" [ref=e131] [cursor=pointer]:
                    - /url: "#B9"
                  - text: ) introduce the Noisy DQN algorithm. They introduced learnable noise into the DQN neural network parameters, creating what is known as a noisy network. It allows the agent to maintain a certain level of exploration throughout the training process, which enhances the algorithm's adaptability to environmental changes and helps in obtaining better policies. The Noisy DQN method has succeeded significantly in various reinforcement learning applications (Gao Q. et al.,
                  - link "2021" [ref=e132] [cursor=pointer]:
                    - /url: "#B11"
                  - text: ; Cao et al.,
                  - link "2020" [ref=e133] [cursor=pointer]:
                    - /url: "#B5"
                  - text: ; Harrold et al.,
                  - link "2022" [ref=e134] [cursor=pointer]:
                    - /url: "#B15"
                  - text: "). Inspired by the above discussion, we introduce the noisy network into the D3QN algorithm and combine it with an ε-decay strategy. Additionally, we modify the reward function to comprehensively account for various requirements, proposing a novel AUV path planning algorithm named the Noisy Dueling Double Deep Q-Network (ND3QN) algorithm. The main contributions of this study are as follows:"
                - paragraph [ref=e135]: (1) By incorporating noisy networks, the ND3QN algorithm can dynamically adjust the level of exploration, preventing premature convergence to local optima and improving the algorithm's robustness and its ability to generalize. Meanwhile, the ND3QN algorithm considers factors such as distance, obstacles, ocean currents, path smoothness, and step count, facilitating the AUV to find smoother and less time-consuming paths.
                - paragraph [ref=e136]: (2) We establish a range sonar model to obtain information about local obstacles and utilize real ocean current and terrain data from the southern Brazilian, providing a more realistic simulation of the marine environment.
                - paragraph [ref=e137]: (3) The ND3QN algorithm significantly enhances the path-planning performance of AUV in complex environments, achieving about 93% success rate in path planning, which is a 4%–11% improvement over the RRT*, DQN, and D3QN algorithms, with a 7%–11% reduction in travel time and 55%–88% improvement in path smoothness.
                - paragraph [ref=e138]: "The remainder of this paper is outlined as follows: Section 2 briefly introduces the AUV motion model, sonar model, basics of reinforcement learning, and the D3QN algorithm. Section 3 explains the ND3QN algorithm in detail. Section 4 validates the effectiveness and generality of the ND3QN algorithm through simulation experiments, comparing it with traditional RRT*, DQN, and D3QN algorithms. Section 5 concludes this work."
              - generic [ref=e139]:
