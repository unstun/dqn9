                  - generic [ref=e503]:
                    - heading "3.3.2 Obstacle avoidance reward" [level=4] [ref=e504]
                    - paragraph [ref=e505]:
                      - text: In the detection distance matrix derived from the sonar model, obstacles detected across various directions exert varying degrees of influence on AUV. Those obstacles directly ahead, within the bow direction, exert the most significant impact on the AUV's navigation, with this impact diminishing progressively as the angle measured from the bow direction increases. The influence of detected obstacles in different directions is quantified by the parameter ω(
