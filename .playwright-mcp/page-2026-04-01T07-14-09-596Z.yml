                - generic [ref=e875]:
                  - heading "4.2 Simulation and training process" [level=3] [ref=e876]
                  - paragraph [ref=e877]:
                    - text: To assess the efficacy of the ND3QN algorithm, we compared DQN (Yang et al.,
                    - link "2023b" [ref=e878] [cursor=pointer]:
                      - /url: "#B43"
                    - text: ) and D3QN (Xi et al.,
                    - link "2022" [ref=e879] [cursor=pointer]:
                      - /url: "#B41"
                    - text: ) in the same simulated environment. Additionally, we implemented RRT* (Chu et al.,
                    - link "2023" [ref=e880] [cursor=pointer]:
                      - /url: "#B6"
                    - text: ) as a reference benchmark, which is an improved heuristic algorithm capable of providing immediate performance indicators for comparison with reinforcement learning algorithms without the need for training. Our proposed improved version, ND3QN, introduces a noisy network and ε-decay strategy to enhance exploration capabilities, thereby further optimizing the effectiveness of path planning. We conducted 3000 training sessions for each of these three reinforcement learning algorithms, and
                    - link "Figure 6" [ref=e881] [cursor=pointer]:
                      - /url: "#F6"
                    - text: illustrates their total reward value variations during the training process, reflecting their learning progress, and performance in path planning tasks.
                  - figure "Comparison of the learning curves of different algorithms during training. Moving averages computed every 200 data points smoothed the curves." [ref=e882]:
                    - heading "Figure 6." [level=4] [ref=e883]
                    - paragraph [ref=e884]:
                      - link "Figure 6 🔍" [ref=e885] [cursor=pointer]:
                        - /url: https://www.ncbi.nlm.nih.gov/core/lw/2.0/html/tileshop_pmc/tileshop_pmc_inline.html?title=Click%20on%20image%20to%20zoom&p=PMC3&id=11513341_fnbot-18-1466571-g0006.jpg
                        - img "Figure 6" [ref=e886]
                        - text: 🔍
                    - link "Open in a new tab" [ref=e888] [cursor=pointer]:
                      - /url: figure/F6/
                    - paragraph [ref=e890]: Comparison of the learning curves of different algorithms during training. Moving averages computed every 200 data points smoothed the curves.
                  - paragraph [ref=e891]:
                    - text: As shown in
                    - link "Figure 6" [ref=e892] [cursor=pointer]:
                      - /url: "#F6"
                    - text: ", the total rewards of all algorithms steadily increase with the number of training episodes and eventually stabilize. From episodes 500 to 3,000, the performance of the algorithms remains relatively stable."
                    - link "Table 2" [ref=e893] [cursor=pointer]:
                      - /url: "#T2"
                    - text: reveals that ND3QN achieves the highest average total reward (557.5526) with the lowest standard deviation (162.2245). Additionally, the difference in average total reward between ND3QN and both DQN and D3QN is statistically significant (
                    - emphasis [ref=e894]: p
                    - strong [ref=e895]: <
                    - text: 0.001). These findings indicate that ND3QN not only achieves higher total rewards but also outperforms the other algorithms in terms of stability. This can be attributed to the integration of a noisy network in the ND3QN algorithm, allowing the agent to dynamically adjust the noise level based on the training progress. In the early training phase, higher noise enhances exploration by increasing randomness, enabling the agent to cover a broader state space and discover high-reward strategies faster. As training progresses, the noise level gradually decreases, balancing exploration and exploitation. This helps prevent premature convergence to suboptimal solutions while maintaining stability in performance, ultimately leading to a higher and more stable total reward.
