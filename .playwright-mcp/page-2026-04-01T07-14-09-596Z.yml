                      - text: indicates a closer alignment between the AUV's motion direction and the ocean current direction, as well as a higher degree of utilization of the ocean current's strength.
                  - generic [ref=e558]:
                    - heading "3.3.4 Path smoothness reward" [level=4] [ref=e559]
                    - paragraph [ref=e560]:
                      - text: Due to the complexity of AUV control underwater, frequent turning can lead to deviations from the planned trajectory. To maintain trajectory stability, we aim to minimize the change between consecutive actions. We achieve this by introducing a reward function
                      - emphasis [ref=e561]: R
                      - subscript [ref=e562]: sta
                      - text: ", defined as:"
                    - table [ref=e563]:
