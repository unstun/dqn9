                - generic [ref=e431]:
                  - heading "3.2 Action space and state transition function" [level=3] [ref=e432]
                  - paragraph [ref=e433]:
                    - text: Some of the existing AUVs can only rotate at fixed angle increments instead of arbitrary angles during navigation, as their steering rudders are limited by factors such as mechanical structure, motor characteristics, and control system. Therefore, in this paper, the navigation direction of AUV is designed as a discrete action. To broaden the range of directional options available for an AUV, we have discretized its horizontal movements into 16 distinct actions,
