                        - text: −1
                      - text: signifies the action taken in the preceding time step, a higher value of
                      - emphasis [ref=e572]: R
                      - subscript [ref=e573]: sta
                      - text: suggests a smaller change in action, thereby conferring a greater positive reward. This reward incentivizes the AUV to execute smoother actions, thereby mitigating the occurrence of abrupt turns and sharp maneuvers.
                  - generic [ref=e574]:
                    - heading "3.3.5 Step reward" [level=4] [ref=e575]
                    - paragraph [ref=e576]:
                      - text: To avoid unnecessary back-and-forth movements of the AUV underwater and to encourage the selection of relatively shorter paths, we introduce a fixed negative penalty
                      - emphasis [ref=e577]: R
                      - subscript [ref=e578]: step
                      - text: at each step.
                  - generic [ref=e579]:
                    - heading "3.3.6 Comprehensive reward" [level=4] [ref=e580]
                    - paragraph [ref=e581]: "The comprehensive reward function is formulated as the aggregated, weighted combination of all the aforementioned reward functions:"
                    - table [ref=e582]:
                      - rowgroup [ref=e583]:
                        - row "(19)" [ref=e584]:
                          - cell [ref=e585]
                          - cell "(19)" [ref=e586]
                    - paragraph [ref=e587]:
                      - text: where
                      - emphasis [ref=e588]: k
                      - subscript [ref=e589]:
                        - emphasis [ref=e590]: i
                      - text: are the weighting factors, and
                      - emphasis [ref=e591]: T
                      - subscript [ref=e592]:
                        - emphasis [ref=e593]: done
                      - text: = 0 or 1, indicates the status of reaching the goal point.
                    - paragraph [ref=e594]: The total reward function, compared to a single reward function, can better accommodate complex task requirements. In particular, due to the obstacle avoidance reward component, the closer the obstacle is to the forward direction of the AUV, the greater the negative penalty imposed. This design helps the AUV detect and avoid obstacles in advance, accelerating the learning process. Additionally, the path smoothness reward encourages the AUV to select actions with smaller turning angles, thereby preventing frequent turns and sharp maneuvers. This approach enhances the AUV's navigational stability and smoother trajectory. To sum up, the composite reward function designed in this study comprehensively accounts for the operational efficiency and safety of the AUV, leveraging information on ocean currents and obstacles to guide the agent toward more time-efficient and smooth paths.
                - generic [ref=e595]:
                  - heading "3.4 Path planning algorithm" [level=3] [ref=e596]
                  - paragraph [ref=e597]:
                    - text: In conventional deep reinforcement learning, the ε-greedy strategy (Dann et al.,
                    - link "2022" [ref=e598] [cursor=pointer]:
                      - /url: "#B7"
                    - text: ) is commonly employed to explore the environment. This strategy involves taking actions at random with a constant probability ε to facilitate exploration and selecting the action currently deemed optimal with a probability of 1 − ε for exploitation purposes. Nonetheless, an over-reliance on experience may result in convergence to local optima, precluding the identification of a global optimum. Conversely, excessive exploration can prolong training duration and diminish efficacy. To tackle this challenge, we propose a novel strategy that balances exploration and exploitation by decaying the probability of selecting random actions and incorporating noisy networks.
                  - paragraph [ref=e599]:
                    - text: We incorporate noisy networks into the D3QN algorithm framework to augment the algorithm's exploration capabilities. Noisy networks introduce parameterized noise into the neural network, which facilitates a more comprehensive exploration of the state space. By introducing noisy parameters, the network can experiment with different combinations of weights and biases during each update, thus enhancing its exploration of the environment and uncovering new, previously unknown state-action pairs. Typically, a fully connected layer receives
                    - emphasis [ref=e600]: p
                    - text: inputs and produces
                    - emphasis [ref=e601]: q
                    - text: outputs, which can be represented as
                    - emphasis [ref=e602]: "Y"
                    - text: =
                    - emphasis [ref=e603]: WX
                    - text: +
                    - emphasis [ref=e604]: B
                    - text: . Here,
                    - emphasis [ref=e605]: W
                    - text: denotes the matrix of weights,
                    - emphasis [ref=e606]: X
                    - text: is the input vector to the layer, and
                    - emphasis [ref=e607]: B
                    - text: is the bias vector. We substitute the parameters
                    - emphasis [ref=e608]: w
                    - text: and
                    - emphasis [ref=e609]: b
                    - text: in the neural network with μ + σ ∘ ξ, where the notation ∘ denotes element-wise multiplication (Yang et al.,
                    - link "2021" [ref=e610] [cursor=pointer]:
                      - /url: "#B44"
                    - text: "). The equivalent noisy linear layer is formulated as follows:"
