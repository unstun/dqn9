                      - text: = 1. In contrast, we assess the action in terms of the difference between the distance from the goal point at this time and the distance from the goal point at the previous instant if the AUV does not reach the goal point, and (
                      - emphasis [ref=e483]: T
                      - subscript [ref=e484]:
                        - emphasis [ref=e485]: done
                      - text: "= 0). The following is the formula used to calculate the distance reward:"
