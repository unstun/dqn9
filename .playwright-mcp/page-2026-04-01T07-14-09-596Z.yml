                  - heading "2.2 Sonar model" [level=3] [ref=e183]
                  - paragraph [ref=e184]:
                    - text: During underwater missions, AUV frequently encounters complex environments such as reefs, schools of fish, and unknown obstacles. To navigate safely, AUV relies on sensors to detect their surroundings and provide data to the planning algorithm. Ranging sonar (Wang and Yang,
                    - link "2013" [ref=e185] [cursor=pointer]:
                      - /url: "#B38"
                    - text: ), known for its simplicity and low cost, is the most widely used underwater detection device. It emits a conical beam and calculates the distance to obstacles by measuring the time difference between transmitted and received beams. When multiple ranging sonars are combined into a multi-beam sonar, they cover a sector-shaped area in front of the AUV.
                  - paragraph [ref=e186]:
                    - text: We assume that the bow of the AUV is equipped with 12 ranging sonars, each with an aperture angle of 10°, providing a horizontal coverage span from −60° to 60°.
