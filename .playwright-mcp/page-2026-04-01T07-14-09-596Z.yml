                    - text: shows the results of DQN, D3QN, and ND3QN algorithms planning paths during training and compares the paths generated by RRT* in the same environment. As shown in
                    - link "Figure 7A" [ref=e935] [cursor=pointer]:
                      - /url: "#F7"
                    - text: ", at the early stages of training, while DQN, D3QN, and ND3QN all successfully reach the target, the planned paths tend to be more convoluted. As training progresses, these reinforcement learning algorithms gradually learn to plan shorter and smoother paths. By the later stages of training, as depicted in"
                    - link "Figure 7D" [ref=e936] [cursor=pointer]:
                      - /url: "#F7"
                    - text: ", ND3QN not only generates paths that are shorter and smoother than those produced by the other algorithms, but it also better adapts to the direction of ocean currents, effectively leveraging them to reduce travel time."
