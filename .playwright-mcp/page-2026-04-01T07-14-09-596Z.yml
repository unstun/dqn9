                  - heading "2.3 Reinforcement learning" [level=3] [ref=e204]
                  - paragraph [ref=e205]:
                    - text: Reinforcement learning relies on the framework of Markov Decision Processes (MDPs) to model the interaction between an agent and its environment (Alvarez et al.,
                    - link "2004" [ref=e206] [cursor=pointer]:
                      - /url: "#B1"
                    - text: "). MDPs are defined by five key components: the state space"
                    - emphasis [ref=e207]: S
                    - text: ", the action space"
                    - emphasis [ref=e208]: A
                    - text: ", the state transition probabilities"
                    - emphasis [ref=e209]: P
                    - text: ", the reward function"
                    - emphasis [ref=e210]: R
                    - text: ", and the policy π("
                    - emphasis [ref=e211]: a
                    - text: "|"
                    - emphasis [ref=e212]: s
                    - text: ), which represents the probability of taking action
                    - emphasis [ref=e213]: a
                    - text: in state
                    - emphasis [ref=e214]: s
                    - text: (Alvarez et al.,
                    - link "2004" [ref=e215] [cursor=pointer]:
                      - /url: "#B1"
                    - text: ). In each iteration, the agent selects an action
                    - emphasis [ref=e216]: a
                    - subscript [ref=e217]:
                      - emphasis [ref=e218]: t
                    - text: based on its current policy π
                    - subscript [ref=e219]:
                      - emphasis [ref=e220]: t
                    - text: ", which influences the state transition of the environment. This leads to a new state"
                    - emphasis [ref=e221]: s
                    - subscript [ref=e222]:
