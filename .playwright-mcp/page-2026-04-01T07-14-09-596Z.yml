                    - paragraph [ref=e1282]: For example, Seed = 10 represents the average of each metric corresponding to successful paths in 200 different environments generated using this random seed.
                  - paragraph [ref=e1283]:
                    - text: The analysis of variance (ANOVA) in
                    - link "Table 5" [ref=e1284] [cursor=pointer]:
                      - /url: "#T5"
                    - text: reveals significant differences among the algorithms in terms of path length, travel time, and path smoothness (
                    - emphasis [ref=e1285]: p
                    - strong [ref=e1286]: <
                    - text: 0.001), indicating that the path planning results differ significantly across the algorithms. The multiple comparison results in
                    - link "Table 6" [ref=e1287] [cursor=pointer]:
                      - /url: "#T6"
                    - text: further confirm the superiority of the ND3QN algorithm, showing significant differences in all three path quality metrics compared to RRT*, DQN, and D3QN (
                    - emphasis [ref=e1288]: p
                    - strong [ref=e1289]: <
                    - text: 0.001). For example, ND3QN's path length is 9.2405 nautical miles shorter than that of DQN (
                    - emphasis [ref=e1290]: p
                    - strong [ref=e1291]: <
                    - text: 0.001). These statistical results demonstrate the significant advantage of the ND3QN algorithm in path planning. Specifically, the ND3QN algorithm reduced path length by 7.39%, 8.77%, and 3.38% compared to RRT*, DQN, and D3QN, respectively. The average travel time of ND3QN (81.1986 h) was reduced by 9.68%, 10.73%, and 7.16% compared to RRT*, DQN, and D3QN, respectively. This indicates that even in environments with randomly generated obstacles, ND3QN can select paths more aligned with ocean currents, thereby reducing travel time. Furthermore, the average path smoothness of ND3QN improved by 87.04%, 67.66%, and 54.94% compared to RRT*, DQN, and D3QN, respectively. This improvement is attributed to the expanded action space and the incorporation of path smoothness rewards.
