                    - paragraph [ref=e1544]: The mean difference represents the mean of the former algorithm subtracted by the mean of the latter in each pairwise comparison. *, **, and *** denote significance at the 10%, 5%, and 1% levels, respectively.
                  - paragraph [ref=e1545]: "In this section, the unknown environment's path planning scenario was simulated by randomly placing obstacles. The experimental results indicate that the ND3QN algorithm significantly outperforms the RRT*, DQN, and D3QN algorithms in the three evaluation metrics: path length, travel time, and path smoothness. Compared to these three algorithms, ND3QN reduced path length by approximately 3%–9%, travel time by about 7%–11%, and improved path smoothness by around 55%–88%, with an increased success rate of 4%–11%. This demonstrates the ND3QN algorithm's significant advantage in planning shorter, smoother, and more efficient paths, better able to adapt to unknown environments."
                - generic [ref=e1546]:
                  - heading "4.4 Comparison with other algorithms" [level=3] [ref=e1547]
                  - paragraph [ref=e1548]:
                    - text: To further validate the performance of the ND3QN algorithm, we compared it with several recently proposed path-planning algorithms. The BI-RRT* algorithm, introduced by Fan et al. (
                    - link "2024" [ref=e1549] [cursor=pointer]:
                      - /url: "#B8"
                    - text: ), improves path planning capabilities over the traditional RRT* by expanding the obstacle regions, employing a bidirectional search strategy, and utilizing cubic spline interpolation for path smoothing. Yang et al. (
                    - link "2023b" [ref=e1550] [cursor=pointer]:
                      - /url: "#B43"
                    - text: ) developed the NPDDQN algorithm, which enhances adaptability in complex environments by integrating double DQN with prioritized experience replay and multi-step reward strategies.
                  - paragraph [ref=e1551]:
                    - text: In the same complex environment with 30 obstacles, we conducted a detailed comparison of the RRT*, BI-RRT*, NPDDQN, and ND3QN algorithms, with the experimental results shown in
                    - link "Figure 11" [ref=e1552] [cursor=pointer]:
                      - /url: "#F11"
                    - text: and
                    - link "Table 7" [ref=e1553] [cursor=pointer]:
                      - /url: "#T7"
                    - text: . Specifically, ND3QN's travel time is 81.8266 h, which is 3.64 h faster than the BI-RRT* and 2.2311 h faster than the NPDDQN. Regarding path smoothness, BI-RRT* improves path smoothness considerably through interpolation techniques, outperforming RRT*. However, ND3QN achieves the lowest smoothness value, indicating that it generates the smoothest paths among all compared algorithms. These results demonstrate ND3QN's superior performance in terms of path length, travel time, and path smoothness, further validating its potential for underwater path planning tasks.
