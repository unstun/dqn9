                  - paragraph [ref=e313]: The introduction of the target network in DQN enhances its efficiency and convergence, reducing variance during training and stabilizing the learning process.
                - generic [ref=e314]:
                  - heading "2.4 Dueling Double Deep Q-Network" [level=3] [ref=e315]
                  - paragraph [ref=e316]:
                    - text: Merging the advantages of Double DQN with those of Dueling DQN results in the formation of the Dueling Double Deep Q-Network (D3QN) algorithm. This integration addresses the overestimation bias typically found in the conventional DQN, thereby enhancing the learning process's overall performance and stability. Double DQN separates the action selection from the target Q-value computation by identifying the action with the highest Q-value in the current Q network and then using this action to calculate the target Q-value in the target Q network, effectively reducing the risk of overestimation (Hasselt et al.,
                    - link "2016" [ref=e317] [cursor=pointer]:
                      - /url: "#B16"
                    - text: "). Here is the definition of the loss function:"
