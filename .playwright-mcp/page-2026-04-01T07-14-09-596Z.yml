              - generic [ref=e353]:
                - heading "3 Methods" [level=2] [ref=e354]: 3 Methods
                - paragraph [ref=e355]: This section provides a detailed introduction to the ND3QN algorithm. Initially, we describe the environmental state variables, including AUV position and orientation information, obstacle information, and ocean current data. Subsequently, we expand on the action space and describe the state transition method. Following this, we elaborate on the composite reward function, which accounts for factors such as ocean currents, obstacles, and turning constraints. Lastly, we introduce a noise network based on the D3QN algorithm.
                - generic [ref=e356]:
                  - heading "3.1 Environmental states" [level=3] [ref=e357]
                  - paragraph [ref=e358]:
                    - text: In the realm of reinforcement learning research and applications, environmental state variables form the foundation of an agent's perception of the surrounding environment. These variables constitute a set of observational data, thereby providing a comprehensive representation of the agent's context, which is crucial for the agent to make effective decisions (Sutton and Barto,
                    - link "2018" [ref=e359] [cursor=pointer]:
                      - /url: "#B36"
                    - text: ). In the underwater operational environment of an AUV, the environmental state variables should encompass the AUV's position and orientation information, as well as external elements like ocean currents and obstacles. In this study, the AUV's local environmental information is represented by the state variables
                    - text: ", where"
                    - text: denotes position information, ψ represents heading angle information,
                    - text: indicates ocean current information, and
                    - emphasis [ref=e360]: M
                    - text: denotes the detection range matrix.
                  - generic [ref=e361]:
                    - heading "3.1.1 Position orientation information" [level=4] [ref=e362]
