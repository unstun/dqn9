                  - generic [ref=e545]:
                    - heading "3.3.3 Ocean current reward" [level=4] [ref=e546]
                    - paragraph [ref=e547]: "In the course of AUV navigation, ocean currents are an indispensable external factor that directly impacts the AUV's speed and energy consumption. To effectively utilize ocean currents for reducing both travel time and energy consumption, we introduce a reward function related to ocean currents:"
                    - table [ref=e548]:
                      - rowgroup [ref=e549]:
