                    - paragraph [ref=e379]: The AUV's decision-making will be influenced by its attitude differences, even when it is in the same circumstance. Therefore, we incorporate the AUV's heading angle ψ as attitude information into the environmental state variable.
                  - generic [ref=e380]:
