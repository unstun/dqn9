                    - emphasis [ref=e469]: t
                    - text: represents the control time interval.
                  - paragraph [ref=e470]: Path planning involves generating a trajectory from a starting point to a destination, which can be represented as a sequence of waypoints. An AUV initiates its journey from the starting point and selects its current action based on discrete action decision-making. Subsequently, by executing the chosen action in conjunction with the position of the current waypoint, the AUV determines the location of the subsequent waypoint. This iterative process continues until the AUV reaches the final destination, thereby compiling a series of waypoints that collectively constitute a complete path.
                - generic [ref=e471]:
                  - heading "3.3 Reward function" [level=3] [ref=e472]
                  - paragraph [ref=e473]:
                    - text: Evaluating an agent's actions is paramount, with the reward function being one of the key determinants in the success and efficiency of reinforcement learning algorithms. Especially in environments with highly complex states and actions, reliance on a single reward often hinders the agent from effectively learning the optimal policy (Tang et al.,
                    - link "2024" [ref=e474] [cursor=pointer]:
                      - /url: "#B37"
                    - text: ). Consequently, after a comprehensive consideration of the motion control characteristics, environmental obstacles, and ocean current influences during AUV navigation, we have designed a composite reward function. This function encompasses distance reward, obstacle avoidance reward, ocean current reward, path smoothness reward, and step reward.
                  - generic [ref=e475]:
                    - heading "3.3.1 Distance reward" [level=4] [ref=e476]
                    - paragraph [ref=e477]:
                      - text: The distance reward guides the AUV to approach the goal point. A fixed reward
