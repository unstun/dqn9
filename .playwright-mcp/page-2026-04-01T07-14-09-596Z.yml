                - generic [ref=e1604]:
                  - heading "4.5 Results in real terrain environment" [level=3] [ref=e1605]
                  - paragraph [ref=e1606]:
                    - text: We selected a real terrain area (GEBCO Compilation Group,
                    - link "2020" [ref=e1607] [cursor=pointer]:
                      - /url: "#B13"
                    - text: ), as shown in
                    - link "Figure 12" [ref=e1608] [cursor=pointer]:
                      - /url: "#F12"
                    - text: . To facilitate the calculation of the detection distance matrix through the simulated sonar model, we compressed the real terrain into a grid map, as illustrated in
                    - link "Figure 13" [ref=e1609] [cursor=pointer]:
                      - /url: "#F13"
                    - text: . We configured the AUV to cruise at 4 kn, with the starting point at (30.04°S, 36.55°W) and the goal point at (31.49°S, 34.26°W). Despite the increased difficulty due to the larger search space, our algorithm was still able to plan a time-efficient path.
                    - link "Figure 14" [ref=e1610] [cursor=pointer]:
                      - /url: "#F14"
                    - text: shows the planned path, with a length of 276.67 nautical miles and a time cost of 34.03 h. In the real environment, the terrain is more complex compared to the circular obstacles used in the simulation. However, by inputting the detection distances obtained from the simulated sonar into the agent as state information, the AUV arrives at the objective site without incident. This demonstrates that our algorithm can handle missions in real ocean environments, showcasing its feasibility in practical scenarios.
