            - heading "B.6 Details on the Compared Methods" [level=3] [ref=e3283]:
              - generic [ref=e3284]: B.6
              - text: Details on the Compared Methods
            - paragraph [ref=e3286]:
              - text: TSP-based solution with A*. For the TSP baseline we subdivide the environment into square grid cells of comparable size to the agent, and apply a TSP solver to find the shortest path to visit the center of each cell, which are the nodes. In order to guarantee that each cell is fully covered by a circular agent, the side length for each grid cell is set to
              - math [ref=e3287]:
                - generic [ref=e3289]:
                  - generic [ref=e3291]: "2"
                  - generic: ⁢
                  - generic [ref=e3292]: r
              - text: ", where"
              - math [ref=e3293]:
                - generic [ref=e3295]: r
              - text: is the agent radius. Note that this leads to overlap and thus increases the time to reach full coverage. In the offline case, we compute the weight between each pair of nodes using the shortest path algorithm, A*
              - generic [ref=e3296]:
                - text: (Hart et al.,
                - link "1968" [ref=e3297] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2306.16978v4#bib.bib16
                - text: )
              - text: . However, due to the size of our environments, the computation time was infeasible. Thus, we implemented a supremum heuristic for distant nodes, where they would be assigned the largest possible path length instead of running A*. This improved the runtime considerably, while not affecting the path length to a noticeable extent. For the online case we applied the TSP solver on all visible nodes, executed the path while observing new nodes, and repeated until all nodes were covered. In this case, the TSP execution time on an Epyc 7742 64-core CPU was included in the coverage time, as the path would need to be replanned online in a realistic setting. However, the execution time was relatively small compared to the time to navigate the path. We also tried replanning in shorter intervals, but the gain in time due to a decreased path length was smaller than the increase in computation time.
