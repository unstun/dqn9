              - link "2013" [ref=e84] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib12
              - text: )
            - text: ", and known to be NP-hard"
            - generic [ref=e85]:
              - text: (Arkin et al.,
              - link "2000" [ref=e86] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib2
              - text: )
            - text: . If the environment is known a priori, including the extent of the area and the location and geometry of all obstacles, an optimal path can be planned offline
            - generic [ref=e87]:
              - text: (Huang,
              - link "2001" [ref=e88] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib20
              - text: )
            - text: . However, if the environment is initially unknown, or at least partially unknown, the path has to be planned online, e.g. by a robot, using sensors to simultaneously map the environment. In this case, an optimal path cannot generally be found
            - generic [ref=e89]:
              - text: (Galceran & Carreras,
              - link "2013" [ref=e90] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib12
              - text: )
            - text: .
          - paragraph [ref=e92]:
