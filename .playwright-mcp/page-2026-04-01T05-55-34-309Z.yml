              - text: we find that our approach works well in a continuous setting, which hints that it may also work in other continuous control spaces for specific kinematic models. The same conclusion could not be drawn if a discrete action space was used. (3) Our specific choice of linear and angular velocities applies directly to a wide variety of robots, e.g. differential drive systems and the Ackermann kinematic model (by using a constraint on the angular velocity). Thus, sim-to-real transfer is more likely compared to a discrete action space. (4) Compared to grid-based discrete actions, a continuous action space introduces additional sources for error, both regarding dynamics and localization, which are more realistic.
