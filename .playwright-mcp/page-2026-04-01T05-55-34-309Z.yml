              - generic [ref=e2487]: A.3
              - text: Collision Frequency
            - paragraph [ref=e2489]: In most real-world applications, it is vital to minimize the collision frequency, as collisions can inflict harm on humans, animals, the environment, and the robot. To gain insights into the collision characteristics of our trained agent, we tracked the collision frequency during evaluation. For exploration, it varied between once every 100-1000 seconds, which is roughly once every 50-500 meters. For lawn mowing, it varied between once every 150-250 seconds, which is roughly once every 30-50 meters. These include all forms of collisions, even low-speed side collisions. The vast majority of collisions were near-parallel, and we did not observe any head on collisions. The practical implications are very different between these cases.
