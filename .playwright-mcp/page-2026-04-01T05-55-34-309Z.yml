            - paragraph [ref=e2076]: Agent architectures. The higher model capacity of the CNN architecture enables a better understanding of the environment, and outperforms the MLP baseline (② vs. ①). Our proposed architecture (SGCNN, ⑥), which groups the different scales and convolves them separately, further improves the performance compared to a naive CNN, which treats all scales as the same spatial structure.
            - paragraph [ref=e2078]: Multi-scale frontier maps. We find that our proposed frontier map representation is crucial for achieving a high performance with the multi-scale map approach (④ vs. ⑥). Without this input feature, too much information is lost in the coarser scales, thus hindering long-term planning.
