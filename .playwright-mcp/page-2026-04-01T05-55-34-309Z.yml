          - paragraph [ref=e82]:
            - text: Task automation is an ever growing field, and as automated systems become more intelligent, they are expected to solve increasingly challenging problems. One such problem is coverage path planning (CPP), where a path is sought that covers the entire free space of a confined area. It is related to the traveling salesman and covering salesman problems
