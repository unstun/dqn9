            - generic [ref=e155]: "2"
            - text: Related Work
          - paragraph [ref=e157]: Coverage path planning has previously been approached from the perspective of classical robotics, as well as reinforcement learning. Both approaches require a suitable map representation of the environment. Below, we summarize the related works within these topics.
          - paragraph [ref=e159]:
            - text: Planning-based methods. Cellular decomposition methods, such as boustrophedon cellular decomposition (BCD)
            - generic [ref=e160]:
              - text: (Choset & Pignon,
              - link "1998" [ref=e161] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib10
              - text: )
            - text: and Morse decomposition
            - generic [ref=e162]:
              - text: (Acar et al.,
              - link "2002" [ref=e163] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib1
              - text: )
            - text: ", subdivide the area into non-overlapping cells free of obstacles. Each cell is covered with a pre-defined pattern, e.g. a back-and-forth motion. The cells are then connected using transport paths, which inevitably lead to overlap with the covered cells. Grid-based methods, such as Spiral-STC"
            - generic [ref=e164]:
              - text: (Gabriely & Rimon,
              - link "2002" [ref=e165] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib11
              - text: )
            - text: and the backtracking spiral algorithm (BSA)
            - generic [ref=e166]:
              - text: (Gonzalez et al.,
              - link "2005" [ref=e167] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib13
              - text: )
            - text: ", decompose the environment into uniform grid cells, such as rectangles"
            - generic [ref=e168]:
              - text: (Zelinsky et al.,
              - link "1993" [ref=e169] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib41
              - text: )
            - text: or triangles
            - generic [ref=e170]:
              - text: (Oh et al.,
              - link "2004" [ref=e171] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib27
              - text: )
            - text: ", with a comparable size to the agent. The coverage path is defined by primitive motions between adjacent cells. The simplicity of these methods is attractive, but they heavily constrain the space of available paths. Frontier-based methods keep track of the boundary between covered and non-covered free space, i.e. the frontier. Segments of the frontier are clustered into nodes, where one node is chosen as the next short-term goal. Different criteria for choosing which node to visit next have been explored, such as the distance to the agent"
            - generic [ref=e172]:
