              - text: meters per pixel for the finest scale, which corresponds to
              - math [ref=e1456]:
                - generic [ref=e1458]: "4"
              - text: pixels per agent radius. Thus, the maps span a square with side length
              - math [ref=e1459]:
                - generic [ref=e1461]: "76.8"
              - text: m. We progressively increase the difficulty of the environment during training, starting from simple maps and increase their complexity over time. The episodes are terminated when a goal coverage rate between
