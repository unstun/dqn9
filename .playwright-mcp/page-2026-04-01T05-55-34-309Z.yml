              - text: is reached, depending on the training progression. For full details on the progressive training, see Appendix
              - link "B.5" [ref=e1470] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#A2.SS5
              - text: . Based on initial experiments, we find suitable reward parameters. The episodes are prematurely truncated if
              - math [ref=e1471]:
                - generic [ref=e1473]:
                  - generic [ref=e1474]: τ
                  - generic [ref=e1475]: =
