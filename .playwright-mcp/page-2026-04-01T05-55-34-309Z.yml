            - paragraph [ref=e628]:
              - text: A continuous action space is of course not the only choice, but it is more realistic than a discrete one. There are many reasons why we chose continuous actions. (1) This allows us to model a continuous pose that is not constrained by the grid discretization, and thus not constraining the path space. (2) The agent can adapt and optimize its path for a specific kinematic model. In Section
              - link "4" [ref=e629] [cursor=pointer]:
