              - text: Frontier maps. When the closest vicinity is covered, the agent needs to make a decision where to explore next. However, the information in the low-resolution large-scale maps may be insufficient. For example, consider an obstacle-cluttered region where the obstacle boundaries have been mapped. A low coverage could either mean that some parts are non-covered free space, or that they are occupied by obstacles. These cases cannot be distinguished if the resolution is too low. As a solution to this problem, we propose to encode a multi-scale frontier map
              - math [ref=e581]:
                - generic [ref=e583]:
                  - generic [ref=e584]: M
                  - generic [ref=e585]: f
              - text: ", which we define in the following way. In the finest scale, a grid cell that has not been visited is a frontier point if any of its neighbours have been visited. Thus, a frontier point is non-visited free space that is reachable from the covered area. A region where the entire free space has been visited does not induce any frontier points. In the coarser scales, a grid cell is a frontier cell if and only if it contains a frontier point. In this way, the existence of frontier points persists through scales. Thus, regions with non-covered free space can be deduced in any scale, based on this multi-scale frontier map representation."
            - paragraph [ref=e587]:
              - text: Egocentric maps. As the movement is made relative to the agent, its pose needs to be related to the map of the environment. Following
