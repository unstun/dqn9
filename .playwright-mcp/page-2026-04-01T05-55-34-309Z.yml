              - text: ", we experimented with a goal coverage reward, and an episode truncation reward. Both were added at the end of every episode. The goal coverage reward was a positive reward that was given once the agent reached the predefined goal coverage. The truncation reward was a negative reward that was given in case the episode was prematurely truncated due to the agent not covering new ground in"
