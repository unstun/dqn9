                - text: )
              - text: ", we use egocentric maps which encode the pose by representing the maps in the coordinate frame of the agent. Each multi-scale map is aligned such that the agent is in the center of the map, facing upwards. This allows the agent to easily map observations to movement actions, instead of having to learn an additional mapping from a separate feature representation of its position, such as a 2D one-hot map"
