            - paragraph [ref=e1534]:
              - text: Map geometry. To increase the variation of encountered scenarios, we use both a fixed set of maps and randomly generated maps, see Figure
              - link "5" [ref=e1535] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#S4.F5
              - text: for examples. The fixed maps provide both simple, and more challenging scenarios that a CPP method is expected to solve. The randomly generated maps provide orders of magnitude more variation during training, and avoid the problem of overfitting to the fixed maps. They are created by randomizing grid-like floor plans with obstacles. For more details, see Appendix
              - link "B.4" [ref=e1536] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#A2.SS4
              - text: .
            - paragraph [ref=e1538]:
              - text: Evaluation and comparison. We measure the times
              - math [ref=e1539]:
                - generic [ref=e1541]:
                  - generic [ref=e1542]: T
                  - generic [ref=e1543]: "90"
              - text: and
              - math [ref=e1544]:
                - generic [ref=e1546]:
                  - generic [ref=e1547]: T
                  - generic [ref=e1548]: "99"
              - text: to reach
              - math [ref=e1549]:
                - generic [ref=e1551]:
                  - generic [ref=e1552]: "90"
                  - generic [ref=e1553]: "%"
              - text: and
              - math [ref=e1554]:
                - generic [ref=e1556]:
                  - generic [ref=e1557]: "99"
                  - generic [ref=e1558]: "%"
              - text: coverage, respectively. For inference times and collision statistics, see
              - link "Sections A.2" [ref=e1559] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#A1.SS2
              - text: and
              - link "A.3" [ref=e1560] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#A1.SS3
              - text: . We use separate maps for evaluation that are not seen during training, see Appendix
              - link "B.7" [ref=e1561] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#A2.SS7
              - text: for a full list. We compare our approach across three CPP variations, to a total of seven previous methods that are tailored for either exploration or the lawn mowing task. For exploration, we evaluate our method on Explore-Bench
              - generic [ref=e1562]:
                - text: (Xu et al.,
                - link "2022" [ref=e1563] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2306.16978v4#bib.bib37
                - text: )
              - text: ", which is a recent benchmark that implements challenging environments, where four methods have been evaluated by the authors. These include three frontier-based methods, namely a distance-based frontier method"
              - generic [ref=e1564]:
                - text: (Yamauchi,
                - link "1997" [ref=e1565] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2306.16978v4#bib.bib38
                - text: )
              - text: ", an RRT-based frontier method"
              - generic [ref=e1566]:
                - text: (Umari & Mukhopadhyay,
                - link "2017" [ref=e1567] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2306.16978v4#bib.bib35
                - text: )
              - text: ", and a potential field-based frontier method"
              - generic [ref=e1568]:
                - text: (Yu et al.,
                - link "2021" [ref=e1569] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2306.16978v4#bib.bib40
                - text: )
              - text: . The fourth method is an RL-based approach, where
              - generic [ref=e1570]:
                - text: Xu et al. (
                - link "2022" [ref=e1571] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2306.16978v4#bib.bib37
                - text: )
              - text: train an RL model to determine a global goal based on active neural SLAM
              - generic [ref=e1572]:
                - text: (Chaplot et al.,
                - link "2020" [ref=e1573] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2306.16978v4#bib.bib6
                - text: )
              - text: . Finally, we reimplement a fifth method by
              - generic [ref=e1574]:
                - text: Hu et al. (
                - link "2020" [ref=e1575] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2306.16978v4#bib.bib19
                - text: )
              - text: that uses RL to navigate to a chosen frontier node. For the lawn mowing task, we compare with the backtracking spiral algorithm (BSA)
              - generic [ref=e1576]:
                - text: (Gonzalez et al.,
                - link "2005" [ref=e1577] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2306.16978v4#bib.bib13
                - text: )
              - text: ", which is a common benchmark for this CPP variation. Additionally, we implement a baseline that combines A*"
              - generic [ref=e1578]:
                - text: (Hart et al.,
                - link "1968" [ref=e1579] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2306.16978v4#bib.bib16
                - text: )
              - text: with a travelling salesman problem (TSP) solver on nodes in a grid-like configuration. This has previously been proposed for the lawn mowing task in the offline setting for small environments
              - generic [ref=e1580]:
                - text: (Bormann et al.,
                - link "2018" [ref=e1581] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2306.16978v4#bib.bib4
                - text: )
              - text: . To make it feasible for our larger environments, a heuristic was required for distant nodes, and periodic replanning was used for the online case. For full details, see Appendix
              - link "B.6" [ref=e1582] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#A2.SS6
              - text: . We provide videos showcasing the learned paths of our approach.
