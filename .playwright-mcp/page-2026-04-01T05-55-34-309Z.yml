        - generic [ref=e2095]:
          - heading "5 Conclusions" [level=2] [ref=e2096]:
            - generic [ref=e2097]: "5"
            - text: Conclusions
          - paragraph [ref=e2099]: We present a method for online coverage path planning in unknown environments, based on a continuous end-to-end deep reinforcement learning approach. The agent implicitly solves three tasks simultaneously, namely mapping of the environment, planning a coverage path, and navigating the planned path while avoiding obstacles. For a scalable solution, we propose to use multi-scale maps, which is made viable through frontier maps that preserve the existence of non-covered space in coarse scales. We propose a novel reward term based on total variation, which significantly improves coverage time when applied locally, but not globally. The result is a task- and robot-agnostic CPP method that can be applied to different applications, which has been demonstrated on the exploration and lawn mowing tasks.
