        - generic [ref=e2405]:
          - heading "Appendix A Extended Analysis" [level=2] [ref=e2406]:
            - generic [ref=e2407]: Appendix A
            - text: Extended Analysis
          - generic [ref=e2408]:
            - heading "A.1 The Necessity of Multi-scale Maps" [level=3] [ref=e2409]:
              - generic [ref=e2410]: A.1
              - text: The Necessity of Multi-scale Maps
            - paragraph [ref=e2412]:
              - text: While the multi-scale maps can represent large regions efficiently, they are even necessary for large-scale environments. In large environments, using a single map is not feasible as the computational cost is
              - math [ref=e2413]:
                - generic [ref=e2415]:
                  - generic [ref=e2416]: 𝒪
                  - generic: ⁢
                  - generic [ref=e2417]:
                    - generic [ref=e2418]: (
                    - generic [ref=e2419]:
                      - generic [ref=e2420]: "n"
                      - generic [ref=e2421]: "2"
                    - generic [ref=e2422]: )
              - text: . For example, with our current setup with 4 maps that span an area of size
              - math [ref=e2423]:
                - generic [ref=e2425]:
                  - generic [ref=e2426]: "76.8"
                  - generic [ref=e2427]: ×
                  - generic [ref=e2428]: "76.8"
              - text: m
              - superscript [ref=e2429]: "2"
              - text: ", the training step time is 40 ms. With a single map spanning only"
              - math [ref=e2430]:
                - generic [ref=e2432]:
                  - generic [ref=e2433]: "19.2"
                  - generic [ref=e2434]: ×
                  - generic [ref=e2435]: "19.2"
              - text: m
              - superscript [ref=e2436]: "2"
              - text: using the same pixel resolution as the finest scale, the training step time is 2500 ms. This would increase the total training time by roughly two orders of magnitude. Going beyond this size resulted in memory problems on a T4 16GB GPU. Thus, a multi-scale map is necessary for large-scale environments.
          - generic [ref=e2437]:
            - heading "A.2 Inference Time Analysis" [level=3] [ref=e2438]:
              - generic [ref=e2439]: A.2
              - text: Inference Time Analysis
            - paragraph [ref=e2441]:
              - text: We evaluate the inference time of our method on two different systems in Table
              - link "5" [ref=e2442] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#A1.T5
              - text: . System 1 is a high-performance computing cluster, with 16-core 6226R CPUs, and T4 GPUs. However, only 4 CPU cores and one GPU were allocated for the analysis. System 2 is a laptop computer, with a 2-core i5-520M CPU, without a GPU. The times are compared between the mowing and exploration tasks, where the inference time is lower for the mowing task since a smaller local neighborhood is used for updating the global coverage map. As our network is fairly lightweight it can run in real time, i.e.
              - math [ref=e2443]:
                - generic [ref=e2445]:
