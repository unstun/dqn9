          - paragraph [ref=e106]:
            - text: We aim to develop a task- and robot-agnostic method for online CPP in unknown environments. This is a challenging task, as intricacies in certain applications may be difficult to model, or even impossible. In the real world, unforeseen discrepancies between the modeled and true environment may occur, e.g. due to wheel slip. A further aspect that needs to be considered is the sensing capability of the agent, e.g. if it is not omnidirectional, the agent needs to rotate itself to explore a different view. Incompleteness of the present model must be assumed to account for open world scenarios. Thus, we approach the problem from the perspective of learning through embodiment. Reinforcement learning (RL) lends itself as a natural choice, where an agent can interact with the world and adapt to specific environment conditions, without the need for an explicit model. Concretely, we consider the case where an RL model directly predicts the control signals for an agent from sensor data. Besides the benefit of adapting to specific environment characteristics, this approach does not constrain the path space in terms of pre-defined patterns in cellular decomposition methods
            - generic [ref=e107]:
              - text: (Choset & Pignon,
              - link "1998" [ref=e108] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib10
              - text: )
            - text: ", or primitive motions in grid-based methods"
            - generic [ref=e109]:
              - text: (Gabriely & Rimon,
              - link "2002" [ref=e110] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib11
              - text: )
            - text: . In other words, it allows for flexibility in the path space, as shown in
            - link "Figure 1" [ref=e111] [cursor=pointer]:
              - /url: https://arxiv.org/html/2306.16978v4#S0.F1
            - text: .
