              - link "2017" [ref=e175] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib35
              - text: )
            - text: ", or the gradient in a potential field"
            - generic [ref=e176]:
              - text: (Yu et al.,
              - link "2021" [ref=e177] [cursor=pointer]:
                - /url: https://arxiv.org/html/2306.16978v4#bib.bib40
              - text: )
            - text: . These methods are mainly tailored for robot exploration, where the notion of a frontier is suitable. Compared to planning-based methods, RL can adapt to specific environment characteristics.
