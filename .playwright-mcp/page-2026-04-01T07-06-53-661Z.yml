              - text: ).
            - paragraph [ref=e1050]: An important aspect of our setup was the representation of the target as a cylindrical object. However, the Turtlebot’s laser sensor was inherently unable to detect this object directly. This limitation is critical for understanding the robot’s perception and navigational abilities within the environment.
