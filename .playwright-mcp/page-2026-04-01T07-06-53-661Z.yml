            - generic [ref=e99]:
              - generic [ref=e100]: "Figure 1:"
              - text: A mapless motion planner was trained using the Proximal Policy Optimization (PPO) algorithm to guide a nonholonomic mobile robot to its target position while avoiding collisions.
          - paragraph [ref=e102]:
            - text: Mapless navigation represents a significant departure from conventional navigation strategies that heavily depend on static, pre-built maps. Instead, it empowers robots with the capability to explore and maneuver through uncharted territories, responding dynamically to unforeseen obstacles, and adapting to evolving circumstances
            - generic [ref=e103]:
              - text: "["
              - link "1" [ref=e104] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.16266v2#bib.bib1
              - text: "]"
            - text: . This paradigm shift holds immense promise in a wide range of applications, from search and rescue missions in disaster-stricken areas to autonomous exploration of remote and hazardous locations
            - generic [ref=e105]:
              - text: "["
              - link "3" [ref=e106] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.16266v2#bib.bib3
              - text: "]"
            - text: .
          - paragraph [ref=e108]:
            - text: Deep Reinforcement Learning (DRL), a subset of machine learning, has become a powerful tool for enhancing robots’ navigation skills through experiential learning
            - generic [ref=e109]:
              - text: "["
              - link "5" [ref=e110] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.16266v2#bib.bib5
              - text: "]"
            - text: . By employing DRL algorithms, robots can make informed decisions in real-time, learning from their actions and refining their path-planning strategies to meet specific objectives. This adaptive learning process mirrors human-like decision-making, enabling robots to navigate smoothly and effectively even in the absence of conventional maps.
          - paragraph [ref=e112]:
            - text: The Robot Operating System (ROS) has established itself as the predominant standard for developing and controlling robotic systems. Offering a versatile framework, ROS facilitates the seamless integration of diverse sensors, actuaries, and control algorithms
            - generic [ref=e113]:
              - text: "["
              - link "6" [ref=e114] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.16266v2#bib.bib6
              - text: "]"
            - text: . When coupled with Gazebo, a high-fidelity robot simulation environment, ROS allows for rigorous testing and validation of mapless navigation algorithms in a secure and controlled virtual setting before their deployment in real-world scenarios
            - generic [ref=e115]:
              - text: "["
              - link "7" [ref=e116] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.16266v2#bib.bib7
              - text: "]"
            - text: .
          - paragraph [ref=e118]: This paper delves into the intriguing realm of mapless robot navigation using Deep Reinforcement Learning (DRL). We explore the theoretical foundations of DRL and its practical applications, demonstrating how robots can navigate without relying on pre-existing maps. Building on this foundation, we present an innovative approach to mapless navigation, marked by three key contributions.
          - paragraph [ref=e120]: Firstly, we introduce a Comprehensive Observation Setup that encompasses a wide array of inputs to fully capture the robot’s environment. These inputs include laser readings across 30 dimensions, the robot’s past linear and angular velocities, and the target position relative to the robot, expressed in polar coordinates. Additionally, we consider the robot’s yaw angle and the orientation required to face the target. This multidimensional observation framework facilitates a comprehensive understanding of the robot’s surroundings, empowering the navigation system with enhanced decision-making capabilities.
          - paragraph [ref=e122]: "PPO-Based Learning for Navigation: In our strategy for training the motion planner, we introduce a customized neural network architecture designed specifically for the Proximal Policy Optimization (PPO) algorithm. This modification results in a significant improvement in the overall performance of the planner. Leveraging this reinforcement learning technique, the planner becomes proficient in acquiring effective navigation strategies by optimizing its decision-making process based on available sensory information. Notably, the planner’s capability to directly output continuous linear and angular velocities contributes to a streamlined and efficient navigation process."
          - paragraph [ref=e124]: Through these contributions, we advance the ability of PPO algorithm, offering an innovative solution that combines sparse sensor data, reinforcement learning with PPO, and adaptability to simulated scenarios, promising efficient and adaptable navigation capabilities for robots in a static environments within the simulation context.
        - generic [ref=e125]:
          - heading "II Related Work" [level=2] [ref=e126]:
            - generic [ref=e127]: II
            - text: Related Work
          - paragraph [ref=e129]: Mobile robot navigation has been a significant research area in robotics, and the integration of deep reinforcement learning (DRL) methods for continuous control has gained substantial attention in recent years. This section provides an overview of relevant literature and highlights key contributions in the field.
          - generic [ref=e130]:
            - heading "II-A Navigational Techniques in Robotics" [level=3] [ref=e131]:
              - generic [ref=e132]: II-A
              - text: Navigational Techniques in Robotics
            - paragraph [ref=e134]:
              - text: Traditional methods for mobile robot navigation often rely on techniques such as Simultaneous Localization and Mapping (SLAM) and path planning algorithms like A* and Dijkstra’s. While these methods have proven effective in structured environments, they may struggle in dynamic, unstructured, or partially observable settings. The application of reinforcement learning in robotics has opened new avenues for autonomous navigation. Early approaches focused on discrete action spaces and tabular methods. Researchers successfully applied RL algorithms to tasks like maze navigation and grid world problems. However, the discrete nature of actions limited their applicability to real-world scenarios, especially in continuous control settings. Deep reinforcement learning introduced the use of neural networks to approximate Q-functions or policy functions, enabling robotic agents to handle high-dimensional state and action spaces. Prominent DRL algorithms like Deep Q-Networks (DQN)
              - generic [ref=e135]:
                - text: "["
                - link "8" [ref=e136] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.16266v2#bib.bib8
                - text: "]"
              - text: and Trust Region Policy Optimization (TRPO)
              - generic [ref=e137]:
                - text: "["
                - link "9" [ref=e138] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.16266v2#bib.bib9
                - text: "]"
              - text: showed promising results in challenging environments, but their application to mobile robot navigation remained limited due to the need for discrete action spaces. The breakthrough in continuous control came with algorithms like the Deep Deterministic Policy Gradient (DDPG)
              - generic [ref=e139]:
                - text: "["
                - link "10" [ref=e140] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.16266v2#bib.bib10
                - text: "]"
              - text: and Proximal Policy Optimization (PPO)
              - generic [ref=e141]:
                - text: "["
                - link "15" [ref=e142] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.16266v2#bib.bib15
                - text: "]"
              - text: . These methods facilitated mobile robot navigation in real-world scenarios, enabling smooth and precise control. PPO and DDPG, in particular, allowed robots to learn continuous actions, making it a significant milestone in this field.
          - generic [ref=e143]:
            - heading "II-B Prior Work in Mobile Robot Navigation" [level=3] [ref=e144]:
              - generic [ref=e145]: II-B
              - text: Prior Work in Mobile Robot Navigation
            - paragraph [ref=e147]: Several studies have already applied Deep Reinforcement Learning (DRL) to mobile robot navigation, demonstrating the method’s adaptability and potential in a variety of contexts.
            - paragraph [ref=e149]:
              - text: Researchers have made significant strides in the field of DRL for robotic navigation. Silver et al.
              - generic [ref=e150]:
                - text: "["
                - link "11" [ref=e151] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.16266v2#bib.bib11
                - text: "]"
              - text: utilized the Deep Deterministic Policy Gradient (DDPG) algorithm to empower mobile robots to autonomously navigate through cluttered environments while effectively avoiding obstacles. This study showcases the potential of DRL for enhancing obstacle avoidance capabilities in robots. Zhu et al.
              - generic [ref=e152]:
                - text: "["
                - link "12" [ref=e153] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.16266v2#bib.bib12
                - text: "]"
              - text: pioneered end-to-end navigation by combining convolutional neural networks (CNNs) with DRL. This integration allows robots to process visual data for perception and make navigation decisions dynamically, thus enabling autonomous navigation without explicit programming. The approach exemplifies how DRL can be integrated with other machine learning techniques to improve the autonomy of robotic systems.
            - paragraph [ref=e155]:
              - text: Tobin et al.
              - generic [ref=e156]:
                - text: "["
                - link "13" [ref=e157] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.16266v2#bib.bib13
                - text: "]"
              - text: explored the challenges of Sim-to-Real Transfer, where robots are trained in simulated environments with the aim of applying these learned policies to real-world scenarios. Their work addresses key deployment challenges and highlights the effectiveness of simulation as a training ground for real-life applications. Furthermore, Zheng et al.
              - generic [ref=e158]:
                - text: "["
                - link "14" [ref=e159] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.16266v2#bib.bib14
                - text: "]"
              - text: investigated multi-agent navigation, utilizing multi-agent reinforcement learning to enable teams of robots to collaboratively navigate complex environments. Their research demonstrates how DRL can be extended to coordinate multiple agents, enhancing the collective navigation capabilities in scenarios like search and rescue or synchronized surveying.
            - paragraph [ref=e161]: These studies collectively underscore the versatility and expansive potential of DRL in advancing the field of robotic navigation, paving the way for more sophisticated and autonomous robotic systems.
