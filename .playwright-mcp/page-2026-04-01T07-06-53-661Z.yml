            - paragraph [ref=e1152]: For each training episode, the target’s starting position was randomized within the environment, ensuring it was placed away from obstacles to prevent immediate collisions. This approach of random initialization was vital for training the model to adapt to a wide range of navigation scenarios, enhancing its ability to operate effectively in varied environments.
          - generic [ref=e1153]:
            - heading "IV-B Performance Comparison" [level=3] [ref=e1154]:
              - generic [ref=e1155]: IV-B
              - text: Performance Comparison
            - paragraph [ref=e1157]: "In our study, we explore the efficacy of Proximal Policy Optimization (PPO) enhanced with Residual Blocks across different environmental complexities and reward function designs. We benchmark these against the Deep Deterministic Policy Gradient (DDPG) algorithm to evaluate performance variations. The investigation unfolds through three distinct scenarios:"
            - paragraph [ref=e1159]:
              - text: In this scenario, we aim to showcase the efficacy of ResBlock PPO by comparing it with DDPG and vanilla PPO. Thus, we’ve crafted a simplified environment with a basic reward function depicted in equation
              - link "5" [ref=e1160] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.16266v2#S3.E5
              - text: . This initial setup allows us to gauge the performance attributes of the ResBlock-enhanced PPO algorithm under fundamental conditions.
            - paragraph [ref=e1162]:
              - text: Complex environment and basic reward function outlined in equation
              - link "5" [ref=e1163] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.16266v2#S3.E5
              - text: ": subsequently, we increase the environmental complexity to observe how effectively the ResBlock PPO setup, still utilizing the basic reward function, adapts to and navigates within more challenging contexts."
            - paragraph [ref=e1165]:
              - text: Complex environment and advanced reward function outlined in equation
              - link "6" [ref=e1166] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.16266v2#S3.E6
              - text: ": in the final configuration, we introduce an advanced reward function to our complex environment scenario, aiming to discern the impact of intricate reward structuring on the ResBlock PPO’s navigational efficacy."
