            - heading "V-A Simple Environment with Basic Reward" [level=3] [ref=e1171]:
              - generic [ref=e1172]: V-A
              - text: Simple Environment with Basic Reward
            - paragraph [ref=e1174]: In the first scenario, the ResBlock PPO algorithm demonstrated significant advantages over the DDPG method within the simple environment. Particularly, ResBlock PPO achieved faster navigation, indicating a more efficient and responsive decision-making process. This effectiveness is partly due to the ResBlock architecture, which helps maintain a strong gradient flow during training, essential for quick learning and adaptation.
            - paragraph [ref=e1176]:
              - text: The improved performance depicted in Figure
              - link "7" [ref=e1177] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.16266v2#S5.F7
              - text: shows that ResBlock PPO not only converges more rapidly but also adapts swiftly to environmental changes. This leads to quicker and more accurate pathfinding compared to both DDPG and vanilla PPO.
            - 'figure "Figure 7: Cumulative Reward of Proposed PPO and DDPG in a Simple Environment with Basic Reward Function." [ref=e1178]':
              - img "Refer to caption" [ref=e1179]
