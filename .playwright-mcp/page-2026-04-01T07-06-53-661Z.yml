            - paragraph [ref=e525]: In the study, we leverage the Proximal Policy Optimization (PPO) algorithm to cultivate our tailored model for efficient navigation.
            - paragraph [ref=e527]:
              - text: A shown in figure
              - link "3" [ref=e528] [cursor=pointer]:
