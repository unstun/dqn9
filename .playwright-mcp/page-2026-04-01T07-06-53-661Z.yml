              - text: ", We conducted our experiments in two distinct environments: an obstacle-free environment and a complex environment. Both environments were simulated indoors within a 10 x 10 square meter area, enclosed by walls. The complex environment was additionally populated with obstacles strategically placed to challenge the navigation capabilities of our robot. Throughout the experiments, we utilized the Turtlebot as the robotic platform for these trials (Figure"
