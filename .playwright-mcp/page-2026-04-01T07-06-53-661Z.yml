            - paragraph [ref=e509]: This section details our LiDAR data processing approach to enhance robot navigation in a complex environment. We aim to condense raw sensor data for optimal decision-making by Actor-Critic models while minimizing computational load.
            - paragraph [ref=e511]: The LiDAR sensor captures 30 distance measurements of the robot’s surroundings. To align with Actor-Critic architecture and ensure efficiency, we propose dividing these measurements into 10 batches of three data points each. Within each batch, we select the minimum distance, identifying the closest obstacle in the robot’s field of view. This process yields 10 streamlined observations.
            - paragraph [ref=e513]: This approach enhances the efficiency and effectiveness of our navigation models. By focusing on the nearest obstacle in each batch, we reduce data dimensionality, streamline computational processes, and prioritize relevant information for safe navigation. These selected data points provide actionable insights for generating well-informed navigation commands, optimizing our robotic systems’ navigation capabilities.
            - paragraph [ref=e515]:
