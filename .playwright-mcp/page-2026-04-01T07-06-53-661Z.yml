            - paragraph [ref=e1040]: The training of our model was conducted in virtual environments, using the Robot Operating System (ROS) combined with the Gazebo simulator. These platforms provided a realistic and customizable setting for the experiments.
            - 'figure "Figure 4: The structure of Turtlebot3 robot." [ref=e1041]':
