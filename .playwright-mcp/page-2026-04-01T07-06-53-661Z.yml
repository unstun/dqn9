            - paragraph [ref=e400]: In our implementation of the Proximal Policy Optimization (PPO) algorithm, the actor and critic networks are fundamental components that facilitate the learning process. The actor network is responsible for defining the policy, which specifies the probability distribution of possible actions in a given state. Conversely, the critic network provides an estimate of the value of each state, essentially predicting the expected return from that state.
            - paragraph [ref=e402]: The training of the actor network is guided by the policy loss, which helps in refining the policy to ensure better decision-making in navigating the environment. On the other hand, the critic network is trained to minimize the value loss, aiming to enhance the accuracy of state value predictions.
            - paragraph [ref=e404]: This dual-network approach, where the actor and critic are concurrently trained, is central to the efficiency of the PPO algorithm. By iteratively updating both networks, our system continuously improves in its ability to not only choose optimal actions (via the actor) but also in evaluating the potential future rewards of current states (via the critic). This collaborative training mechanism is particularly effective in our application of mapless motion planning, allowing for a more effective navigation strategy to be developed by the algorithm.
