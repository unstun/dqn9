            - paragraph [ref=e169]: In our research, we employed the Proximal Policy Optimization (PPO) algorithm, a well-regarded reinforcement learning technique known for its stability and efficacy in continuous control tasks. Unlike the Deep Deterministic Policy Gradient (DDPG) algorithm, PPO iteratively updates the policy to maximize the expected cumulative reward, implementing a constraint to limit policy changes and prevent large, abrupt deviations. This controlled approach to policy updates ensures more stable training progress, making PPO particularly suitable for our mapless motion planning problem.
            - paragraph [ref=e171]: "In the Proximal Policy Optimization (PPO) algorithm, the loss function is composed of two integral components: the policy loss and the value loss."
            - paragraph [ref=e173]: "The policy loss is crafted to modulate the updates made to the policy, ensuring they remain modest and do not significantly diverge from the current policy. This controlled adjustment is vital for the stability of the training process, enabling a gradual and steady improvement in policy performance. Mathematically, the policy loss can be described as follows:"
