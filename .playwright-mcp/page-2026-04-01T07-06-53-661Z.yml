        - generic [ref=e79]:
          - heading "Abstract" [level=6] [ref=e80]
          - paragraph [ref=e81]: "Collision-free motion is essential for mobile robots. Most approaches to collision-free and efficient navigation with wheeled robots require parameter tuning by experts to obtain good navigation behavior. This study investigates the application of deep reinforcement learning to train a mobile robot for autonomous navigation in a complex environment. The robot utilizes LiDAR sensor data and a deep neural network to generate control signals guiding it toward a specified target while avoiding obstacles. We employ two reinforcement learning algorithms in the Gazebo simulation environment: Deep Deterministic Policy Gradient and proximal policy optimization. The study introduces an enhanced neural network structure in the Proximal Policy Optimization algorithm to boost performance, accompanied by a well-designed reward function to improve algorithm efficacy. Experimental results conducted in both obstacle and obstacle-free environments underscore the effectiveness of the proposed approach. This research significantly contributes to the advancement of autonomous robotics in complex environments through the application of deep reinforcement learning."
        - generic [ref=e82]:
          - heading "Index Terms:" [level=6] [ref=e83]
          - text: deep reinforcement learning, autonomous navigation, control, obstacle avoidance
        - generic [ref=e84]:
          - heading "I Introduction" [level=2] [ref=e85]:
            - generic [ref=e86]: I
            - text: Introduction
          - paragraph [ref=e88]:
            - text: In an era where robotics is making profound strides in reshaping our world, the ability of robots to autonomously navigate complex and dynamic environments remains a challenge. Conventional robotic navigation systems often rely on meticulously crafted maps, limiting their adaptability to real-world scenarios where environments are constantly changing
            - generic [ref=e89]:
