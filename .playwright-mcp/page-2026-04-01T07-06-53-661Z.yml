            - paragraph [ref=e541]: To align with the dynamics of the Turtlebot, we set the maximum speeds at 0.25 m/s (linear) and 1 rad/s (angular). The integration of two ResBlocks in each of the actor and critic networks is a pivotal enhancement. These blocks significantly improve the flow of information and the efficiency of the control policy, proving indispensable for the robot’s adept navigation in environments without predefined maps.
