              - text: ", In our innovative approach, we introduced an advanced architecture within the actor and critic networks of our Proximal Policy Optimization (PPO) model, significantly enhancing its performance. Central to this enhancement are the Residual Blocks (ResBlocks) integrated into both networks."
            - paragraph [ref=e530]:
              - text: Our system operates with a 16-dimensional observation space designed to meticulously capture environmental nuances. The action space, comprising linear and angular velocities, is adeptly constrained to mirror realistic robotic maneuvers; angular velocity is confined to a range of (-1, 1) using the hyperbolic tangent function (
              - math [ref=e531]:
                - generic [ref=e533]: tanh
              - text: ), while linear velocity is restricted to (0, 1) via a sigmoid function, accommodating the robot’s limited reverse capability due to sparse rear sensor coverage.
            - paragraph [ref=e535]: For environmental perception, we process laser range data, sampling it uniformly from -90 to 90 degrees and normalizing these readings to a (0, 1) scale. This data handling facilitates a more structured and effective decision-making process.
