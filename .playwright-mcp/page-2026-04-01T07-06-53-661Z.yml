                - text: Cumulative Reward of Proposed PPO and DDPG in a Simple Environment with Basic Reward Function.
            - paragraph [ref=e1183]: The architecture’s ability to process environmental cues effectively allows for faster adjustments to changes, enhancing the robot’s navigation capabilities. This trial establishes a clear performance ranking with ResBlock PPO at the forefront, followed by DDPG, and then vanilla PPO. The results underscore the potential of integrating advanced neural network architectures like ResBlock into reinforcement learning frameworks to boost efficiency and adaptability in robotic navigation.
