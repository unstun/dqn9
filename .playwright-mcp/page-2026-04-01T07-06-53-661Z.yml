            - paragraph [ref=e1344]: In a more challenging environment, the application of an advanced reward function significantly enhanced the performance of ResBlock PPO. However, despite the improvement seen in PPO results due to the advanced reward function, DDPG still outperformed it in terms of success rate. Notably, while DDPG achieved a better success rate, it operated slower compared to PPO. This advanced reward function, tailored to assess finer details of the navigation strategy, better complemented ResBlock PPO’s adaptive learning capabilities. It effectively encouraged more strategic decision-making, allowing ResBlock PPO to navigate complex settings more proficiently than the previous version with a simple reward function. This performance improvement highlights the importance of aligning reward mechanisms with specific algorithm strengths, particularly in challenging environments where nuanced decision-making is crucial.
