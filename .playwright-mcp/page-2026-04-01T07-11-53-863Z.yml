        - paragraph [ref=e1738]:
          - text: The experimental results, presented in Table
          - link "3" [ref=e1739] [cursor=pointer]:
            - /url: https://arxiv.org/html/2508.21259v1#S6.T3
          - text: ", compare the performance of various recommendation strategies across different numbers of shown items (10, 25, 50, and 100) using Root Mean Square Error (RMSE) as the evaluation metric. The strategies include three Deep Q-Network (DQN) variants—standard DQN, Double DQN, and Dueling DQN—and a range of non-personalized baselines, such as Popularity and its variants (e.g., PopGini, PopError)."
        - paragraph [ref=e1741]: The DQN-based methods consistently outperform most non-personalized baselines in terms of mean RMSE. Dueling DQN achieves the lowest mean RMSE of 0.429, closely followed by Double DQN and standard DQN, both at 0.430. This suggests that the architectural enhancements in Dueling DQN and Double DQN provide slight but meaningful improvements over the standard DQN.
        - paragraph [ref=e1743]: Dueling DQN achieves the lowest RMSE (0.408), outperforming Double DQN (0.425) and standard DQN (0.431). Non-personalized baselines, such as Popularity (0.497) and Gini (0.672), exhibit higher errors, suggesting that DQN-based methods excel in early-stage preference elicitation due to their adaptive learning capabilities. Double DQN takes the lead with an RMSE of 0.426, followed by standard DQN (0.428) and Dueling DQN (0.436). Popularity improves to 0.471, but remains less effective than the DQN variants. Standard DQN achieves the lowest RMSE (0.421), with Dueling DQN (0.432) and Double DQN (0.439) close behind. Popularity baselines continue to improve, narrowing the gap with DQN methods. PopError emerges as the top performer with an RMSE of 0.424, slightly surpassing Double DQN (0.429), Dueling DQN (0.441), and standard DQN (0.442). This indicates that certain baselines can leverage extensive feedback to rival or exceed DQN-based methods in later stages. These trends suggest that DQN-based methods are particularly effective in the early to mid-range of interactions (10–50 items), while some baselines, like PopError, gain ground with more data.
