        - paragraph [ref=e71]:
          - text: Prior solutions to the cold-user problem have included asking users to provide initial feedback or leveraging side information. For example, active learning approaches solicit a new user’s preferences by prompting them to rate a few items, thereby quickly gathering personal data
          - generic [ref=e72]:
