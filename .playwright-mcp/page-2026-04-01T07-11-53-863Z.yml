      - generic [ref=e1780]:
        - heading "7 Discussion" [level=2] [ref=e1781]:
          - generic [ref=e1782]: "7"
          - text: Discussion
        - paragraph [ref=e1784]: The superior performance of DQN-based methods, especially Dueling DQN, highlights the advantage of reinforcement learning in cold-start recommendation systems. These methods adaptively select items to elicit user preferences, leveraging feedback to minimize RMSE effectively. The slight edge of Dueling DQN (mean RMSE 0.429) over Double DQN and standard DQN (both 0.430) likely stems from its ability to disentangle state values and action advantages, enhancing decision-making. Double DQN’s performance benefits from reduced Q-value overestimation, making it more stable than standard DQN, particularly at higher interaction counts.
        - paragraph [ref=e1786]: These findings have practical implications for designing recommendation systems. DQN-based methods, particularly Dueling DQN, are ideal for platforms needing rapid preference elicitation for new users, such as e-commerce or streaming services. Their early-stage effectiveness (e.g., RMSE 0.408 at 10 items) can enhance user onboarding. However, for systems with longer interaction windows, integrating heuristics like PopError could provide a cost-effective alternative, given their simplicity and competitive late-stage performance.
        - paragraph [ref=e1788]: The study’s reliance on RMSE may overlook other quality aspects, such as recommendation diversity or user satisfaction. The DQN models’ action space, potentially constrained to popular items, might limit personalization for users with niche preferences. Additionally, the offline evaluation using historical data assumes consistent user feedback, which may not hold in real-time settings.
        - paragraph [ref=e1790]:
          - text: Future research directions for recommendation systems could encompass several key areas. Alternative metrics, such as diversity and serendipity, should be integrated alongside traditional measures like RMSE to offer a more comprehensive evaluation of recommendation quality, capturing not only accuracy but also the variety and unexpectedness of suggestions
          - generic [ref=e1791]:
            - text: (Stamenkovic et al.,
            - link "2021" [ref=e1792] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib23
            - text: )
          - text: . Scalability efforts could focus on expanding the DQN’s action space, potentially through embeddings or hierarchical policies, to accommodate larger item catalogs and adapt to real-world demands
          - generic [ref=e1793]:
            - text: (Zhang et al.,
            - link "2019" [ref=e1794] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib28
            - text: )
          - text: . Finally, hybrid approaches combining the adaptability of DQN with the robustness of heuristic methods could enhance performance across both early and late stages of the recommendation process, creating a more resilient and effective system
          - generic [ref=e1795]:
            - text: (Smith & Linden,
            - link "2017" [ref=e1796] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib22
            - text: )
          - text: .
        - paragraph [ref=e1798]: We implemented the entire pipeline in Python 3.6 using the Stable Baselines library on a workstation with an Intel i7 CPU, an NVIDIA RTX 3070 Ti GPU, and 512 GB SSD storage. Each variant was trained for 2,000 episodes per recommendation list (10, 25, 50, or 100 items), requiring approximately six hours of wall-clock time. From a theoretical standpoint, the DQN update scales polynomially in the number of states and actions; by restricting our state and action spaces to the 200 most popular items, we reduce the cubic complexity to a constant factor.
        - paragraph [ref=e1800]: In conclusion, we presented one of the first systematic explorations of advanced Q-network architectures for the cold-user recommendation problem under privacy constraints. Our results show that Double and Dueling DQNs consistently outperform traditional heuristics and provide stable improvements over standard DQN, highlighting the promise of reinforcement learning for adaptive preference elicitation. While the gains are modest, the findings establish a foundation for RL-driven recommenders that do not rely on demographic data, a key requirement in GDPR-era systems. Looking forward, extending evaluation to user-centric measures (e.g., diversity, serendipity) and scaling to larger action spaces will be crucial for bridging research insights with deployment in real-world platforms.
