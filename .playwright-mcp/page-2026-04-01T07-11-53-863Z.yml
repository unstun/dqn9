            - link "2011" [ref=e77] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib30
            - text: )
          - text: . While these approaches alleviate cold-start issues, they require additional data sources or interaction steps.
        - paragraph [ref=e79]:
          - text: Reinforcement learning (RL) has emerged as a promising paradigm for recommender systems, offering a way to continuously adapt to user interactions and optimize long-term rewards
          - generic [ref=e80]:
            - text: (Wang et al.,
            - link "2014" [ref=e81] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib26
            - text: )
          - text: ". Unlike one-shot recommendation algorithms, an RL agent can learn an interactive policy: it treats recommendation as a sequential decision process, where at each step the agent recommends an item, observes the user’s reaction (click, purchase, etc.), and updates its strategy"
          - generic [ref=e82]:
            - text: (Zhao et al.,
            - link "2018" [ref=e83] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib29
            - text: )
          - text: . This framework can naturally handle cold users by learning how to explore their preferences in real time, without requiring demographic data or upfront ratings. However, using RL for recommender systems is rare bacause for the action space, the set of possible items to recommend, is typically huge, making learning difficult
          - generic [ref=e84]:
            - text: (Dureddy & Kaden,
            - link "2018" [ref=e85] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib2
            - text: )
          - text: .
        - paragraph [ref=e87]:
          - text: Recently, Giannikis et al.
          - link "2024" [ref=e89] [cursor=pointer]:
            - /url: https://arxiv.org/html/2508.21259v1#bib.bib7
          - text: introduced a novel approach that combines reinforcement learning with a model-based recommender to tackle the cold-user problem. In their framework, an agent uses a Deep Q-Network (DQN) to choose which item to show to a new user at each step. They demonstrated that an item-based DQN policy could outperform traditional strategies like popularity or hand-crafted active learning heuristics in terms of rating prediction accuracy. This approach illustrates the potential of deep reinforcement learning for cold-start recommendation, but also leaves room for improvement. Standard DQN algorithms are known to suffer from issues such as overestimation bias in Q-value predictions
          - generic [ref=e90]:
            - text: (van Hasselt et al.,
            - link "2015" [ref=e91] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib25
            - text: )
          - text: ", which can lead to suboptimal policies, and they might not fully capitalize on the underlying structure of the state–action value function."
        - paragraph [ref=e93]:
          - text: In this paper, we build upon the baseline of Giannikis et al.
          - link "2024" [ref=e95] [cursor=pointer]:
            - /url: https://arxiv.org/html/2508.21259v1#bib.bib7
          - text: "by introducing enhanced DQN architectures to improve cold-user recommendations. In particular, we investigate two DQN variants: Double DQN"
          - generic [ref=e96]:
            - text: (van Hasselt et al.,
            - link "2015" [ref=e97] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib25
            - text: )
          - text: and Dueling DQN
          - generic [ref=e98]:
            - text: (Wang et al.,
            - link "2016" [ref=e99] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib27
            - text: )
          - text: . Double DQN addresses the overestimation problem by decoupling action selection from evaluation, using two Q-networks to obtain more accurate value estimates. Dueling DQN features a neural network architecture with separate streams to estimate state values and action advantages, which can lead to more stable and generalized learning of which states are valuable regardless of action
          - generic [ref=e100]:
            - text: (Wang et al.,
            - link "2016" [ref=e101] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib27
            - text: )
          - text: . These techniques have proven effective in other domains, but have not been explored in recommender system contexts. We adapt them to the cold-user recommendation scenario and show that they yield small yet consistent gains in accuracy.
        - paragraph [ref=e103]: Our contributions are as follows. (1) We formulate the cold-user recommendation task as an RL problem and reproduce a state-of-the-art baseline DQN method augmented with matrix factorization for new users. (2) We propose the use of Double and Dueling DQN architectures in this setting and describe how they can alleviate specific deficiencies of the standard DQN approach (like overestimation bias and slow convergence). (3) We conduct extensive experiments on a large real-world retail dataset, evaluating recommendation performance across various display sizes (number of items shown) and comparing against multiple baseline strategies (non-personalized and active learning-based). (4) We demonstrate that our enhanced RL agents achieve the lowest Root Mean Square Error (RMSE) in predicting user interactions for cold users – outperforming the original DQN and other baselines – and analyze the statistical significance of the improvements. (5) We discuss the implications of deploying RL for cold-start users, the limitations observed (e.g. performance trends as more items are recommended), and suggest future directions such as reward shaping, hybrid methods, and incorporating richer success metrics beyond RMSE.
        - paragraph [ref=e105]: The rest of this paper is organized as follows. Section 2 reviews related work on recommender systems, cold-start problems, and reinforcement learning in recommendations. Section 3 formally states the cold-user recommendation problem we address. Section 4 describes our methodology, including the baseline matrix factorization + DQN approach and the proposed Double and Dueling DQN enhancements, as well as details of the dataset and evaluation metrics. Section 5 outlines the experimental setup, model architecture, and Section 6. Section 7 presents our findings, discusses the limitations of the proposed approach, outlines avenues for future work, evaluates its feasibility, and offers concluding remarks.
