          - heading "2.1 Cold-User Problem" [level=3] [ref=e110]:
            - generic [ref=e111]: "2.1"
            - text: Cold-User Problem
          - paragraph [ref=e113]:
            - text: The cold-user problem is well studied because it is one of the most popular topic in recommender systems today especially for the internet shop
            - generic [ref=e114]:
