            - text: )
          - text: . Such methods can improve cold-start recommendations but depend on users’ willingness to give explicit feedback and are constrained by which items are queried. Content-based methods incorporate user attributes or item descriptions to infer preferences for new users
          - generic [ref=e74]:
            - text: (Zhou et al.,
            - link "2011" [ref=e75] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib30
            - text: )
          - text: . For instance, functional matrix factorization uses user profile features or product content to bootstrap recommendations
          - generic [ref=e76]:
