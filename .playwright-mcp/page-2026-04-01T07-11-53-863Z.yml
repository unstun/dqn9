        - paragraph [ref=e56]:
          - text: Online platforms like Amazon, Youtube, Spotify, and Tiktok rely on recommender systems to help users navigate an overwhelming number of options. As product variety grows, users face choice overload, where being confronted with too many possibilities can reduce satisfaction
          - generic [ref=e57]:
            - text: (Schwartz,
            - link "2004" [ref=e58] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib20
            - text: )
          - text: . Recommenders mitigate this by personalizing content to each user’s tastes. Nevertheless, providing useful recommendations for new users – the cold-user problem – remains a significant challenge. Cold users come with little or no interaction history, so collaborative filtering and matrix factorization models have sparse or zero data to learn from, often resorting to generic “popular item” suggestions
          - generic [ref=e59]:
            - text: (Palomares et al.,
            - link "2018" [ref=e60] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib16
            - text: )
          - text: . This can degrade the user experience for newcomers. The problem is exacerbated by privacy regulations like General Data Protection Regulation (GDPR) , which restrict using demographic
          - generic [ref=e61]:
            - text: (Pazzani,
            - link "1999" [ref=e62] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib17
            - text: )
          - text: or social
          - generic [ref=e63]:
