            - text: .
        - generic [ref=e128]:
          - heading "2.2 Reinforcement Learning in Recommender System" [level=3] [ref=e129]:
            - generic [ref=e130]: "2.2"
            - text: Reinforcement Learning in Recommender System
          - paragraph [ref=e132]:
            - text: In recent years, reinforcement learning has been applied to personalization problems to optimize long-term user satisfaction or cumulative reward in recommender system. RL can naturally handle interactive settings like news recommendation, ad placement, or multimedia recommendation, where each user interaction (click/no-click, watch or skip) provides a reward signal. Wang et al.
            - link "2014" [ref=e134] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib26
            - text: presented an RL approach for music recommendation that used an
            - math [ref=e135]:
              - generic [ref=e137]: ε
            - text: "-greedy strategy to balance exploring new artists with exploiting known preferences. The RL paradigm is appealing for recommendations because it can in principle adjust to user reactions on the fly and even learn an optimal strategy for asking questions or choosing content for cold users. Multi-armed bandits (a stateless form of RL) have also been widely studied for recommendation and ads, focusing on the exploration-exploitation trade-off to maximize clicks or sales"
            - generic [ref=e138]:
              - text: (Tang et al.,
              - link "2019" [ref=e139] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib24
              - text: ; Lin et al.,
              - link "2022" [ref=e140] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib14
              - text: )
            - text: . However, full RL (with state) can consider the sequence of recommendations and dependencies across time, which bandits ignore
            - generic [ref=e141]:
              - text: (Huang et al.,
              - link "2021" [ref=e142] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib10
              - text: )
            - text: .
          - paragraph [ref=e144]:
            - text: One challenge in applying RL to recommender systems is the enormous action space – there may be hundreds of thousands or millions of items to choose from at each step. Traditional RL algorithms struggle with such large discrete action spaces because it’s infeasible to try every action enough times, and function approximation (like deep neural networks) becomes necessary to generalize across actions. Dureddy and Kaden
            - generic [ref=e145]:
              - text: (Dureddy & Kaden,
              - link "2018" [ref=e146] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib2
              - text: )
            - text: highlighted this issue in their work on RL for collaborative filtering, noting that naive RL approaches can perform poorly due to the huge item space and sparse rewards. Approaches to mitigate this include action space reduction
            - generic [ref=e147]:
              - text: (Choi et al.,
              - link "2018" [ref=e148] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib1
              - text: )
            - text: or using parametric policies that rank items rather than evaluate each item independently
            - generic [ref=e149]:
              - text: (Fu et al.,
              - link "2022" [ref=e150] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib4
              - text: )
            - text: .
        - generic [ref=e151]:
          - heading "2.3 Reinforcement Learning for Cold Users Problem" [level=3] [ref=e152]:
            - generic [ref=e153]: "2.3"
            - text: Reinforcement Learning for Cold Users Problem
          - paragraph [ref=e155]:
            - text: Combining RL with cold-start scenarios has begun to garner attention. The idea is to let an agent learn an optimal strategy to interact with a new user, such as which items or questions to present, in order to quickly identify their preferences and maximize some notion of cumulative reward (like total number of liked items)
            - generic [ref=e156]:
              - text: (Dureddy & Kaden,
              - link "2018" [ref=e157] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib2
              - text: )
            - text: . The baseline for our work is the method by Giannikis et al.
            - generic [ref=e158]:
              - text: (Giannikis et al.,
              - link "2024" [ref=e159] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib7
              - text: )
            - text: ", who formulated cold-user recommendation as an RL problem. In their framework, an episode corresponds to a new user session. At each time step, the agent chooses an item to show from a restricted pool, and the user’s reaction is observed implicitly. A pre-trained matrix factorization model is used to estimate user-item interaction probabilities, which effectively provides a prior for the agent. They investigated two variants: an item-based RL approach where the agent’s actions are individual items"
            - generic [ref=e160]:
              - text: (Smith & Linden,
              - link "2017" [ref=e161] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib22
              - text: )
            - text: ", and an AL-based RL approach"
            - generic [ref=e162]:
              - text: (Dureddy & Kaden,
              - link "2018" [ref=e163] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib2
              - text: )
            - text: where actions correspond to selecting one of the predefined active learning strategies (like PopGini) to apply. In their experiments on a large retail dataset, the item-based DQN approach achieved an average RMSE of 0.430 in predicting user interactions. Their RL agent outperformed other baselines such as pure popularity, entropy-based querying, etc., particularly when the number of recommended items was moderate (25 or 50). However, they observed that for very short lists (10 items), a trivial random strategy achieved a surprisingly low RMSE (around 0.378) – a result of the metric and data sparsity (if a user interacts with none of the randomly shown items, the error is low) – and for long lists (100 items), simpler strategies caught up with or surpassed the RL approach. These observations indicate that while RL is promising for cold-start, there is room to improve its robustness and consistency across scenarios.
          - paragraph [ref=e165]:
            - text: The success of Deep Q-Networks (DQN) in game-playing and other domains has led to several extensions that improve learning stability and performance. Double DQN was introduced by van Hasselt et al.
            - generic [ref=e166]:
              - text: (van Hasselt et al.,
              - link "2015" [ref=e167] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib25
              - text: )
            - text: "to address overestimation of action values in DQN. Standard DQN uses one network to both select and evaluate an action, which tends to overestimate Q-values due to maximization bias. Double DQN instead uses two networks (often the same network at different target intervals): one is used to pick the best action, and the other (a target network) is used to evaluate that action’s value, resulting in more accurate Q-value updates. This method has been shown to reduce overestimation and often improves final policy performance. Dueling DQN, proposed by Wang et al."
            - generic [ref=e168]:
              - text: (Wang et al.,
              - link "2016" [ref=e169] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib27
              - text: )
            - text: ", changes the network architecture by splitting the Q-value computation into two parts: one stream estimates the state value (how good the state is overall), and another estimates the advantage of each action (how much better an action is compared to the average for that state). These two are combined to form the final Q-values. The dueling architecture can learn state values even when the choice of action doesn’t matter (which can happen in many states), and it can more easily identify salient actions in states where actions do make a difference"
            - generic [ref=e170]:
              - text: (Shi et al.,
              - link "2024" [ref=e171] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib21
              - text: )
            - text: . This often speeds up learning and leads to more robust policies, as the network can generalize the value of similar states without being confused by irrelevant action specifics. Both Double and Dueling DQN have been successfully employed in various environments (often combined with other improvements like prioritized replay
            - generic [ref=e172]:
              - text: (Schaul et al.,
              - link "2016" [ref=e173] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib19
              - text: )
            - text: ", as in the Rainbow algorithm"
            - generic [ref=e174]:
              - text: (Hessel et al.,
              - link "2018" [ref=e175] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib9
              - text: )
            - text: ), but they have not been widely applied in recommendation tasks yet. In the context of cold-user recommendation, we hypothesize that Double DQN can yield more reliable estimates of the long-term reward for recommending certain items, preventing the agent from over-valuing suboptimal items due to noise, while Dueling DQN can help distinguish between states (users with different emerging preference patterns) and actions (items) more effectively even from sparse feedback.
          - paragraph [ref=e177]: Our work contributes to the intersection of RL and recommender systems by bringing these advanced DQN techniques into the cold-start recommendation problem. To our knowledge, this is one of the first studies applying Double and Dueling network architectures to recommender system scenarios. We compare these against the baseline single-network DQN approach and traditional strategies, providing insight into how each fares in terms of prediction accuracy for new users.
