              - text: )
            - text: . Traditional collaborative filtering algorithms, including neighborhood methods and latent factor models, perform poorly for new users due to lack of past interactions
            - generic [ref=e116]:
              - text: (Iyengar & Lepper,
              - link "2001" [ref=e117] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib11
              - text: )
            - text: . To combat this, various strategies have been developed. One category is content-based and hybrid methods that leverage side information about users or items. For example, Zhou et al.
            - generic [ref=e118]:
              - text: (Zhou et al.,
              - link "2011" [ref=e119] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib30
              - text: )
            - text: propose functional matrix factorizations that incorporate user attributes (e.g. demographics or survey responses) into the factor model to make initial predictions for new users. Such methods can partially alleviate cold-start by using proxy data, but obtaining rich user attributes is not always feasible (especially under privacy constraints) and may not capture individual taste nuances.
          - paragraph [ref=e121]:
            - text: Another line of work uses interview and active learning techniques. These approaches proactively acquire information from the user
            - generic [ref=e122]:
              - text: (Elahi et al.,
              - link "2016" [ref=e123] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib3
              - text: )
            - text: . Based on those responses, a more personalized model is trained. Prior research by Geurts and Frasincar
            - link "2017b" [ref=e125] [cursor=pointer]:
              - /url: https://arxiv.org/html/2508.21259v1#bib.bib6
            - text: explored active learning heuristics for cold-user recommendation. They introduced strategies like Gini (which picks items with the highest information gain as queries) and Pop-Gini (a hybrid that balances popularity with information gain) to decide which items to present to a new user for feedback. Such strategies help profile new users more quickly than waiting for organic interactions. However, they require explicit feedback and interrupt the user experience with questions, which not all users may engage with. Moreover, these heuristics need to be carefully designed to select informative items; if the user’s tastes lie outside the queried items, the value of the feedback is limited
            - generic [ref=e126]:
              - text: (Smith & Linden,
              - link "2017" [ref=e127] [cursor=pointer]:
                - /url: https://arxiv.org/html/2508.21259v1#bib.bib22
