                - text: to avoid performance degradation in large crowds. These approaches focus on efficient crowd-robot interaction modeling. Social behavior is restricted to maintaining a constant minimum distance from other humans, which can be seen as the robot’s personal zone.
              - paragraph [ref=e252]:
                - text: Velocity-depending danger zones, which are differently shaped personal zones, were proposed in
