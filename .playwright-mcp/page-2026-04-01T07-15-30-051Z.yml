                - text: "]"
              - text: . However, they do not directly distinguish for \acdrl-based approaches how they exhibit social behavior and how they have learned social behavior. Thus, we distinguish between Social Collision Avoidance, Socially Aware Navigation, and propose the novel category Socially Integrated Navigation as described in the following.
            - generic [ref=e221]:
              - heading "II-B1 Social Collision Avoidance" [level=4] [ref=e222]:
                - generic [ref=e223]: II-B1
                - text: Social Collision Avoidance
              - paragraph [ref=e225]:
                - text: We refer to a robot navigation policy that is trained to efficiently reach the goal position while avoiding physical collisions in an environment with dynamic agents as social collision avoidance. Thereby, agents in the environment are referred to as humans but neither the robot nor the agents consider social norms or social behavior. The social aspect of these approaches arises from efficient and collision-free navigation next to humans. During the training procedure, the agent is rewarded for reaching the goal, penalized for colliding with other agents, and encouraged to efficient navigation
                - generic [ref=e226]:
                  - text: "["
