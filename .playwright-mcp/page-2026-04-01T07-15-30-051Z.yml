          - generic [ref=e1852]:
            - heading "IV-B Training a Socially Integrated Agent" [level=3] [ref=e1853]:
              - generic [ref=e1854]: IV-B
              - text: Training a Socially Integrated Agent
            - paragraph [ref=e1856]: The formulation of our socially integrated navigation approach based on social acting refers to the behavior of others and adapting to their behavior. In a real-world setting, the robot is used in an environment where humans respect the social behavior of others and have learned to adapt to their behavior, and they interact socially integrated. To ensure realistic and representative training, we impose the minimum requirement to the training environment that humans act according to their own social behavior and that of other humans. This implies that they actively avoid violating their own preferences and those of others. In addition, the social behavior of humans must correspond to the social norms to which the robot should adapt in the real world. Otherwise, the robot can’t infer social behavior from social cues and observations, and thus, it is not possible to train a socially integrated robot.
