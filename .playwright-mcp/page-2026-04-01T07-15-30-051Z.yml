            - generic [ref=e987]: IV
            - text: Approach
          - paragraph [ref=e989]: This section presents our \acdrl-based socially integrated navigation approach, which is based on social acting and learns to adapt to the social behavior of humans. We first describe how we incorporated the social integration formulation within a \acdrl framework, and subsequently, we impose minimum requirements on the training process.
          - generic [ref=e990]:
            - heading "IV-A Adapting Social Behavior" [level=3] [ref=e991]:
              - generic [ref=e992]: IV-A
              - text: Adapting Social Behavior
            - paragraph [ref=e994]: Recall that the objective of the \acdrl training process is to find a policy that maximizes the expected accumulated discounted reward over one episode. The reward system is decisive for what the policy has learned from the observation, whereas the observation must be sufficient to learn the desired behavior. In the environment, humans have their own objectives and evaluate the current situation and the behavior of others based on their personal preferences and objectives. This assessment is then transferred to other people in the environment through social cues.
            - paragraph [ref=e996]:
              - text: This leads to an environment where multiple reward systems exist, as depicted in Fig.
              - link "3" [ref=e997] [cursor=pointer]:
                - /url: https://arxiv.org/html/2403.09793v3#S4.F3
              - text: . We interpret the social cues as a reward a human will give the robot. We assume an integrated society where everyone is perceived as part of the group, and therefore, we assume that people treat the robot equally to humans. This individual human reward evaluates the robot’s behavior from the individual human perspective, and all rewards together evaluate the robot’s behavior in the group. Since not every human in the environment gives social cues, e.g., because the distance is too large or he is not directly involved in the interaction, only the people within a certain radius
              - math [ref=e998]:
