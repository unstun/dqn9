                - text: to represent crowd interactions and geometric structures. These approaches consider variable personal zones but with predefined fixed assumptions from an ego-robot perspective.
              - paragraph [ref=e264]:
                - text: A norm-inducing reward function is proposed in
                - generic [ref=e265]:
                  - text: "["
                  - link "6" [ref=e266] [cursor=pointer]:
                    - /url: https://arxiv.org/html/2403.09793v3#bib.bib6
                  - text: "]"
                - text: to train an agent with overtaking, passing, and crossing capability. However, the agent is explicitly trained to do that in a predefined manner, e.g., passing on the right, and deviations from the predetermined social behavior are due to the tradeoff to time optimality and not due to adaptivity to human preferences. Hence, this is a predefined social behavior rather than an adaptation to human preferences.
              - paragraph [ref=e268]:
                - text: All these approaches are based on predefined social behavior and show no adaptivity to human behavior. As a result, these approaches are not socially acceptable based on the considered definitions
                - generic [ref=e269]:
                  - text: "["
