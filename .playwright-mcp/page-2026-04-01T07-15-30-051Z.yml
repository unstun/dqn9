            - generic [ref=e2312]:
              - heading "V-B2 Adapting Social Behavior" [level=4] [ref=e2313]:
                - generic [ref=e2314]: V-B2
                - text: Adapting Social Behavior
              - paragraph [ref=e2316]:
                - text: To prove the adaptivity of our approach to individual human behavior and the impact on others, we consider the same passing scenario twice as depicted in Fig.
                - link "6" [ref=e2317] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2403.09793v3#S5.F6
                - text: on the left half. In column
                - math [ref=e2318]:
                  - generic [ref=e2320]: "1"
                - text: ", the approaching other agents have an invisible personal space of"
                - math [ref=e2321]:
                  - generic [ref=e2323]:
                    - generic [ref=e2324]:
                      - generic [ref=e2325]: r
                      - generic [ref=e2326]: prox
                    - generic [ref=e2327]: =
                    - generic [ref=e2328]: "0.8"
                - text: ", and in column"
                - math [ref=e2329]:
                  - generic [ref=e2331]: "2"
                - text: ", they have no personal space. The socially integrated robot successfully adapts the distance to the approaching agents depending on the humans’ personal space, whereas the socially aware agent violates the other humans’ personal space while moving straight toward the goal. Although the human acts to maintain his personal space. In contrast, the socially integrated agent accelerates so that he passes the green agent earlier when he is already interacting with the purple agent. If the passing agents have no personal space, both robots perform similarly. In the heterogeneous scenario in column"
                - math [ref=e2332]:
                  - generic [ref=e2334]: "4"
                - text: of Fig.
                - link "6" [ref=e2335] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2403.09793v3#S5.F6
                - text: ", the socially aware robot violates the personal space of the yellow agent and also pushes him back as the yellow agent acts to maintain its personal space. In contrast, the socially integrated robot passes the other agents on the other side and thus avoids the conflict."
              - paragraph [ref=e2337]:
                - text: The ablation study, based on the heterogeneous (HE) and homogeneous (HO) circle crossing scenarios, is aggregated in Table
                - link "II" [ref=e2338] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2403.09793v3#S5.T2
                - text: for a socially integrated and a socially aware robot with history (k=15) and without (k=0). The two ratios indicate how much more or less time and distance is required compared to the ideal value. The human return value aggregates (
                - link "7" [ref=e2339] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2403.09793v3#S4.E7
                - text: ). The socially aware robots cause more collisions, run into more timeouts, and cause significantly more proxemic violations. A socially aware robot with history has improved ego navigation performance but more negative impact on humans, measured by more negative human return, more proxemic violations, and worse human time ratio. In comparison, the socially integrated robot has better ego navigation performance, causes less human discomfort, reflected in human return and proxemic violations, and leads humans to slightly better distance and time ratios.
          - generic [ref=e2340]:
            - heading "V-C Discussion" [level=3] [ref=e2341]:
              - generic [ref=e2342]: V-C
              - text: Discussion
            - paragraph [ref=e2344]: Through the extension of the \acORCA model with individual proxemic radius and the environment design that humans respect the proxemics of others, the simulated human social behavior is closer to the reality than just using the ORCA model as used in previous approaches. Therefore, the environment is well suited to investigate the effect of the robot’s exhibited social behavior. For the socially aware navigation, the results clearly show a trade-off between an improvement in robot navigation performance and causing negative effects on other agents in the environment. At the same time, the socially aware agents do not react to people’s conscious actions and push them back, for example. In contrast, the socially integrated approach does not have this trade-off. The perspective change leads to a significantly reduced negative impact on others and at the same time to better robot navigation performance. In addition, due to its ability to adapt to the individual behavior of others, the socially integrated robot can react more consciously to the reactions of others and thus make more far-sighted decisions. However, if others are not cooperative and do not interact, the robot can not adapt, and proxemic violations can still occur. Overall, a socially integrated robot outperforms a socially aware robot.
