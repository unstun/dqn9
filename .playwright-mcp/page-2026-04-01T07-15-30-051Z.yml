                    - /url: https://arxiv.org/html/2403.09793v3#bib.bib13
                  - text: "]"
                - text: . In addition, if the prior assumptions for social behavior do not apply, these approaches are not efficiently applicable.
            - generic [ref=e272]:
              - heading "II-B3 Socially Integrated Navigation" [level=4] [ref=e273]:
                - generic [ref=e274]: II-B3
                - text: Socially Integrated Navigation
              - paragraph [ref=e276]: We refer to a navigation policy as socially integrated, which is trained to exhibit implicit and adaptive social behavior to other agents’ behavior with individual consideration. Adaptation is not an imitation but rather a deviation from a personal understanding. In addition, the policy must be trained in an environment where other agents exhibit social behavior as well. There is no existing \acdrl approach that fulfills these minimum requirements toward a socially integrated navigation.
