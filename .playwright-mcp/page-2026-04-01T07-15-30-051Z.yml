          - paragraph [ref=e174]: We address the above-mentioned drawbacks with a \acdrl-based socially integrated navigation approach, which adapts to the individual social behavior of humans in the current situation. The approach is derived from the sociological understanding of social acting and leads to socially acceptable robot behavior. We propose to rethink the navigation approaches and change the perspective of how the robot’s social behavior emerges. Moving away from an ego-robot perspective with fixed predefined social behavior toward mutual recognition as part of the crowd, where social behavior emerges through adaptation and the basic understanding of social norms. The socially integrated navigation formulation enables the robot to integrate itself into the crowd through its actions.
          - paragraph [ref=e176]: The main contributions of this paper are (i) a novel categorization of existing \acdrl-based social navigation approaches based on robot’s social behavior. (ii) We propose a \acdrl-based socially integrated navigation approach that empowers the robot to adapt its social behavior individually to human behavior and (iii) leverage principles of training a socially integrated policy from scratch. (iv) The evaluation with an impact analysis of the robot’s behavior in the crowd shows the improvements in social adaptive robot behavior.
