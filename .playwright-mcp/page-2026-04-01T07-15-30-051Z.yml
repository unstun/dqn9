                - generic [ref=e233]: II-B2
                - text: Socially Aware Navigation
              - paragraph [ref=e235]:
                - text: We refer to a navigation policy that is, additionally to social collision avoidance, trained to respect explicit social behavior as socially aware navigation. Accordingly, the robot is rewarded for maintaining a predefined social behavior. This social behavior remains constant, and the robot interacts with every human in the same way, regardless of how the human behaves, as depicted in Fig.
                - link "2" [ref=e236] [cursor=pointer]:
