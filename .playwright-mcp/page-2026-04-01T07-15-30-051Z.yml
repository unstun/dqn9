          - heading "VI CONCLUSIONS" [level=2] [ref=e2727]:
            - generic [ref=e2728]: VI
            - text: CONCLUSIONS
          - paragraph [ref=e2730]: In this paper, a distinction between social collision avoidance, socially aware navigation, and socially integrated navigation approaches is proposed with regard to the exhibited social behavior of the robot. The proposed socially integrated navigation approach is derived from sociological definitions and an understanding of human behavior in crowded environments. The results show that the proposed perspective change from predefined explicit social behavior to the adaption to individual human behavior leads to better robot navigation while reducing the negative impact on all agents involved. Consequently, robots should have the same social understanding and decision-making as humans and thus act in a socially integrated manner. Moreover, our approach is applicable in a scalable manner through adaptive behavior. Future work includes an evaluation in the real world.
