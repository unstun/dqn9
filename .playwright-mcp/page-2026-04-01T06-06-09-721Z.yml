            - generic [ref=e93]:
              - generic [ref=e94]:
                - heading "Summary" [level=2] [ref=e95]: Summary
                - paragraph [ref=e96]: Humans possess an exceptional aptitude to efficiently make decisions from high-dimensional sensory observations. However, it is unknown how the brain compactly represents the current state of the environment to guide this process. The Deep Q-Network (DQN) achieves this by capturing highly nonlinear mappings from multivariate inputs to the values of potential actions. We deployed DQN as a model of brain activity and behavior in participants playing three Atari video games during fMRI. Hidden layers of DQN exhibited a striking resemblance to voxel activity in a distributed sensorimotor network, extending throughout the dorsal visual pathway into posterior parietal cortex. Neural state-space representations emerged from nonlinear transformations of the pixel space bridging perception to action and reward. These transformations reshape axes to reflect relevant high-level features and strip away information about task irrelevant sensory features. Our findings shed light on the neural encoding of task representations for decision-making in real-world situations.
              - generic [ref=e97]:
                - heading "In Brief" [level=2] [ref=e98]: In Brief
                - paragraph [ref=e99]: Cross et al. scanned humans playing Atari games and utilized a deep reinforcement learning algorithm as a model for how humans can map high-dimensional sensory inputs in actions. Representations in the intermediate layers of the algorithm were used to predict behavior and neural activity throughout a sensorimotor pathway.
              - generic [ref=e100]:
                - heading "Introduction" [level=2] [ref=e101]: Introduction
                - paragraph [ref=e102]:
                  - text: The framework of reinforcement-learning (RL) has illuminated how agents learn to make adaptive choices from trial and error feedback (
                  - link "Niv and Langdon, 2016" [ref=e103] [cursor=pointer]:
                    - /url: "#R39"
                  - text: ). Efficient algorithmic strategies have been identified for learning which actions to take in a given state of the world (
                  - link "Sutton and Barto, 2018" [ref=e104] [cursor=pointer]:
                    - /url: "#R54"
                  - text: ;
                  - link "Watkins and Dayan, 1992" [ref=e105] [cursor=pointer]:
                    - /url: "#R57"
                  - text: ), which in turn has helped reveal neural substrates for these processes (
                  - link "O’Doherty et al., 2004" [ref=e106] [cursor=pointer]:
                    - /url: "#R40"
                  - text: ;
                  - link "Schultz, 1998" [ref=e107] [cursor=pointer]:
                    - /url: "#R45"
                  - text: ;
                  - link "Schultz et al., 1997" [ref=e108] [cursor=pointer]:
                    - /url: "#R46"
                  - text: ;
                  - link "Steinberg et al., 2013" [ref=e109] [cursor=pointer]:
                    - /url: "#R52"
                  - text: ).
                - paragraph [ref=e110]:
                  - text: To date, most research has been on learning and value representations, divorced from the perceptual systems coupled to these mechanisms in the real-world. In a typical neuroscience study, state-spaces are low-dimensional and discrete, characterized by a small set of distinctive stimuli and actions. Yet, in more naturalistic environments, the brain faces a continuous stream of high-dimensional input and has to efficiently identify relevant states from this complex input stream by constructing a lower dimensional state-space internally (
                  - link "Botvinick et al., 2020" [ref=e111] [cursor=pointer]:
                    - /url: "#R9"
                  - text: ;
                  - link "Niv, 2019" [ref=e112] [cursor=pointer]:
                    - /url: "#R38"
                  - text: ). Actions can then be selected with even novel sensory inputs by generalizing from past experience given what previously worked well in similar states in this space. The goal of the present study is to probe how the human brain can solve this state-space representation problem.
                - paragraph [ref=e113]:
                  - text: This computational problem was a major barrier to progress in artificial intelligence, until the recent emergence of deep reinforcement learning. The marriage of reinforcement learning and deep learning provides an end-to-end framework for solving the task representation problem by linking sensory processing to action selection. For instance, the Deep Q Network (DQN) is capable of learning high-dimensional tasks like Atari video games with human level performance (
                  - link "Mnih et al., 2015" [ref=e114] [cursor=pointer]:
                    - /url: "#R36"
                  - text: ). Here we explore the possibility that the human brain may utilize similar computational principles in dynamic decision-making environments.
                - paragraph [ref=e115]: "To address this question, we scanned human participants with fMRI while they played three different classic Atari video games: Pong, Enduro, and Space Invaders. We used DQN as a model for how the brain might solve the state representation and action evaluation problems humans face when mapping high-dimensional pixel inputs to actions."
                - paragraph [ref=e116]: We first tested whether DQN converges on a similar behavioral policy to that used by human participants during gameplay. We next examined the relationship between the features encoded in the hidden layers of the DQN agent and patterns of activity in the human brain while human participants played the Atari games. This enabled us to test whether the human brain utilizes similar mechanisms for encoding state space representations as DQN.
                - paragraph [ref=e117]: Additionally, comparing the neural predictivity of various control models and different features within DQN helped reveal which computational principles the brain uses to encode a compact state-space representation and how this representation changes between regions. We reasoned that abstract state-space representations should only encode sensory information relevant for gameplay behavior, by encoding the most important high-level features and ignoring irrelevant low-level nuisance variables. The richness of Space Invaders and Enduro also enabled us to determine that abstract features that generalize across perceptually different inputs are mapped to posterior parietal cortex.
              - generic [ref=e118]:
                - heading "Results" [level=2] [ref=e119]: Results
                - paragraph [ref=e120]:
                  - text: We used three Atari tasks of varied complexity (
                  - link "Figure 1A" [ref=e121] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ). The relatively simple game of Pong involves getting the ball past your opponent’s paddle while avoiding being scored against. Enduro is a driving game where a player needs to drive as fast as possible while avoiding other cars, and Space Invaders is a fixed shooter game where a player shoots enemy spaceships. The trained DQN reaches human-level performance on all three games (
                  - link "Mnih et al., 2015" [ref=e122] [cursor=pointer]:
                    - /url: "#R36"
                  - text: ","
                  - link "Table S1" [ref=e123] [cursor=pointer]:
                    - /url: "#SD1"
                  - text: ). Therefore, we hypothesized that the DQN agent could be utilized as an end-to-end model for how the brain maps high-dimensional inputs to actions, and that its hidden layers could serve as a model for state-space representation (
                  - link "Figure 1B" [ref=e124] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ).
                - 'figure "a. Participants played Atari games in the fMRI scanner: Pong, Enduro, and Space Invaders. A button box was used as a controller. b. Deep Q Network is used as a model for how the brain maps high-dimensional inputs to actions. See Mnih et al., 2015 and methods for more details." [ref=e125]':
                  - heading "Figure 1. Atari game set up and Deep Q Network." [level=3] [ref=e126]
                  - paragraph [ref=e127]:
                    - img "Figure 1." [ref=e128]
                  - link "Open in a new tab" [ref=e130] [cursor=pointer]:
                    - /url: figure/F1/
                  - generic [ref=e131]:
                    - paragraph [ref=e132]: "a. Participants played Atari games in the fMRI scanner: Pong, Enduro, and Space Invaders. A button box was used as a controller."
                    - paragraph [ref=e133]:
                      - text: b. Deep Q Network is used as a model for how the brain maps high-dimensional inputs to actions. See
                      - link "Mnih et al., 2015" [ref=e134] [cursor=pointer]:
                        - /url: "#R36"
                      - text: and
                      - link "methods" [ref=e135] [cursor=pointer]:
                        - /url: "#S14"
                      - text: for more details.
                - paragraph [ref=e136]:
                  - text: We acquired fMRI data from 6 participants each completing 4.5 hours of gameplay (1.5 hours on each game). Rather than testing a large group of participants for a short time as is typical in group fMRI studies, here we obtained sufficiently large amounts of data in a small set of participants to robustly establish the relationship between each participant’s data and DQN representations (see
                  - link "Kay et al., 2008" [ref=e137] [cursor=pointer]:
                    - /url: "#R28"
                  - text: for a similar approach). For our analyses, we ran the frames from human gameplay data through DQN models trained independently from human data. This yielded Q-value outputs and a large set of nonlinear stimulus features represented by the activations in the hidden layers.
                - generic [ref=e138]:
                  - heading "DQN state-space representations resemble human state-space representations" [level=3] [ref=e139]
                  - paragraph [ref=e140]:
                    - text: Since DQN training was independent of human behavior, it is unclear whether its state-space representations or policy would resemble that of humans. The distribution of human actions appeared to diverge from the DQN’s when fed human gameplay frames (
                    - link "Figure S1A" [ref=e141] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). However, these differences are largely trivial due to an increased propensity for humans to take NOOP actions (meaning no action) and a reduced tendency for action combinations. This is expected, since unlike DQN, humans encounter a metabolic cost for taking actions and physical constraints limit rapid switching from one action to another. Consequently, we focused on DQN action values when human participants take a “move left” or “move right” action (or any combination with fire or brake). Across all games, DQN action values were significantly higher for the corresponding human action (
                    - link "Figure 2A" [ref=e142] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ). For example, when a human participant moves left to avoid hitting a car in Enduro, DQN also values moving left more than right. This suggests that the DQN mirrors human policies at these crucial decision points.
                  - figure "a. DQN action values are higher for actions that participants chose. DQN action values depicted for “left” and “right” actions for frames where human participants took either a “left” or “right” action of any combination with fire or brake. Action values correspond to normalized action advantages (see methods). b. Human actions are linearly decodable from the features in DQN hidden layers. Logistic regression models were trained to predict left vs. right actions in all games. Features in the model included 100 principal components (PCs) of each DQN layer. Graphs depict cross-validated classification accuracy. Error bars depict SE across 11 cross-validation folds. Dashed lines correspond to the max and min accuracies of null distributions computed with block permutation tests of 1000 shuffles." [ref=e143]:
                    - heading "Figure 2. Predicting human behavior using DQN hidden layer." [level=4] [ref=e144]
                    - paragraph [ref=e145]:
                      - img "Figure 2." [ref=e146]
                    - link "Open in a new tab" [ref=e148] [cursor=pointer]:
                      - /url: figure/F2/
                    - generic [ref=e149]:
                      - paragraph [ref=e150]:
                        - strong [ref=e151]: a. DQN action values are higher for actions that participants chose.
                        - text: DQN action values depicted for “left” and “right” actions for frames where human participants took either a “left” or “right” action of any combination with fire or brake. Action values correspond to normalized action advantages (see
                        - link "methods" [ref=e152] [cursor=pointer]:
                          - /url: "#S14"
                        - text: ).
                      - paragraph [ref=e153]:
                        - strong [ref=e154]: b. Human actions are linearly decodable from the features in DQN hidden layers.
                        - text: Logistic regression models were trained to predict left vs. right actions in all games. Features in the model included 100 principal components (PCs) of each DQN layer. Graphs depict cross-validated classification accuracy. Error bars depict SE across 11 cross-validation folds. Dashed lines correspond to the max and min accuracies of null distributions computed with block permutation tests of 1000 shuffles.
                  - paragraph [ref=e155]:
                    - text: The DQN’s state-space is not encoded by the output action value layer, but rather in the internal representations of the four preceding hidden layers. Therefore, we tested if these representations are predictive of human actions. Using a linear decoder, human actions (move left vs. move right) could be reliably predicted from the hidden representations in all games, demonstrating that DQN encodes stimulus features that can be used to model human actions (average accuracy Enduro=84.3, Pong=75.0%, Space Invaders=67.9%; cross-validated by run; chance level accuracy=50%; P < 0.001, block permutation test;
                    - link "Figure 2B" [ref=e156] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ). We also isolated contributions from different layers by averaging the absolute value of the coefficients across a layer (
                    - link "Figure S1B" [ref=e157] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). For Enduro and Space Invaders, features from the last two hidden layers were most useful for predicting actions. For the simplest game Pong, layers 1 and 2 contributed more, and the contribution of each layer was more varied across participants.
                - generic [ref=e158]:
                  - heading "Encoding model reveals a distributed network representing a state-space" [level=3] [ref=e159]
                  - paragraph [ref=e160]:
                    - text: After validating the use of DQN hidden layers as a model for human state-space representation that could predict behavior, we next aimed to localize brain regions involved in encoding this state-space. We employed an encoding model to create a linear mapping of neural network activations to voxel responses, as done previously (
                    - link "Güçlü and Gerven, 2015" [ref=e161] [cursor=pointer]:
                      - /url: "#R17"
                    - text: ;
                    - link "Yamins et al., 2014" [ref=e162] [cursor=pointer]:
                      - /url: "#R62"
                    - text: ). Neural network activations from all hidden layers were used to model and predict the response of individual voxels with ridge regression (
                    - link "Figure 3A" [ref=e163] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ).
                  - figure [ref=e164]:
                    - heading "Figure 3. Encoding model. DQN hidden layers mapped to distributed network across the brain, including dorsal stream." [level=4] [ref=e165]
                    - paragraph [ref=e166]:
                      - img "Figure 3." [ref=e167]
                    - link "Open in a new tab" [ref=e169] [cursor=pointer]:
                      - /url: figure/F3/
                    - generic [ref=e170]:
                      - paragraph [ref=e171]:
                        - text: a.
                        - strong [ref=e172]: Visualization of encoding model analysis
                        - text: . Human gameplay frames were run through a trained DQN to extract neural network activations in the hidden layers at every time point in an fMRI run. Voxel responses were modeled using ridge regression. The Explanatory features included the first 100 PCs from each DQN hidden layer.
                      - paragraph [ref=e173]:
                        - text: b. Voxels mapped to hidden layers for Pong. Cross-validated prediction accuracy uses Pearson correlation between the predicted and actual voxel responses. Whole brain threshold at P < 0.001 or P < 0.0001 FDR corrected. Thresholds are determined via cross-validated prediction accuracy against the null distribution using block permutation testing on a subset of voxels. Data are from two participants, others are shown in
                        - link "Figure S2A" [ref=e174] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: .
                      - paragraph [ref=e175]:
                        - text: c.
                        - strong [ref=e176]: c
                        - text: . Same as in b, but for Enduro.
                      - paragraph [ref=e177]:
                        - text: d.
                        - strong [ref=e178]: d
                        - text: . Same as in b, but for Space Invaders
                      - paragraph [ref=e179]:
                        - text: "e. Percentage of voxels in a region of interest that are significant in the respective thresholds in b, c, and d. ROIs are noted as: V1/V2, V3/V4, LOC Inf. (inferior lateral occipital cortex), MTG (middle temporal gyrus), IT (inferior temporal lobe), LOC Sup. (superior lateral occipital cortex), SPL (superior parietal lobule), SMG (supramarginal gyrus), PREC (precuneus), MC (motor cortex), SMA (supplementary motor area), SFG (superior frontal gyrus). Plots for individual participants shown in"
                        - link "Figure S2B" [ref=e180] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: .
                  - paragraph [ref=e181]:
                    - text: Across games, DQN significantly predicted voxel responses throughout the dorsal visual stream and posterior parietal cortex (PPC) (cross-validated by run; P < 0.001, FDR corrected; block permutation tests;
                    - link "Figure 3B" [ref=e182] [cursor=pointer]:
                      - /url: "#F3"
                    - text: –
                    - link "E" [ref=e183] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ","
                    - link "Figure S2" [ref=e184] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). Prediction accuracies were higher in the dorsal visual stream extending into parietal cortex, than the ventral stream extending into temporal cortex, suggesting a specific role for the dorsal visual pathway in state-space representation for naturalistic visuomotor tasks (two-sample T-test, P < 1e-10,
                    - link "Figure S3A" [ref=e185] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). The encoding model also captured responses in motor and premotor cortex, SMA, and superior frontal gyrus in all games. Outside of primary sensory and motor areas, additional regions of PPC were mapped to DQN hidden layers, including the superior parietal lobule, supramarginal gyrus, and precuneus.
                  - paragraph [ref=e186]:
                    - text: To determine whether early visual regions prefer early DQN layers and more anterior regions prefer later layers (a representational gradient), we examined coefficients in each layer. No clear gradient was identified for Enduro and Pong (
                    - link "Figure S3B" [ref=e187] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). For Space Invaders, coefficients for layers 1 and 2 were lower in PPC, motor, and frontal regions than in early visual regions. For all games, every region had very high magnitude coefficients for the last convolutional layer (layer 3).
                - generic [ref=e188]:
                  - heading "Control analyses" [level=3] [ref=e189]
                  - paragraph [ref=e190]:
                    - text: "An alternative explanation for the encoding model results is that they reflect basic visual features and not information related to reward or action evaluation. To test this, we performed control analyses with feature representations of variable complexity. We used motor regressors as a basic motor control and PCs of the pixel space to control for low-level visual properties. We also included two deep neural network controls: a DQN agent trained on a separate game, and a variational autoencoder (VAE) ("
                    - link "Kingma and Welling, 2014" [ref=e191] [cursor=pointer]:
                      - /url: "#R31"
                    - text: ), an unsupervised representation learning method used previously to extract state representations (
                    - link "Ha and Schmidhuber, 2018" [ref=e192] [cursor=pointer]:
                      - /url: "#R18"
                    - text: ;
                    - link "Higgins et al., 2018b" [ref=e193] [cursor=pointer]:
                      - /url: "#R23"
                    - text: ;
                    - link "Watter et al., 2015" [ref=e194] [cursor=pointer]:
                      - /url: "#R58"
                    - text: ) (see
                    - link "methods" [ref=e195] [cursor=pointer]:
                      - /url: "#S14"
                    - text: ","
                    - link "Figure S4A" [ref=e196] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: for examples of VAE outputs). Since the VAE does not encode value or action information, this allows us to test whether this information is needed to reach the prediction accuracies of the DQN encoding model.
                  - paragraph [ref=e197]:
                    - text: DQN outperformed all control models (P < 1e-10, paired T-test across voxels) across games except in one participant (
                    - link "Figure 4A" [ref=e198] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ","
                    - link "Figure S4B" [ref=e199] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). Furthermore, DQN was best in all ROIs (except in one participant), especially in PPC (
                    - link "Figure 4B" [ref=e200] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ","
                    - link "Figure S5A" [ref=e201] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). The relative performance of different feature sets reveals the computational principles accounting for DQN’s ability to explain neural activity. Nonlinear feature representations outperformed linear ones as both the DQN trained on another game, and the VAE consistently showed higher prediction accuracies than a linear PCA model. Additionally, the original DQN surpasses the other two DNN models by linking perception to action and reward.
                  - figure [ref=e202]:
                    - heading "Figure 4. Control models." [level=4] [ref=e203]
                    - paragraph [ref=e204]:
                      - img "Figure 4" [ref=e205]
                    - link "Open in a new tab" [ref=e207] [cursor=pointer]:
                      - /url: figure/F4/
                    - generic [ref=e208]:
                      - paragraph [ref=e209]:
                        - text: "a. Encoding analysis control models: motor regressors, PCA on the input pixels, DQN trained on one of the other games, and a VAE. Bar plots show prediction accuracies for the 90th percentile of prediction accuracies across the whole brain for each model (averaged across six participants with each participants’ values shown). Box plots for distribution of scores in the upper 20th percentile for each model and participant shown in"
                        - link "Figure S4B" [ref=e210] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: .
                      - paragraph [ref=e211]:
                        - text: b. T-scores by region of interest comparing DQN prediction accuracies to prediction accuracies from control models. T-values reflect average T-scores across participants with each participants’ T-scores shown. Plots for individual participants depicted in
                        - link "Figure S5A" [ref=e212] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: .
                      - paragraph [ref=e213]: c. Percentage of significant voxels for each ROI in a GLM where all DQN layers, VAE model, and PCA model compete for variance (P < 0.001 FWER corrected, cluster-level, F-test across 10 PCs representing a model’s regressors).
                  - paragraph [ref=e214]: We next examined whether neural to DQN feature correlations are maintained when all models are included in the same analysis to compete for variance. This reveals whether DQN offers unique predictive information even after controlling for basic visual and motor activity and alternative sensory models. For this, we constructed a general linear model with the first 10 PCs of the most relevant models (DQN Layers 1–4, VAE and PCA) and other regressors of no interest such as game events.
                  - paragraph [ref=e215]:
                    - text: We found that many voxels within each ROI are significantly modulated by unique variance in each model, particularly DQN layers 3 and 4 (P < 0.001 FWER corrected, cluster-level, F-test;
                    - link "Figure 4C" [ref=e216] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ). In
                    - link "Figure 4C" [ref=e217] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ", the results show the proportion of voxels per ROI correlating with a given model above and beyond variance explained by every other model. After controlling for both VAE and PCA, all DQN layers still explain significant variance in a substantial proportion of the voxels per ROI. Additionally, VAE and PCA models explain significant variance after controlling for the effects of the DQN layers. Since early visual and motor regions encode features in DQN layers 3 and 4 when controlling for the other models, this suggests that even these primary sensory regions process more complex sensorimotor features than in conventional visual and motor models."
                - generic [ref=e218]:
                  - heading "Representational geometry of DQN’s internal representations" [level=3] [ref=e219]
                  - paragraph [ref=e220]:
                    - text: The highly distributed representation and numerous parameters within a deep neural network make its representation rather opaque. To shed light on what DQN is encoding, we utilized representational similarity analysis (RSA). RSA allows comparison of the representational space of many different data types and models of varying dimensionality (deep network, fMRI patterns, hand drawn features, etc.), helping to illustrate how a model’s representation changes throughout a task as well as aiding comparison across models. (
                    - link "Haxby et al., 2014" [ref=e221] [cursor=pointer]:
                      - /url: "#R20"
                    - text: ;
                    - link "Kriegeskorte et al., 2008" [ref=e222] [cursor=pointer]:
                      - /url: "#R32"
                    - text: ).
                  - paragraph [ref=e223]:
                    - text: "We first examined Pong, which can be fully characterized with a few high-level features that we manually annotated frame by frame: the positions of the two paddles, the ball position (X and Y), and the ball’s velocity (X and Y). A useful and compact state-space should encode this information in some form. An exemplar dissimilarity matrix (DSM; see"
                    - link "methods" [ref=e224] [cursor=pointer]:
                      - /url: "#S14"
                    - text: ) for these hand drawn features is illustrated in
                    - link "Figure 5A" [ref=e225] [cursor=pointer]:
                      - /url: "#F5"
                    - text: alongside the DSM of the last convolutional layer in DQN (layer 3) for the same game frames. Similarity is high between two time points when feature vectors in those time points are close in a distance metric (ie. Euclidean). The representational geometry of DQN resembles the hand drawn feature DSM, suggesting that it may encode these game-relevant features directly.
                  - figure [ref=e226]:
                    - heading "Figure 5. Representational Similarity Analysis." [level=4] [ref=e227]
                    - paragraph [ref=e228]:
                      - img "Figure 5" [ref=e229]
                    - link "Open in a new tab" [ref=e231] [cursor=pointer]:
                      - /url: figure/F5/
                    - generic [ref=e232]:
                      - paragraph [ref=e233]: "a. Illustrations of what dissimilarity matrices (DSMs) look like for Pong. DSMs represent pairwise comparisons of model representations across time, depicted here for the first 1000 frames in an example Pong run. The DSM on the left represents the DSM for DQN layer 3 and the DSM on the right represents the DSM for the hand drawn features in Pong: the positions of the two paddles, the ball position, and the ball’s velocity"
                      - paragraph [ref=e234]:
                        - text: b.
                        - strong [ref=e235]: Representational Similarity Analysis on DQN.
                        - text: Correlations of all the model DSMs for all games, and also the hand drawn features (HDFs) for Pong. The internal representations in Pong become more dissimilar to the pixel space and PCA model and more similar to the hand drawn features from DQN Layer 1 - Layer 4. DQN representations in later layers also become more dissimilar to the input space in Space Invaders.
                      - paragraph [ref=e236]:
                        - text: c.
                        - strong [ref=e237]: Representational Similarity Analysis on fMRI data for Pong.
                        - text: fMRI DSMs for three ROIs were correlated with model DSMs including HDFs, each layer of DQN, PCA, and VAE. Asterisks (*) above bars indicate significance in 6/6 subjects (block permutation tests, P < 0.01, FWER corrected for multiple comparisons). Dotted lines above bars indicate significant differences between models in 6/6 subjects (block permutation tests, P < 0.01, FWER corrected for multiple comparisons). All brain areas in all subjects were significantly correlated to the HDF DSM, and DQN layer 3 and 4. See
                        - link "Figure S6" [ref=e238] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: for individual subject plots.
                  - paragraph [ref=e239]:
                    - text: To quantify similarities between different DQN layers, hand drawn features, and other models, we correlated the model DSMs with each other. In Pong, the internal representations in DQN start to become highly similar to hand drawn features in layers 3 and 4 (
                    - link "Figure 5B" [ref=e240] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ; Spearman ρ = 0.53, 0.55 respectively), suggesting that DQN constructs a compact state-space representation by realigning its axes to code for these high-level features in later layers. Although this object information is present in the input pixels, they share a relatively low correlation with the pixel space (ρ = 0.058), suggesting some form of nonlinear transformation is required to disentangle this information from the input (
                    - link "DiCarlo and Cox, 2007" [ref=e241] [cursor=pointer]:
                      - /url: "#R12"
                    - text: ;
                    - link "Higgins et al., 2018a" [ref=e242] [cursor=pointer]:
                      - /url: "#R22"
                    - text: ). Additionally, the first layer of DQN in Pong is highly similar to the pixel space and PCA model (ρ = 0.9; ρ = 0.78), suggesting that the input data is not yet highly compressed in the first layer of DQN. In contrast, the later layers become increasingly dissimilar to the pixel and PCA representation as they start encoding a lower dimensional subspace for game-relevant features. A similar pattern is seen in Space Invaders, where the first DQN layer is highly correlated to the pixel space and PCA model (ρ = 0.91; ρ = 0.69), but the last layer is highly dissimilar (ρ = −0.16; ρ = 0.04). In Enduro, representations in all four layers are highly similar to each other, suggesting that differences between them might be more subtle, raising the possibility there may be more interesting variance within layer rather than between layers. In all games, the VAE representations are moderately similar to the DQN’s, especially for the first three DQN layers.
                - generic [ref=e243]:
                  - heading "The brain’s state-space representation in Pong encodes the spatial information about objects" [level=3] [ref=e244]
                  - paragraph [ref=e245]:
                    - text: Next, we tested whether the brain similarly encodes the spatial positions of the objects in Pong by computing DSMs from voxel activity and correlating these DSMs with a hand drawn feature DSM (downsampled to TR resolution). For all subjects, the hand drawn feature DSM was significantly correlated to all brain areas in the sensorimotor pathway previously identified in the encoding model analyses (
                    - link "Figure 5C" [ref=e246] [cursor=pointer]:
                      - /url: "#F5"
                    - text: and
                    - link "Figure S6" [ref=e247] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: for individual subjects, block permutation tests, P < 0.01, FWER corrected for multiple comparisons). This suggests that similarly to DQN, the brain’s state-space representation in Pong involves coding for high-level features tracking the spatial positions of the relevant objects.
                  - paragraph [ref=e248]: Additionally, brain DSMs are significantly correlated to DQN layers 3 and 4 for all subjects in early visual, PPC, and motor/frontal regions of interest (and to DQN layer 2 for early visual regions). Representations in early visual areas are already highly correlated to hand drawn features, which may explain why these regions prefer DQN layers 3 and 4 rather than earlier layers.
                - generic [ref=e249]:
                  - heading "Action values encoded in motor and premotor areas" [level=3] [ref=e250]
                  - paragraph [ref=e251]:
                    - text: DQN hidden layers encode a state-space to compute Q-values in the output of the network for action evaluation. To identify whether similar action value computations occur in the brain, we implemented a computational model-based GLM analysis (
                    - link "O’Doherty et al., 2007" [ref=e252] [cursor=pointer]:
                      - /url: "#R41"
                    - text: ), using the DQN output as the computational model.
                  - paragraph [ref=e253]:
                    - text: The action value regressor identifies regions encoding continuous values for the chosen DQN action as a function of the state the participant sees (action advantages used, see
                    - link "methods" [ref=e254] [cursor=pointer]:
                      - /url: "#S14"
                    - text: ). Significant encoding of action values was found in premotor, SMA and primary visual and motor cortex in all games (
                    - link "Figure 6B" [ref=e255] [cursor=pointer]:
                      - /url: "#F6"
                    - text: ","
                    - link "Figure S7" [ref=e256] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). Significant clusters at P < 0.001 (FWER corrected, cluster-level) are located in motor or SMA/premotor regions for all participants in Enduro, 5/6 in Pong (6/6 at uncorrected P < 0.001), and in 3/6 participants in Space Invaders. These results indicate that action values are computed in SMA and premotor cortex during Atari gameplay.
                  - figure "a. Depiction of action value GLMs. Human gameplay frames were run through DQN to evaluate action/chosen values. Traces were then downsampled to 10 Hz and convolved with a hemodynamic response function to reveal GLM regressors for action values. b. Neural encoding of action value in premotor/SMA areas. Whole brain maps thresholded at P< 0.001 (FWER corrected, cluster-level). Significant representation of action value was also found in primary visual and motor cortex. Other participants shown in Figure S7." [ref=e257]:
                    - heading "Figure 6. Action value results." [level=4] [ref=e258]
                    - paragraph [ref=e259]:
                      - img "Figure 6." [ref=e260]
                    - link "Open in a new tab" [ref=e262] [cursor=pointer]:
                      - /url: figure/F6/
                    - generic [ref=e263]:
                      - paragraph [ref=e264]:
                        - text: a.
                        - strong [ref=e265]: Depiction of action value GLMs.
                        - text: Human gameplay frames were run through DQN to evaluate action/chosen values. Traces were then downsampled to 10 Hz and convolved with a hemodynamic response function to reveal GLM regressors for action values.
                      - paragraph [ref=e266]:
                        - text: b.
                        - strong [ref=e267]: Neural encoding of action value in premotor/SMA areas.
                        - text: Whole brain maps thresholded at P< 0.001 (FWER corrected, cluster-level). Significant representation of action value was also found in primary visual and motor cortex. Other participants shown in
                        - link "Figure S7" [ref=e268] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: .
                - generic [ref=e269]:
                  - heading "Convolutional filter analyses" [level=3] [ref=e270]
                  - paragraph [ref=e271]: Thus far we have shown that a brain-like representation emerges most notably in DQN layers 3 and 4. We see that all ROIs, even early visual regions, prefer these last two DQN layers, suggesting multiple nonlinear transformations of the input pixels are necessary to derive features most predictive of cortical responses during Atari gameplay. However, even though the last two layers best predict voxels across the brain, different regions might prefer different artificial neurons or features within these layers. If so, could we leverage this variability to further shed insight into the features the brain is encoding and how the brain’s internal representations transform from one region to another?
                  - paragraph [ref=e272]:
                    - text: We test this by retraining the encoding model on each convolutional filter in the last convolutional layer separately (layer 3, 64 filters; DQN architecture illustrated in
                    - link "Figure 1B" [ref=e273] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ). The convolutional filter of a convolutional neural network (CNN) represents a feature the network is looking to detect in the input, and this feature can be somewhat visualized with guided backpropagation/deconvolution (
                    - link "Springenberg et al., 2015" [ref=e274] [cursor=pointer]:
                      - /url: "#R50"
                    - text: ;
                    - link "Zeiler and Fergus, 2013" [ref=e275] [cursor=pointer]:
                      - /url: "#R63"
                    - text: ) (
                    - link "Figure 7E" [ref=e276] [cursor=pointer]:
                      - /url: "#F7"
                    - text: ). For example, early layers in a typical CNN encode low-level features such as edges and contours.
                  - figure [ref=e277]:
                    - heading "Figure 7. Filter analyses on brain activity." [level=4] [ref=e278]
                    - paragraph [ref=e279]:
                      - img "Figure 7." [ref=e280]
                    - link "Open in a new tab" [ref=e282] [cursor=pointer]:
                      - /url: figure/F7/
                    - generic [ref=e283]:
                      - paragraph [ref=e284]:
                        - text: a.
                        - strong [ref=e285]: Neurally predictive filters in Pong encode the spatial positions of objects.
                        - text: Encoding models were run separately on each layer 3 filter to estimate filter Neural Predictivity (NP). Separately, each filter was assessed on how much it encoded the hand labeled features in Pong. Significant correlations were found between the filter NP scores and the metric about how much information the filters encoded about the hand labeled features in every participant (P < 0.0001). The average scores and correlations across participants are plotted.
                      - paragraph [ref=e286]:
                        - text: b.
                        - strong [ref=e287]: Correlations in filter Neural Predictivity scores across regions.
                        - text: NP scores were correlated across regions to estimate whether the same filters are useful for predicting all neural responses, or whether the mapping is more heterogeneous. In both Enduro and Space Invaders, more clustering occurs separating visual, parietal, and motor networks.
                      - paragraph [ref=e288]:
                        - text: c.
                        - strong [ref=e289]: Filter scores are correlated across participants.
                        - text: There are high correlations across all participants, and nearly perfect correlations for Pong.
                      - paragraph [ref=e290]:
                        - text: d.
                        - strong [ref=e291]: Correlations between Neural Predictivity and Behavioral Predictivity.
                        - text: Axes represent normalized scores with worst filter at 0 and best filter at 1. Data aggregated across participants is depicted.
                      - paragraph [ref=e292]:
                        - text: e.
                        - strong [ref=e293]: Visualization of two example filters using guided backpropagation in Neon.
                        - text: Images to the right of each example represent an image from the human gameplay data that activate the filter the most. Gray images to the left of each example represent which parts of the pixel space affect the activation of the filter the most from this input image. Red, green, and blue colors reflect pixels that changed across the frames in the input. Five randomly selected filters for each game are also visualized in
                        - link "Figure S8a" [ref=e294] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: .
                  - paragraph [ref=e295]:
                    - text: We then estimated how well each filter predicted voxel responses by averaging prediction accuracies across voxels in our ROIs, a metric we term
                    - emphasis [ref=e296]: Neural Predictivity
                    - text: . This quantifies how well each filter explains neural responses in general and enables us to test whether Neural Predictivity changes across different ROIs.
                  - paragraph [ref=e297]: The RSA results in Pong suggested that the shared representation between the brain and DQN in Pong corresponds to a mutual encoding of the spatial positions of objects. We tested this explicitly with our Neural Predictivity metric, as convolutional filters containing more information about high-level features may better explain brain responses. To quantify this, we calculate the degree to which a layer 3 filter encodes the Pong hand drawn features with a mutual information metric.
                  - paragraph [ref=e298]:
                    - text: We found that filters with higher Neural Predictivity encode more information about the hand drawn features. These correlations are significant for ball position, ball velocity, and paddle positions in every participant (P < 0.0001,
                    - link "Figure 7A" [ref=e299] [cursor=pointer]:
                      - /url: "#F7"
                    - text: ), indicating that the nature of the DQN to brain mapping in Pong lies at the representation of the high-level features.
                - generic [ref=e300]:
                  - heading "Filter Neural Predictivity across regions" [level=3] [ref=e301]
                  - paragraph [ref=e302]:
                    - text: To estimate whether different regions prefer different filters, we averaged prediction accuracies for each filter across each ROI. We then computed correlations between the 64 filter scores across regions. For Pong, high correlations between filter scores were found across all regions, suggesting that the same filters are useful for explaining responses uniformly across the brain (
                    - link "Figure 7B" [ref=e303] [cursor=pointer]:
                      - /url: "#F7"
                    - text: ).
                  - paragraph [ref=e304]:
                    - text: However, in Enduro and Space Invaders different ROIs only have partially overlapping sets of filters mapped to them, suggesting a more heterogeneous representation across regions (
                    - link "Figure 7B" [ref=e305] [cursor=pointer]:
                      - /url: "#F7"
                    - text: ). We found visual, parietal, and motor clusters of filter encoding with high correlations within cluster and moderate correlations between cluster. These patterns may differ from the more homogenous filter selectivity in Pong because of the increased complexity of these games.
                - generic [ref=e306]:
                  - heading "Neurally predictive filters generalize across participants and can predict behavior" [level=3] [ref=e307]
                  - paragraph [ref=e308]:
                    - text: To investigate if all our participants converge on similar useful representations for solving the task, we correlated each filter’s Neural Predictivity score across participants. We observed high correlations between all participants in all games (
                    - link "Figure 7C" [ref=e309] [cursor=pointer]:
                      - /url: "#F7"
                    - text: ), meaning the same filters were mapped to the brain across participants.
                  - paragraph [ref=e310]:
                    - text: This result also suggests that some filters in the network are universally useful for explaining neural responses and some are universally useless. Enduro layer 3 filter 40 was one of the best fitting filters for explaining brain activity in every participant. Through guided backpropagation (
                    - link "Springenberg et al., 2015" [ref=e311] [cursor=pointer]:
                      - /url: "#R50"
                    - text: ), we could see that the filter detects cars and the sides of the road, which are useful features for acting in the game (
                    - link "Figure 7E" [ref=e312] [cursor=pointer]:
                      - /url: "#F7"
                    - text: ). By contrast, Enduro layer 3 filter 56 was one of the worst fitting filters for explaining brain activity in 5/6 participants. This filter detects the score at the bottom of the screen, which is correlative of reward since the score board changes when reward is received but not causally related to reward. A sample of filter deconvolutions for five random filters in each game is also plotted in
                    - link "Figure S8a" [ref=e313] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: .
                  - paragraph [ref=e314]:
                    - text: Next, we evaluated how well each filter modeled human behavior by retraining the decoding human behavior model (
                    - link "Figure 2B" [ref=e315] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ) on every filter in layer 3 separately. Similar to the Neural Predictivity analysis, this allows us to probe how useful every layer 3 filter is for predicting human actions. We found correlations between how well a filter explains voxel activity (the Neural Predictivity score) and how well a filter explains human behavior (
                    - link "Figure 7D" [ref=e316] [cursor=pointer]:
                      - /url: "#F7"
                    - text: ). This correlation was most pronounced for Enduro and Pong (P < 0.05 in 6/6 participants in Enduro, 6/6 participants in Pong, but only 2/6 participants in Space Invaders). Thus, the brain encodes the features most relevant for behavior, and DQN encodes features that are not only brain-like in a universal way across participants, but also predict human actions.
                - generic [ref=e317]:
                  - heading "State-space representations are nuisance invariant in posterior parietal cortex" [level=3] [ref=e318]
                  - paragraph [ref=e319]: An abstract state-space representation should ideally be pruned of sensory features not necessary for learning or behavior. For Pong, this involves encoding high-level features about the relevant objects in the game. However, the other two games are more complex and involve a large number of features that are difficult to hand label. Thus, rather than isolating relevant high-level features in these games, we next identify irrelevant features that an abstract state-space should ignore.
                  - paragraph [ref=e320]:
                    - text: We wanted to find brain regions where the state-space encoding is insensitive to sensory information irrelevant for task performance, a pattern known as nuisance invariance (
                    - link "Lenc and Vedaldi, 2015" [ref=e321] [cursor=pointer]:
                      - /url: "#R34"
                    - text: ). For Enduro, one nuisance variable is the weather and time of day. Driving gameplay starts off during the day and gradually becomes night-time with various weather patterns. The colors of the pixels and visual input dramatically change while the overall gameplay remains mostly the same. Formally, this weather variable had no relationship with the participant’s actions in an information-theoretic sense (see
                    - link "methods" [ref=e322] [cursor=pointer]:
                      - /url: "#S14"
                    - text: ). A good state-space representation should localize objects independently of colors in the game. Thus, it should often project inputs that are very far away in the pixel space to similar regions of the latent state-space if an agent should act similarly across them (illustrated in
                    - link "Figure 8A" [ref=e323] [cursor=pointer]:
                      - /url: "#F8"
                    - text: ). In contrast, even small changes in pixel space may necessitate opposite actions. For example in
                    - link "Figure 8A" [ref=e324] [cursor=pointer]:
                      - /url: "#F8"
                    - text: ", an agent should move left or right depending on the location of the car in front of it, even though the two pairs of frames are perceptually similar."
                  - figure [ref=e325]:
                    - heading "Figure 8. Representations become more insensitive to nuisances in parietal cortex." [level=4] [ref=e326]
                    - paragraph [ref=e327]:
                      - img "Figure 8." [ref=e328]
                    - link "Open in a new tab" [ref=e330] [cursor=pointer]:
                      - /url: figure/F8/
                    - generic [ref=e331]:
                      - paragraph [ref=e332]: a. Illustration of what a useful representation would do in Enduro.
                      - paragraph [ref=e333]: The sky color changes frequently, but these changes have no effect on human actions. The input space on the left depicts how situations are clustered by perceptual features such as color in the pixel space. Within each night/day cluster, there are examples of a car in front of an agent both on the right and left. Therefore, one must take opposite actions in each scenario to avoid a collision. A good state-space localizes the positions of the relevant objects independently of visual nuisances. The resulting state-space representation on the right clusters together perceptually dissimilar situations if they share the same underlying semantic meaning for the policy.
                      - paragraph [ref=e334]:
                        - text: b.
                        - strong [ref=e335]: Nuisance invariance to weather/time of day in Enduro
                        - text: . We calculate a nuisance invariance score in every region. This score is defined as the correlation of a filter’s Neural Predictivity in a region and that filter’s nuisance invariance to weather. The Motor Areas ROI includes both the primary motor cortex and premotor cortex.
                      - paragraph [ref=e336]:
                        - text: c.
                        - strong [ref=e337]: Nuisance invariance to number of invaders on the screen in Space Invaders
                        - text: . We similarly calculate a nuisance invariance score for every region as defined in B. For the game Space Invaders, the proxy nuisance variable was the number of invaders on the screen.
                  - paragraph [ref=e338]:
                    - text: For Space Invaders, the number of on-screen invaders explains a lot of variance in the pixel space but has a marginal effect on what actions participants take (see
                    - link "methods" [ref=e339] [cursor=pointer]:
                      - /url: "#S14"
                    - text: ). This is because as an agent kills more invaders, the screen becomes more and more black. This information does not heavily impact which actions an agent should take because the relative positions of the invaders above an agent matter the most.
                  - paragraph [ref=e340]:
                    - text: To estimate whether ROI representations are nuisance invariant, we quantified the mutual information between a filter and the nuisances identified for Enduro and Space Invaders, giving each filter a metric for how insensitive it was to the nuisances (see
                    - link "methods" [ref=e341] [cursor=pointer]:
                      - /url: "#S14"
                    - text: ). We computed the correlation between each filter’s nuisance invariance, and its Neural Predictivity in a ROI, which we define as a nuisance invariance score for each region (normalized across voxels, see
                    - link "Methods" [ref=e342] [cursor=pointer]:
                      - /url: "#S14"
                    - text: ). Simply put, this score estimates how each region prefers the filters that are nuisance invariant.
                  - paragraph [ref=e343]:
                    - text: Regions in posterior parietal cortex (PPC) and in the late dorsal visual stream (ie. LOC) were more insensitive to nuisances than early visual cortex regions V1-V4 (
                    - link "Figure 8B" [ref=e344] [cursor=pointer]:
                      - /url: "#F8"
                    - text: ","
                    - link "C" [ref=e345] [cursor=pointer]:
                      - /url: "#F8"
                    - text: ;
                    - link "Figure S8B" [ref=e346] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ","
                    - link "C" [ref=e347] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ) in both games. Early visual cortex regions exhibited the lowest nuisance invariance scores in both games, suggesting that filters mapped to these regions still encoded the low-level nuisance variables. Additionally, LOC which is later in the dorsal visual pathway, had a higher nuisance invariance score than these earlier visual regions. For Enduro, a PPC region exhibited the highest or second highest score of any region in every participant. In 5/6 participants in Space Invaders, premotor/prefrontal cortex regions also exhibited high nuisance invariance scores.
                  - paragraph [ref=e348]:
                    - text: These results suggest that irrelevant visual input is stripped from the neural code as information passes through the dorsal visual stream to the posterior parietal cortex. This leads to a lower-dimensional, compressed, and abstract representation that projects similar game situations to the same part of the state-space as depicted in
                    - link "Figure 8A" [ref=e349] [cursor=pointer]:
                      - /url: "#F8"
                    - text: .
              - generic [ref=e350]:
                - heading "Discussion" [level=2] [ref=e351]: Discussion
                - paragraph [ref=e352]:
                  - text: One of the major unresolved questions in decision neuroscience is how relevant sensory features are identified and structured to aid action evaluation and selection in real-world scenarios. Here we addressed this question by having humans play complex Atari games (Pong, Enduro and Space Invaders) in an fMRI scanner. Taking our cue from advances in artificial intelligence (
                  - link "Mnih et al., 2015" [ref=e353] [cursor=pointer]:
                    - /url: "#R36"
                  - text: ), we utilized a deep RL algorithm as a model for how to solve the task representation problem inherent in these tasks. We demonstrate that representations in DQN show a remarkable similarity to those used by humans. Features in DQN hidden layers predict human actions and fMRI activity in a distributed sensorimotor network extending from the dorsal visual stream and posterior parietal cortex (PPC) to premotor areas. Not only does the DQN model significantly outperform control models of varying levels of complexity, but DQN features also explain unique variance in these ROIs when controlling for the other models. These results suggest that these regions do not simply encode low-level sensory information, but produce a state representation that links sensory information to reward and action selection. Further validating our approach, we found an encoding of the action value output of DQN in premotor cortex/SMA, along with primary visual and motor cortex. In alignment with a traditional trial-based study (
                  - link "Wunderlich et al., 2009" [ref=e354] [cursor=pointer]:
                    - /url: "#R60"
                  - text: ), our results support a role for SMA in action valuation, while generalizing these findings to an environment with high-dimensional state dynamics.
                - paragraph [ref=e355]:
                  - text: Our findings build on a growing catalogue of intriguing similarities between deep neural networks (DNNs) and the brain (
                  - link "Eickenberg et al., 2017" [ref=e356] [cursor=pointer]:
                    - /url: "#R13"
                  - text: ;
                  - link "Güçlü and Gerven, 2015" [ref=e357] [cursor=pointer]:
                    - /url: "#R17"
                  - text: ","
                  - link "2015" [ref=e358] [cursor=pointer]:
                    - /url: "#R17"
                  - text: ;
                  - link "Iigaya et al., 2020" [ref=e359] [cursor=pointer]:
                    - /url: "#R25"
                  - text: ;
                  - link "Khaligh-Razavi and Kriegeskorte, 2014" [ref=e360] [cursor=pointer]:
                    - /url: "#R29"
                  - text: ;
                  - link "Wang et al., 2018" [ref=e361] [cursor=pointer]:
                    - /url: "#R56"
                  - text: ;
                  - link "Wen et al., 2018" [ref=e362] [cursor=pointer]:
                    - /url: "#R59"
                  - text: ;
                  - link "Yamins et al., 2014" [ref=e363] [cursor=pointer]:
                    - /url: "#R62"
                  - text: ;
                  - link "Yamins and DiCarlo, 2016" [ref=e364] [cursor=pointer]:
                    - /url: "#R61"
                  - text: ). Unlike some studies, we did not find a gradient of abstraction mapping early layers to early visual regions and later layers to later regions. All ROIs consistently preferred DQN layers 3 and 4. By examining the representational geometry of different DQN layers, we could identify principles accounting for this pattern. For Pong and Space Invaders especially, the internal representation is not dissimilar to the pixel space until DQN layers 3 and 4, whereas the information reaching early visual cortex may already be heavily compressed. Prior research suggests considerable compression and nonlinear processing of visual inputs occurs before the cortex, via the retina, LGN processing, eye movements, and feedback connections (
                  - link "Gollisch and Meister, 2010" [ref=e365] [cursor=pointer]:
                    - /url: "#R16"
                  - text: ;
                  - link "Hayhoe and Ballard, 2005" [ref=e366] [cursor=pointer]:
                    - /url: "#R21"
                  - text: ;
                  - link "Hosoya et al., 2005" [ref=e367] [cursor=pointer]:
                    - /url: "#R24"
                  - text: ;
                  - link "Kietzmann et al., 2019" [ref=e368] [cursor=pointer]:
                    - /url: "#R30"
                  - text: ). For Pong, both the brain and later layers of DQN represent high-level features about the spatial positions of the ball and paddles. Early visual regions may have more similarity to layers 3 and 4, because DQN only disentangles these features from the pixel space in later layers. Additionally, many of the DNNs used in visual neuroscience have 8 or more layers, with layers 2–4 often constituting the most similarity to early visual cortex, rather than layer 1 (
                  - link "Khaligh-Razavi and Kriegeskorte, 2014" [ref=e369] [cursor=pointer]:
                    - /url: "#R29"
                  - text: ;
                  - link "Seeliger et al., 2018" [ref=e370] [cursor=pointer]:
                    - /url: "#R47"
                  - text: ;
                  - link "Wen et al., 2018" [ref=e371] [cursor=pointer]:
                    - /url: "#R59"
                  - text: ). If the network had more layers, representational gradients at the layer level might emerge, perhaps with early visual regions still preferring layers 3 and 4, but more anterior regions mapping to deeper layers. Yet, for our purposes DQN provides a satisfactory account of both behavior and neural data, with relevant variance for explaining cortical activity packed into layers 3 and 4. Thus, we analyzed how different features within layer 3 (the last convolutional layer) explain activity across the brain.
                - paragraph [ref=e372]:
                  - text: To do so, we retrained separate encoding models on stimulus features from the convolutional filters in DQN layer 3. This analysis showed that filters most predictive of voxel activity are also predictive of human behavior, suggesting that these features are used by the brain to guide behavior. Filter selectivity is highly correlated between participants, indicating a common task representation across individuals. For Pong, the filter analysis provided more evidence that this common state-space represents high-level features such as the spatial positions of the relevant objects. This is in line with a recent proposal that the dorsal stream and PPC encode spatial positions of objects by projecting high-dimensional inputs onto a low-dimensional manifold of physical space (
                  - link "Summerfield et al., 2020" [ref=e373] [cursor=pointer]:
                    - /url: "#R53"
                  - text: ).
                - paragraph [ref=e374]:
                  - text: For Enduro and Space Invaders, the mapping of DQN features to the brain was more heterogeneous between regions, suggesting that different regions prefer different underlying features in the network. PPC areas encoded features that are more generalizable and nuisance invariant than early visual regions. Thus, PPC is able to ignore and abstract away information from the sensory stream that is not relevant for behavioral performance, such as changing colors and backgrounds in Enduro. This suggests that PPC may be a central nexus for isolating behaviorally relevant stimuli by integrating visual, cognitive, and motor information (
                  - link "Freedman and Ibos, 2018" [ref=e375] [cursor=pointer]:
                    - /url: "#R14"
                  - text: ). A substantial literature in motor neuroscience also implicates PPC in sensorimotor transformations, linking perception to decision-making and action (
                  - link "Andersen and Buneo, 2002" [ref=e376] [cursor=pointer]:
                    - /url: "#R3"
                  - text: ;
                  - link "Andersen and Cui, 2009" [ref=e377] [cursor=pointer]:
                    - /url: "#R4"
                  - text: ;
                  - link "Gold and Shadlen, 2007" [ref=e378] [cursor=pointer]:
                    - /url: "#R15"
                  - text: ). The present work suggests that these past findings and proposed theories can be integrated into a broader conceptualization of PPC as encoding abstract state-space features linking perception to learning and action selection.
                - paragraph [ref=e379]:
                  - text: Overall, our results point toward key properties fostering an effective state-space for tasks of real-world complexity. Initially, compression to a lower dimensional space takes place to avoid the curse of dimensionality where learning complexity scales exponentially with the number of states to learn about. However, exploiting the raw statistical properties of the input data, as in unsupervised learning techniques, is not enough; it must also disentangle a purely sensory manifold into appropriate axes linked to rewards and the actions that deliver them (
                  - link "DiCarlo and Cox, 2007" [ref=e380] [cursor=pointer]:
                    - /url: "#R12"
                  - text: ;
                  - link "Higgins et al., 2018a" [ref=e381] [cursor=pointer]:
                    - /url: "#R22"
                  - text: "). For Pong, these axes code for relevant data generating factors: the spatial positions of the ball and paddles. In addition, a state-space would likely benefit from being invariant to nuisances irrelevant for task performance ("
                  - link "Lenc and Vedaldi, 2015" [ref=e382] [cursor=pointer]:
                    - /url: "#R34"
                  - text: ). This property further reduces state-space dimensionality, by only transmitting useful signals through an information bottleneck (
                  - link "Achille and Soatto, 2018" [ref=e383] [cursor=pointer]:
                    - /url: "#R1"
                  - text: ;
                  - link "Shwartz-Ziv and Tishby, 2017" [ref=e384] [cursor=pointer]:
                    - /url: "#R48"
                  - text: ). This added compression helps protect against overfitting by shaping an abstract task representation orthogonal to low-level sensory properties that can change in future settings. Humans are clearly equipped with abstract representations with this property (
                  - link "Behrens et al., 2018" [ref=e385] [cursor=pointer]:
                    - /url: "#R6"
                  - text: ), as they can seamlessly adapt to novel circumstances, such as driving on new roads without having to relearn the driving process.
                - paragraph [ref=e386]:
                  - text: It should be noted that the DQN objective does not explicitly promote the learning of nuisance invariant representations, and most filters still retain information about nuisances we highlighted. Additionally, DQN performance is not robust to visual changes such as in image contrast during testing if the change was not in the training distribution. Most deep RL algorithms are not explicitly trained to learn a representation, but are trained to approximate value-based and policy-based functions and thereby learn a task representation as a side-effect. These approaches suffer sample efficiency and generalization issues (
                  - link "Kaiser et al., 2020" [ref=e387] [cursor=pointer]:
                    - /url: "#R27"
                  - text: ;
                  - link "Lake et al., 2016" [ref=e388] [cursor=pointer]:
                    - /url: "#R33"
                  - text: ). Therefore, deep RL algorithms likely would benefit from explicitly learning a representation with the principles we previously outlined, alongside other inductive biases humans possess about the structure of the world (
                  - link "Botvinick et al., 2019" [ref=e389] [cursor=pointer]:
                    - /url: "#R8"
                  - text: ). Methods for accomplishing this goal are being developed in the emerging field of state representation learning (
                  - link "Anand et al., 2019" [ref=e390] [cursor=pointer]:
                    - /url: "#R2"
                  - text: ;
                  - link "Higgins et al., 2018b" [ref=e391] [cursor=pointer]:
                    - /url: "#R23"
                  - text: ;
                  - link "Jaderberg et al., 2016" [ref=e392] [cursor=pointer]:
                    - /url: "#R26"
                  - text: ;
                  - link "Lesort et al., 2018" [ref=e393] [cursor=pointer]:
                    - /url: "#R35"
                  - text: ;
                  - link "Oord et al., 2019" [ref=e394] [cursor=pointer]:
                    - /url: "#R43"
                  - text: ;
                  - link "Srinivas et al., 2020" [ref=e395] [cursor=pointer]:
                    - /url: "#R51"
                  - text: ;
                  - link "Zhang et al., 2020" [ref=e396] [cursor=pointer]:
                    - /url: "#R64"
                  - text: ). We also espouse cross-talk between decision neuroscientists and AI researchers at the level of representations for a RL system; thus far most of the interaction between these fields has occurred at the level of learning signals (
                  - link "Botvinick et al., 2020" [ref=e397] [cursor=pointer]:
                    - /url: "#R9"
                  - text: ;
                  - link "Dabney et al., 2020" [ref=e398] [cursor=pointer]:
                    - /url: "#R11"
                  - text: ;
                  - link "Niv and Langdon, 2016" [ref=e399] [cursor=pointer]:
                    - /url: "#R39"
                  - text: ;
                  - link "Wang et al., 2018" [ref=e400] [cursor=pointer]:
                    - /url: "#R56"
                  - text: ).
                - paragraph [ref=e401]: The present findings suggest that even with notable architectural differences between the human brain and deep RL models, DQN still does remarkably well in capturing variance in both human behavior and brain activity throughout the dorsal visual stream and the parietal and premotor cortices in high-dimensional decision-making contexts. These findings further help to establish the deep and sustained relationship between progress in artificial intelligence and in computational neuroscience. Our results suggest that this interdisciplinary interplay is continuing to evolve, and that in particular, a synergy between deep RL and decision neuroscience offers the continuing prospect to yield rich insights about the internal representations of intelligent systems.
              - generic [ref=e402]:
                - heading "STAR* Methods" [level=2] [ref=e403]: STAR* Methods
                - generic [ref=e404]:
                  - heading "RESOURCE AVAILABILITY" [level=3] [ref=e405]
                  - generic [ref=e406]:
                    - heading "Lead Contact" [level=4] [ref=e407]
                    - paragraph [ref=e408]: Any additional information and requests for resources or data should be directed to and will be fulfilled by the Lead Contact, Logan Cross at lcross@caltech.edu.
                  - generic [ref=e409]:
                    - heading "Materials Availability" [level=4] [ref=e410]
                    - paragraph [ref=e411]: This study did not generate new unique materials.
                  - generic [ref=e412]:
                    - heading "Data and Code Availability" [level=4] [ref=e413]
                    - paragraph [ref=e414]: Due to Conte Center NIH funding, the fMRI data will be uploaded to the NIH database in the near future.
                    - paragraph [ref=e415]:
                      - text: The code for this project is available upon request from the corresponding authors. The most fundamental parts of our code base will be released on GitHub (
                      - link "External, opens in a new tab. https://github.com/locross93/Atari-Project" [ref=e416] [cursor=pointer]:
                        - /url: https://github.com/locross93/Atari-Project
                      - text: ).
                - generic [ref=e417]:
                  - heading "EXPERIMENTAL MODEL AND SUBJECT DETAILS" [level=3] [ref=e418]
                  - paragraph [ref=e419]: We recruited six healthy participants from the Caltech and Pasadena community (4 male and 2 females, age 26 ± 3.4). All participants performed the tasks over the course of four separate days and received a participation fee of $40 a day. The Caltech Institutional Review Board approved the protocol, and all participants gave their informed consent on each day of the experiment.
                - generic [ref=e420]:
                  - heading "METHOD DETAILS" [level=3] [ref=e421]
                  - generic [ref=e422]:
                    - heading "Experimental Paradigm/Atari Gameplay" [level=4] [ref=e423]
                    - paragraph [ref=e424]: Across the four days of the experiment, each participant went through 33 runs of gameplay. The runs were 10 minutes in duration, with 8 minutes of gameplay in between a minute of rest and a fixation cross before and after gameplay. Eyetracking was recorded, but not analyzed for this paper. Each participant played the games Space Invaders, Pong, and Enduro 11 times each. On day 1, each game was played twice, in random order with the one constraint of never playing the same game twice in a row. The six runs were then followed by anatomical scans on day 1. On days 2–4, each game was played three times, in random order with the same constraint of never playing the same game twice in a row. Before scanning on the first day, each participant went through a training session to become familiar with each game by playing each game for 5 minutes on a laptop.
                    - paragraph [ref=e425]:
                      - text: The Atari games were presented through the Arcade Learning Environment (
                      - link "Bellemare et al., 2013" [ref=e426] [cursor=pointer]:
                        - /url: "#R7"
                      - text: ), with modified code to log actions, rewards, MRI pulses, and frames with proper timestamps. A button box with four buttons was used as an Atari controller (
                      - link "Figure 1A" [ref=e427] [cursor=pointer]:
                        - /url: "#F1"
                      - text: ). Participants held the button box with two hands, using their left thumb to press the 1 and 2 buttons corresponding to move left and move right respectively, and using their right thumb to press the 3 and 4 buttons to hit brake and fire respectively. Brake is only used in Enduro, and fire is only used in Enduro and Space Invaders.
                    - paragraph [ref=e428]: In Enduro, participants control a race car that must move as fast as possible while avoiding other cars on the road. Participants get a reward of 1 for every car they pass, and the main objective is to pass a certain number of cars before the end of the day (200 cars in level 1 and 300 cars in level 2). The sky and weather patterns change throughout the gameplay to simulate the passing of time in the day (‘sunny’, ‘snow’, ‘blue dusk’, ‘red dusk’, ‘night’, ‘fog’, ‘sunrise’), with the sky eventually becoming black and the sun beginning to rise before time runs out after 13312 frames.
                    - paragraph [ref=e429]: In Pong, points are awarded to a player when the white ball moves past their opponent’s paddle. Participants control the green paddle on the right side of the screen and try to defend their goal and score on their opponent’s goal by moving their paddle up and down in the white ball’s path.
                    - paragraph [ref=e430]: In Space Invaders, participants control a green ship that can move from left to right at the bottom of the screen. The objective is to destroy enemy ships to get reward and avoid being hit by missiles from the enemy ships while having 3 lives before the game ends.
                  - generic [ref=e431]:
                    - heading "fMRI Data Acquisition" [level=4] [ref=e432]
                    - paragraph [ref=e433]: "We collected two datasets on two separate scanners at the Caltech Brain Imaging Center (Pasadena, CA). The first dataset included two participants and was collected using a 3T Siemens Magneto TrioTim scanner. After an upgrade to a Siemens Prisma, a second dataset was collected with four participants. Both datasets used a 32-channel radio frequency coil. These parameters were shared across the two sequences: whole-brain BOLD signal acquired using multiband acceleration of 4, 56 slices, voxel size=2.5mm isotropic, TR = 1,000 ms, TE = 30 ms, FA = 60°, FOV= 200mm × 200mm. At the end of the first day of scanning, T1 and T2 weighted anatomical high-resolution scans were collected with 0.9mm isotropic resolution."
                - generic [ref=e434]:
                  - heading "QUANTIFICATION AND STATISTICAL ANALYSIS" [level=3] [ref=e435]
                  - generic [ref=e436]:
                    - heading "fMRI Preprocessing" [level=4] [ref=e437]
                    - paragraph [ref=e438]:
                      - text: Data was preprocessed using a standard pipeline for preprocessing of multiband data. Using FSL (
                      - link "Smith et al., 2004" [ref=e439] [cursor=pointer]:
                        - /url: "#R49"
                      - text: ), images were brain extracted, realigned, high-pass filtered (100s threshold), and unwarped. Images were denoised by ICA component removal. Components were extracted using FSL’s Melodic, classified into signal or noise with a classifier trained on separate datasets for the first dataset, and manually classified for the second dataset since the scanner was different from the one used in the classifier training set. T2 images were aligned to T1 images with FSL FLIRT, and then both were normalized to standard space using ANTs (using CIT168 high resolution T1 and T2 templates (
                      - link "Avants et al., 2009" [ref=e440] [cursor=pointer]:
                        - /url: "#R5"
                      - text: ;
                      - link "Tyszka and Pauli, 2016" [ref=e441] [cursor=pointer]:
                        - /url: "#R55"
                      - text: )). The functional data was first co-registered to anatomical images using FSL’s FLIRT, then registered to the normalized T2 using ANTs. For GLMs in SPM 12 (
                      - link "Penny et al., 2011" [ref=e442] [cursor=pointer]:
                        - /url: "#R44"
                      - text: ) (encoding model control GLM and action value analysis) the data was spatially smoothed in FSL with a 5-mm FWHM Gaussian kernel. Smoothing was not initially applied to the fMRI images for the voxelwise encoding model analyses to preserve fine-grained detail at the voxel level but was applied with a 5-mm kernel for visualization.
                  - generic [ref=e443]:
                    - heading "Deep Q Network Training" [level=4] [ref=e444]
                    - paragraph [ref=e445]:
                      - text: Deep Q Networks were trained separately for each of the three games using the Neon deep learning library, by making modifications to open source code (
                      - link "External, opens in a new tab. https://github.com/tambetm/simple_dqn" [ref=e446] [cursor=pointer]:
                        - /url: https://github.com/tambetm/simple_dqn
                      - text: ). As in the original paper (
                      - link "Mnih et al., 2015" [ref=e447] [cursor=pointer]:
                        - /url: "#R36"
                      - text: "), DQN takes a tensor of four input frames as input, has three convolutional layers (Layer 1: 32 filters of 8×8 with stride of 4; Layer 2: 64 filters of 4×4 with stride of 2; Layer 3: 64 filters of 3×3 with stride of 1) followed by one fully connected layer (512 units), and outputs Q-values for every available action. DQN takes the action with the highest Q-value. Convolutional layers are locally connected with each neuron having a receptive field. Convolutional filters learn visual features which are then convolved across the input to detect the presence of that feature. Fully connected layers do not have this local connectivity as every neuron is connected to every neuron in the previous layer."
                    - paragraph [ref=e448]:
                      - text: The Arcade Learning Environment was used as the Atari environment during training (
                      - link "Bellemare et al., 2013" [ref=e449] [cursor=pointer]:
                        - /url: "#R7"
                      - text: ). The training consisted of 100 epochs of 250,000 steps in each epoch for each game. One modification was made for Pong by restricting the action set to noop, up, and down, since the default available action set for this game includes redundant actions up/right, and down/left.
                    - paragraph [ref=e450]: To output Q-values and hidden unit activations that are used for all analyses, the human gameplay frames were run through the trained network. Since the input to DQN is a tensor of four consecutive images, a frame from the human data is concatenated with its three preceding frames. Thus, the fourth frame in a run is the first one put through DQN. In Enduro, each level is won after passing 200 cars in the first level and 300 cars in the second level, signified by flags appearing on the scoreboard. When this happens, the game engine no longer gives reward until the day ends/clock stops even though the participant is still tasked with controlling the car and trying to avoid other cars. Thus, the network would detect the flags and predict 0 reward when this happened, resulting in meaningless Q-value traces. This would happen occasionally in a participant’s run and would last a couple of minutes. To ensure that the activations and Q-values we extracted from the network were useful, we altered the images from Enduro human gameplay before they were put through DQN so that the scoreboard would never change. Specifically, the scoreboard from a reference image midway through a run was copied into every frame.
                  - generic [ref=e451]:
                    - heading "Human Actions Analyses" [level=4] [ref=e452]
                    - paragraph [ref=e453]:
                      - text: To analyze the human state-space in relation to the DQN’s state space, we analyzed the actions participants took and how these compare to the actions DQN selects when fed the human gameplay data. This initially involved plotting the distributions for the actions executed by DQN and human participants (
                      - link "Figure S1A" [ref=e454] [cursor=pointer]:
                        - /url: "#SD1"
                      - text: ). To analyze DQN’s action values with respect to human actions, the Q-values for every participant were included after downsampling by 10 and removing the first 100 frames in a run. Action values were computed with an action advantage function by subtracting the average Q-value as an action-independent baseline (
                      - link "Sutton and Barto, 2018" [ref=e455] [cursor=pointer]:
                        - /url: "#R54"
                      - text: ). This allows us to isolate action related variance from state value related variance. Action values/advantages were then LOWESS smoothed across frames (using the Statsmodels python package with the “frac” parameter = 0.005) and normalized with sklearn’s StandardScaler. All the frames involving a “move-left” or “move-right” human action were selected, including combination actions (ie. “fire left”). Then average action values for the corresponding frames are computed across a human action category. For Enduro and Space Invaders that have combination actions, the maximum Q-value for a “move” action was taken (ie. for the “move left” Q-value in a frame in Enduro, we take the max between “move left”, “brake left”, and “fire left”). To test for significance, we test the interaction term in the linear model Action Value ~ C(DQN Action Value) + C(Human Action) + C(DQN Action Value):C(Human Action) with Statsmodels.
                    - paragraph [ref=e456]:
                      - text: For decoding human actions, we model human actions with the hidden layers of DQN using LASSO logistic regression (L1 regularization) using scikit learn functions and custom python code. Each hidden layer was projected to a dimensionality of 100 using PCA, giving a concatenated feature set of 400. Time points were downsampled by a factor of 10 to ease computation. The PCA transformation matrices were estimated using the frames for Sub001. These transformation matrices were used in every participant, to ensure that the PCs of every participant would be in the same space. LASSO logistic regression classifiers were then trained to predict left vs. right actions, after frames where no action or other actions occurred were removed. The time points when other actions were selected in combination with left vs. right were also included. Decoding accuracy was determined by cross-validating across runs. Optimal regularization parameters were found through grid search and were fixed across participants per game. Decoding accuracies were tested against a null distribution created from permutation tests of 1000 permutations. To maintain the autocorrelation of action trajectories, the cross validated data was shuffled in blocks of 40 time points (
                      - link "Wen et al., 2018" [ref=e457] [cursor=pointer]:
                        - /url: "#R59"
                      - text: ). The predicted responses from the model were then compared against these shuffled datasets. The accuracy of every model in every participant exceeded the accuracy of the maximum value in the null distributions. To determine which layers were most useful for decoding actions, the model was trained on all runs (no cross-validation) and coefficients were absolute valued and averaged by layer.
                  - generic [ref=e458]:
                    - heading "Encoding Model" [level=4] [ref=e459]
                    - paragraph [ref=e460]:
                      - text: To map hidden representations in DQN to voxels in the brain, we performed deep learning based encoding model analyses (
                      - link "Güçlü and Gerven, 2015" [ref=e461] [cursor=pointer]:
                        - /url: "#R17"
                      - text: ). All analyses were run in custom python code using functions from PyMVPA (
                      - link "Hanke et al., 2009" [ref=e462] [cursor=pointer]:
                        - /url: "#R19"
                      - text: ) and scikit learn. First, image frames from the participant’s gameplay data were run through the trained DQNs in order to generate neural network activations in every layer at every time point. As done in the decoding human actions analysis, PCA is used to reduce the dimensionality to 400 (100 PCs per layer). To downsample from the video game framerate to the TR of 1 Hz, each feature’s values are averaged over a second. Then, copied time courses are shifted by both 5s and 6s to account for the hemodynamic delay of the fMRI signal. These two shifted time courses are concatenated into a feature set of 800. Next, voxelwise ridge regression (L2 regularization) is performed to predict each voxel’s responses as a linear combination of this feature set. Optimal regularization parameters were found using grid search. Voxels are preprocessed as described above without spatial smoothing. Each voxel’s response is z-scored to ensure every voxel is on the same scale. Accuracy is estimated using cross-validation across runs and calculating the Pearson correlation between predicted and actual time courses.
                    - paragraph [ref=e463]:
                      - text: Statistical significance was quantified through permutation tests (since fMRI data may not but normally distributed) methods similar to previous approaches where 100,000 permutation tests are performed on 14 random voxels (
                      - link "Eickenberg et al., 2017" [ref=e464] [cursor=pointer]:
                        - /url: "#R13"
                      - text: ). In each permutation, the time course of the held-out validation set was shuffled in a blockwise manner of blocks of 40 TRs to keep autocorrelation intact (
                      - link "Wen et al., 2018" [ref=e465] [cursor=pointer]:
                        - /url: "#R59"
                      - text: ). The Pearson correlation between the shuffled time course and the predicted responses from the model were then computed. These permuted distributions are then concatenated, and voxel accuracy scores are compared to this concatenated null distribution to obtain one-sided p-values for every voxel. Rather than selecting 14 completely random voxels to estimate a global null hypothesis for all brain voxels, we took a more conservative approach and selected 14 random voxels who were in the 90th percentile or above of scores in the encoding model analysis. This condition ensured that voxels with strong signal were selected. Voxels were then multiple comparisons corrected using FDR and plotted at the corrected threshold as indicated. Maps are transformed to standard space and spatially smoothed (5mm kernel) for visualization. To estimate layer selectivity, the coefficients from the models were absolute valued, averaged across layer, and then averaged across region. Average coefficients across participants are shown in
                      - link "Figure S3B" [ref=e466] [cursor=pointer]:
                        - /url: "#SD1"
                      - text: .
                  - generic [ref=e467]:
                    - heading "Regions of Interest and Atlases" [level=4] [ref=e468]
                    - paragraph [ref=e469]: To define regions of interests for visualization and further analyses, we used the Harvard-Oxford Atlas. To distinguish V1, V2, V3, and V4 in the visual cortex, we used the Juelich Histological Atlas. Both atlases were accessed with FSLview. The early visual ROI consists of V1-V4; PPC includes LOC superior, superior parietal lobule, supramarginal gyrus, precuneus; Motor/Frontal includes motor and premotor cortex, SMA, and superior frontal gyrus.
                  - generic [ref=e470]:
                    - heading "Encoding Model Control Analyses" [level=4] [ref=e471]
                    - paragraph [ref=e472]: Various control models were tested in the encoding model to help identify what computational principles play a role in the DQN model explaining neural responses. In an identical pipeline as the DQN encoding model analysis, these control feature sets were downsampled and time shifted by 5s and 6s (other than motor regressors where this preprocessing has already taken place) before cross-validated ridge regression was performed to compute prediction accuracies for every voxel.
                  - generic [ref=e473]:
                    - heading "Motor" [level=4] [ref=e474]
                    - paragraph [ref=e475]: Two motor regressors corresponding to making responses with the left and right hands were used. These regressors were taken directly from the GLMs in SPM for action value that are described below.
                  - generic [ref=e476]:
                    - heading "PCA" [level=4] [ref=e477]
                    - paragraph [ref=e478]:
                      - text: To construct a control model for basic visual features that represented the statistical structure of the images, the 84×84×4 pixel tensor was linearly projected to dimensionality 100 with principal component analysis using scikit learn. Although the DQN encoding model includes 400 features and we match this dimensionality with the cross game DQN and VAE control models, using 100 principal components outperformed using 400. This linear projection of the input uncovers features that explain the low-level statistical structure in the input that vary the most during gameplay without any representation of reward. Similar approaches have been used to explain neural responses to a remarkable degree throughout the visual pathway (
                      - link "Chang and Tsao, 2017" [ref=e479] [cursor=pointer]:
                        - /url: "#R10"
                      - text: ;
                      - link "Olshausen and Field, 1996" [ref=e480] [cursor=pointer]:
                        - /url: "#R42"
                      - text: ). Additionally, since we perform PCA on the tensor of 4 consecutive frames that are input into DQN, the principal components uncover statistical properties of motion and change detection that are appropriate to model the dorsal visual pathway. As with the other PCA analyses, transformation matrices were estimated using sub001’s data and used across participants to project every all data to the same space.
                    - paragraph [ref=e481]: These principal components were also used to estimate their representation of the nuisance variables. Scikit learn’s ‘mutual_info_classif’ function was used to calculate the mutual information between the first principal component and the nuisance variables.
                  - generic [ref=e482]:
                    - heading "Cross Game DQN" [level=4] [ref=e483]
                    - paragraph [ref=e484]: We also compared our encoding model results with a DQN trained on a different game. The Space Invaders network was used as this control for Enduro, Enduro for Pong, and Pong for Space Invaders. Other than shifting the networks, the regressors were constructed identically to the original encoding model.
                  - generic [ref=e485]:
                    - heading "VAE" [level=4] [ref=e486]
                    - paragraph [ref=e487]:
                      - text: To compare DQN with another state of the art method for state representation learning using a deep neural network (
                      - link "Higgins et al., 2018b" [ref=e488] [cursor=pointer]:
                        - /url: "#R23"
                      - text: ;
                      - link "Mohamed and Rezende, 2015" [ref=e489] [cursor=pointer]:
                        - /url: "#R37"
                      - text: ;
                      - link "Watter et al., 2015" [ref=e490] [cursor=pointer]:
                        - /url: "#R58"
                      - text: ), we trained variational autoencoders in Tensorflow for each game by modifying an existing template (
                      - link "External, opens in a new tab. https://github.com/tensorflow/docs/blob/master/site/en/tutorials/generative/cvae.ipynb" [ref=e491] [cursor=pointer]:
                        - /url: https://github.com/tensorflow/docs/blob/master/site/en/tutorials/generative/cvae.ipynb
                      - text: "). The architecture we used was designed to be as similar as possible to DQN. This consisted of an encoder of three convolutional layers (Layer 1: 32 filters of 8×8 with stride of 4; Layer 2: 64 filters of 4×4 with stride of 2; Layer 3: 64 filters of 3×3 with stride of 1), followed by a fully connected layer to output the set of mean and log-variance parameters for the latent representation of dimensionality 400. The decoder architecture consisted of a fully connected layer followed by four convolution transpose layers (Layer 1: 64 filters of 4×4 with stride of 1; Layer 2: 64 filters of 4×4 with stride of 2; Layer 3: 32 filters of 8×8 with stride of 2; Layer 4: 1 filter of 8×8 with stride of 1). All activation functions are rectified linear units (ReLU). The network was trained on each game separately by maximizing the evidence lower bound (ELBO) on the marginal log-likelihood of the training data. Data frames of the first 8 runs of the first participant were used as the training set, and frames from the last 3 runs were used as the test set for tracking generalization (training sets and test sets were downsampled by 5 to ease computation). Training included 1000 epochs over the entire training set, but converged well before that for every game (training loss for first 500 epochs plotted in"
                      - link "Figure 4A" [ref=e492] [cursor=pointer]:
                        - /url: "#F4"
                      - text: ). After training, performance on the test set was nearly equivalent to performance on training set.
                    - paragraph [ref=e493]: The human frames from every participant were then run through the trained encoder to map them to the latent distribution, which outputs 400 means and log-variances for the latent dimensions. The means were then used as a 400 dimensional stimulus feature set for the control encoding model, and preprocessed with downsampling and time lags identically to the other feature sets used for encoding models.
                  - generic [ref=e494]:
                    - heading "General Linear Model (GLM) Control Analysis" [level=4] [ref=e495]
                    - paragraph [ref=e496]:
                      - text: In order to test for whether brain responses could still be predicted by DQN when controlling for the other models and game events, we constructed GLMs in SPM12 similarly to previous approaches (
                      - link "Iigaya et al., 2020" [ref=e497] [cursor=pointer]:
                        - /url: "#R25"
                      - text: ). The first 10 principal components for each DQN layer, VAE, and PCA models were added as parametric modulators to the same onset at the temporal resolution of the 1 Hz TR after averaging across volumes. Orthogonalization was turned off. Other regressors of no interest included all of the regressors described in the computational model-based GLM section below, including regressors for motor responses, reward/punishment, and action values. To quantify a voxel’s correlation to the unique variance in each of the six models (four DQN layers, VAE, PCA) F-tests were computed on the betas for the 10 PCs in each model, which tests whether a voxel is significantly modulated by at least one principal component in a model. The percentage of significant voxels in a region of interest for each model is reported in
                      - link "Figure 4C" [ref=e498] [cursor=pointer]:
                        - /url: "#F4"
                      - text: .
                  - generic [ref=e499]:
                    - heading "Control Region Analysis" [level=4] [ref=e500]
                    - paragraph [ref=e501]:
                      - text: To rule out the possibility that our analyses are picking up on artifacts such as head motion that affect the entire properties of the fMRI images, we completed a control region analysis with one subject (sub001). A control region was represented by two spheres of air drawn directly in front of the brain. The encoding model was then run on every voxel within those spheres and the distribution of prediction accuracies were plotted alongside comparison ROIs (V1 and superior parietal lobule) in
                      - link "Figure S5B" [ref=e502] [cursor=pointer]:
                        - /url: "#SD1"
                      - text: . No voxels in these spheres had significant prediction accuracies and the whole distribution of scores were very close to zero.
                  - generic [ref=e503]:
                    - heading "Representational Similarity Analysis" [level=4] [ref=e504]
                    - paragraph [ref=e505]: We performed representational similarity analyses (RSA) to examine how the representations transform throughout the DQN layers. Dissimilarity matrices (DSMs) were constructed at the frame level for DQN layers 1–4, VAE, PCA, the pixel space, and the hand drawn features for Pong. Each model was first downsampled by 20 and data was concatenated across runs within subject. DSMs were constructed by computing pairwise comparisons across frames for each model with pyMVPA. Within day comparisons were removed to avoid potential confounds due to similarity being driven by patterns being in the same run or day. For the pixel space, the 84×84×4 tensor of images that are fed to DQN were reshaped into a 28224 dimensional response vector. For the PCA model, weights fit to the data of sub001 were again used to transform the pixel space into a 100 dimensional space. In Pong, each hand drawn feature (the positions of the two paddles, the ball position X and Y, and the ball’s velocity X and Y) was z-scored and input into one response vector. Euclidean distance was used as the distance metric for the Pong hand drawn features, and correlation distance was used for every other model. Every DSM was rank-ordered to compare model DSMs without assuming a linear relationship between models. Models were then compared with Spearman correlations (the Pearson correlation on the rank-ordered DSMs).
                    - paragraph [ref=e506]: For comparing model DSMs and fMRI DSMs in Pong, each DSM was created at the TR level. This involved using the same feature sets that were used in the encoding model, where responses were averaged across volumes to downsample to TR resolution (1 Hz) and shifted by 6 seconds to account for hemodynamic delay. Again, correlation distance was used for every model except the hand drawn features (Euclidean) and DSMs were rank-ordered.
                    - paragraph [ref=e507]: For fMRI data, DSMs for three brain areas were constructed, early visual, posterior parietal cortex (PPC), and motor/frontal. Early visual regions included all visual cortex ROIs. PPC included superior lateral occipital cortex, superior parietal lobule, supramarginal gyrus, and precuneus. Motor/frontal included motor and premotor cortex, SMA, and superior frontal gyrus.
                    - paragraph [ref=e508]:
                      - text: To test for significance we performed block permutation tests for every model, since the data may not be normally distributed. Similarly to the encoding model permutation tests, fMRI data volumes were shuffled blockwise in blocks of 40 TRs to keep autocorrelation intact (
                      - link "Wen et al., 2018" [ref=e509] [cursor=pointer]:
                        - /url: "#R59"
                      - text: ), then DSMs were reconstructed and correlated to the non shuffled model DSMs. Then, to test if the correlation in a model was significantly different than zero, the correlation score had to be greater than the maximum correlation in the permutation test distribution (one-sided). To test if the differences between models were significant, this difference was tested (two-sided) against a distribution based on computing the differences between the models in every permutation. All scores were corrected for multiple comparisons.
                  - generic [ref=e510]:
                    - heading "Computational Model-Based GLMs" [level=4] [ref=e511]
                    - paragraph [ref=e512]:
                      - text: To localize the neural correlates of action value computations, we conducted computational model-based generalized linear model (GLM) analyses (
                      - link "O’Doherty et al., 2007" [ref=e513] [cursor=pointer]:
                        - /url: "#R41"
                      - text: "). This novel analysis differs from previous approaches in two ways: a deep neural network is used to approximate the value function that is used to construct regressors, and the model is trained independently of any human behavioral data."
                    - paragraph [ref=e514]:
                      - text: All univariate GLMs were conducted using SPM12 software. Initially the image frames from the human gameplay data were run through the trained DQN to output Q-values at every frame in a run as described above. Next, the Q-values were decomposed into action advantages/value to separate action related variance from reward related variance. Taking inspiration from actor critic approaches to isolate action advantages (
                      - link "Sutton and Barto, 2018" [ref=e515] [cursor=pointer]:
                        - /url: "#R54"
                      - text: ), we define state value (V(s), s=state) as the average of all Q-values, and action advantages (A(s,a), s=state, a=action) as the difference between an actions Q-value and the state value.
                    - table [ref=e516]:
                      - rowgroup [ref=e517]:
                        - row [ref=e518]:
                          - cell [ref=e519]
                    - table [ref=e520]:
                      - rowgroup [ref=e521]:
                        - row [ref=e522]:
                          - cell [ref=e523]
                    - paragraph [ref=e524]:
                      - text: Similar to the analysis in a previous study (
                      - link "Wunderlich et al., 2009" [ref=e525] [cursor=pointer]:
                        - /url: "#R60"
                      - text: ), the action value regressor here is computed as the chosen value (the maximum) between move left value and move right value. Chosen value is then LOWESS smoothed across frames, and downsampled to 10 Hz for every volume (TR = 1s). The regressor is then z-scored and entered into a GLM where it is convolved with a hemodynamic response function. Across the games, other covariates included left and right hand motor responses, parametric regressors for both positive reward and negative reward, game presentation (8 minutes of gameplay per run with one minute of rest before and after), run, and day. Losing a life was included as the negative reward regressor in Space Invaders, although the Atari engine does not explicitly deliver negative reward for loss of life, and the negative ramifications are reflected in the opportunity cost of gaining more points. Additional regressors for Space Invaders also included fire action value and the number of invaders left on the screen. For Enduro, the action value for the brake action was also included (which simultaneously approximates the anti-correlated fire action value, thus the fire action value was not also included).
                  - generic [ref=e526]:
                    - heading "Filter Analyses" [level=4] [ref=e527]
                    - paragraph [ref=e528]:
                      - text: To further interpret the encoding model results, we wanted to identify which filters were useful for modeling neural responses, and whether this varied between regions of interest. To do this, we retrained the encoding model on each filter in layer 3 (the last convolutional layer) on each voxel that was significant in the encoding model analyses. This layer had 64 filters of 7×7 receptive field size. We use cross-validated prediction accuracy of a voxel response using a convolutional filter’s explanatory features to quantify that filter’s Neural Predictivity. This Neural Predictivity score was averaged across a region to estimate how well that filter predicted responses in a region. With 64 Neural Predictivity scores per region, correlations of these scores across regions were computed to evaluate the variability of filter selectivity between regions and to construct a similarity matrix (
                      - link "Figure 7B" [ref=e529] [cursor=pointer]:
                        - /url: "#F7"
                      - text: ). This similarity matrix reflects the average similarity matrix across the six participants. A similar procedure was used to compute correlations of Neural Predictivity across participants, where in this case filter scores were averaged across all voxels in all ROIs in a participant rather than by region (
                      - link "Figure 7C" [ref=e530] [cursor=pointer]:
                        - /url: "#F7"
                      - text: ). For computing a filter score for decoding human actions (
                      - link "Figure 7D" [ref=e531] [cursor=pointer]:
                        - /url: "#F7"
                      - text: ), we similarly retrain the model from “Decoding Human Actions” on each filter separately in layer 3. These filter scores were then rescaled with min-max normalization for subsequent correlation analyses and visualizations. Thus, the best filter has a score of 1 and the worst filter has a score of 0.
                    - paragraph [ref=e532]:
                      - text: To visualize the features encoded by the filters (
                      - link "Figure 7E" [ref=e533] [cursor=pointer]:
                        - /url: "#F7"
                      - text: ), we use Neon’s deconvolution visualization function and modified code from (
                      - link "External, opens in a new tab. https://github.com/tambetm/simple_dqn" [ref=e534] [cursor=pointer]:
                        - /url: https://github.com/tambetm/simple_dqn
                      - text: ). This procedure finds frames from the human gameplay data that activate a filter the most (which is depicted on the right side), then uses guided backpropagation to identify parts of the image that led to this activation (left side). The colors reflect changes and motion across the image tensor of three frames, meaning the filter detects motion in this location.
                    - paragraph [ref=e535]:
                      - text: "We annotate six high-level features in Pong using custom python code that localizes the corresponding objects in the pixel space: ball X position, ball Y position, ball X velocity, ball Y velocity, left paddle position, and right paddle position. To assess how much each filter encodes each feature, we use scikit learn’s ‘mutual_info_regression’ function to calculate the mutual information between a filter and these continuous variables. The mutual information scores were averaged across ball X and Y positions to get one score for ball position. We similarly averaged across the ball X and Y velocity and the left and right paddle position to get scores for ball velocity and the paddle positions respectively. This outputs a MI score for each of the 7×7 receptive fields in a filter, which were then averaged to get one metric per filter for each high-level feature. These metrics are then correlated with each filter’s Neural Predictivity across the whole brain in Pong ("
                      - link "Figure 7A" [ref=e536] [cursor=pointer]:
                        - /url: "#F7"
                      - text: ).
                  - generic [ref=e537]:
                    - heading "Nuisance Invariance Scores" [level=4] [ref=e538]
                    - paragraph [ref=e539]:
                      - text: "We completed additional analyses to identify how the regions of interest encode sensory information that is irrelevant for task performance. To uncover this, we utilized a concept from the machine-learning sub-field of representation learning: nuisance invariance ("
                      - link "Lenc and Vedaldi, 2015" [ref=e540] [cursor=pointer]:
                        - /url: "#R34"
                      - text: ). A nuisance variable is any variable in the input that is irrelevant to the task, and is mathematically defined as any variable where the mutual information between it and the task output is zero (I(y;n) = 0), where y is a task label and n is a nuisance variable). Common examples include translation and illumination invariance in object recognition, as the location of an object on an image and the overall brightness of a picture are usually unrelated to classifying it correctly. Thus, nuisance invariance in neural networks suggests that a compressed and abstract representation has been learned.
                    - paragraph [ref=e541]: The game Enduro has a unique feature that we leveraged to study nuisance invariance in the gameplay environment. The colors on the screen constantly change as the weather and time of day in the game frequently changes. These stages include sunny, snowy, foggy, dusk, and night-time. Therefore, the pixel space changes dramatically while the overall gameplay dynamics are stable. In fact, we calculated that the mutual information between human left and right actions and the weather/time of day variable equals zero using scikit-learns ‘mutual_info_classif’ function (I(time of day; actions)=0), which indicates that weather/time of day is a nuisance variable. This metric can only be zero if and only if two random variables are independent. To put this in perspective, the mutual information between weather/time of day and the first principal component of the pixel space is 1.70 (I(time of day; PC 1)=1.70), and the mutual information of weather/time of day with itself is 1.81. This shows that a large amount of variance in the pixel space is due to these changing weather patterns as the first principal component codes for these conditions.
                    - paragraph [ref=e542]: Although there was no factor that is as obviously a nuisance variable in Space Invaders as the changing colors on the screen was in Enduro, the total number of invader ships on the screen explains a lot of variance in the visual pixel space, and has a high mutual information with the first principal component of the pixel space (I(num. invaders; PC 1)=1.52). However, in this game the relative positions of the invaders above an agent matter more than their absolute position and the global features, as the invaders above an agent will be in the agent’s line of fire and the agent will be in the invader’s line of fire. One exception is when there is one invader left and it starts to speed up faster than usual. To quantify this pattern, we calculated that the mutual information between the number of invaders on the screen and left and right actions is relatively low (I(num. invaders; action)=0.07).
                    - paragraph [ref=e543]: To compute a nuisance invariance score for each filter, we again use scikit learn’s ‘mutual_info_classif’ function to calculate the mutual information between a filter and a nuisance variable (weather/time of day for Enduro, number of invaders on the screen for Space Invaders - calculated with downsampled data from sub001 to ease computation). This function outputs a MI score for each of the 7×7 receptive fields, thus these scores were averaged to get a single score per filter. This score was multiplied by −1 to get the inverse of this MI metric, to denote insensitivity of the nuisance rather than encoding of the nuisance. Next, the 64 filter nuisance invariance scores are Pearson correlated with the 64 Neural Predictivity scores in a region. Intuitively, this analysis estimates whether a region prefers filters that are more insensitive to the nuisances (positive correlation) or filters that code for the nuisance (negative correlation). To increase interpretability and enhance the variability across regions that we are most interested in assessing, we z-score this metric across voxels in a participant. Thus, a nuisance invariance score of 0 is average with respect to the other voxels in a participant and the magnitude of the score reflects how many standard deviations it is from the mean.
