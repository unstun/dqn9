                  - heading "4.3. Analysis of ROS simulation results" [level=3] [ref=e841]
                  - paragraph [ref=e842]:
                    - text: To verify the feasibility of the improved algorithm in real robots, this section implements mobile robot path planning under the ROS Gazebo simulator. A small four-wheeled all-terrain robot of Jackal UGV is used in this experiment, and the robot autonomously builds a map of the environment by LiDAR, and the blue line is the LiDAR scanning line, as shown in
