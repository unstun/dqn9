                  - heading "3.6. BiLSTM-D3QN algorithm path planning overall process" [level=3] [ref=e475]
                  - paragraph [ref=e476]:
                    - text: The framework of the BiLSTM-D3QN model is shown in
                    - link "Figure 9" [ref=e477] [cursor=pointer]:
                      - /url: "#fig9"
                    - text: . The BiLSTM-D3QN model adopts a dual network structure, which inputs the current state
                    - text: from the experience pool to the current network
                    - text: based on the priority, and then selects the action
                    - text: under the state
                    - text: according to the adaptive action and obtains the Q-value of the current network. The state
                    - text: is input to the target network
                    - text: . At the same time, the action
                    - text: corresponding to the maximum Q value in state
                    - text: is selected in the current network, and then
                    - text: is used to find the Q value in the target network. The current network updates the network parameters
                    - text: by backpropagation of the loss function and periodically copies the parameters to the target network parameters
                    - text: . In the inner layer of the two network structures, the state information is extracted through the memory unit module and input into the two-layer BiLSTM network. After passing through the four fully connected layers, the advantage function layer
                    - text: and the state value function layer
                    - text: output the Q value. This makes the mobile robot memorable and more stable in decision-making when encountering the same obstacles. The robot’s ability to find target points and avoid obstacles becomes stronger, which also makes the converged reward curve less volatile thus planning a better path. Path planning pseudocode of mobile robot based on BiLSTM-D3QN is shown in
                    - link "Algorithm 1" [ref=e478] [cursor=pointer]:
                      - /url: "#sec15"
                    - text: .
