                  - heading "2.3. DDQN algorithm" [level=3] [ref=e181]
                  - paragraph [ref=e182]:
                    - text: In response to the issue of overestimation of the Q value in the DQN algorithm, the DeepMind team put forth the DDQN algorithm as a potential solution. In comparison to the DQN algorithm, the DDQN algorithm modifies the manner in which the Q value is calculated within the target network. This involves the decomposition of the maximization operation within the target network into the utilization of distinct networks for the purposes of action selection and action evaluation. In contrast to the conventional approach of selecting the maximum Q value, the DDQN algorithm initially identifies the action
                    - text: that corresponds to the maximum Q value in state
                    - text: through the current network. The target network then calculates the Q value based on action
                    - text: and the current state
                    - text: . This process effectively mitigates the issue of overestimation of Q values (
                    - link "Yuan et al., 2023" [ref=e183] [cursor=pointer]:
                      - /url: "#ref21"
                    - text: ), leading to more precise Q value estimation. The structural diagram of the DDQN network is illustrated in
                    - link "Figure 3" [ref=e184] [cursor=pointer]:
                      - /url: "#fig3"
                    - text: .
