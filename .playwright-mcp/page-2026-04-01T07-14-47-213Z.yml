                  - heading "3.4. Dueling Network" [level=3] [ref=e359]
                  - paragraph [ref=e360]:
                    - text: This paper introduces a competitive network into the neural network structure of the DDQN algorithm. The competitive network introduces a dual layer with two branches between the hidden layer and the output layer of the DDQN network, which are, respectively, the advantage function layer
                    - text: and the state value function layer
                    - text: . The advantage function layer calculates the advantage of each action relative to the average, and the state function layer calculates the state value of the object in its current state. The advantage value of each action is summed with the state value to obtain the Q-value of each action. The problem of overestimation of the Q-value by the neural network can be further solved. The structure of the competition network is shown in
                    - link "Figure 6" [ref=e361] [cursor=pointer]:
