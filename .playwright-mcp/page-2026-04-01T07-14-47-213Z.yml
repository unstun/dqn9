                    - paragraph [ref=e637]:
                      - text: To verify the effectiveness of the proposed algorithm, it is compared with the Q-learning, DQN, and DDQN path planning algorithms in environment 1.
                      - link "Figure 11" [ref=e638] [cursor=pointer]:
