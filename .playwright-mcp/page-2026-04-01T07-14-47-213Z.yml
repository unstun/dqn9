                - generic [ref=e125]:
                  - heading "2.1. Q-Learning algorithm" [level=3] [ref=e126]
                  - paragraph [ref=e127]:
                    - text: Reinforcement Learning is an important branch of machine learning that aims to learn how to take the best action in a given situation by interacting with the environment in order to maximize cumulative rewards. Reinforcement learning differs from supervised learning and unsupervised learning in that it emphasizes trial and error in interacting with the environment for feedback, constantly adjusting strategies to achieve the best results. The basic framework of reinforcement learning is shown in
                    - link "Figure 1" [ref=e128] [cursor=pointer]:
                      - /url: "#fig1"
                    - text: . The agent chooses action
                    - text: based on current state
                    - text: . The environment provides reward
                    - text: for the current action and state
                    - text: for the next moment based on the action. After continuous interaction, the agent’s decision is improved and updated to obtain a higher reward
                    - text: .
