              - generic [ref=e86]:
                - heading "Abstract" [level=2] [ref=e87]: Abstract
                - paragraph [ref=e88]: Aiming at the problems of slow network convergence, poor reward convergence stability, and low path planning efficiency of traditional deep reinforcement learning algorithms, this paper proposes a BiLSTM-D3QN (Bidirectional Long and Short-Term Memory Dueling Double Deep Q-Network) path planning algorithm based on the DDQN (Double Deep Q-Network) decision model. Firstly, a Bidirectional Long Short-Term Memory network (BiLSTM) is introduced to make the network have memory, increase the stability of decision making and make the reward converge more stably; secondly, Dueling Network is introduced to further solve the problem of overestimating the Q-value of the neural network, which makes the network able to be updated quickly; Adaptive reprioritization based on the frequency penalty function is proposed. Experience Playback, which extracts important and fresh data from the experience pool to accelerate the convergence of the neural network; finally, an adaptive action selection mechanism is introduced to further optimize the action exploration. Simulation experiments show that the BiLSTM-D3QN path planning algorithm outperforms the traditional Deep Reinforcement Learning algorithm in terms of network convergence speed, planning efficiency, stability of reward convergence, and success rate in simple environments; in complex environments, the path length of BiLSTM-D3QN is 20 m shorter than that of the improved ERDDQN (Experience Replay Double Deep Q-Network) algorithm, the number of turning points is 7 fewer, the planning time is 0.54 s shorter, and the success rate is 10.4% higher. The superiority of the BiLSTM-D3QN algorithm in terms of network convergence speed and path planning performance is demonstrated.
                - paragraph [ref=e90]:
                  - strong [ref=e91]: "Keywords:"
                  - text: deep reinforcement learning, mobile robot, path planning, BiLSTM, Dueling Network
              - generic [ref=e92]:
                - heading "1. Introduction" [level=2] [ref=e93]: 1. Introduction
                - paragraph [ref=e94]:
                  - text: In recent years, there has been a notable increase in the utilization of mobile robots in a variety of fields, including the military and industry, for the performance of essential unmanned tasks (
                  - link "Deguale et al., 2024" [ref=e95] [cursor=pointer]:
                    - /url: "#ref4"
                  - text: ). As the complexity of use scenarios and the level of safety standards continue to evolve, the challenge of efficiently and accurately planning driving paths has become a significant research topic (
                  - link "Meng et al., 2023" [ref=e96] [cursor=pointer]:
                    - /url: "#ref14"
                  - text: ). The planning of robot paths has consistently been a topic of significant interest within the field of robotics. It enhances the autonomy and operational efficiency of robots in diverse environments, offering substantial benefits for applications across various sectors of modern society (
                  - link "Kong et al., 2024" [ref=e97] [cursor=pointer]:
                    - /url: "#ref9"
                  - text: ). The fundamental objective of path planning is to identify the optimal route from the initial position to the intended destination of the robot, which typically necessitates a comprehensive assessment of factors such as distance, time, energy consumption, and the safety of the path (
                  - link "Guo et al., 2020" [ref=e98] [cursor=pointer]:
                    - /url: "#ref5"
                  - text: ). An optimal path should be free of obstacles, minimize detours, and facilitate efficient navigation (
                  - link "Junli et al., 2020" [ref=e99] [cursor=pointer]:
                    - /url: "#ref8"
                  - text: ). Mobile robots frequently operate in environments with diverse obstacles and unknown variables, underscoring the importance of path planning algorithms that can effectively avoid obstacles and operate in real-time with high reliability (
                  - link "Sha et al., 2023" [ref=e100] [cursor=pointer]:
                    - /url: "#ref15"
                  - text: ).
                - paragraph [ref=e101]:
                  - text: "The existing body of literature on path planning algorithms can be divided into two main categories: traditional algorithms and those based on machine learning ("
                  - link "Yuwan et al., 2022" [ref=e102] [cursor=pointer]:
                    - /url: "#ref22"
                  - text: ). The traditional path planning algorithms include Ant Colony Optimization (
                  - link "Lei et al., 2023" [ref=e103] [cursor=pointer]:
                    - /url: "#ref10"
                  - text: ), A* algorithm (
                  - link "Yu et al., 2024" [ref=e104] [cursor=pointer]:
                    - /url: "#ref20"
                  - text: ), Particle Swarm Optimization (
                  - link "Meetu et al., 2022" [ref=e105] [cursor=pointer]:
                    - /url: "#ref13"
                  - text: ), Dijkstra algorithm (
                  - link "Zhou et al., 2023" [ref=e106] [cursor=pointer]:
                    - /url: "#ref25"
                  - text: ), Genetic Algorithm (
                  - link "Debnath et al., 2024" [ref=e107] [cursor=pointer]:
                    - /url: "#ref3"
                  - text: ), Dynamic Window Approach (
                  - link "Chuanbo et al., 2023" [ref=e108] [cursor=pointer]:
                    - /url: "#ref2"
                  - text: ), and Artificial Potential Field algorithm (
                  - link "Zhang et al., 2023" [ref=e109] [cursor=pointer]:
                    - /url: "#ref23"
                  - text: ), among others. While these algorithms are widely used, they also have corresponding shortcomings, including low planning efficiency, poor search ability, and the tendency to fall into local optima. In recent years, the application of Deep Reinforcement Learning (DRL) algorithms in the field of path planning has been significantly advanced by the progress of hardware technology. DRL integrates the robust feature extraction capabilities of Deep Learning (DL) with the decision optimization abilities of Reinforcement Learning (RL), thereby offering a novel approach to address the limitations of traditional path planning algorithms (
                  - link "Chen et al., 2024" [ref=e110] [cursor=pointer]:
                    - /url: "#ref1"
                  - text: ). The DRL algorithm most widely used in path planning is the Deep Q Network (DQN) algorithm proposed by the DeepMind team (
                  - link "Lin and Wen, 2023" [ref=e111] [cursor=pointer]:
                    - /url: "#ref12"
                  - text: ). The DQN effectively addresses the “curse of dimensionality” problem faced by Q-value tables in complex environments by utilizing a neural network to replace the Q-value table in the Q-Learning algorithm. However, the traditional DQN algorithm exhibits shortcomings such as overestimation of Q-values and slow network convergence.
                - paragraph [ref=e112]:
                  - text: In light of the shortcomings of the DQN algorithm,
                  - link "Huiyan et al. (2023)" [ref=e113] [cursor=pointer]:
                    - /url: "#ref6"
                  - text: put forth an augmented DDQN (double DQN) approach to path planning, which enhances the efficacy of algorithmic training and the precision of optimal path generation.
                  - link "Jinduo et al. (2022)" [ref=e114] [cursor=pointer]:
                    - /url: "#ref7"
                  - text: put forth a double DQN-state splitting Q network (DDQNSSQN) algorithm that integrates state splitting with optimal states. This method employs a multi-dimensional state classification and storage system, coupled with targeted training to obtain optimal path information.
                  - link "Yan et al. (2023)" [ref=e115] [cursor=pointer]:
                    - /url: "#ref19"
                  - text: put forth an end-to-end local path planner n-step dueling double DQN with reward-based
                  - emphasis [ref=e116]: ϵ
                  - text: "-greedy (RND3QN) based on a deep reinforcement learning framework, which acquires environmental data from LiDAR as input and uses a neural network to fit Q-values to output the corresponding discrete actions. The problem of unstable mobile robot action selection due to sparse rewards is effectively solved."
                  - link "Shen and Zhao (2023)" [ref=e117] [cursor=pointer]:
                    - /url: "#ref16"
                  - text: put forth a DDQN-based path planning framework for UAVs to traverse unknown terrain, which effectively mitigates the issue of overestimation of Q values.
                  - link "Wang et al. (2024)" [ref=e118] [cursor=pointer]:
                    - /url: "#ref18"
                  - text: put forth an extended double deep Q network (DDQN) model that incorporates a radio prediction network to generate a UAV trajectory and anticipate the accumulated reward value resulting from action selection. This approach enhances the network’s learning efficiency. In a further development of the field,
                  - link "Li and Geng (2023)" [ref=e119] [cursor=pointer]:
                    - /url: "#ref11"
                  - text: proposed a probabilistic state exploration ERDDQN algorithm. This has the effect of reducing the number of times the robot enters a repeated state during training, thus allowing it to explore new states more effectively, improve the speed of network convergence, and optimize the path planning effect.
                  - link "Tang et al. (2024)" [ref=e120] [cursor=pointer]:
                    - /url: "#ref17"
                  - text: put forth a competitive architecture dueling-deep Q network (D3QN) for UAV path planning, which further optimizes the calculation of Q value and facilitates more precise updates to network parameters.
                  - link "Yuan et al. (2023)" [ref=e121] [cursor=pointer]:
                    - /url: "#ref21"
                  - text: proposed the D3QN-PER path planning algorithm, which employs the Prioritized Experience Replay (PER) mechanism to enhance the utilization rate of crucial samples and accelerate the convergence of the neural network.
                - paragraph [ref=e122]: The aforementioned research has enhanced the functionality of the DQN algorithm to a certain degree; nevertheless, there are still significant issues that require attention, including low sample utilization, slow network convergence, and unstable reward convergence. To address this issue, this paper proposes a BiLSTM-D3QN path planning algorithm based on the DDQN algorithm. First, a BILSTM network is introduced to render the neural network memory-based, thereby increasing the stability of decision-making and thus facilitating more stable reward convergence. Secondly, a competitive network is introduced to further address the issue of overestimation of the neural network’s Q-value, thereby enabling the network to update more rapidly. The proposal of adaptive reprioritization of experience replay based on frequency penalty function is intended to facilitate the extraction of crucial and recent data from the experience pool, thus accelerating the convergence of the neural network. Finally, an adaptive action selection mechanism is introduced with the objective of further optimizing action exploration.
