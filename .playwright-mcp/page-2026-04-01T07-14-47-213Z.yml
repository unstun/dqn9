              - generic [ref=e202]:
                - heading "3. BiLSTM-D3QN path planning algorithm" [level=2] [ref=e203]: 3. BiLSTM-D3QN path planning algorithm
                - paragraph [ref=e204]:
                  - text: While DDQN addresses the issue of overestimation of Q-values to a degree, it nevertheless exhibits certain shortcomings and constraints. In the DDQN algorithm, the value of
                  - emphasis [ref=e205]: ε
                  - text: is a constant. In the latter stages of path planning, the robot may fail to identify the optimal path due to the random selection of actions. While the experience replay buffer addresses the issue of data correlation, it also presents a challenge in efficiently sampling representative experiences from the experience pool to accelerate network convergence. Furthermore, when the robot encounters the same obstacle, it may execute disparate actions, which impedes the value function from attaining convergence. This ultimately results in an unstable decision-making process. In light of these considerations, this paper puts forth a BiLSTM-D3QN path planning algorithm founded upon the DDQN decision-making model.
                - generic [ref=e206]:
                  - heading "3.1. Design of reward function" [level=3] [ref=e207]
                  - paragraph [ref=e208]:
                    - text: In the context of mobile robot path planning, the term “state” is defined as the position coordinates of the robot, as illustrated in
                    - link "Equation 6" [ref=e209] [cursor=pointer]:
                      - /url: "#EQ6"
                    - text: ":"
                  - table [ref=e210]:
                    - rowgroup [ref=e211]:
                      - row "(6)" [ref=e212]:
                        - cell [ref=e213]
                        - cell "(6)" [ref=e214]
                  - paragraph [ref=e215]:
                    - text: Its action space is shown in
                    - link "Figure 4" [ref=e216] [cursor=pointer]:
                      - /url: "#fig4"
                    - text: .
                  - figure "Schematic diagram of the action space." [ref=e217]:
                    - heading "Figure 4." [level=4] [ref=e218]
                    - paragraph [ref=e219]:
                      - img "Figure 4" [ref=e220]
                    - link "Open in a new tab" [ref=e222] [cursor=pointer]:
                      - /url: figure/fig4/
                    - paragraph [ref=e224]: Schematic diagram of the action space.
                  - paragraph [ref=e225]:
                    - text: "The area in which the robot is permitted to move is divided into a grid, and the robot is therefore able to move freely to any of the eight surrounding grids. The digits 0 through 7 are used to represent the eight directions: front, back, left, right, top left, top right, bottom left, and bottom right, respectively. The action set is illustrated in"
                    - link "Equation 7" [ref=e226] [cursor=pointer]:
                      - /url: "#EQ7"
                    - text: ":"
                  - table [ref=e227]:
                    - rowgroup [ref=e228]:
                      - row "(7)" [ref=e229]:
                        - cell [ref=e230]
                        - cell "(7)" [ref=e231]
                  - paragraph [ref=e232]:
                    - text: Reward functions are a key component of research in the field of RL on path planning. Classical DRL algorithms typically employ sparse reward functions, as discussed in
                    - link "Zhao et al. (2024)" [ref=e233] [cursor=pointer]:
                      - /url: "#ref24"
                    - text: . The classical DRL algorithm is designed with arrival rewards and collision rewards, with a positive reward of 20 given for arrival at the target point and-20 for collision, and the reward function is shown in
                    - link "Equation 8" [ref=e234] [cursor=pointer]:
                      - /url: "#EQ8"
                    - text: ":"
                  - table [ref=e235]:
                    - rowgroup [ref=e236]:
                      - row "(8)" [ref=e237]:
                        - cell [ref=e238]
                        - cell "(8)" [ref=e239]
                  - paragraph [ref=e240]: Since only the arrival and collision rewards are set during the training process, it results in a sparse reward signal. When the mobile robot acts, ineffective actions often occur. In general, terms, when the robot completes the action, if the reward value is 0 at this time, the robot can not judge what to do next based on the current state, and it is not clear how to reach the target position. Due to the difficulty of pre-exploration, the robot needs to go through a longer trial-and-error process to find the correct path. During this process, the robot is mainly guided by the negative rewards from collisions and lacks the guidance of positive rewards, so it is difficult to update a better strategy during strategy evaluation.
                  - paragraph [ref=e241]:
                    - text: One solution to the reward sparsity problem is to add auxiliary rewards, and in this paper, we introduce a dynamic reward function. Distance and direction rewards are added to the environment as auxiliary rewards, and the reward values are dynamically presented with the change of robot position. The closer the mobile robot is to the target point, the greater the reward is. The reward function is shown in
                    - link "Equation 9" [ref=e242] [cursor=pointer]:
                      - /url: "#EQ9"
                    - text: ":"
                  - table [ref=e243]:
                    - rowgroup [ref=e244]:
                      - row "(9)" [ref=e245]:
