                - generic [ref=e145]:
                  - heading "2.2. DQN algorithm" [level=3] [ref=e146]
                  - paragraph [ref=e147]:
                    - text: The traditional DQN algorithm, as proposed by the DeepMind team, is based on the Q-Learning algorithm. The introduction of a neural network as the carrier of the value function allows for the nonlinear approximation of the state value function through the use of a neural network with parameters
                    - text: and an activation function. This approach enhances the efficiency of path planning. In contrast to the Q-Learning algorithm Q-value table, the DQN employs a neural network to address the dimensional explosion problem that arises in complex environments (
                    - link "Chen et al., 2024" [ref=e148] [cursor=pointer]:
                      - /url: "#ref1"
                    - text: ). However, the conventional DQN approach selects the action with the maximum Q-value when searching for the optimal action, which is susceptible to overestimation of the Q-value during network updates.
                    - link "Figure 2" [ref=e149] [cursor=pointer]:
                      - /url: "#fig2"
                    - text: illustrates the structure of the DQN algorithm.
