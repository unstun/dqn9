                - generic [ref=e546]:
                  - heading "4.1. Environment setup and parameter configuration" [level=3] [ref=e547]
                  - paragraph [ref=e548]:
                    - text: "A simulation comparison experiment was set up to verify the algorithm’s effectiveness proposed in this paper. Experimental environment: CPU model i7-13700H, GPU model RTX4070, Python 3.8, Pytorch 2.2.2, Tensorflow 2.13, Cuda 11.8. In this experiment, two raster environments were created. Environment 1 is a simple environment with a raster map size of 16 × 16; environment 2 is a complex environment with a raster map size of 25 × 25. In both environments, the black rectangular blocks represent obstacles, and the white parts are free-movement areas. The red square in the bottom left corner represents the starting point of the mobile robot; the red square in the top right corner represents the endpoint of the mobile robot. The starting point of Environment 1 is (10, 0) and the endpoint is (150, 160); the starting point of Environment 2 is (10, 0) and the endpoint is (240, 250). The robot can move on the map in eight directions: up, down, left, right, top left, top right, bottom left, and bottom right. Each movement is 10 m long. The episode ends when the robot hits an obstacle, exceeds the maximum number of steps, or reaches the end. The map of the simulation environment is shown in"
