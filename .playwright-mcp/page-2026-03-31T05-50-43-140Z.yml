                      - heading "6. Results and Discussion" [level=2] [ref=e524]
                      - generic [ref=e525]:
                        - text: The suggested approach was validated using the free autonomous driving simulation program CALRA [
                        - link "3" [ref=e526] [cursor=pointer]:
