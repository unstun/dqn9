                        - text: "]. Several training simulations were carried out in the Town 05 environment using CARLA 0.9.13. The simulation environment is shown in"
                        - link "Figure 5" [ref=e529] [cursor=pointer]:
                          - /url: "#fig_body_display_wevj-16-00138-f005"
                        - text: .
