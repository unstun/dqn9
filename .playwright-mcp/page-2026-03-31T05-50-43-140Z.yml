                - generic [ref=e256]:
                  - generic [ref=e257]:
                    - generic [ref=e258]:
                      - heading "1. Introduction" [level=2] [ref=e259]
                      - generic [ref=e260]:
                        - text: Autonomous driving has been a topic of interest for many years, with various advancements being made to improve its safety and efficiency [
                        - link "1" [ref=e261] [cursor=pointer]:
                          - /url: "#B1-wevj-16-00138"
                        - text: "]. However, developing a fully autonomous system presents several challenges, such as the need for real-time decision-making and adaptability to changing environments. One of the most promising technologies used in this field is deep reinforcement learning, a type of Machine Learning that uses neural networks and reward-based training to enable decision-making ["
                        - link "2" [ref=e262] [cursor=pointer]:
                          - /url: "#B2-wevj-16-00138"
                        - text: "]. Despite these promising advancements, deep reinforcement learning also presents challenges and ethical implications ["
                        - link "3" [ref=e263] [cursor=pointer]:
                          - /url: "#B3-wevj-16-00138"
                        - text: "]. For example, it raises concerns about responsibility if an autonomous vehicle causes an accident. Determining fault involves assessing whether the manufacturer, the software developer, or the vehicle owner is responsible. Moreover, there are concerns about the impact of autonomous driving on employment and the economy. Nonetheless, the potential benefits of DRL in this field are vast, and the technology continues to evolve. For instance, developing more advanced neural networks and integrating other technologies, such as computer vision and natural language processing, can further enhance the decision-making process of autonomous systems."
                      - generic [ref=e264]:
                        - text: Deep reinforcement learning enhances autonomous driving systems by allowing agents to learn from their mistakes and improve decision-making over time [
                        - link "4" [ref=e265] [cursor=pointer]:
                          - /url: "#B4-wevj-16-00138"
                        - text: "]. For example, an agent can receive a reward for staying within the speed limit and a penalty for breaking it ["
                        - link "5" [ref=e266] [cursor=pointer]:
                          - /url: "#B5-wevj-16-00138"
                        - text: "]. This reward-based training helps the agent learn from past experiences, making adapting to different road and weather conditions possible ["
                        - link "6" [ref=e267] [cursor=pointer]:
                          - /url: "#B6-wevj-16-00138"
                        - text: "]. As a result, DRL has the potential to revolutionize autonomous driving by enhancing the system’s ability to respond effectively to diverse situations."
                      - generic [ref=e268]:
                        - text: This work aims to assess autonomous driving tasks in urban environments using DQN agents. To achieve this, several approaches based on DQN agents will be investigated. The DQN agent learns a policy, and a set of behaviors, for lane-following tasks by applying visual and driving characteristics obtained from in-vehicle sensors and a trajectory planner based on a model [
                        - link "7" [ref=e269] [cursor=pointer]:
                          - /url: "#B7-wevj-16-00138"
                        - text: ","
                        - link "8" [ref=e270] [cursor=pointer]:
                          - /url: "#B8-wevj-16-00138"
                        - text: ","
                        - link "9" [ref=e271] [cursor=pointer]:
                          - /url: "#B9-wevj-16-00138"
                        - text: "]. This method comprehensively analyzes how deep reinforcement learning is transforming autonomous driving technology."
                      - generic [ref=e272]:
                        - text: An end-to-end autonomous system based on the Deep Q-learning algorithm offers several advantages over traditional approaches [
                        - link "10" [ref=e273] [cursor=pointer]:
                          - /url: "#B10-wevj-16-00138"
                        - text: "]. Its simplicity lies in the seamless integration of perception, prediction, and planning into a unified model that can be trained together. Our study proposes an RL-based autonomous driving system, emphasizing more informative exploration and improved reward signaling. We will evaluate the performance of this system in urban environments using the DDQN approach combined with Long Short-Term Memory (LSTM) ["
                        - link "11" [ref=e274] [cursor=pointer]:
                          - /url: "#B11-wevj-16-00138"
                        - text: "]."
                      - generic [ref=e275]:
                        - text: We will develop an intelligent driving agent capable of navigating complex environments along predetermined routes [
                        - link "12" [ref=e276] [cursor=pointer]:
                          - /url: "#B12-wevj-16-00138"
                        - text: ","
                        - link "13" [ref=e277] [cursor=pointer]:
                          - /url: "#B13-wevj-16-00138"
                        - text: "], such as those in the CARLA simulator, to validate our approach ["
                        - link "14" [ref=e278] [cursor=pointer]:
                          - /url: "#B14-wevj-16-00138"
                        - text: "]. We will also analyze various design decisions to determine the best configurations for training autonomous driving agents using reinforcement learning. Additionally, we will demonstrate the training methods that can significantly impact the performance of a deep RL agent. Finally, we will validate our approach in various challenging traffic scenarios and show that our method outperforms previous state-of-the-art techniques."
                    - generic [ref=e279]:
                      - heading "2. Overview of Deep Reinforcement Learning in Autonomous Driving" [level=2] [ref=e280]
                      - generic [ref=e281]:
                        - heading "2.1. Reinforcement Learning" [level=3] [ref=e282]
                        - generic [ref=e283]:
                          - text: RL is a key artificial intelligence technique for tackling complex problems like robotics [
                          - link "15" [ref=e284] [cursor=pointer]:
                            - /url: "#B15-wevj-16-00138"
                          - text: "], industry automation, natural language processing, and autonomous driving. In autonomous driving, RL trains vehicles to make decisions in dynamic environments. The vehicle, the agent, interacts with its surroundings, including roads, traffic, and pedestrians, by taking actions such as steering, accelerating, and braking. Each action earns rewards or penalties based on its safety and effectiveness, guiding the vehicle to improve over time."
                        - generic [ref=e285]:
                          - text: Autonomous driving with RL involves balancing exploration, i.e., trying new maneuvers, and exploitation, i.e., using proven strategies, to maximize rewards [
                          - link "16" [ref=e286] [cursor=pointer]:
                            - /url: "#B16-wevj-16-00138"
                          - text: "]. Simulations play a vital role in training RL models safely before real-world deployment, addressing the challenges of complex, dynamic environments. Unlike supervised learning, where explicit examples are provided, RL relies on trial and error to optimize actions, using feedback to refine strategies and ensure safe, efficient performance. The general agent–environment interaction process in RL is shown in"
                          - link "Figure 1" [ref=e287] [cursor=pointer]:
                            - /url: "#fig_body_display_wevj-16-00138-f001"
                          - text: .
                        - generic [ref=e288]:
                          - generic [ref=e290] [cursor=pointer]:
                            - img "Wevj 16 00138 g001" [ref=e291]
                            - link [ref=e292]:
                              - /url: "#fig_body_display_wevj-16-00138-f001"
                          - generic [ref=e293]:
                            - text: Figure 1. The agent–environment interaction in reinforcement learning, reprinted from Ref. [
                            - link "17" [ref=e294] [cursor=pointer]:
                              - /url: "#B17-wevj-16-00138"
                            - text: "]."
                        - generic [ref=e295]:
                          - text: The learning and decision-making in RL critically involve an interaction between the agent and the environment. A
                          - subscript [ref=e296]: t
                          - text: a given time step t, the environment is in a certain state, S
                          - subscript [ref=e297]: t
                          - text: ", from which the agent takes an action, A"
                          - subscript [ref=e298]: t
                          - text: ", according to its policy, which has assigned a strategy to map states to actions. The execution of action A"
                          - subscript [ref=e299]: t
                          - text: causes the environment to transition into the next state, S
                          - subscript [ref=e300]: t+1
                          - text: ", and gives the agent a reward R"
                          - subscript [ref=e301]: t
                          - text: . The agent then observes this reward and new state, S
                          - subscript [ref=e302]: t+1
                          - text: . At the next time step, t+1, an updated action, A
                          - subscript [ref=e303]: t+1
                          - text: ", is taken by the agent in response to its updated state. It goes on repeatedly that an agent selects an action, receives a reward, and observes the next state. It tries to maximize rewards over time, which can be measured regarding a sum of rewards, discounted rewards, or another metric concerning long-term benefit. This then creates an iterative feedback loop through which the agent can improve its policy and further develop its strategy in making decisions ["
                          - link "18" [ref=e304] [cursor=pointer]:
                            - /url: "#B18-wevj-16-00138"
                          - text: "]."
                      - generic [ref=e305]:
                        - heading "2.2. Deep Reinforcement Learning" [level=3] [ref=e306]
                        - generic [ref=e307]:
                          - text: DRL has become a key approach for training autonomous vehicles to make complex decisions in dynamic environments [
                          - link "19" [ref=e308] [cursor=pointer]:
                            - /url: "#B19-wevj-16-00138"
                          - text: "]. By combining reinforcement learning and deep learning, DRL allows vehicles to navigate, plan, and control effectively while handling tasks like lane changes, intersections, and obstacle avoidance. Training often occurs in simulated environments, enabling the safe exploration and refinement of strategies. Using reward systems, DRL optimizes decision-making by encouraging safe behaviors and penalizing unsafe actions ["
                          - link "20" [ref=e309] [cursor=pointer]:
                            - /url: "#B20-wevj-16-00138"
                          - text: "]. Techniques like Convolutional Neural Networks process sensory data to enhance perception and planning. Despite its promise, challenges remain, such as ensuring generalization to new scenarios, improving safety mechanisms, and addressing computational efficiency. DRL’s hierarchical structures help tackle complex traffic scenarios, improving speed, trajectory, and collision avoidance, while algorithms like DQN are evaluated for maneuver planning. Simulations significantly reduce real-world testing needs, minimizing risks and enhancing algorithm performance."
                      - generic [ref=e310]:
                        - heading "2.3. Deep Q-Networks (DQNs)" [level=3] [ref=e311]
                        - generic [ref=e312]:
                          - text: DQNs combine Q-learning with deep neural networks to enable reinforcement learning agents to handle high-dimensional state spaces. By approximating the Q-value function using a neural network, DQNs allow agents to learn optimal policies directly from raw inputs, such as images or sensor data [
                          - link "8" [ref=e313] [cursor=pointer]:
                            - /url: "#B8-wevj-16-00138"
                          - text: "]. This approach has been successfully applied in various domains, including playing video games, robotics, and autonomous driving, showcasing its ability to solve complex decision-making problems."
                      - generic [ref=e314]:
                        - heading "2.4. Double Deep Q-Networks (DDQNs)" [level=3] [ref=e315]
                        - generic [ref=e316]:
                          - text: DDQN is an enhancement to the original DQN algorithm designed to address the overestimation bias in Q-learning, which arises when the same network is used to select and evaluate actions, leading to inflated Q-values [
                          - link "21" [ref=e317] [cursor=pointer]:
                            - /url: "#B21-wevj-16-00138"
                          - text: "]. Unlike DQN, DDQN employs two separate networks: an online network for action selection and a target network for Q-value evaluation. This decoupling reduces bias and improves learning stability and Q-Network (DDQN)-based deep reinforcement learning (DRL) algorithms to enhance decision-making and control. Several novel approaches have emerged, each addressing enhancing performance in complex environments by ensuring more accurate Q-value updates. Thus, recent advancements in autonomous driving have leveraged Double Deep specific challenges. Notable approaches include Dueling DDQN for lane-keeping, which improves stability by separately estimating state value and advantage functions ["
                          - link "22" [ref=e318] [cursor=pointer]:
                            - /url: "#B22-wevj-16-00138"
                          - text: "], and Game-Theoretic DDQN for Intersection Control, enabling cooperative vehicle interactions ["
                          - link "23" [ref=e319] [cursor=pointer]:
                            - /url: "#B23-wevj-16-00138"
                          - text: "]. The Double Broad Q-Network (DBQN) enhances overtaking decisions using a broad learning system ["
                          - link "24" [ref=e320] [cursor=pointer]:
                            - /url: "#B24-wevj-16-00138"
                          - text: "], while Hierarchical Dueling DDQN improves sparse-reward learning for complex driving tasks ["
                          - link "25" [ref=e321] [cursor=pointer]:
                            - /url: "#B25-wevj-16-00138"
                          - text: "]. Lastly, LK-TDDQN applies transfer learning to adapt lane-keeping strategies across environments ["
                          - link "26" [ref=e322] [cursor=pointer]:
                            - /url: "#B26-wevj-16-00138"
                          - text: "]. These innovations demonstrate the versatility of DDQN-based DRL in autonomous driving."
                    - generic [ref=e323]:
                      - heading "3. Benchmarking—Urban Driving Simulator" [level=2] [ref=e324]
                      - generic [ref=e325]: Simulation is a cost-effective and safe alternative to real-world testing for autonomous systems. It allows developers to quickly create and evaluate prototypes, iterate on designs, and explore various scenarios. Simulators also provide precise performance measurement tools, enabling the in-depth analysis and optimization of algorithms. This approach accelerates development and enhances safety by allowing for comprehensive testing in controlled virtual environments.
                      - generic [ref=e326]:
