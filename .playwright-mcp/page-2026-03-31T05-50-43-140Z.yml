                        - generic [ref=e535]: Figure 5. The CARLA highway environment (Town 05).
                      - generic [ref=e536]: Using the Town 05 environment of CARLA 0.9.13, we simulated the behavior of an expert human driver to control an autonomous vehicle using the actions generated by our model. After the model was well trained, we integrated it into the actor network for RL. This approach reduces the gap between states and actions, thus accelerating the training and convergence of the model.
                      - generic [ref=e537]: In the CARLA simulator, the starting and destination points were consistent, and the traffic conditions varied according to the various episodes of training in Town 05. While the autonomous vehicle was entrusted with the task of driving safely and effectively, it could turn right and left in several intersections in an urban environment.
                      - generic [ref=e538]:
                        - text: The experimental simulation and training tests in our work were conducted using a PC HP Gaming I-5, Intel
                        - superscript [ref=e539]: ®
                        - text: Core ™ i5-11800h processor reconditioned 2.30 GHz 16 GB RAM, 512GB SSD Hard Drive, Nvidia GeForce RTX 3050 Graphic, 15.6 “HD LED”.
                      - generic [ref=e540]: To test our work, the vehicle was initially generated randomly in the starting area, and it had to follow the designated route according to the town chosen until reaching its destination; it must also avoid collisions with other vehicles in dense traffic. The environment of the town chosen also contains other fixed and mobile objects, including signaling failures, pedestrians, cyclists, motorcycles, and other vehicles.
                      - generic [ref=e541]:
                        - text: In
                        - link "Figure 6" [ref=e542] [cursor=pointer]:
                          - /url: "#fig_body_display_wevj-16-00138-f006"
                        - text: ", the graph represents the reward per episode for the Deep Q-Network (DQN) agent trained in CARLA over 2000 episodes. This method is used in state-of-the-art methodologies. The x-axis denotes the number of episodes, while the y-axis represents the reward value. Observing the graph, the reward values exhibit significant fluctuations and spikes throughout the episodes, indicating inconsistent learning. There is no clear trend of continuous improvement, suggesting that the agent struggles to optimize its policy effectively. Additionally, the large variance in rewards implies that the model does not achieve stable learning."
                      - generic [ref=e543]:
                        - generic [ref=e545] [cursor=pointer]:
                          - img "Wevj 16 00138 g006" [ref=e546]
                          - link [ref=e547]:
                            - /url: "#fig_body_display_wevj-16-00138-f006"
                        - generic [ref=e548]: Figure 6. Representation of reward vs. episode of DQN algorithm with 2000 episodes.
                      - generic [ref=e549]: DQN, in addition, has several limitations when used for autonomous vehicle (AV) training in reinforcement learning. One major issue is the lack of stability in learning, as the high variance in rewards suggests that DQN struggles with maintaining stable Q-values. Furthermore, DQN is designed for discrete action spaces, whereas AVs require continuous control over acceleration, braking, and steering. Discretizing these actions limits fine control and reduces overall performance. Another challenge is the exploration versus exploitation trade-off; DQN often suffers from insufficient exploration, leading to suboptimal policies.
                      - generic [ref=e550]: Moreover, the algorithm is highly sensitive to hyperparameter tuning, such as learning rate and experience replay buffer size, making training inefficient for AVs. Small changes in parameters can result in catastrophic forgetting or suboptimal learning outcomes. Another crucial limitation is DQN’s inability to handle safety constraints effectively. The high fluctuations in rewards suggest frequent collisions or unsafe driving events, highlighting DQN’s inadequacy for real-world AV training without additional modifications.
                      - generic [ref=e551]:
