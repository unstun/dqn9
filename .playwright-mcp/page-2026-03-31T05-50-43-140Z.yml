                        - generic [ref=e558]: Figure 7. Representation of epsilon decay values of DQN algorithm with 2000 episodes.
                      - generic [ref=e559]: Epsilon (ε) is a parameter in ε-greedy exploration used in DQN to balance exploration (trying new actions) and exploitation (choosing the best-known action). The graph shows that epsilon starts at 1.0, meaning that the agent initially explores randomly. Over time, epsilon decays exponentially, approaching near-zero values after around 1500 episodes, indicating that the agent shifts from exploration to exploitation.
