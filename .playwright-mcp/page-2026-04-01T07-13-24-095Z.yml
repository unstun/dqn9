            - paragraph [ref=e4933]: "We employ a multi-layer perceptron model for vector-based input to encode it into a feature token. For image-based input, we use a convolution neural network (CNN) with residual blocks to extract 2D features, which are later flattened to match the dimensions of other tokens. Tokens from different views are then fused in the transformer encoder, and their values are selected as outputs. Finally, an MLP-based network is used to map the concatenation of the values to the target output, namely the action for actor-net or the estimated value for value-net. Moreover, we use an auto-encoder structure to train the encoder in self-supervision. The CNN encoder extracts the features from the original image, and a deconvolutional neural network is used to reconstruct the image from the features. The pre-training data is collected with a naive agent trained initially without image input. The loss function of the auto-encoder using a mean square error can be expressed as:"
