        - generic [ref=e62]:
          - generic [ref=e63]: Mingyang Jiang, Yueyuan Li, Songan Zhang, Siyuan Chen, Chunxiang Wang, and Ming Yang
          - generic [ref=e64]: "This work is supported in part by the National Natural Science Foundation of China under Grants 62173228 (Corresponding author: Ming Yang and Yueyuan Li).Mingyang Jiang, Yueyuan Li, Siyuan Chen, Chunxiang Wang, and Ming Yang are with the Department of Automation, Shanghai Jiao Tong University, Key Laboratory of System Control and Information Processing, Ministry of Education of China, Shanghai, 200240, CN (email: MingYANG@sjtu.edu.cn, rowena_lee@sjtu.edu.cn).Songan Zhang is with the Global Institute of Future Technology, Shanghai Jiao Tong University, Shanghai, 200240, CN"
        - generic [ref=e65]:
          - heading "Abstract" [level=6] [ref=e66]
          - paragraph [ref=e67]:
            - text: Automated parking stands as a highly anticipated application of autonomous driving technology. However, existing path planning methodologies fall short of addressing this need due to their incapability to handle the diverse and complex parking scenarios in reality. While non-learning methods provide reliable planning results, they are vulnerable to intricate occasions, whereas learning-based ones are good at exploration but unstable in converging to feasible solutions. To leverage the strengths of both approaches, we introduce Hybrid pOlicy Path plannEr (HOPE). This novel solution integrates a reinforcement learning agent with Reeds-Shepp curves, enabling effective planning across diverse scenarios. HOPE guides the exploration of the reinforcement learning agent by applying an action mask mechanism and employs a transformer to integrate the perceived environmental information with the mask. To facilitate the training and evaluation of the proposed planner, we propose a criterion for categorizing the difficulty level of parking scenarios based on space and obstacle distribution. Experimental results demonstrate that our approach outperforms typical rule-based algorithms and traditional reinforcement learning methods, showing higher planning success rates and generalization across various scenarios. We also conduct real-world experiments to verify the practicability of HOPE. The code for our solution will be openly available on
            - link "https://github.com/jiamiya/HOPE" [ref=e68] [cursor=pointer]:
              - /url: GitHub
            - text: .
        - generic [ref=e69]:
          - heading "Index Terms:" [level=6] [ref=e70]
          - text: Automated parking, reinforcement learning, path planning.
        - generic [ref=e71]:
          - heading "I Introduction" [level=2] [ref=e72]:
            - generic [ref=e73]: I
            - text: Introduction
          - paragraph [ref=e75]:
            - text: Automated parking is a tempting technology to improve driving safety and efficiency
            - generic [ref=e76]:
              - text: "["
              - link "1" [ref=e77] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.20579v2#bib.bib1
              - text: "]"
            - text: . An automated parking system comprises several vital components, including perception, planning, and control, in which path-planning algorithms play a crucial role
            - generic [ref=e78]:
              - text: "["
              - link "2" [ref=e79] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.20579v2#bib.bib2
              - text: "]"
            - text: . In parking scenarios, the path-planning task involves generating a feasible path from the start position to the target parking spots under specific physics constraints.
            - generic [ref=e80]:
              - text: Compared to other scenarios, finding a feasible path in parking scenarios is usually more challenging because of the lower error tolerance of the target spot and the lack of navigational reference lines
              - generic [ref=e81]:
                - text: "["
                - link "3" [ref=e82] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.20579v2#bib.bib3
                - text: "]"
              - text: . Additionally, the limited space and surrounding obstacles shrink the number of potential solutions.
            - text: While existing path-planning approaches have proved practical and robust in most simple scenarios, their inherent difficulty in truly understanding the surrounding environment may lead to planning failures, especially when scenarios become more intricate
            - generic [ref=e83]:
              - text: "["
              - link "4" [ref=e84] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.20579v2#bib.bib4
              - text: "]"
            - text: .
          - paragraph [ref=e86]:
            - text: Learning-based planners have the potential to understand environments and intelligently plan routes through a data-driven approach, diverging from reliance on pre-defined planning methods rooted in human priors. While expert data is used as the ground truth for imitation learning in various tasks, the scarcity of large-scale datasets for parking scenarios necessitates researchers to collect data manually
            - generic [ref=e87]:
              - text: "["
              - link "5" [ref=e88] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.20579v2#bib.bib5
              - text: "]"
            - text: . This supervised learning approach risks overfitting the model to specific parking strategies due to the insufficient diversity in the training scenarios. Meanwhile, Reinforcement Learning (RL) has gathered increasing attention in the field of autonomous driving
            - generic [ref=e89]:
              - text: "["
              - link "6" [ref=e90] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.20579v2#bib.bib6
              - text: "]"
            - text: . Indeed, through interaction with the environment, RL methods enable the training of agents without labeling trajectory ground truth. Nonetheless, training RL agents in complex and diverse scenarios remains a challenging task
            - generic [ref=e91]:
              - text: "["
              - link "7" [ref=e92] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.20579v2#bib.bib7
              - text: "]"
            - text: . It is straightforward for the agent to fit into fixed parking strategies but poses greater difficulty in obtaining generalization capability across various parking scenarios. Moreover, the agent faces challenges in conducting effective exploration, especially in complex scenarios with narrow parking spaces, significantly impacting the training efficiency.
          - generic [ref=e93]:
            - paragraph [ref=e94]:
              - text: This paper focuses on employing RL methods in the parking path planning task with static obstacles. To achieve efficient and effective learning under diverse parking scenarios, we propose reinforcement learning-based Hybrid pOlicy Path plannEr (HOPE). The hybrid policy planner is designed to leverage RL-based methods and a classical geometric-based path planning method, the Reeds-Shepp (RS) curve
              - generic [ref=e95]:
                - text: "["
                - link "8" [ref=e96] [cursor=pointer]:
