            - text: Conclusion and Future Work
          - paragraph [ref=e4528]: In this paper, we proposed a reinforcement learning-based path planning method in diverse parking scenarios with static obstacles. Instead of directly training the parking agent with existing RL methods, we introduced a hybrid policy that integrates the RS curve and PPO as well as SAC. To enhance the training efficiency and performance of reinforcement learning agents, we introduce a method to calculate and implement the action mask mechanism in the task of parking path planning. A transformer-based network structure is utilized to fuse information about obstacles and target parking spots from different inputs and output the planning actions.
          - paragraph [ref=e4530]: To better train and evaluate the proposed method, we introduce a difficulty ranking approach for parking scenarios. The difficulty ranking standard categorizes scenarios into normal, complex, and extreme based on obstacles and parking space conditions. We utilized a simulator and a real-world parking lot dataset to construct training and testing scenarios. Comparisons were made against other rule-based and RL-based methods. Comprehensive experiments were designed to illustrate the effectiveness of the proposed method. The results indicate that our approach outperforms the Hybrid A* algorithm in planning success rates across all types of scenarios, particularly in complex and extreme situations. Compared to the typical approach of directly using reinforcement learning for training, our proposed method combines the advantages of both rule-based and learning-based methods, resulting in an effectively trained planner with generalization capabilities across different scenarios.
          - paragraph [ref=e4532]: This paper shows that the learning-based approach can serve as a promising tool in dealing with complex and diverse parking scenarios. Our work will be open-sourced to support the following research. The proposed HOPE serves as a potential planner to deal with the intricate scenarios where the rule-based methods fail to plan a feasible path. Besides, since only static scenarios are considered in our work, our method can be integrated with a dynamic obstacle avoidance system to handle real-world participants to ensure compatibility and safety in dynamic environments. In the future, more efforts could be made to apply the learning-based method directly in parking scenarios with dynamic obstacles. To support this, enhancing simulation environments with interactive traffic participant models that realistically react to the autonomous vehicle would greatly improve the training and evaluation of such methods.
