                    - generic: ⁢
                    - generic [ref=e4482]: m
                - text: and we fine-tuned our model with the vehicle’s parameter in the same simulation environment. More details about the experimental platform and the overall system can be found in the appendix
                - link "E" [ref=e4483] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.20579v2#A5
                - text: .
            - paragraph [ref=e4485]:
              - generic [ref=e4486]:
                - text: We tested our method on vertical parking, parallel parking, and an additional challenging dead-end vertical parking scenario, as shown in Figure
                - link "6" [ref=e4487] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.20579v2#S5.F6
                - text: . To test the generalization ability of our algorithm, these scenarios are not included in the training set. In all three scenarios, our algorithm successfully planned collision-free paths and guided the vehicle to complete the parking process. Detailed videos of the parking processes can be found at
                - link "https://www.youtube.com/watch?v=62w9qhjIuRI" [ref=e4488] [cursor=pointer]:
                  - /url: https://www.youtube.com/watch?v=62w9qhjIuRI
                - text: . It is worth noting that the dead-end scenario in Figure
                - link "6" [ref=e4489] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.20579v2#S5.F6
                - text: (c) represents a situation where the drivable area in front of the parking spot is narrow, with one side obstructed by obstacles. This requires the vehicle to perform extensive maneuvering and multiple gear shifts to adjust its orientation, making it a highly challenging scenario. These results demonstrate the practical applicability and generalization capability of our algorithm in real-world scenarios.
