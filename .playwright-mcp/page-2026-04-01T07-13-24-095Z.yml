          - heading "Appendix E Real-world experiment setups" [level=2] [ref=e5717]:
            - generic [ref=e5718]: Appendix E
            - text: Real-world experiment setups
          - paragraph [ref=e5720]:
            - generic [ref=e5721]:
              - text: For sensors, we used Hesai Pandar40, RoboSense RS-LiDAR-32 and Bpearl LiDAR to support the vehicle’s localization and perception modules and no GPS was included. Figure
              - link "8" [ref=e5722] [cursor=pointer]:
                - /url: https://arxiv.org/html/2405.20579v2#A5.F8
              - text: illustrates the framework of the parking system and how our method operates in real-world scenarios. The input to the planning module, where our method is applied, consists of a BEV grid map, obstacle distance, and the position of the parking spot. The target parking spot is selected by the driver and its precise location is obtained from a high-definition map, then transformed into the ego coordinate system through the localization system. Obstacle distance information is derived from the LiDAR point cloud, while the BEV grid map is generated by augmenting the drivable area from the high-definition map with real-time detected obstacles from the LiDAR. To mitigate the impact of upstream perception errors, we also add virtual occupancy grids in other parking spaces in the BEV grid map based on high-definition map information, ensuring the vehicle does not drive into these areas during maneuvering. These inputs are then converted into the format required by the network, which outputs a one-step planned path. Finally, a Quadratic Programming (QP) and Model Predictive Control (MPC) approach is used for path following to obtain the vehicle control commands from the waypoints. Besides, we also utilize a collision avoidance module to give way to dynamic obstacles in practice. All the perception and localization modules along with our planning algorithm are deployed on an Intel i7-1165G7 2.80GHz CPU.
