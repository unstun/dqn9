            - paragraph [ref=e4471]:
              - generic [ref=e4472]:
                - text: We also conducted real-world experiments in an indoor parking garage to show the applicability of our method in the real world. Our experimental platform was a Changan CS55E-Rock vehicle with a dimension of
                - math [ref=e4473]:
