              - text: . To enhance training efficiency, we employ a hybrid policy reinforcement learning approach. Our proposed HOPE combines the learnable policy from original reinforcement learning with a rule-based policy derived from the RS curve. In each interaction step, the agent outputs the action, namely the single-step path planning result, based on the current state given by the environment. The action is then adjusted using the action mask mechanism before interacting with the environment. We employ four forms of network input as state representation, including information about the distance to obstacles, target parking space, drivable action space, and historical trajectory, encoded in either vectors or images. A transformer-based structure with learnable view encoding is designed to fuse the inputs and get the outputs in the actor and critic network
