                - link "25" [ref=e159] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.20579v2#bib.bib25
                - text: "]"
              - text: . However, imitation learning-based methods are not good at handling the scenarios beyond their training sets, and the behavior cloners cannot outperform their imitation targets in terms of performance
              - generic [ref=e160]:
                - text: "["
                - link "26" [ref=e161] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.20579v2#bib.bib26
                - text: "]"
              - text: .
            - paragraph [ref=e163]:
              - text: In RL-based approaches, the agents are developed without any labeled ground truth. The Monte Carlo tree search method was applied to search the available path in parallel parking scenarios
              - generic [ref=e164]:
                - text: "["
                - link "27" [ref=e165] [cursor=pointer]:
