                - text: "]"
              - text: . Both geometric and sampling-and-search-based methods, as rule-based methods, leverage human prior knowledge to design algorithms. In most common cases, these priors can serve as a strong fallback to obtain satisfactory solutions. However, these methods can hardly achieve human-level proficiency in complex and diverse parking scenarios
