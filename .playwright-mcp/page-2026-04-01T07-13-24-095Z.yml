              - text: . A transformer-based structure is used as the information fusion network in actor and critic networks
              - generic [ref=e97]:
                - text: "["
                - link "9" [ref=e98] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.20579v2#bib.bib9
                - text: "]"
              - text: ". Since the diversity of scenario difficulty has a significant impact on training and testing, we rank the difficulty of scenarios by referencing related standards for automated parking. Overall, the main contributions of this paper include:"
            - list [ref=e99]:
              - listitem [ref=e100]:
                - text: •
                - paragraph [ref=e102]: We develop a hybrid policy method for parking path planning which achieves over 97% success rate across diverse and challenging parking scenarios and verify its generalization ability with real-world experiments.
              - listitem [ref=e103]:
                - text: •
                - paragraph [ref=e105]: We propose a method for calculating and implementing the action mask in the path planning task. This mechanism excludes improper actions for reinforcement learning agents and significantly improves training efficiency and performance.
              - listitem [ref=e106]:
                - text: •
                - paragraph [ref=e108]: We propose a criterion to rank the difficulty of static parking scenarios. Comprehensive experiments are conducted across simulations of different difficulty levels, demonstrating a notable improvement in success rates compared to rule-based and naive reinforcement learning-based methods.
