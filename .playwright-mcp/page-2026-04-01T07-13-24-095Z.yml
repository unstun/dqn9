              - text: Learning-based parking path-planning
            - paragraph [ref=e152]:
              - text: Learning-based methods represent a potential avenue to enhance the planner’s performance in the task of parking. Existing methods mainly include imitating learning-based and reinforcement learning-based methods. Imitating learning requires the learnable planner to fit on the ground truth data. Liu et al. employed a neural network to align parking paths more closely with human behavior
              - generic [ref=e153]:
