                  - /url: https://arxiv.org/html/2405.20579v2#S5.T2
                - text: presents the planning success rates of these methods across different scene types and difficulty levels. We have separately listed the results for DLP scenarios since they originate from real-world parking environments. As shown in the table, a direct implementation of the RS method fails to provide a feasible path in most cases. Hybrid A* achieves a success rate of over 90% in both normal scenarios and complex vertical parking cases. However, as the scene difficulty increases, its planning success rate significantly declines. In the extreme parallel parking scenarios, the most narrow cases, its success rate is only 16.8%. EBHS shows a significantly higher success rate in parallel parking scenarios than Hybrid A*. Specifically, in complex and extreme parallel parking scenarios, EBHS improves the success rate by nearly 30% over Hybrid A*. This improvement is attributed to the learning-based Q-function in EBHS, which can better estimate the state values in these scenarios compared to the rule-based heuristic function in Hybrid A*. However, the overall success rate of EBHS is still not high enough to be considered robust. The reinforcement learning baselines perform better than the rule-based RS method but fail to surpass the Hybrid A*. Their low success rates in several scenarios demonstrate that achieving good performance through overfitting in a few cases does not necessarily guarantee the trained agent’s generalization capability. In contrast, our proposed HOPE, no matter based on on-policy PPO or off-policy SAC, outperforms all baselines and reaches a success rate of over 99.4% in all normal scenarios and over 94% in all scenarios. Figure
                - link "3" [ref=e3721] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2405.20579v2#S5.F3
                - text: shows the reward and success rate curves in the training process. The proposed method significantly improves training efficiency and success rate over the naive RL method by combining the RL agent and the RS policy.
