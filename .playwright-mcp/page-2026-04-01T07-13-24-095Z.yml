                - text: "]"
              - text: . The existing works typically map the elements of the task to the components of RL and directly employ them to train the agent in a limited number of scenarios. As more complex and diverse parking scenarios are introduced, it would be harder for RL-based methods to explore the proper parking policy, making it challenging to obtain planners with generalization capabilities.
