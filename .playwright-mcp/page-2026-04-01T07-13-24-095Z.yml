                - text: . In the absence of the action mask mechanism, the success rate declines by more than 20% in complex parallel parking scenarios and 30% in extreme scenarios. This significant drop in performance indicates that utilizing an action mask to influence and constrain the agent’s action is crucial for training effectiveness. Besides, replacing the transformer with a multi-layer perceptron leads to a decline of more than 10% in several scenarios, demonstrating the importance of multi-modal information fusion. Excluding the action mask or BEV images as inputs to the neural network also impacts the agent’s performance. Using the auto-encoder to pre-train the image encoder can enhance the training for the PPO-based agent but has a relatively minor impact on the SAC-based agent.
