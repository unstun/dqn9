                  - generic [ref=e291]: "$$\\:{g}_{t}={f}_{dec}\\left({l}_{0:t},{m}_{t}\\right)$$"
                  - generic [ref=e292]: (4)
                - paragraph [ref=e293]: "Where the goal point at time t is denoted by \\(\\:{g}_{t}\\), the position of MR from time 0 to t is represented by \\(\\:{l}_{0:t}\\), the surrounding map generated at time t is \\(\\:{m}_{t}\\), and the decision function is \\(\\:{f}_{dec}\\)."
                - paragraph [ref=e294]: "These techniques lead to significant reliance on knowledge, as they are necessary to build extensive rules for complicated contexts. The primary goal of this study is to determine the simplest and most common function \\(\\:{f}_{dec}\\). Our approach addresses more complicated scenarios and learns the workable technique by trial and error, as compared to stacking the rules for study."
            - generic [ref=e296]:
              - heading "Theoretical methodology" [level=2] [ref=e297]
              - generic [ref=e298]:
                - paragraph [ref=e299]: Mobile robots must have the ability to discover how to travel independently in unfamiliar interior scenarios while avoiding both dynamic and static obstacles. By finding the ideal Q-value function that produces the best outcomes across every situation, RL seeks to educate the agent on how to act in a strange setting. After choosing action over every state, the agent adopts rewards from the surroundings to modify Q-values towards optimality convergence. For an RL algorithm, there is a conflict between exploring and exploiting when the surroundings are unknown. By choosing the course of action with the highest assessed value, the agent makes use of its existing understanding. If the agent chooses any of the remaining actions, on the other hand, it suggests that the agent is exploring to refine and enhance its assessment of the act’s values.
                - paragraph [ref=e300]:
                  - text: Developing a surroundings map that is as close to replicating the real-world scenario as possible is the aim of MR Exploring. In Fig.
                  - link "3" [ref=e301] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig3
                  - text: ", the agent, and surroundings within the DRL-based system of navigation are shown collaborating with each other. The DRL agent drives toward the intended destination while avoiding static and dynamic obstacles, substituting the localizing, map-generating, and planning of local paths that make up the traditional navigation approach. The global route planning element in Fig."
                  - link "3" [ref=e302] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig3
                  - text: establishes a series of landmarks to act as transitional locations of references throughout DRL-based MR movement, enabling an integrated navigation system for carrying out extended-distance movement through challenging terrain.
                - figure "Fig. 3" [ref=e304]:
                  - generic [ref=e306]: Fig. 3
