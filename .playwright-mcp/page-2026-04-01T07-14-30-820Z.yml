                  - text: ":"
                - generic [ref=e278]:
                  - generic [ref=e279]: "$$\\:{m}_{t},\\:{l}_{t}={f}_{map}\\left({l}_{t-1},{m}_{t-1},{c}_{t},\\:{o}_{t}\\right)$$"
                  - generic [ref=e280]: (3)
                - paragraph [ref=e281]: "Where control and observation are \\(\\:{c}_{t}\\) and \\(\\:{o}_{t}\\) consecutively, \\(\\:{f}_{map}\\) is the mapping function, the location of MR is denoted by \\(\\:{l}_{t-1}\\) at time \\(\\:t-1\\), and \\(\\:{m}_{t-1}\\) is the map created in the environment at time \\(\\:t-1\\)."
                - paragraph [ref=e282]:
                  - text: The two main types of SLAM techniques are filter-based and graph-based. Filter-based techniques modify the predicted value of both landmark and MR positions using a Kalman filter as well as the expanded Kalman filter. The graph-based techniques use nonlinear optimization for predicting the MR location by building a position graph using both control and observation data. We use a graph-based approach in this study because it is easy to apply and performs well in most scenarios. The graph-based technique can minimize errors and reliably provide the obtained answer when compared with the filter-based technique
                  - superscript [ref=e283]:
                    - link "Reference 32" [ref=e284] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR32
                      - text: "32"
                  - text: .
                - heading "Decision strategy" [level=3] [ref=e285]
                - paragraph [ref=e286]:
                  - text: This component selects the target point, or the location, that the MR needs to reach based on past observations. The map for the surrounding area generated by the mapping section serves as the input for this work. The decision strategy can be expressed as in Eq. (
                  - link "4" [ref=e287] [cursor=pointer]:
