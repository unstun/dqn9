            - generic [ref=e205]:
              - heading "Literature survey" [level=2] [ref=e206]
              - generic [ref=e207]:
                - paragraph [ref=e208]:
                  - text: In recent years, many researchers have focused on the development of an effective framework based on the DDRL technique for the navigation of MR in a partially or fully unknown environment. Singla et al.
                  - superscript [ref=e209]:
                    - link "Reference 19" [ref=e210] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR19
                      - text: "19"
                  - text: explain a technique for allowing an unmanned aerial vehicle (UAV) quadrotor using a monocular camera to avoid obstacles by itself within unplanned and unexplored indoor environments. This study implements a memory-based DDRL for the avoidance of obstacles for UAVs, considering partial information about the environment. Li et al.
                  - superscript [ref=e211]:
                    - link "Reference 20" [ref=e212] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR20
                      - text: "20"
                  - text: address the issue of automated exploration in a completely new environment, which is crucial when using a robotic system for various social activities. To improve the functional flexibility of the robot system, this study designs a generic exploring architecture by breaking down the methods of exploration in planning, decision-making, and mapping categories. This research suggests a DDRL-based decision technique that relies on this structure, which makes use of a DNN to learn an exploration approach considering the partial map.
                - paragraph [ref=e213]:
                  - text: Cai et al.
                  - superscript [ref=e214]:
                    - link "Reference 21" [ref=e215] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR21
                      - text: "21"
                  - text: propose a Linear Temporal Logic (LTL) formula-based deep policy gradient technique for directing a robot with uncertain dynamics working in a crowded environment. This paper presents a unique route-planning-guided reward system that incorporates sampling-based methodologies for successfully completing target-reaching tasks and tackles the sustainability issue of exploration in training. Yan et al.
                  - superscript [ref=e216]:
                    - link "Reference 22" [ref=e217] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR22
                      - text: "22"
                  - text: "suggest a multi-robot navigation architecture that uses option-based hierarchy DDRL, enabling quick and secure navigation. Two control schemes are included in this architecture: a lower-level version that utilizes sub-policies to produce actions and a higher-level version that autonomously develops a reliable and steady behavior selection policy. Ali et al."
                  - superscript [ref=e218]:
                    - link "Reference 23" [ref=e219] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR23
                      - text: "23"
                  - text: present a technique to utilize DDRL to enable autonomous exploration of unfamiliar environments. In this study, the environment is explored using external and curiosity-driven reward mechanisms. By anticipating future states, the curiosity-based reward mechanism encourages an agent to search for previously unexplored areas, while the external incentive function helps the agent avoid collisions.
                - paragraph [ref=e220]:
                  - text: Xue et al.
                  - superscript [ref=e221]:
                    - link "Reference 24" [ref=e222] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR24
                      - text: "24"
                  - text: focused on the challenge of enabling efficient UAV navigation in large-scale unknown regions involving many obstacles utilizing DDRL techniques. In this study, a UAV through perception-constrained navigation is represented as a partially observable MDP and an actor-critic-based rapid recurrent stochastic valued gradient method has been developed for a real-time solution. Wang et al.
                  - superscript [ref=e223]:
                    - link "Reference 25" [ref=e224] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR25
                      - text: "25"
                  - text: present a hierarchical navigation system that integrates model-based control with DRL-based perception. A DDRL network built using the Long Short-Term Memory (LSTM) and Soft Actor-Critic (SAC) algorithms can be trained to estimate 2D lidar inputs, goal locations, and the state of robots into a set of local checkpoints that are ideal in terms of avoiding collisions. Zeng et al.
                  - superscript [ref=e225]:
                    - link "Reference 26" [ref=e226] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR26
                      - text: "26"
                  - text: provide a unique DDRL technique that can maneuver non-holonomic robots into an uncertain, unfamiliar environment containing moving obstacles while maintaining constant control. Simulation tests demonstrate that the suggested strategy, by continuously issuing acceleration instructions, can achieve excellent robotic maneuvering in unfamiliar and difficult settings when compared to traditional approaches.
                - paragraph [ref=e227]:
                  - text: Zhu et al.
                  - superscript [ref=e228]:
                    - link "Reference 27" [ref=e229] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR27
                      - text: "27"
                  - text: "provide a hierarchical DRL architecture for quick and secure navigation that has an excellent rate of sampling and sim-to-real transferring skill: The robot might follow toward the goal point while maintaining an adequate distance from obstacles thanks to the minimal DRL policy; additional a high degree DRL policy is added for further enhanced navigational reliability. With the goal of minimizing state space and preventing inadequate reward, this method chooses a waypoint that is on a trajectory that leads the robot toward the desired destination as the subgoal. Furthermore, the path is created using a regional or global map, which may greatly enhance the suggested DRL framework’s adaptation capacity, security, and sampling accuracy. To increase mobility accuracy and decrease action space, a target-directed illustration of the action space might additionally be developed from the subgoal. Xue et al."
                  - superscript [ref=e230]:
                    - link "Reference 28" [ref=e231] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR28
                      - text: "28"
                  - text: propose a novel technique for guiding the multi-UAV’s navigational activities depending upon the gradient algorithm of the depth deterministic policy, which is known as multi-agent recurrent deterministic policy gradient (MARDPG). To be more precise, every critic network trains centralized, enabling every UAV to determine the policies of different UAVs, and overcoming the delayed convergence issue brought due to the uncertain surroundings. The requirement for resources to communicate between UAVs is eliminated by distributed operation. In critic’s network, sharing variables speeds up training.
            - generic [ref=e233]:
              - heading "Background information" [level=2] [ref=e234]
              - generic [ref=e235]:
                - paragraph [ref=e236]:
                  - text: To perform autonomous navigation while navigating through an unfamiliar area, MR acquires sensor data and simultaneously creates a map of its environment. The MR exploration algorithm is required to generate a map that looks more like the real world. In conventional navigation approaches, the MR creates an environment map by itself and finds its own location. DL and RL have progressed throughout the decades, and with their assistance, numerous end-to-end control techniques have been created. These technologies integrate sensor information and the environment into deep neural networks (DNN) as inputs and outputs for MR control. One major benefit of end-to-end approaches is their conciseness
                  - superscript [ref=e237]:
                    - link "Reference 29" [ref=e238] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR29
                      - text: "29"
                  - text: . Despite this, there is a significant lag before using the method on an actual MR. Since end-to-end learning techniques require extensive trial and error, many academics have implemented this method of learning in simulation environments. Since the MR begins by acquiring the ability to navigate to discover a new environment, the algorithm takes a while to converge. It cannot be assured that the mapping that a DNN learns in a simulation setting will have a better generalization for the actual world because the two environments are not exactly similar. The relationship between surroundings and an agent might be represented by the MDP. MDPs apply several variables, such as the surroundings, agent action, and rewards, to decide what the optimum next action of the framework will take. An MDP describes an iterative decision-making problem in which an agent must select an array of actions to maximize reward-based criteria. Equation (
                  - link "1" [ref=e239] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Equ1
                  - text: ) is the abbreviation for an MDP (M)
                  - superscript [ref=e240]:
                    - link "Reference 30" [ref=e241] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR30
                      - text: "30"
                    - text: ","
                    - link "Reference 31" [ref=e242] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR31
                      - text: "31"
                  - text: .
                - generic [ref=e243]:
                  - generic [ref=e244]: $$\:M=\left(S,A,T,R\right)$$
                  - generic [ref=e245]: (1)
                - paragraph [ref=e246]: "Where \\(\\:S\\) is the number of finite states, \\(\\:A\\) is a set of possible actions, \\(\\:T\\left(s,{s}^{{\\prime\\:}}\\right)={T}_{r}({s}_{t+1}={s}^{{\\prime\\:}}|{s}_{t}=s,{a}_{t}=a)\\) is the transition probability that action \\(\\:a\\) takes for state \\(\\:s\\) at time \\(\\:t\\) that will forward to state \\(\\:{s}^{{\\prime\\:}}\\) at time \\(\\:t+1\\), and \\(\\:R(s,{s}^{{\\prime\\:}})\\) is the possible reward value after the transition between state \\(\\:s\\) to state \\(\\:{s}^{{\\prime\\:}}\\) because of action \\(\\:a\\)."
                - paragraph [ref=e247]:
                  - text: "To enable MRs to avoid obstacles and navigate safely in previously unknown complex environments, we developed an RL-based regional planner that translates acquired sensory information directly to robotic behaviors. Also, we divide the MR exploration strategies into three different parts: planning, mapping, and decision. Thus, as each component acts independently from the others, we can create the planning techniques for various MRs using a single decision segment. The MR’s abilities to navigate effectively in a familiar area without requiring any training are guaranteed by the planning algorithms. Utilizing conventional navigation techniques, the decision section concentrates on an effective exploration approach. Figure"
                  - link "2" [ref=e248] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig2
                  - text: "depicts the interaction between all three parts that compose the exploratory architecture. The decision element gets information from the mapping element and forwards it through the planning element. The complete MR exploration technique is divided into subsections in the following ways:"
                - figure "Fig. 2" [ref=e250]:
                  - generic [ref=e252]: Fig. 2
                  - generic [ref=e253]:
