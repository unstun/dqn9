                          - text: "15"
                      - text: .
                - paragraph [ref=e319]: The MR can navigate through the environment and avoid obstacles while achieving its goal on time in this study. Now, we explain the objective function and DRL for the proposed technique in detail.
                - heading "Objective function" [level=3] [ref=e320]
                - paragraph [ref=e321]:
                  - text: When exploring the area, MR is meant to take the shortest route possible to conserve battery life. Next, we provide the subsequent objective function in Eq. (
