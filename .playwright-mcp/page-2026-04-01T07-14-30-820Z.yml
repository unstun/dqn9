                      - text: "20"
                  - text: ":"
                - generic [ref=e268]:
                  - generic [ref=e269]: "$$\\Gamma _{{t:t + T}} = f_{{plan}} \\left( {l_{{0:t}} ,g,m_{t} } \\right)$$"
                  - generic [ref=e270]: (2)
                - paragraph [ref=e271]: "Where the planning trajectory is denoted by \\(\\Gamma _{{t:t + T}}\\), \\(\\:{f}_{plan}\\) is the planning function, positions of MR from time 0 to t are denoted by \\(\\:{l}_{0:t}\\), the target point is denoted by \\(\\:g\\), and \\(\\:{m}_{t}\\) is the map created in the environment at time t."
                - paragraph [ref=e272]: Local planning and global planning techniques are two of the most extensively studied frameworks for several strategies that carry out the planning function. For turning the route into a trajectory and modifying it according to the real-time data collected from sensors, the objective of this research is to find the shortest route over the map between the current location and the target location.
                - heading "Mapping strategy" [level=3] [ref=e273]
                - paragraph [ref=e274]:
                  - text: The mapping section, which is additionally referred to as simultaneous localization and mapping (SLAM), generates the MR position and environment mapping at every moment by systematically processing the sensor data. The SLAM function is expressed as in Eq. (
                  - link "3" [ref=e275] [cursor=pointer]:
