                  - text: ":"
                - generic [ref=e335]:
                  - generic [ref=e336]: "$$E\\left( m \\right) = - \\sum\\limits_{i} {\\sum\\limits_{j} {p\\left( {m_{{i,j}} } \\right)logp\\left( {m_{{i,j}} } \\right)} }$$"
                  - generic [ref=e337]: (6)
                - paragraph [ref=e338]: "There are three states that can occur on every grid in the map: occupied, free, and uncertain. This objective function assesses the constructed map’s uncertainty. The proposed DRL technique used for this study is explained in subsection A; the strategy of action space and state space for the experiment is explained in subsection B; and the proposed model is illustrated in subsection C of this section."
                - heading "Mobile robot learning" [level=3] [ref=e339]
                - paragraph [ref=e340]:
                  - text: A standard robotics issue with multispectral applications across many industries is MR navigation. Numerous industries, including healthcare, robotics, smart surveillance systems, human-computer interfaces, and several more, employ human activity recognition extensively
                  - superscript [ref=e341]:
                    - link "Reference 34" [ref=e342] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR34
                      - text: "34"
                    - text: ","
                    - link "Reference 35" [ref=e343] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR35
                      - text: "35"
                  - text: ", or RL. Rather than attempting an extensive investigation for a space this vast, we just address the issue of indoor navigation. Getting to a target on a collision-free path in the least amount of time is often the goal of navigation. Perhaps the most crucial ability that an autonomous MR must possess is the practice of localization learning, as determining the robot’s position is necessary to decide what to do next. In various mapping-based robot systems of navigation, an environment remains available for the robot since it was originally specified in a metric map. Here, MR learns its surroundings using the RL algorithm using DQN and Double Deep Q- Network (DDQN) techniques. RL algorithms enable MR to learn the environment without predefined mapping. Nowadays, most RL-based techniques are used by robotics to perform navigation tasks that establish a mapping link between the control strategy and raw sensor inputs."
                - paragraph [ref=e344]:
                  - text: To learn how to select either discrete or continuous navigation activities for movement utilizing internal sensory input in an area with either a known
                  - superscript [ref=e345]:
                    - link "36" [ref=e346] [cursor=pointer]:
                      - /url: "#ref-CR36"
                    - text: ","
                    - link "37" [ref=e347] [cursor=pointer]:
                      - /url: "#ref-CR37"
                    - text: ","
                    - link "Reference 38" [ref=e348] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR38
                      - text: "38"
                  - text: or unidentified
                  - superscript [ref=e349]:
                    - link "Reference 39" [ref=e350] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR39
                      - text: "39"
                  - text: flat surface, DRL has been the primary learning approach used to teach robots to navigate. However, most of these initiatives concentrate on navigation in stationary environments, making them impractical for most real-life applications as different types of moving items need to be considered.
                - heading "Deep Q-networks" [level=4] [ref=e351]
                - paragraph [ref=e352]:
                  - text: A model-free RL technique called Q-learning is implemented to determine the worth of some action in each situation. It can address issues with stochastic transitioning and reward despite the need for modifications, and it doesn’t demand environment modeling. To simulate the impacts of receptive fields, the DeepMind approach uses a deep convolutional neural network (DCNN) comprising layers of convolutional filtering. The trained network might achieve a level comparable to the level of human beings shortly after playing 49 games, according to research done in 2015 and originally published in Nature by Mnih et al.
                  - superscript [ref=e353]:
                    - link "Reference 16" [ref=e354] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR16
                      - text: "16"
                  - text: . DQN is dependent upon Q-learning, where the action value function is represented by DCNN, and the reward feedback received from the game is responsible for training the network. Gradient descent is used for updating the neural network’s parameters. The DQN’s loss function is indicated in Eq. (
                  - link "7" [ref=e355] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Equ7
                  - text: )
                  - superscript [ref=e356]:
                    - link "Reference 15" [ref=e357] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR15
                      - text: "15"
                  - text: ":"
                - generic [ref=e358]:
                  - generic [ref=e359]: "$$L(\\theta _{i} ) = F\\left[ {\\left( {R + \\lambda \\mathop {max}\\limits_{{A^{\\prime } }} Q\\left( {S^{\\prime } ,A^{\\prime } ;\\theta _{i}^{ - } } \\right) - Q(S,A;\\theta _{i} )} \\right)^{2} } \\right]$$"
                  - generic [ref=e360]: (7)
                - paragraph [ref=e361]: "Where the discount factor is denoted by \\(\\:\\lambda\\:\\)\\(\\:\\in\\:\\left[\\text{0,1}\\right],\\:S\\) is the state, \\(\\:R\\) is the reward, \\(\\:A\\) is the action, \\(\\:{S}^{{\\prime\\:}}={S}_{t+1}\\), \\(\\:{A}^{{\\prime\\:}}={A}_{t+1}\\), and \\(\\theta _{i}\\) is the parameter for the current Q-network \\(Q(S,A;\\theta _{i} )\\) is replicated to \\(\\:{\\theta\\:}_{i}^{-}\\) for the goal Q-network \\(\\:Q\\left({S}^{{\\prime\\:}},{A}^{{\\prime\\:}};{\\theta\\:}_{i}^{-}\\right)\\) at each step of n-time."
                - heading "Double deep Q-networks" [level=4] [ref=e362]
                - paragraph [ref=e363]:
                  - text: Although DQN’s introduction aided in the general adoption of DRL, it has several drawbacks, one of which is that it overestimates the action value function. Van Hasselt et al.
                  - superscript [ref=e364]:
                    - link "Reference 40" [ref=e365] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR40
                      - text: "40"
                  - text: noted that overestimating occurs for the value function whenever the DQN computes the temporal-difference (TD) error and an identical Q network is used to choose actions and compute value functions; therefore, they have suggested the DDQN technique. For the goal Q function, a dual network architecture is used by DDQN, where the goal Q network estimates the specified optimal action and the current Q network is responsible for the selection of optimal action. The action decision and assessment of policy activities are divided into two sets of variables, which lowers the chance of overestimation. The DDQN’s loss function is indicated in Eq. (
                  - link "8" [ref=e366] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Equ8
                  - text: )
                  - superscript [ref=e367]:
                    - link "Reference 15" [ref=e368] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR15
                      - text: "15"
                  - text: ":"
                - generic [ref=e369]:
                  - generic [ref=e370]: "$$L\\left( {\\theta _{i} } \\right) = F\\left[ {\\left( {R + \\lambda Q(S^{\\prime } ,arg\\mathop {max}\\limits_{{A^{\\prime } }} Q\\left( {S^{\\prime } ,A^{\\prime } ;\\theta _{i} ;\\theta _{i}^{ - } } \\right) - Q(S,A;\\theta _{i} )} \\right)^{2} } \\right]$$"
                  - generic [ref=e371]: (8)
                - heading "Reinforcement learning-based navigation" [level=3] [ref=e372]
                - paragraph [ref=e373]:
                  - text: "DL is basically a set of frameworks enabling non-linear function estimations by using DNNs to abstract characteristics that are buried in inputs, which is now frequently employed in the field of robotics, including indoor navigation and robot manipulation. Aerial vehicles, autonomous vehicles, and two- or three-dimensional moving ships are examples of MRs. Finding the best or least undesirable route between the starting point and a destination while avoiding obstacles is the purpose of MR navigation. We have limited our attention to a two-dimensional (2D) space navigation issue with the objective of simplifying this assignment. The mobile robot navigation problem essentially consists of obstacle avoidance and point-to-point (P2P) motion: (1) The target point’s location in relation to the initial location is necessary to complete the P2P assignment"
                  - superscript [ref=e374]:
                    - link "Reference 41" [ref=e375] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR41
                      - text: "41"
                  - text: ", and (2) The three types of obstacles that are susceptible to detection by cameras, ultrasonic sensors, laser rangefinders, and other sensors involve those characterized as static, dynamic, and physically consistent. A hallway or wall are examples of natural environmental structures that are referred to as physically consistent obstacles in this study. These obstacles create an interior or labyrinthine setting. With its significant representation and knowledge-based learning skills, RL has received considerable interest as an alternative solution to the fundamental navigation problem faced by robotics systems"
                  - superscript [ref=e376]:
                    - link "Reference 42" [ref=e377] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR42
                      - text: "42"
                  - text: .
                - paragraph [ref=e378]:
                  - text: When utilizing the DRL technique for autonomy in navigation, the goal is to determine the optimal path of action for directing MR toward its destination by interacting with its surroundings. The conventional navigational system might be merged with or replaced by DRL-based navigation. Because RL utilizes a trial-and-error learning system, it is forbidden for MR to crash into surrounding obstacles during the physical training phase. Before being implemented in an actual MR for navigation and making decisions in real-time, the DNN is often trained in a simulated setting. The mechanism of agent-environment interaction in the DRL-based navigation system is depicted in Fig.
                  - link "3" [ref=e379] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig3
                  - text: . The DRL agent proceeds in the direction of the destination location while preventing dynamic, static, and basic physically constant obstacles. Subsequently substitutes both the localization and map-building modules along with the local route planning section of the standard navigation system. Nonetheless, the agent could encounter a local trap in a setting with excessively complicated, structurally persistent obstacles
                  - superscript [ref=e380]:
                    - link "Reference 43" [ref=e381] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR43
                      - text: "43"
                  - text: . The process of acquisition is continuous, with an agent gaining knowledge of the policy through interactions with its surroundings. Figure
                  - link "4" [ref=e382] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig4
                  - text: illustrates how the agent determines what to do after determining the current situation. After carrying out the decision-made action, it gets feedback—that is, the reward—and monitors the subsequent state to decide on its subsequent course of action.
                - figure "Fig. 4" [ref=e384]:
                  - generic [ref=e386]: Fig. 4
                  - generic [ref=e387]:
                    - generic [ref=e388]:
                      - img "Fig. 4" [ref=e390]
                      - link "Full size image figure 4" [ref=e392] [cursor=pointer]:
                        - /url: /articles/s41598-024-72857-3/figures/4
                        - text: Full size image
                        - img [ref=e393]
                    - paragraph [ref=e396]: Relationship between agent, decision, and environment.
                - paragraph [ref=e397]:
                  - text: The global planning of paths section, as seen in Fig.
                  - link "3" [ref=e398] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig3
                  - text: ", creates a sequence of touchpoints that serve as middle objective points for DRL-based navigation, which allows the combined navigational system to do long-range movement into a complicated structural domain. Depending on whether RL employs an explicit policy or not, it might be either active or passive. Only the set policy’s effectiveness is the focus of passive learning. Considering the surroundings are unknown, the agent’s main problem is that it remains unaware of both the transitional model and the reward function. To determine the expected outcome of every state, the agent uses the predefined policy to carry out a series of experiments. Active learning, as opposed to passive learning, also tries to learn how to behave in the environment. The agent needs to comprehend the transition model to be able to identify the best policy because it is ignorant about the surroundings and the policy. The operational scenarios and the RL algorithm’s effectiveness are significantly determined by three essential components, including state space, action space, and reward function, of the DRL-based MR navigational framework."
                - heading "State space" [level=4] [ref=e399]
                - paragraph [ref=e400]: The initial point, objective point, and obstacles are the state-space configurations that are typically implemented. The MR’s initial and target coordinates serve as the initial position and target position representations, respectively. Many studies transform global Cartesian positions into regional polar positions and then define the goal point location using the angle and distance with respect to MR. The state of an obstacle can be expressed as the velocity, location, and dimension of the dynamic obstacles (agent leveling), or it can be expressed as a state of sensor-level through treating sensor information, such as depth camera data, lidar/ultrasonic range data, or monocular camera images. The state space is denoted by S.
                - heading "Action space" [level=4] [ref=e401]
                - paragraph [ref=e402]: There are mainly three types of actions in the DRL based MR navigation, including discrete moving actions (turning left, turning right, moving forward, moving backward, and many more), motor speed commands (the required speed of the right and left motor), and continuous velocity commands (the angular and linear velocity of the MR). The sensor-level states might be used to accomplish end-to-end commands through motor velocity commands, although the corresponding training is substantially more challenging. Proportional-integral-derivative (PID) or equivalent lower-level controllers are often needed to generate control of mobility commands for MR and operate the MR to accomplish the required motion for discrete motions and continuous velocity instructions. The action space is denoted by A. Robots move and change directions by using several components including actuators, control algorithms, and sensors.
                - heading "Reward function" [level=4] [ref=e403]
                - paragraph [ref=e404]: The RL agent is trained to do a task using the reward function. The rewards are given positive or negative only, when MR hitting obstacles or reaching the goal, which means this reward is small. The agent cannot rapidly converge when rewards are few. Most research employs dense reward-shaping techniques to increase training efficiency. A positive reward is always given to MR when it reaches the target and is close to the target point. When an MR reaches or collides with obstacles, it usually gets a negative reward. A time-stepping penalty represents a penalty that MR receives at every step in order to motivate it to travel toward the goal more quickly. The reward function is denoted by R.
            - generic [ref=e406]:
              - heading "Simulation and experimental analysis" [level=2] [ref=e407]
              - generic [ref=e408]:
                - paragraph [ref=e409]:
                  - text: "Researchers are concentrating on autonomous interaction with surroundings and self-learning methodologies, notably on RL systems, to enhance the ability to generalize while preventing manually gathering supervised information. The following is a description of the intended navigation challenge in this article: A mobile robot with scattered regional distance sensors provides all that is needed to go reliably to a goal controlled by constant guidelines over an initially unfamiliar area with broadly dispersed topography, such as lengthy hallways and dead corners. The MR can build an independent environmental model through exploration because, initially, it does not know anything about its surroundings. The dynamic and unpredictable nature of surroundings with dynamic obstacles adds significantly to their complexity. We implement into operation an RL-based regional plan that interprets observable sensory information into activities for secure navigation and avoiding obstacles in dynamic, previously unexplored areas. We add several frequent patterns to the basic RL approaches to allow navigation in complicated situations and improve performance. We also anticipate better navigation performance in more complicated situations, including alleyways, long hallways, and concave regions, because the memory section can think about several sensor perceptions instead of depending only on the present perception. Figure"
                  - link "5" [ref=e410] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig5
                  - text: shows a binary occupancy grid map containing different types of obstacles and the start and target positions for robot path planning., which is used for the simulation to demonstrate the starting and final positions for the navigation of MR.
                - figure "Fig. 5" [ref=e412]:
                  - generic [ref=e414]: Fig. 5
                  - generic [ref=e415]:
                    - generic [ref=e416]:
                      - img "Fig. 5" [ref=e418]
                      - link "Full size image figure 5" [ref=e420] [cursor=pointer]:
                        - /url: /articles/s41598-024-72857-3/figures/5
                        - text: Full size image
                        - img [ref=e421]
                    - paragraph [ref=e424]: Binary occupancy grid map for navigation tasks.
                - paragraph [ref=e425]:
                  - text: The ability for autonomous learning is absent in the conventional robot navigation strategy. MRs must be able to navigate unknown areas independently and avoid static and dynamic obstacles. Navigation is the capacity of the robot to make decisions based on its internal skills and sensor data with the objective of achieving its goal locations as quickly and effectively as feasible, providing a partial understanding of its surroundings and a desired location or set of locations. A virtual robot is used for the simulated environment to carry out the chosen actions at every stage of the episodes. The training process for a neural network can be extrapolated into a dataset of accessible training instances, enabling the acquisition of viable answers for comparable conditions that might not have been observed in demonstrations. To assess this proposed approach, simulation tests are performed. The dimensions of an environmental mapping are 250 m by 250 m. The obstacles are dispersed arbitrarily around the surroundings. The robot’s starting point coordinate is shown on the map as a red triangle, which is located at (10, 10), and the goal location is shown as a green circle, which is located at (240, 240). The robot’s task is to begin at the starting point and choose the best route to take for the purpose of reaching the goal without hitting any obstacles. Table
                  - link "1" [ref=e426] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Tab1
                  - text: illustrates the list of hyperparameters and their descriptions, which are used in this experiment.
                - figure "Table 1 List of hyperparameters." [ref=e428]:
                  - generic [ref=e429]: Table 1 List of hyperparameters.
                  - link "Full size table 1" [ref=e431] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3/tables/1
                    - text: Full size table
                    - img [ref=e432]
                - paragraph [ref=e434]:
                  - text: The robot is sent to perform a navigation task within an unfamiliar and novel environment. The simulation’s primary goal is to produce an ideal Q-value matrix. In contrast to the tests, the robot is initially unaware of the quantity, dimensions, and locations of the obstacles. It is also noticed that, although the pathways the robot selected may not have been the optimal routes since it did not completely understand its surroundings, they were nevertheless perfectly adequate and met standard reference. The algorithm for the navigation of MR based on RL is abbreviated in Table
                  - link "2" [ref=e435] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Tab2
                  - text: .
                - figure "Table 2 Algorithm for navigation based on RL." [ref=e437]:
                  - generic [ref=e438]: Table 2 Algorithm for navigation based on RL.
                  - link "Full size table 2" [ref=e440] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3/tables/2
                    - text: Full size table
                    - img [ref=e441]
                - paragraph [ref=e443]:
                  - text: The process of training an MR involves placing it in several unpredictable scenarios, referred to as episodes. Every episode assumes a distinct goal direction. Every episode uses a variable quantity of obstacles as well. It is considered that some of these obstacles are stationary while others are considered to be dynamic. The more episodes that are utilized to train the robot, the more skilled it will become at maneuvering its dynamic surroundings
                  - superscript [ref=e444]:
                    - link "Reference 44" [ref=e445] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR44
                      - text: "44"
                  - text: . The proposed approach has been developed to operate in simulation environments. We are examining how the pathways differ from one another since they are not the most effective routes. Figure
                  - link "6" [ref=e446] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig6
                  - text: shows four different environments for the navigation of mobile robots, where the starting and goal location is predefined. Blue curved lines represent the normal route for navigation while red curved line represents the optimal or shortest path.
                - figure "Fig. 6" [ref=e448]:
                  - generic [ref=e450]: Fig. 6
                  - generic [ref=e451]:
                    - generic [ref=e452]:
                      - img "Fig. 6" [ref=e454]
                      - link "Full size image figure 6" [ref=e456] [cursor=pointer]:
                        - /url: /articles/s41598-024-72857-3/figures/6
                        - text: Full size image
                        - img [ref=e457]
                    - paragraph [ref=e460]: Illustration of RL-based autonomous navigation results in various scenarios.
                - paragraph [ref=e461]: The suggested system generates a state collection with dynamic variables such that, once it successfully navigates a specific situation, it might be effective within another, wherever the barriers and goals are situated at different positions. How to characterize the reward function—the way the environment reacts to the cognitive agent’s actions—is another criterion for making decisions.
                - paragraph [ref=e462]:
                  - text: The number of successful learning episodes for every 50 episodes is shown in Fig.
                  - link "7" [ref=e463] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig7
                  - text: . This quickly increasing pattern of successful episodes in Fig.
                  - link "7" [ref=e464] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig7
                  - text: with respect to the number of episodes demonstrated that the proposed DRL algorithm improved the robot’s intelligence. An epsilon-greedy algorithm is used in simulation. Figure
                  - link "8" [ref=e465] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig8
                  - text: shows the variance graph for reward and epsilon during simulation. The score of reward and epsilon with respect to the number of episodes has been shown in Fig.
                  - link "8" [ref=e466] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig8
                  - text: .
                - figure "Fig. 7" [ref=e468]:
                  - generic [ref=e470]: Fig. 7
                  - generic [ref=e471]:
                    - generic [ref=e472]:
                      - img "Fig. 7" [ref=e474]
                      - link "Full size image figure 7" [ref=e476] [cursor=pointer]:
                        - /url: /articles/s41598-024-72857-3/figures/7
