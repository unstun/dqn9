                    - paragraph [ref=e480]: Illustration of the number of successful learning episodes in simulation for every 50 episodes.
                - figure "Fig. 8" [ref=e482]:
                  - generic [ref=e484]: Fig. 8
                  - generic [ref=e485]:
                    - generic [ref=e486]:
                      - img "Fig. 8" [ref=e488]
                      - link "Full size image figure 8" [ref=e490] [cursor=pointer]:
                        - /url: /articles/s41598-024-72857-3/figures/8
                        - text: Full size image
                        - img [ref=e491]
                    - paragraph [ref=e494]: Illustration of Reward and Epsilon variance score per episode during simulation.
                - paragraph [ref=e495]:
                  - text: Initially, the simulation carried out for the experimental studies only used the Adam optimizer algorithm. We evaluate the three algorithms various performances using the simulation environment. This is necessary to demonstrate that finite state space algorithms might be an effective choice for robotics and to provide a consistent quantitative assessment of the technique. We compared this approach by using three different optimizers including the Adam optimizer algorithm, SGD optimizer algorithm, and RMSprop optimizer algorithm to validate the proposed technique for 100 episodes. Figure
                  - link "9" [ref=e496] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig9
                  - text: shows an illustration of the reward value comparison between the Adam optimizer, SGD optimizer, and RMSprop optimizer. As shown in Fig.
                  - link "9" [ref=e497] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig9
                  - text: ", the Adam optimizer receives the highest reward during simulation."
                - figure "Fig. 9" [ref=e499]:
                  - generic [ref=e501]: Fig. 9
                  - generic [ref=e502]:
                    - generic [ref=e503]:
                      - img "Fig. 9" [ref=e505]
                      - link "Full size image figure 9" [ref=e507] [cursor=pointer]:
                        - /url: /articles/s41598-024-72857-3/figures/9
                        - text: Full size image
                        - img [ref=e508]
                    - paragraph [ref=e511]: Illustration of comparative graph for reward value when using Adam, SGD, and RMSprop optimizers in simulation.
                - paragraph [ref=e512]:
                  - text: We conducted relevant research and compared the findings with other optimization algorithms to validate the produced RL technique’s better sampling performance, speedy mobility, substantial target-reach success rate, and greater extrapolation with regard to diverse motion situations and surroundings. The proposed algorithm is compared with Proximal Policy Optimization (PPO) to analyze the effectiveness of our approach. PPO is an RL technique that trains the cognitive role of a computer agent or robot to complete challenging tasks
                  - superscript [ref=e513]:
                    - link "Reference 45" [ref=e514] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR45
                      - text: "45"
                  - text: . Figure
                  - link "10" [ref=e515] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig10
                  - text: shows a comparative reward value assessment between the proposed approach algorithm and the PPO algorithm. The Q-learning algorithm approach outperforms the PPO algorithm as shown in the comparative graph.
                - figure "Fig. 10" [ref=e517]:
                  - generic [ref=e519]: Fig. 10
                  - generic [ref=e520]:
                    - generic [ref=e521]:
                      - img "Fig. 10" [ref=e523]
                      - link "Full size image figure 10" [ref=e525] [cursor=pointer]:
                        - /url: /articles/s41598-024-72857-3/figures/10
                        - text: Full size image
                        - img [ref=e526]
                    - paragraph [ref=e529]: Comparison between the reward of the proposed algorithm and the PPO algorithm.
            - generic [ref=e531]:
              - heading "Main contributions of this research" [level=2] [ref=e532]
              - paragraph [ref=e534]: The proposed approach has several advantages when compared with the above techniques. First, it does not require explicit modeling of the environment or the robot’s dynamics. Second, it can adapt to changing environments and tasks without requiring manual tuning of control parameters. Third, it can learn from experience and improve its performance over time. This approach has a higher rate of accuracy compared to the traditional MR control strategy. However, most of the such DRL-based movement control strategies are primarily effective in plain indoor environments. To the best of our knowledge, only some research has successfully controlled MR in an unknown environment. We are presenting an end-to-end mobility control technique based on DRL to make it easier for MR to operate effectively in an unknown and complicated environment to get beyond the constraints of the earlier techniques that were discussed. The proposed approach is carried out in a simulation environment, so there is a possibility of variation in the real-world application scenario. The tracking challenge for non-holonomic robots in unpredictable circumstances with constant control of movement is the primary subject of this research. Our goal is to present a DRL method that can quickly and safely navigate through complicated settings while also having excellent training and adaptation capacity across different settings and robotic systems.
            - generic [ref=e536]:
              - heading "Conclusion and future perspectives" [level=2] [ref=e537]
              - generic [ref=e538]:
                - paragraph [ref=e539]: For continuous-state problems, sampling every possible solution is impractical, and in the absence of a specific instructor, RL algorithms are the preferred method in supervised learning for the DL domain. This paper presents a comprehensive methodology for DRL-based regional plan training and deployment in extremely complex and dynamic contexts for the navigation of MR. We have tested the proposed autonomous navigation approach for four different environmental settings, where each environment contains different obstacles shapes, and positions. The optimal path while avoiding obstacles between the start point to the goal point has been explored in the simulation. In conclusion, our approach shows promising results for intelligent MR control using DRL. In this approach, to carry out its collision-free navigation, the MR is using the DRL to gather background information about its surroundings from the sensor data. The proposed technique has been validated by using the Adam optimizer and a comparative analysis has been carried out using three different optimizers including Adam, SGD, and RMSprop optimizers. The proposed approach is a very simple but effective simulation system that demonstrated quick and effective training rates as well as the ability to transmit the frameworks to the actual robot. The outcomes demonstrated an apparent increase in the dependability and safety of navigating in complicated surroundings, but at the expense of effectiveness due to an extended exploration phase. Simulations demonstrated the effectiveness of our complete learning framework, as there is a significant likelihood that the robot might be able to navigate freely in an unfamiliar area.
                - paragraph [ref=e540]: The proposed approach has been delivered promising outcomes, it can continue to be improved to improve its learning and performance rate. To enhance the learning approach and raise the rate of accuracy of completely autonomous navigation in an unfamiliar environment, the reward function can be modified in future studies. The experiment carried out in this study is in a simulation environment, so the outcomes can be slightly different in the real-world implementation. Future work will focus on applying our approach to real-world MR systems and evaluating their performance in various applications.
