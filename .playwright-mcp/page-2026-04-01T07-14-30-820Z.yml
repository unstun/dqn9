                      - text: "20"
                  - text: ":"
                - generic [ref=e325]:
                  - generic [ref=e326]: "$$Z(\\hat{m},y_{{t = 0:T}} ) = D(y_{{t = 0:T}} ) + \\mathop {min}\\limits_{{u_{{t = 0:T}} }} \\left\\| {m - \\hat{m}} \\right\\|^{2}$$"
                  - generic [ref=e327]: (5)
                - paragraph [ref=e328]: "Where the real map is \\(\\:m\\), the estimation map is \\(\\:\\widehat{m}\\), and \\(\\:D\\left(\\right)\\) is the distance between the starting point to the target point."
                - paragraph [ref=e329]:
                  - text: However, it is challenging to regulate the objective function and determine an optimal approach because the real map is unavailable because of the unknown surroundings. Our utilization of the occupancy grid map to depict the environment is motivated by the application of the Shannon entropy during the estimation of the exploration
                  - superscript [ref=e330]:
                    - link "Reference 33" [ref=e331] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR33
                      - text: "33"
                  - text: ". The cross-grid occupied probability is \\(\\:p\\left({m}_{i,j}\\right)\\) for column \\(\\:i\\) and row j. The mapping entropy is expressed in Eq. ("
                  - link "6" [ref=e332] [cursor=pointer]:
