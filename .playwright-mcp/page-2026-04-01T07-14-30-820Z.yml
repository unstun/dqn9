                        - text: Full size image
                        - img [ref=e259]
                    - paragraph [ref=e262]: Relationship between planning, mapping, and decision.
                - heading "Planning strategy" [level=3] [ref=e263]
                - paragraph [ref=e264]:
                  - text: Finding a plausible path from the present location to the desired location is the main objective of this section. The planning strategy is abbreviated as Eq. (
                  - link "2" [ref=e265] [cursor=pointer]:
