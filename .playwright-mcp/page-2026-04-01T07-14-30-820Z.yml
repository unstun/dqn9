              - heading "Introduction" [level=2] [ref=e140]
              - generic [ref=e141]:
                - paragraph [ref=e142]:
                  - text: As Artificial Intelligence (AI) technology rapidly advances, MRs are evolving and becoming more proficient at performing tasks that were previously too complex and hard, including space exploration, heavy-weight carriage, security, and many more. By integrating AI and robotics, robots might become intelligent and autonomous, performing tasks without assistance from humans
                  - superscript [ref=e143]:
                    - link "Reference 1" [ref=e144] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR1
                      - text: "1"
                  - text: . MRs are becoming more proficient by virtue of AI technology and can be employed in a wide range of domains, including defense, freight, infrastructure development and inspection, postal delivery, security, healthcare, customer support, and more. MR utilizes the sensors along with additional technologies to recognize its surroundings and execute its assigned assignment
                  - superscript [ref=e145]:
                    - link "Reference 2" [ref=e146] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR2
                      - text: "2"
                  - text: . The diversity of fundamental problems, which extend from difficult computational challenges to others that are exceptionally logical, is certainly among the most significant and fascinating features of MRs that allow them to solve these problems easily
                  - superscript [ref=e147]:
                    - link "Reference 3" [ref=e148] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR3
                      - text: "3"
                  - text: ". To complete a predetermined work, the MR generally goes through three phases: perception (sensing), path planning and synthesis (process), and motion (action). Finding the optimal routes to reach the target while avoiding obstacles is an important step in the navigation of MRs"
                  - superscript [ref=e149]:
                    - link "Reference 4" [ref=e150] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR4
                      - text: "4"
                  - text: . For a navigational system, one of the most important factors is determining how long and how much energy a robotic device needs to travel a given course
                  - superscript [ref=e151]:
                    - link "Reference 5" [ref=e152] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR5
                      - text: "5"
                    - text: ","
                    - link "Reference 6" [ref=e153] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR6
                      - text: "6"
                  - text: . Since artificial intelligence (AI) approaches are accurate for generating findings, numerous researchers are employing them to automate the trajectory formulation method
                  - superscript [ref=e154]:
                    - link "Reference 7" [ref=e155] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR7
                      - text: "7"
                  - text: . One of the most challenging areas of robot development continues to be path modeling. One of the main driving forces behind the analysis and study of mobile robots is the algorithm’s broad range of applications and the complex nature of its design and development
                  - superscript [ref=e156]:
                    - link "Reference 8" [ref=e157] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR8
                      - text: "8"
                  - text: . For researchers, the most important part of the development of MRs for implementation in the real world is how they operate in tropical environments.
                - paragraph [ref=e158]:
                  - text: The capability of autonomous learning is not present in the conventional MR navigation technique. MRs must be able to navigate unknown areas autonomously while avoiding both static and moving obstacles. Classical and heuristic approaches are both utilized for developing the operating technique of MRs. Traditional approaches can become tiresome and may stop producing the best results whenever environments become more complex. Nowadays, researchers choose heuristic methods more and more because of the extent to which they imitate the way humans acquire behavior
                  - superscript [ref=e159]:
                    - link "Reference 9" [ref=e160] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR9
                      - text: "9"
                  - text: . Among the most well-known heuristic methods is reinforcement learning (RL), which is often used in MR navigation. The observed rotation angle around obstacles is refined using the RL-based controller
                  - superscript [ref=e161]:
                    - link "Reference 10" [ref=e162] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR10
                      - text: "10"
                  - text: . The RL approach allows MR to identify the route based on past behavior. The MR, additionally known to be an agent, recognizes the environment, makes a choice, and gets rewarded or penalized in accordance with the environment, allowing the successful use of the RL approach. Whenever the MR ultimately receives a higher reward, it subsequently modifies its technique, and the agent might acquire various behavioral patterns through the development of an extensive number of rules
                  - superscript [ref=e163]:
                    - link "Reference 11" [ref=e164] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR11
                      - text: "11"
                  - text: .
                - paragraph [ref=e165]:
                  - text: RL has received interest from researchers for being able to overcome the fundamental navigation challenges faced by MRs, because of its powerful illustration and capacity for learning from experience. Experts have developed two distinct learning techniques, including Monte Carlo and Temporal-Difference (TD) learning because full flexibility of data and substantial use of memory are essential in programming with variables that aren’t feasible. The Bellman equations and the Markov decision process (MDP), among other concepts, were integrated with TD learning to create the Q-learning approach in
                  - superscript [ref=e166]:
                    - link "Reference 12" [ref=e167] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR12
                      - text: "12"
                  - text: . After that, the RL technique made immense advancements, and RL concepts are implemented in a range of real-world problems, especially MR navigation. Due to its strong visualizations and flexibility over experiences-based Q-learning, RL has attracted a lot of attention for its ability to overcome the fundamental navigation difficulty encountered by MRs. When mobile robots are used in crowded circumstances, they must be able to move safely and interact socially amid people and different barriers
                  - superscript [ref=e168]:
                    - link "Reference 13" [ref=e169] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR13
                      - text: "13"
                  - text: . Some of the key issues with deep learning in robots are that it does not ensure the reliability or accuracy of a learned policy, which presents an additional barrier to learning-based collision prevention
                  - superscript [ref=e170]:
                    - link "Reference 14" [ref=e171] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR14
                      - text: "14"
                  - text: Since it is challenging to produce training data for physical robots in an efficient and secure way, and due to the quantity and quality of the training data acquired has a significant impact on robot learning efficiency, the collision-avoidance policy used in this study is trained via simulations instead of in the real environment.
                - paragraph [ref=e172]:
                  - text: As seen in Fig.
                  - link "1" [ref=e173] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Fig1
                  - text: ", the conventional navigation strategy maps an unknown region using simultaneous localization and mapping (SLAM), determines MRs present location using an orientation localization technique, and employs a path planning mechanism to navigate it to its target. The conventional navigational framework’s inability to control an unfamiliar and unpredictable setting stems from its reliance on high-precision global mapping, which is highly sensitive to sensor noise. The designated complexity of multimodal situations constitutes a challenge for the traditional DRL approach, where the computation stress increases substantially as the diversity of inputs rises. Through the training process of a deep neural network (DNN), the deep learning (DL) approach models functions that are nonlinear while learning the underlying rules and characteristics of the original data. Deep reinforcement learning (DRL) has been generated by fusing RL with a DNN. The traditional navigation method is currently being supplemented or replaced in several experiments by DRL-based MR navigation. Professionals from across the world have worked to find a solution to the navigation challenge for the last 20 years. Integrating many distinct techniques is a widely utilized method."
                - figure "Fig. 1" [ref=e175]:
                  - generic [ref=e177]: Fig. 1
                  - generic [ref=e178]:
                    - generic [ref=e179]:
                      - img "Fig. 1" [ref=e181]
                      - link "Full size image figure 1" [ref=e183] [cursor=pointer]:
                        - /url: /articles/s41598-024-72857-3/figures/1
                        - text: Full size image
                        - img [ref=e184]
                    - paragraph [ref=e187]:
                      - text: Illustration of the MR navigation using traditional technique, based on
                      - superscript [ref=e188]:
                        - link "Reference 15" [ref=e189] [cursor=pointer]:
                          - /url: /articles/s41598-024-72857-3#ref-CR15
                          - text: "15"
                      - text: .
                - paragraph [ref=e190]:
                  - text: The phenomenal modeling capabilities of deep neural networks and the robust interaction, exploration, and self-learning features of RL have led to the widespread use of deep learning, particularly DRL-based techniques, enabling map-free navigation in recent times. In DRL, the agent automatically explores the surroundings by trial and error and then adapts the action based on the rewards received. Therefore, regardless of previous experience, including maps, autonomous navigation might be conducted with DRL. Deep Q-network (DQN), introduced by
                  - superscript [ref=e191]:
                    - link "Reference 16" [ref=e192] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR16
                      - text: "16"
                  - text: ", is an early method to integrate DL with DRL, and while it considerably increases the practical skills of DRL, the actions taken by this technique are only discrete. In"
                  - superscript [ref=e193]:
                    - link "Reference 17" [ref=e194] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR17
                      - text: "17"
                  - text: ", a novel learning framework for DRL is suggested that drastically reduces the time of training. This study is enhancing the capability of visual navigation with a camera-equipped robot. The navigation difficulties can be separated into multiple manageably simple assignments using a distributed training strategy using the DRL that is proposed in"
                  - superscript [ref=e195]:
                    - link "Reference 18" [ref=e196] [cursor=pointer]:
                      - /url: /articles/s41598-024-72857-3#ref-CR18
                      - text: "18"
                  - text: to ensure the robot might successfully navigate in a substantial and complicated interior region without requiring the use of a map.
                - paragraph [ref=e197]:
                  - text: "The remaining article is divided into the following ways: Section “"
                  - link "Literature survey" [ref=e198] [cursor=pointer]:
                    - /url: /articles/s41598-024-72857-3#Sec2
                  - text: ” contains a literature survey; Section “
                  - link "Background information" [ref=e199] [cursor=pointer]:
