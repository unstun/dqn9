                              - generic [ref=e315]: ϵ
                        - text: ", leading the performance to heavily rely on the size of"
                        - generic [ref=e316]:
                          - generic [ref=e322]: 𝜖
                          - math [ref=e324]:
                            - generic [ref=e326]: ϵ
                        - text: . Furthermore, the
                        - generic [ref=e327]:
                          - generic [ref=e333]: 𝜖
                          - math [ref=e335]:
                            - generic [ref=e337]: ϵ
                        - text: "-greedy algorithm selects the optimal action based on the current maximum Q-value at each time step, ignoring opportunities to explore other unknown actions, meaning that it may fall into a local optimal solution and fail to discover the global optimal solution. Although the DDQN can alleviate the overestimation problem to a certain extent, in mobile robot autonomous navigation problems, states typically exhibit a strong correlation. There still exists the potential for overestimation in certain actions because the Q-values of different actions may be highly similar, making it difficult to accurately estimate their differences. In this case, the network may overestimate the values of certain actions, leading to unstable learning."
                      - generic [ref=e338]:
                        - text: To solve the aforementioned problems and propose an efficient mapless autonomous navigation algorithm for mobile robots with high accuracy in both static and dynamic environments, this paper introduces a novel variant of the DDQN named prioritized experience replay noisy n-step dueling DDQN (PER-n
                        - subscript [ref=e339]: "2"
                        - text: D
                        - subscript [ref=e340]: "3"
                        - text: QN). As implied by its name, this proposed method incorporates a key enhancement by replacing traditional experience replay with prioritized experience replay (PER), where each experience is assigned a priority based on its significance or informativeness. This prioritization mechanism allows the agent to focus on the experiences that most significantly contribute to its learning objectives, enhancing the sample efficiency [
                        - link "20" [ref=e341] [cursor=pointer]:
                          - /url: "#B20-electronics-13-02423"
                        - text: ","
                        - link "21" [ref=e342] [cursor=pointer]:
                          - /url: "#B21-electronics-13-02423"
                        - text: "]. Furthermore, a noisy network ["
                        - link "22" [ref=e343] [cursor=pointer]:
                          - /url: "#B22-electronics-13-02423"
                        - text: "] with factorized Gaussian noise injected into the parameters of the online network is introduced to solve the exploration limitation in the DDQN, which can automatically adjust the randomness of action selection to find a better balance between exploration and exploitation. Additionally, an n-step temporal difference learning mechanism is adopted to alleviate the estimation error of the target Q-value, moving much closer to the real target Q-value ["
                        - link "23" [ref=e344] [cursor=pointer]:
                          - /url: "#B23-electronics-13-02423"
                        - text: "], coupled with a dueling network structure to further alleviate overestimation issues and improve the stability and accuracy of learning by decomposing the Q-value into a state-value function and an advantage function, allowing the network to better learn the relationship between the state value and action advantage ["
                        - link "24" [ref=e345] [cursor=pointer]:
                          - /url: "#B24-electronics-13-02423"
                        - text: ","
                        - link "25" [ref=e346] [cursor=pointer]:
                          - /url: "#B25-electronics-13-02423"
                        - text: "]."
                      - generic [ref=e347]: "The main contributions of this paper are outlined as follows:"
