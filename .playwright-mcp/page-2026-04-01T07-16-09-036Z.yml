                      - heading "5. Numerical Experiments and Results" [level=2] [ref=e8497]
                      - generic [ref=e8498]:
                        - heading "5.1. Experimental Settings" [level=3] [ref=e8499]
                        - generic [ref=e8500]:
                          - text: To evaluate the performance of the proposed algorithm PER-n
                          - subscript [ref=e8501]: "2"
                          - text: D
                          - subscript [ref=e8502]: "3"
                          - text: QN, we conducted experiments simulating mobile robot navigation tasks across three scenarios using the DQN, DDQN, and PER-n
                          - subscript [ref=e8503]: "2"
                          - text: D
                          - subscript [ref=e8504]: "3"
                          - text: QN methods (the codes are available at
                          - link "https://github.com/iAerialRobo" [ref=e8505] [cursor=pointer]:
                            - /url: https://github.com/iAerialRobo
                          - text: (accessed on 1 January 2024)). The experiments were conducted on a laptop with an 8 GB NVIDIA GTX4060 GPU and 16 GB RAM employing the open-source robot operating system (ROS) [
                          - link "47" [ref=e8506] [cursor=pointer]:
                            - /url: "#B47-electronics-13-02423"
                          - text: ","
                          - link "48" [ref=e8507] [cursor=pointer]:
                            - /url: "#B48-electronics-13-02423"
                          - text: "] and open-source 3D simulator Gazebo ["
                          - link "49" [ref=e8508] [cursor=pointer]:
                            - /url: "#B49-electronics-13-02423"
                          - text: "]. The model is implemented in Python 3.8.10 using PyTorch 1.11, with experiment-specific parameters detailed in"
                          - link "Table 1" [ref=e8509] [cursor=pointer]:
                            - /url: "#table_body_display_electronics-13-02423-t001"
                          - text: .
                        - generic [ref=e8510]:
                          - generic [ref=e8511]: Table 1. Experiment hyper-parameters.
                          - generic [ref=e8513] [cursor=pointer]:
                            - img [ref=e8514]
                            - link [ref=e8515]:
                              - /url: "#table_body_display_electronics-13-02423-t001"
                        - generic [ref=e8516]:
                          - text: The agent employed is the Waffle model of the TurtleBot3 mobile robot, navigating three distinct scenarios depicted in
                          - link "Figure 5" [ref=e8517] [cursor=pointer]:
                            - /url: "#fig_body_display_electronics-13-02423-f005"
                          - text: . In scenario 1, as shown in
                          - link "Figure 5" [ref=e8518] [cursor=pointer]:
                            - /url: "#fig_body_display_electronics-13-02423-f005"
                          - text: a, a static environment with simple obstacles is presented, featuring four cylindrical obstacles around the mobile robot. Furthermore, the area of the entire closed area is 4 × 4 m
                          - superscript [ref=e8519]: "2"
                          - text: ", and the radius of the cylindrical obstacle in the area is 0.15 m. Scenario 2 in"
                          - link "Figure 5" [ref=e8520] [cursor=pointer]:
                            - /url: "#fig_body_display_electronics-13-02423-f005"
                          - text: b retains a static setting but introduces a more complex environment with numerous rectangular obstacles. In addition, the area of the entire closed area is 5 × 5 m
                          - superscript [ref=e8521]: "2"
                          - text: ", and the length of the rectangular obstacle in the area is 1 m, while the width and height are the same as those of the outer wall. Lastly, scenario 3 in"
                          - link "Figure 5" [ref=e8522] [cursor=pointer]:
                            - /url: "#fig_body_display_electronics-13-02423-f005"
                          - text: c incorporates two dynamic cylindrical obstacles with a radius of 0.12 m, moving with a line velocity of 0.5 m/s. In these three scenarios, all the target positions are generated randomly.
                        - generic [ref=e8523]:
                          - generic [ref=e8525] [cursor=pointer]:
                            - img "Electronics 13 02423 g005" [ref=e8526]
                            - link [ref=e8527]:
                              - /url: "#fig_body_display_electronics-13-02423-f005"
                          - generic [ref=e8528]: Figure 5. Static and dynamic simulation scenarios, where the black point represents the mobile robot, and the red square represents the target. (a) Scenario 1 with static obstacles. (b) Scenario 2 with static obstacles. (c) Scenario 3 with dynamic obstacles.
                      - generic [ref=e8529]:
                        - heading "5.2. Quantitative Analysis of Simulation Environment" [level=3] [ref=e8530]
                        - generic [ref=e8531]:
                          - text: In scientific research and engineering design, quantitative analysis provides comprehensive and robust support. To better illustrate the complexity variety between different scenarios in the simulation environment, we projected obstacles onto the X- and Y-axes and quantitatively analyzed environmental complexity based on the proportion of obstacle projections throughout the environment with the removal of the width of the outermost wall. The analysis results are also depicted in
                          - link "Figure 5" [ref=e8532] [cursor=pointer]:
                            - /url: "#fig_body_display_electronics-13-02423-f005"
                          - text: .
                        - generic [ref=e8533]: In scenario 1, the projection distribution of obstacles on the x- and y-axes is relatively sparse, with only two distribution areas with an obstacle, and the maximum projection proportion on the x-axes is only 0.0811 and the same with the y-axes. Additionally, the area of obstacles accounts for 0.516% of the entire simulation environment area. In scenario 2, the projection distribution of obstacles on the x- and y-axes has significantly increased. Furthermore, the maximum projection proportions on the x- and y-axes are 0.2766 and 0.4255, respectively. In addition, the obstacles encompass 5.432% of the total simulation environment area. Scenario 3 adds dynamically moving obstacles based on scenario 2, and we only show the obstacle projection distribution in the initial state. As the positions of dynamic obstacles change, their projected positions on the x- and y-axes change in real time. When calculating the proportion of the obstacle area to the total area, to distinguish the difference between dynamic obstacles and static obstacles, we use the relative value of the linear speed of the dynamic obstacle compared to that of the mobile robot as the weight, and the product of this weight and the area of the dynamic obstacles is used as the final area of the dynamic obstacle. Thus, the obstacles encompass 19.47% of the total simulation environment area. The quantitative analysis of simulation environment complexity allows for a more accurate description of environmental complexity and provides deeper insights into the performance of the three algorithms.
                      - generic [ref=e8534]:
                        - heading "5.3. Results and Discussion" [level=3] [ref=e8535]
                        - generic [ref=e8536]:
                          - text: To assess the performance of the DQN, DDQN, and proposed PER-n
                          - subscript [ref=e8537]: "2"
                          - text: D
                          - subscript [ref=e8538]: "3"
                          - text: QN methods across three scenarios, we analyze the average score (AS) and success rate (SR).
                          - link "Figure 6" [ref=e8539] [cursor=pointer]:
                            - /url: "#fig_body_display_electronics-13-02423-f006"
                          - text: depicts the performance comparison of the three algorithms after 10 training trials in scenario 1, with each trial comprising 1100 episodes.
                          - link "Table 2" [ref=e8540] [cursor=pointer]:
                            - /url: "#table_body_display_electronics-13-02423-t002"
                          - text: details the average reward and success rate statistics. DQN achieves an average score of 828.18 with a standard deviation (SD) of 248.05, and it increases to 1049.51 for the DDQN, coupled with a standard deviation of 198.96. Remarkably, PER-n
                          - subscript [ref=e8541]: "2"
                          - text: D
                          - subscript [ref=e8542]: "3"
                          - text: QN reaches a substantially higher average score of 3384.88 with a standard deviation of 224.69. The average success rate follows a similar trend, improving from 62.74% with a standard deviation of 5.88% for the DQN to 63.92% with a standard deviation of 4.32% for the DDQN and, finally, to 98.91% with a standard deviation of 3.41% for PER-n
                          - subscript [ref=e8543]: "2"
                          - text: D
                          - subscript [ref=e8544]: "3"
                          - text: QN. In this simpler static scenario 1, there is marginal improvement in the average score between the DQN and DDQN, with little difference in the success rate. However, PER-n
                          - subscript [ref=e8545]: "2"
                          - text: D
                          - subscript [ref=e8546]: "3"
                          - text: QN outperforms both the DQN and DDQN significantly in terms of both the average score and success rate.
                        - generic [ref=e8547]:
                          - generic [ref=e8549] [cursor=pointer]:
                            - img "Electronics 13 02423 g006" [ref=e8550]
                            - link [ref=e8551]:
                              - /url: "#fig_body_display_electronics-13-02423-f006"
                          - generic [ref=e8552]: "Figure 6. Experimental results in scenario 1 when trained 1100 episodes (shadowed color: Standard Error). (a) Average score over 10 trials. (b) Average success rate over 10 trials."
                        - generic [ref=e8553]:
                          - generic [ref=e8554]: Table 2. Experimental results when trained for 1100 episodes in scenario 1.
                          - generic [ref=e8556] [cursor=pointer]:
                            - img [ref=e8557]
                            - link [ref=e8558]:
                              - /url: "#table_body_display_electronics-13-02423-t002"
                        - generic [ref=e8559]:
                          - text: Next, we evaluated the performance of the three algorithms in scenario 2, with 1600 episodes per trial and 10 repeated trials.
                          - link "Figure 7" [ref=e8560] [cursor=pointer]:
                            - /url: "#fig_body_display_electronics-13-02423-f007"
                          - text: a and
                          - link "Figure 7" [ref=e8561] [cursor=pointer]:
                            - /url: "#fig_body_display_electronics-13-02423-f007"
                          - text: b, respectively, illustrate the results for the average score and success rate, while
                          - link "Table 3" [ref=e8562] [cursor=pointer]:
                            - /url: "#table_body_display_electronics-13-02423-t003"
                          - text: provides specific statistics. The DQN starts with an average score of −309.56 coupled with a standard deviation of 199.66, and it improves to −209.01 with a standard deviation of 244.97 for the DDQN. In contrast, PER-n
                          - subscript [ref=e8563]: "2"
                          - text: D
                          - subscript [ref=e8564]: "3"
                          - text: QN achieves a substantially increased average score of 2862.23, along with a standard deviation of 236.93. Additionally, the success rate of the DQN is a mere 2.97% with a standard deviation of 2.47%, improving to 15.08% with a standard deviation of 11.21% for the DDQN and eventually reaching 98.32% with a standard deviation of 3.83% for PER-n
                          - subscript [ref=e8565]: "2"
                          - text: D
                          - subscript [ref=e8566]: "3"
                          - text: QN. Similar to scenario 1, the DDQN performs better than the DQN in the more complex static scenario 2. The increment in the average score between the DQN and DDQN is 100.55, and the average success rate improves by 12.11%. However, the DDQN’s accuracy and stability remain relatively low. Conversely, PER-n
                          - subscript [ref=e8567]: "2"
                          - text: D
                          - subscript [ref=e8568]: "3"
                          - text: QN excels in scenario 2 with high accuracy and stability.
