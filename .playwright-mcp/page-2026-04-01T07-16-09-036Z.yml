                          - subscript [ref=e8605]: "3"
                          - text: QN. In dynamic scenario 3, the average score rose by 1068.10%, and the success rate experienced a substantial 934.97% enhancement from the DDQN to PER-n
                          - subscript [ref=e8606]: "2"
                          - text: D
                          - subscript [ref=e8607]: "3"
                          - text: QN. In the detailed performance comparison of the DQN, DDQN, and PER-n
