                          - link "Table 4" [ref=e8584] [cursor=pointer]:
                            - /url: "#table_body_display_electronics-13-02423-t004"
                          - text: . The DQN and DDQN perform poorly in scenario 3. Specifically, the DQN achieves a success rate of only 1.59% with a standard deviation of 0.85%, and the DDQN’s success rate rises to a mere 8.95% with a standard deviation of 4.52%. In contrast, PER-n
                          - subscript [ref=e8585]: "2"
                          - text: D
                          - subscript [ref=e8586]: "3"
                          - text: QN achieves a high average score of 2571.28 with a standard deviation of 108.20 and a success rate of 92.63% with a standard deviation of 0.93%. Although the DDQN outperformed DQN in dynamic scenario 3, with an improvement in the average score of 58.68 and a 7.36% increase in the average success rate, its accuracy and stability still lag behind those in scenario 2. On the other hand, PER-n
                          - subscript [ref=e8587]: "2"
                          - text: D
                          - subscript [ref=e8588]: "3"
                          - text: QN continued to excel in scenario 3, demonstrating high accuracy and stability.
