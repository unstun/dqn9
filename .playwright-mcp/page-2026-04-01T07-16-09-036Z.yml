                    - generic [ref=e8641]:
                      - heading "6. Conclusions" [level=2] [ref=e8642]
                      - generic [ref=e8643]:
                        - text: This paper presents an advanced approach to autonomous navigation for mobile robots termed PER-n
                        - subscript [ref=e8644]: "2"
                        - text: D
                        - subscript [ref=e8645]: "3"
                        - text: QN, which is an extension of the DDQN. It significantly enhances the performance of autonomous navigation, including the average score, path efficiency, and accuracy, by incorporating prioritized experience replay, a noisy network, n-step learning, and a dueling network structure into the DDQN. Furthermore, an effective target-oriented reshaping reward function is employed to expedite learning, coupled with useful techniques, including a target “soft” update and a gradient clipping mechanism, to improve the stability and robustness of learning. These improvements boost the efficiency of experience replay, promote exploration, and deliver a more precise Q-value estimate, thereby significantly enhancing the performance of autonomous navigation for mobile robots. In addition, to further capture the complexity of the simulation environment, this paper presents a comprehensive quantitative analysis of the simulation environment for the first time. Subsequently, to validate the proposed algorithm, we conducted extensive experiments using the DQN, DDQN, and PER-n
                        - subscript [ref=e8646]: "2"
                        - text: D
                        - subscript [ref=e8647]: "3"
                        - text: QN on the ROS and Gazebo platforms for mobile robot autonomous navigation tasks.
                      - generic [ref=e8648]:
                        - text: "The trained models were assessed across three distinct scenarios: two static simulation settings and one dynamic simulation setting. A comparative analysis of performance metrics, including the average reward and success rate, reveals that PER-n"
                        - subscript [ref=e8649]: "2"
                        - text: D
                        - subscript [ref=e8650]: "3"
                        - text: QN exhibits remarkable improvements and enhanced robustness, particularly across all three scenarios. Although the experiment focuses on wheeled robots, this approach can extend to various types of mobile robots, including legged robots and aerial robots, as it learns directly from sensor inputs and does not rely on the type or model of the robots. Future research will delve into autonomous navigation for mobile robots in more complex tasks involving coordination and collaboration among multiple agents to improve traffic flow efficiency and safety and reduce training time.
