                        - heading "4.3. Target-Oriented Reward Function" [level=3] [ref=e7262]
                        - generic [ref=e7263]:
                          - text: In the context of RL, the reward function serves the purpose of guiding the agent to learn the value of different actions with a given state [
                          - link "44" [ref=e7264] [cursor=pointer]:
                            - /url: "#B44-electronics-13-02423"
                          - text: "]. In the domain of autonomous navigation for mobile robots, a straightforward method involves utilizing sparse rewards, where positive rewards are only received by the agent when reaching the goal, while negative rewards are given if it collides with an obstacle. This can result in slower or erratic learning. However, in complicated environments with abundant dense or dynamic obstacles, navigating to the target becomes exceedingly challenging for the mobile robot. Operating in such environments with sparse rewards often leads to the mobile robot becoming disoriented or immobilized. Fortunately, reward shaping provides the agent with a smoother and denser form of non-sparse reward, enabling the agent to receive more intermediate reward signals during task execution. This offers more guidance and expedites the learning process ["
                          - link "45" [ref=e7265] [cursor=pointer]:
                            - /url: "#B45-electronics-13-02423"
                          - text: "]."
                        - generic [ref=e7266]:
                          - text: In this paper, a novel target-oriented reshaping reward function is proposed, which adjusts rewards based on factors like the distance and direction between the robot and the target and the distance between the robot and the obstacles. For instance, if the mobile robot is closer to the target, a higher reward might be given to incentivize the mobile robot to reach the goal more quickly. However, if the mobile robot is closer to the obstacle, it may receive a lower reward as a penalty to prevent it from colliding with the obstacle. This target-oriented reshaping reward function encompasses three scenarios. Firstly, if the minimum distance between the mobile robot and the obstacle is less than
                          - generic [ref=e7267]:
                            - generic [ref=e7273]:
                              - generic [ref=e7274]: 𝑙
                              - generic [ref=e7275]: 𝑎
                            - math [ref=e7276]:
                              - generic [ref=e7278]:
                                - generic [ref=e7279]: l
                                - generic [ref=e7280]: a
                          - text: ", it is deemed a collision, and the agent receives a reward of −500. Secondly, when the current distance between the mobile robot and the target is less than"
                          - generic [ref=e7281]:
                            - generic [ref=e7287]:
                              - generic [ref=e7288]: 𝑙
                              - generic [ref=e7289]: 𝑏
                            - math [ref=e7290]:
                              - generic [ref=e7292]:
                                - generic [ref=e7293]: l
                                - generic [ref=e7294]: b
                          - text: ", the robot is considered to have successfully reached the goal, and the agent is rewarded with 1000 ["
                          - link "46" [ref=e7295] [cursor=pointer]:
                            - /url: "#B46-electronics-13-02423"
                          - text: "]. Otherwise, the reward is the sum of"
                          - generic [ref=e7296]:
                            - generic [ref=e7302]:
