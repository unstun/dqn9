                        - heading "4.2. State Space" [level=3] [ref=e7045]
                        - generic [ref=e7046]:
                          - text: The state represents the environmental information perceived by the agent, directly affecting its decisions during learning. In achieving efficient and collision-free navigation for the mobile robot in complex environments, designing the state space also plays an important role. The DDQN is typically more suitable for discrete state spaces, leveraging Q values within a discrete action space to optimize the policy [
                          - link "42" [ref=e7047] [cursor=pointer]:
                            - /url: "#B42-electronics-13-02423"
                          - text: "]."
                        - generic [ref=e7048]:
                          - text: Our experiments use the Waffle model of the TurtleBot3 mobile robot, a popular open-source platform designed for education, research, and hobbyist use and specifically tailored to work with the robot operating system (ROS). The Waffle model, equipped with sensors, employs a laser beam to detect obstacles in a 360° direction, calculating distances based on the return time and providing a comprehensive view of the surroundings. During robot navigation, the real-time state information is perceived through a LIDAR sensor and an odometer [
                          - link "43" [ref=e7049] [cursor=pointer]:
                            - /url: "#B43-electronics-13-02423"
                          - text: "]. The LIDAR sensor captures distance and heading information between the robot, goal, and obstacles, while the odometer supplies the robot’s position. The efficiency of the algorithm is greatly influenced by the size of the state space. If the state space is too small, the algorithm will have low accuracy. Otherwise, it will take too much more time for training and convergence."
                        - generic [ref=e7050]:
                          - text: After multiple attempts and referencing a related paper [
                          - link "43" [ref=e7051] [cursor=pointer]:
                            - /url: "#B43-electronics-13-02423"
                          - text: "], our implementation utilizes only the distances from the LIDAR sensor at 24 equidistant points, reducing the state space to 28. The state space is defined as"
