                - generic [ref=e235]:
                  - paragraph
                  - generic [ref=e236]:
                    - generic [ref=e237]:
                      - heading "Abstract" [level=2] [ref=e238]
                      - generic [ref=e239]:
                        - text: Effective real-time autonomous navigation for mobile robots in static and dynamic environments has become a challenging and active research topic. Although the simultaneous localization and mapping (SLAM) algorithm offers a solution, it often heavily relies on complex global and local maps, resulting in significant computational demands, slower convergence rates, and prolonged training times. In response to these challenges, this paper presents a novel algorithm called PER-n
                        - subscript [ref=e240]: "2"
                        - text: D
                        - subscript [ref=e241]: "3"
                        - text: QN, which integrates prioritized experience replay, a noisy network with factorized Gaussian noise, n-step learning, and a dueling structure into a double deep Q-network. This combination enhances the efficiency of experience replay, facilitates exploration, and provides more accurate Q-value estimates, thereby significantly improving the performance of autonomous navigation for mobile robots. To further bolster the stability and robustness, meaningful improvements, such as target “soft” updates and the gradient clipping mechanism, are employed. Additionally, a novel and powerful target-oriented reshaping reward function is designed to expedite learning. The proposed model is validated through extensive experiments using the robot operating system (ROS) and Gazebo simulation environment. Furthermore, to more specifically reflect the complexity of the simulation environment, this paper presents a quantitative analysis of the simulation environment. The experimental results demonstrate that PER-n
                        - subscript [ref=e242]: "2"
                        - text: D
                        - subscript [ref=e243]: "3"
                        - text: QN exhibits heightened accuracy, accelerated convergence rates, and enhanced robustness in both static and dynamic scenarios.
                    - generic [ref=e245]:
                      - text: "Keywords:"
                      - link "deep reinforcement learning" [ref=e246] [cursor=pointer]:
                        - /url: /search?q=deep+reinforcement+learning
                      - text: ;
                      - link "double deep Q-network" [ref=e247] [cursor=pointer]:
                        - /url: /search?q=double+deep+Q-network
                      - text: ;
                      - link "dueling network" [ref=e248] [cursor=pointer]:
                        - /url: /search?q=dueling+network
                      - text: ;
                      - link "prioritized experience replay" [ref=e249] [cursor=pointer]:
                        - /url: /search?q=prioritized+experience+replay
                      - text: ;
                      - link "mobile robot navigation" [ref=e250] [cursor=pointer]:
                        - /url: /search?q=mobile+robot+navigation
                  - paragraph
                - generic [ref=e251]:
                  - generic [ref=e252]:
                    - generic [ref=e253]:
                      - heading "1. Introduction" [level=2] [ref=e254]
                      - generic [ref=e255]:
                        - text: Mobile robots play an increasingly crucial role in various aspects of our daily lives and work, including agricultural operations, catering services, medical assistance, military actions, autonomous driving, etc. The successful execution of tasks in these applications hinges on the mobile robots’ adept navigation through static or dynamic environments, coupled with collision avoidance [
                        - link "1" [ref=e256] [cursor=pointer]:
                          - /url: "#B1-electronics-13-02423"
                        - text: ","
                        - link "2" [ref=e257] [cursor=pointer]:
                          - /url: "#B2-electronics-13-02423"
                        - text: "]. Effective navigation requires mobile robots to accurately sense and respond to their surroundings, especially in dynamic settings, where robots confront evolving terrains, dynamic obstacles, and unforeseen scenarios, necessitating the capability to explore and learn to proficiently adapt to changing environments."
                      - generic [ref=e258]:
                        - text: Simultaneous localization and mapping (SLAM) has emerged as a solution, integrating the mobile robot’s position and environmental state data from sensors to construct precise local and global maps for autonomous navigation [
                        - link "3" [ref=e259] [cursor=pointer]:
                          - /url: "#B3-electronics-13-02423"
                        - text: "]. However, this process relies on costly sensors and manual examinations to guarantee that the produced maps satisfy the required standards for path planning and localization, which may hamper its efficiency by consuming time, resources, and computational power ["
                        - link "4" [ref=e260] [cursor=pointer]:
                          - /url: "#B4-electronics-13-02423"
                        - text: ","
                        - link "5" [ref=e261] [cursor=pointer]:
                          - /url: "#B5-electronics-13-02423"
                        - text: "]. Recently, visual SLAM has been used for robot navigation, relying on a visual camera to capture environmental images and calculate the robot’s position and direction. Nevertheless, its susceptibility to external factors, such as light, humidity, temperature variations, and dust, coupled with computational demands in complex environments, raises concerns about accuracy and performance ["
                        - link "6" [ref=e262] [cursor=pointer]:
                          - /url: "#B6-electronics-13-02423"
                        - text: "]."
                      - generic [ref=e263]:
                        - text: In response, deep reinforcement learning (DRL) was proposed and has gained prominence in autonomous navigation [
                        - link "7" [ref=e264] [cursor=pointer]:
                          - /url: "#B7-electronics-13-02423"
                        - text: "]. This paradigm introduces an innovative approach to decision-making from raw sensor inputs in diverse environments through the fusion of deep learning (DL) and reinforcement learning (RL). On the one hand, DRL leverages DL’s success in high-dimensional information analysis, especially in image analysis, speech recognition, and natural language processing, which has yielded a spectrum of supervised and unsupervised DL algorithms tailored for the movement of mobile robots ["
                        - link "8" [ref=e265] [cursor=pointer]:
                          - /url: "#B8-electronics-13-02423"
                        - text: "]. Such algorithms have proven effective in tasks like path planning and navigation ["
                        - link "9" [ref=e266] [cursor=pointer]:
                          - /url: "#B9-electronics-13-02423"
                        - text: "]. On the other hand, DRL harnesses the efficacy of RL in addressing challenges in sequential decision-making ["
                        - link "10" [ref=e267] [cursor=pointer]:
                          - /url: "#B10-electronics-13-02423"
                        - text: "]. This empowers the agent to gradually learn optimal decision strategies to maximize cumulative rewards or achieve specific goals through interactions with its environment ["
                        - link "11" [ref=e268] [cursor=pointer]:
                          - /url: "#B11-electronics-13-02423"
                        - text: ","
                        - link "12" [ref=e269] [cursor=pointer]:
                          - /url: "#B12-electronics-13-02423"
                        - text: "]."
                      - generic [ref=e270]:
                        - text: As an end-to-end DRL algorithm, the deep Q-Network (DQN) was introduced [
                        - link "13" [ref=e271] [cursor=pointer]:
                          - /url: "#B13-electronics-13-02423"
                        - text: "], and its success in learning policies from high-dimensional inputs was demonstrated. To enhance learning efficiency and stability, the algorithm utilizes an experience replay buffer to store and reuse previous experiences. Additionally, a secondary target network is introduced to address issues of oscillation and divergence during the learning process. Despite the DQN’s success in diverse applications and its widespread use in autonomous navigation ["
                        - link "14" [ref=e272] [cursor=pointer]:
                          - /url: "#B14-electronics-13-02423"
                        - text: ","
                        - link "15" [ref=e273] [cursor=pointer]:
                          - /url: "#B15-electronics-13-02423"
                        - text: "], it has some drawbacks, notably action value overestimation derived from Q-learning updates. This overestimation arises because the action with the highest value in the Q-network is usually selected in the next state, and the same Q-network is used to select actions and calculate action values. This approach can lead to overestimation issues, as it does not consider the possibility of estimation errors. To address this issue, the double deep Q-network (DDQN) was proposed ["
                        - link "16" [ref=e274] [cursor=pointer]:
                          - /url: "#B16-electronics-13-02423"
                        - text: "], utilizing two distinct Q-networks for action selection and value estimation to prevent overestimation. Meanwhile, DDQN finds applications in training mobile robots for tasks like optimal navigation and obstacle avoidance ["
                        - link "17" [ref=e275] [cursor=pointer]:
                          - /url: "#B17-electronics-13-02423"
                        - text: ","
                        - link "18" [ref=e276] [cursor=pointer]:
                          - /url: "#B18-electronics-13-02423"
                        - text: "]."
                      - generic [ref=e277]:
                        - text: This research initially used the DQN algorithm to solve autonomous navigation for mobile robots. Although the accuracy can reach over 95% in open and enclosed simulation environments, with the increase in obstacles, the accuracy with the original DQN algorithm is very low. Then, the DDQN algorithm was utilized to enhance the accuracy, but the performance improvement was still minor. On the other hand, the rainbow DDQN with multiple improvement techniques has greatly improved the performance of the DDQN in Atari games [
                        - link "19" [ref=e278] [cursor=pointer]:
                          - /url: "#B19-electronics-13-02423"
                        - text: "] with high-dimensional, complex state and action spaces. However, autonomous navigation for mobile robots may have relatively low-dimensional state and action spaces, but it requires a fast response with a low computational load. The rainbow DDQN may be overly complex and inefficient for our purpose and may also increase the difficulty of implementation and parameter adjustment. More importantly, the rainbow DDQN may require more computational resources and training time, which might be challenging in resource-constrained environments or scenarios requiring rapid iteration."
                      - generic [ref=e279]:
                        - text: In autonomous navigation problems for mobile robots, there is usually a high correlation between states. However, the traditional experience replay method in the DDQN randomly samples with equal probability, ignoring the importance of different samples, thus leading to a long training time and making it difficult to converge. Additionally, in the DDQN algorithm, the agent adopts an
                        - generic [ref=e280]:
                          - generic [ref=e286]: 𝜖
                          - math [ref=e288]:
