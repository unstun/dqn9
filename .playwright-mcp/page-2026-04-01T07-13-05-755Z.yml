                        - generic [ref=e3843]:
                          - heading "5.2.2. For the Gazebo Simulation Environments (E-2 and E-3)" [level=4] [ref=e3844]
                          - generic [ref=e3845]:
                            - text: In the test environments E-2 and E-3, there were six and seven selected navigation points, respectively. The robot’s task was to independently explore these unfamiliar environments, commencing its movement from the initial point O. In the case of E-2, the robot’s path encompassed positions A through F, followed by a return to the final goal position A, all achieved without encountering collisions. Similarly, for E-3, the robot’s trajectory comprised positions A to G, followed by a return to the final goal position A, while ensuring collision-free movement, as illustrated in
                            - link "Figure 9" [ref=e3846] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-24-01523-f009"
                            - text: . The local planner needs to be robust in handling both static and dynamic obstacles. It can utilize sensor data effectively to detect and react to dynamic obstacles. During planning, the global planner considers both static obstacles (from the map) and the current state of dynamic obstacles (from the Lidar sensor of the Turtlebot3 robot) to generate the target sequence. The local planner continuously monitors the environment E-3 for changes in dynamic obstacles and adapts its path accordingly which involves replanning the path if an obstacle suddenly appears on the planned trajectory. For example, in
                            - link "Figure 9" [ref=e3847] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-24-01523-f009"
                            - text: b, a dynamic obstacle blocks the path between points F and G; the local planner detects this obstruction and replans a new collision-free path to reach the next goal point. The global path remains the same, but the local planner dynamically adjusts the specific motions to handle changes in the environment such as moving obstacles.
                          - generic [ref=e3848]:
                            - generic [ref=e3850] [cursor=pointer]:
                              - img "Sensors 24 01523 g009" [ref=e3851]
                              - link [ref=e3852]:
                                - /url: "#fig_body_display_sensors-24-01523-f009"
                            - generic [ref=e3853]: "Figure 9. Generated path for the proposed PMR-Dueling DQN algorithm: (a) In environment E-2 which only contains static obstacles. The trajectory of the robot consisted of positions A to F, ultimately returning to the final destination at position A; (b) In environment E-3 which contains both static and dynamic obstacles. The robot followed a path that included positions A to G, and then returned to the final goal position A."
                          - generic [ref=e3854]:
                            - text: In order to verify the efficiency of the proposed PMR-Dueling DQN algorithm, we conducted comparative experimentation in both Gazebo simulation environments. The cumulative rewards of each algorithm for the agent are shown in two separate figures, one for each environment.
                            - link "Figure 10" [ref=e3855] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-24-01523-f010"
                            - text: shows the cumulative rewards for each algorithm in environment E-2, and
                            - link "Figure 11" [ref=e3856] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-24-01523-f011"
                            - text: shows the cumulative rewards for each algorithm in environment E-3.
                            - link "Figure 12" [ref=e3857] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-24-01523-f012"
                            - text: ", compares the average rewards of the four algorithms for each environment. As shown in the figures, in the less complex environment E-2, the PMR-Dueling DQN algorithm again clearly outperforms the other algorithms, converging to a significantly higher reward of 1400 compared to 200 for Q-learning, 600 for DQN, and 1100 for DDQN. The performance gap is even more substantial in the more complex E-3 environment, with the PMR-Dueling DQN achieving a reward of 1200 versus much lower rewards of 400, 700, and 900 for Q-learning, DQN, and DDQN, respectively. The consistent superior performance of the PMR-Dueling DQN across both environments demonstrates its ability to learn optimal policies more efficiently. The simplicity of Q-learning limits its performance, while DQN and DDQN show improvements but are still outclassed by the proposed PMR-Dueling DQN’s ability to leverage dueling architecture and Prioritized Experience Replay for sample efficient learning."
