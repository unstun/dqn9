                    - generic [ref=e3897]:
                      - heading "6. Conclusions" [level=2] [ref=e3898]
                      - generic [ref=e3899]: This work demonstrated how deep reinforcement learning combined with novel network design, experience replay, and reward shaping can greatly enhance the performance of mobile robot path planning. These developments are used by the proposed PMR-Dueling DQN algorithm which significantly outperforms conventional Q-learning, DQN, and DDQN techniques in both grid world and Gazebo simulation environments. The higher sampling efficiency, stability, and final policy quality of the PMR-Dueling DQN have been highlighted in evaluations conducted in both a grid world and a realistic Gazebo simulation environment. Compared to sparse binary rewards, the shaped Reward function offers a rich training signal to facilitate faster convergence. Dueling architecture, conversely, separates state and action representations to enable more precise value learning. This is further complemented by Prioritized Experience Replay, which concentrates training on the most informative transitions. This study verifies efficiency in high-fidelity Gazebo environments, bridging the gap between simulation and reality.
                      - generic [ref=e3900]: While results are promising for simulated settings, further research is needed to evaluate performance in real-world environments with physical robot platforms. A logical next phase of research involves extending the evaluation of our proposed PMR-Dueling DQN approach to physical robots operating in real-world environments. While the simulation environments provide valuable initial development spaces, real-world dynamics and uncertainty will further challenge the generalization capabilities. By deploying onto platforms equipped with sensors for perceiving trajectories and obstacles, such as the Turtlebot with LIDAR and RGB-D cameras, we can rigorously benchmark real-time planning performance across diverse navigation tasks. Success across office building traversals and in outdoor terrain would demonstrate the robustness of the methodology to complex spaces. Transitioning to real-world autonomous navigation remains the ultimate milestone in progressing from simulation. This effort to address interactive dynamics and partial observability would strengthen the proposed technique’s capabilities and maturity towards impactful applications.
