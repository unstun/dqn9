                        - heading "3.3. Prioritized Experience Replay" [level=3] [ref=e1160]
                        - generic [ref=e1161]: The agent’s experiences including both successful and failed attempts are recorded during interaction with the environment and stored in the experience replay unit for training purposes. These events are recorded in the playback unit as they happen throughout the learning process. Replaying these incidents enables the agent to learn from both good and bad actions, enabling it to continuously improve its behavior. Using the recorded experiences, the agent gains an understanding of the effects of various actions and can make adjustments to enhance performance over time. Prioritized Experience Replay chooses events from the replay buffer based on their assigned priority rather than sampling events at random. Based on these preferences, it prioritizes experiences and probabilistically samples them. By emphasizing more important events, Prioritized Experience Replay has the potential to enhance learning effectiveness when compared to random sampling in experience replay.
                        - generic [ref=e1162]:
                          - text: However, the significance of various experience samples varies. Given that the experience replay unit is constantly updated with new samples, selecting a small number of samples using uniform random sampling as the model’s input could lead to inadequate utilization or even the overwriting of important data. The model’s training effectiveness suffers as a result. To increase the success rate of model training, this work uses the Prioritized Experience Replay technique [
                          - link "41" [ref=e1163] [cursor=pointer]:
                            - /url: "#B41-sensors-24-01523"
                          - text: "]. With this tactic, choosing samples from the experience replay unit is prioritized, improving the likelihood of receiving samples with more significance. This increases the effectiveness of the training process, ensuring that meaningful experience samples contribute more significantly to the model’s learning and overall performance."
                        - generic [ref=e1164]:
                          - text: Each replayed event’s TD error is calculated again during the learning process, and the priority of the experiences is adjusted by the new TD error. As shown in Equation (
                          - link "6" [ref=e1165] [cursor=pointer]:
                            - /url: "#FD6-sensors-24-01523"
                          - text: ), it uses a proportional prioritization method to decide how important experience is. The small positive integer
                          - generic [ref=e1166]:
