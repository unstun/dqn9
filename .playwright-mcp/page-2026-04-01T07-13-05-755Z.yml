                        - heading "4.3. Network Structure" [level=3] [ref=e1875]
                        - generic [ref=e1876]: The Tensorflow library was used due to its open-source nature and ability to offer versatile machine-learning tools. Its API enables the building of models and applications with an adjustable architecture. Keras was used to program the network layers, reducing the amount of code needed to construct control systems.
                        - generic [ref=e1877]:
                          - text: The network model architecture shown in
                          - link "Figure 5" [ref=e1878] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-24-01523-f005"
                          - text: is planned in a step-by-step fashion. The network consists of an input layer implementing a dense ReLU activation to accept the state representation input data. This feeds into two convolutional layers which extract spatial features from the input states. The output is then flattened into a 1D vector and split into separate advantage and value streams. Both the advantage stream and the value stream contain dense layers with ReLU activation to estimate the advantage function and value function, respectively. After the final advantage and value functions are combined by the aggregation layer, it is then passed to a linear activated output layer representing the Q-value for each possible action in the given input state. Using a linear output activation allows the network to predict Q-values unconstrained to any range.
                        - generic [ref=e1879]:
