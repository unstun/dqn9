                            - text: also displays the same quantitative evaluation comparison across the four reinforcement learning algorithms but under the more complex environment E-3, which contains both static and dynamic obstacles. The performance of all four algorithms decreases with the inclusion of dynamic obstacles. However, it still shows that the PMR-Dueling DQN has the highest success rate compared to the other three methods with a 38.1% improvement in success rate compared to the DDQN algorithm, a 47.0% improvement over the DQN algorithm, and a 58.2% higher success rate than the Q-learning algorithm. The convergence speeds of the four algorithms on a particular task are also presented in
