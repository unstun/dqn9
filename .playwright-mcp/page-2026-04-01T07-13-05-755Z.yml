                          - text: "]. Thus, we employ a deep dueling algorithm ["
                          - link "14" [ref=e887] [cursor=pointer]:
                            - /url: "#B14-sensors-24-01523"
                          - text: "] introduced by Google DeepMind in 2016, combined with a shaped Reward function and Prioritized Experience Replay to further optimize convergence for this system. The key innovation making deep dueling superior is its neural network architecture. For many states, estimating action values is unnecessary when the choice of those actions does not impact what happens next ["
                          - link "29" [ref=e888] [cursor=pointer]:
                            - /url: "#B29-sensors-24-01523"
                          - text: "]. The deep dueling architecture addresses this by separately learning state values and action advantages, rather than direct action values. This avoids wasted computation on inconsequential actions, accelerating training. Our use of deep dueling is motivated by its potential to mitigate overestimation and more quickly converge to optimal Q-values based on this improved neural network structure. Rather than directly estimating the action-value (Q) function, the deep dueling algorithm splits the neural network into two separate streams of fully connected layers. One stream estimates state value"
