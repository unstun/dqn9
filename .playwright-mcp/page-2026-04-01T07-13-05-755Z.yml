                        - heading "3.1. Deep Q-Network (DQN)" [level=3] [ref=e639]
                        - generic [ref=e640]: DQN improves reinforcement learning by utilizing deep neural networks to solve complicated problems with high-dimensional states. The deep neural network’s primary job is to estimate the action value function, allowing the calculation of Q-values for all available actions in each state. The approximation function, designated as Q(S,a;), considers the current state, represented as S, and an action from the action space, denoted as a. The network weights, indicated by w, are critical in determining the approximation’s accuracy. The DQN algorithm can find the action with the highest Q-value in a given state by employing the deep neural network. This procedure guarantees that the agent makes accurate decisions according to the estimated values of various actions. Iterative training updates the network’s weights, w, allowing for continuous improvement in Q-value approximation. As a result, the agent trains to maximize its behavior by selecting actions that correlate to the highest Q-value in the current state.
                        - generic [ref=e641]:
                          - text: Generally, the DQN method applies deep learning to tackle reinforcement learning problems involving complex and continuous state and action spaces. It builds a value network and a loss function, with the loss function measuring the difference between the network’s anticipated and desired values [
                          - link "40" [ref=e642] [cursor=pointer]:
                            - /url: "#B40-sensors-24-01523"
                          - text: "]. The objective is to minimize this disparity by adjusting the network’s parameters. Training the Q-network requires the use of labeled samples. Equation ("
                          - link "2" [ref=e643] [cursor=pointer]:
                            - /url: "#FD2-sensors-24-01523"
                          - text: ) represents the modification of the Q-learning algorithm, which is the core of DQN.
