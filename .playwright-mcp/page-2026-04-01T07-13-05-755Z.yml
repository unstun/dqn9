                  - paragraph
                - generic [ref=e260]:
                  - generic [ref=e261]:
                    - generic [ref=e262]:
                      - heading "1. Introduction" [level=2] [ref=e263]
                      - generic [ref=e264]:
                        - text: In recent decades, mobile robots have been utilized across various domains, such as the military, industry, and security, to perform vital unmanned tasks. A key challenge in enabling effective navigation for mobile robots in complex environments is path planning [
                        - link "1" [ref=e265] [cursor=pointer]:
                          - /url: "#B1-sensors-24-01523"
                        - text: "]. The principal goal of path planning is to identify the optimal trajectory between a robot’s initial and desired end positions. While there are typically multiple feasible paths to choose from, the best path is selected based on criteria such as minimum distance, path quality, energy efficiency, or, most commonly, the shortest distance and time ["
                        - link "2" [ref=e266] [cursor=pointer]:
                          - /url: "#B2-sensors-24-01523"
                        - text: "]. The development of high-performance path-planning techniques has been crucial to allowing mobile robots to determine optimal routes amidst obstacles and avoid unnecessary detours."
                      - generic [ref=e267]:
                        - text: In the area of mobile robot path planning, effective algorithms play a crucial role by considering factors such as path length and traversal time to optimize point-to-point routes. Recent years have witnessed a notable transformation driven by the application of deep reinforcement learning (DRL) algorithms and the widespread adoption of artificial intelligence in this domain. This shift has given rise to intelligent, flexible, and dynamic path-planning processes for mobile robots. The incorporation of AI and DRL has introduced several advantages, including the automation of path planning, the establishment of interconnected cyber-physical systems, and the continuous exchange of real-time data facilitated by cloud computing. This integration has led to the development of machine learning-based control algorithms, elevating the capabilities of mobile robot path planning in diverse applications such as manufacturing processes [
                        - link "3" [ref=e268] [cursor=pointer]:
                          - /url: "#B3-sensors-24-01523"
                        - text: "]."
                      - generic [ref=e269]:
                        - text: "Path planning is generally divided into two categories: local path planning and global path planning ["
                        - link "4" [ref=e270] [cursor=pointer]:
                          - /url: "#B4-sensors-24-01523"
                        - text: "]. Global path planning requires full knowledge of the environment in advance in order to pre-compute a collision-free path connecting the origin and destination prior to execution. Complete environmental information is needed upfront. Consequently, the main objective of global path planning is to create the environment and subsequently optimize the path ["
                        - link "5" [ref=e271] [cursor=pointer]:
                          - /url: "#B5-sensors-24-01523"
                        - text: "]. In contrast, local path planning can handle unknown or partially known environments. Also called reactive methods, local techniques are used for navigating unfamiliar spaces where there is significant uncertainty. Local path planning requires that the robots gather data and information from their surroundings throughout the whole process, which requires the robots to be prepared with learning abilities. Local planners dynamically react in real time based on sensor feedback rather than relying on pre-mapped routes. In practical applications, it is common to employ a hybrid approach that combines both local and global planning methods because ensuring the reliability of global path planning becomes challenging in dynamic and complex environments when these approaches are employed. Global planning is typically updated at a lower frequency, considering the broader environment, while local planning is updated more frequently, responding to each new action the agent takes. A well-known example is the Move Base function package in the Robot Operating System (ROS). This hybrid strategy allows for efficient and adaptable navigation, leveraging the advantages of both global and local planning techniques."
                      - generic [ref=e272]:
                        - text: In recent years, rapid advances in reinforcement learning have created new potential for addressing the long-standing challenge of path planning for mobile robots [
                        - link "6" [ref=e273] [cursor=pointer]:
                          - /url: "#B6-sensors-24-01523"
                        - text: "]. As both reinforcement learning theory and practical algorithms continue to evolve at a rapid pace, applying modern reinforcement learning techniques to robot path planning problems has become an active and promising research area for tackling these challenges. This is because reinforcement learning does not require prior knowledge of complex environmental models, instead enabling agents to learn competent behavior through direct interaction with their surroundings and feedback in the form of reward signals. This makes reinforcement learning a highly appealing approach for robot path planning applications. Reinforcement learning has been successfully utilized across a diverse array of domains, including autonomous vehicle control ["
                        - link "7" [ref=e274] [cursor=pointer]:
                          - /url: "#B7-sensors-24-01523"
                        - text: "], advanced robotics ["
                        - link "8" [ref=e275] [cursor=pointer]:
                          - /url: "#B8-sensors-24-01523"
                        - text: ","
                        - link "9" [ref=e276] [cursor=pointer]:
                          - /url: "#B9-sensors-24-01523"
                        - text: "], and, critically, mobile robot path planning ["
                        - link "10" [ref=e277] [cursor=pointer]:
                          - /url: "#B10-sensors-24-01523"
                        - text: "]. In reinforcement learning, agents learn optimal behavior purely from experience by interacting with their environment and observing the associated perspectives and reward outcomes, eventually converging on learned value functions that allow maximally rewarding performance ["
                        - link "11" [ref=e278] [cursor=pointer]:
                          - /url: "#B11-sensors-24-01523"
                        - text: "]. A key advantage is that reinforcement learning agents can acquire skills in rarely visited sections of state space that may lack human-provided examples ["
                        - link "12" [ref=e279] [cursor=pointer]:
                          - /url: "#B12-sensors-24-01523"
                        - text: "]. However, while traditional Q-learning algorithms have shown promise for path planning, their slow convergence hinders effectiveness in addressing large-scale, complex real-world problems ["
                        - link "13" [ref=e280] [cursor=pointer]:
                          - /url: "#B13-sensors-24-01523"
                        - text: "]. To tackle this issue, in this work, we used the Dueling Deep Q-Network introduced by ["
                        - link "14" [ref=e281] [cursor=pointer]:
                          - /url: "#B14-sensors-24-01523"
                        - text: "] with the shaped Rewards and Prioritized Experience Replay (PMR-Dueling DQN) approach. By incorporating a shaped Reward function that takes into consideration target proximity, trajectory smoothing, and obstacle avoidance at each step, this method goes beyond traditional feedback signals. The algorithm’s performance in difficult navigation settings is greatly enhanced by the refined training signal that is the consequence of rigorous design and adaptation of each of the environmental aspects. We conducted a comparative analysis against the standard Q-learning, DQN, and DDQN approaches for global path planning in the grid map environment, as well as for both global and local path planning in the Gazebo simulation environment. Our evaluations across the grid world and Gazebo simulation environments with mobile agents show that the PMR-Dueling DQN algorithm outperforms the others in terms of average rewards accumulated, steps taken, and path lengths traversed."
                      - generic [ref=e282]: "In general, this paper has the following key contributions:"
                      - list [ref=e284]:
                        - listitem [ref=e285]:
                          - generic [ref=e286]: The PMR-Dueling DQN method for mobile robot path planning in complex and dynamic situations is used to address the problems of instability and slow convergence seen in the DQN algorithm. To achieve superior performance in terms of convergence speed, stability, and path planning performance, the algorithm integrates deep neural networks, dueling architecture, Prioritized Experience Replay, and shaped Rewards.
                        - listitem [ref=e287]:
                          - generic [ref=e288]: A more realistic Gazebo simulation setting is used in addition to the traditional grid map. The physical simulation platform, called Gazebo, bridges the gap between the real and virtual environments by offering a simplified model of the environment that is quite similar to the real one. This method guarantees the agent’s learned methods apply to actual robotic environments.
                        - listitem [ref=e289]:
                          - generic [ref=e290]: To address the influence of obstacles, a shaped Reward function is built for each environment model, contributing to the enhancement of the planning path and a boost in the convergence speed of the algorithm by incorporating obstacle avoidance and the distance metrics to the target position. This improvement aims to strike a balance between steering clear of obstacles and progressing toward the target, enabling the robot to devise a path that avoids the area of obstacles which addresses challenges associated with sparse reward problems.
                        - listitem [ref=e291]:
                          - generic [ref=e292]: A comparative analysis is conducted, wherein we evaluate the efficiency of our proposed method by comparing it with traditional Q-learning and other deep reinforcement learning (DRL) algorithms.
                      - generic [ref=e293]:
