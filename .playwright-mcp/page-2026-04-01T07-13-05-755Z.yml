                        - link "Section 2" [ref=e294] [cursor=pointer]:
                          - /url: "#sec2-sensors-24-01523"
                        - text: ","
                        - link "Section 3" [ref=e295] [cursor=pointer]:
                          - /url: "#sec3-sensors-24-01523"
                        - text: ", and"
                        - link "Section 4" [ref=e296] [cursor=pointer]:
                          - /url: "#sec4-sensors-24-01523"
                        - text: ", we introduce related work, the theoretical foundation, and the methodology, respectively. We conduct simulation experiments and analyze the results in"
                        - link "Section 5" [ref=e297] [cursor=pointer]:
                          - /url: "#sec5-sensors-24-01523"
                        - text: . In the final section,
                        - link "Section 6" [ref=e298] [cursor=pointer]:
                          - /url: "#sec6-sensors-24-01523"
                        - text: ", we summarize the work of this paper."
                    - generic [ref=e299]:
                      - heading "2. Related Work" [level=2] [ref=e300]
                      - generic [ref=e301]:
                        - text: Over the years, various conventional global planning techniques have been developed. Dijkstra’s approach [
                        - link "15" [ref=e302] [cursor=pointer]:
                          - /url: "#B15-sensors-24-01523"
                        - text: "] selects the node closest to the start and yields the shortest path but has a high computational cost compared to BFS and A* ["
                        - link "16" [ref=e303] [cursor=pointer]:
                          - /url: "#B16-sensors-24-01523"
                        - text: "]. The probabilistic roadmap (PRM) method ["
                        - link "17" [ref=e304] [cursor=pointer]:
                          - /url: "#B17-sensors-24-01523"
                        - text: "] utilizes graph search to discretize continuous space for algorithms such as A* search. The PRM is widely used for its ability to find short paths efficiently. The rapidly exploring random trees (RRT) approach ["
                        - link "18" [ref=e305] [cursor=pointer]:
                          - /url: "#B18-sensors-24-01523"
                        - text: "] can construct real-time paths and handle high-dimensional spaces well but may achieve inferior path optimality versus Dijkstra or the PRM."
                      - generic [ref=e306]:
                        - text: Reinforcement learning has made major advances in robot planning recently. Ref. [
                        - link "19" [ref=e307] [cursor=pointer]:
                          - /url: "#B19-sensors-24-01523"
                        - text: "] developed multiple Q-networks for grid-based tasks, while ["
                        - link "20" [ref=e308] [cursor=pointer]:
                          - /url: "#B20-sensors-24-01523"
                        - text: "] improved Q-learning convergence for grid path planning. However, Q-learning has limitations as the environment grows, needing prolonged computation for Q-value updates and larger memory matrices. Learned matrices may also be suboptimal. To address this, Ref. ["
                        - link "21" [ref=e309] [cursor=pointer]:
                          - /url: "#B21-sensors-24-01523"
                        - text: "] integrated a metaheuristic into Q-learning to reduce optimal solution search times. Ref. ["
                        - link "22" [ref=e310] [cursor=pointer]:
                          - /url: "#B22-sensors-24-01523"
                        - text: "] proposed a heuristic RL method that selects strategies by incorporating cost functions and heuristics. Adding cost learning balances rewards and costs in RL, validated on robot path planning problems. Backward Q-learning ["
                        - link "23" [ref=e311] [cursor=pointer]:
                          - /url: "#B23-sensors-24-01523"
                        - text: "] combines Q-learning and Sarsa for faster convergence in various systems. Ref. ["
                        - link "24" [ref=e312] [cursor=pointer]:
                          - /url: "#B24-sensors-24-01523"
                        - text: "] combined Q-learning and neural networks to efficiently handle dynamic and static obstacles for robot navigation. By presetting speeds, their technique simplifies time-critical applications. Evaluations showed positive results. Ref. ["
                        - link "25" [ref=e313] [cursor=pointer]:
                          - /url: "#B25-sensors-24-01523"
                        - text: "] integrated Q-learning and differential evolution in a memetic algorithm, enhancing multi-robot navigation performance versus GA, PSO, and differential evolution."
                      - generic [ref=e314]:
                        - text: Recently, the use of deep reinforcement learning (DRL) algorithms as the fundamental control [
                        - link "26" [ref=e315] [cursor=pointer]:
                          - /url: "#B26-sensors-24-01523"
                        - text: "], navigation ["
                        - link "27" [ref=e316] [cursor=pointer]:
                          - /url: "#B27-sensors-24-01523"
                        - text: "], localization ["
                        - link "28" [ref=e317] [cursor=pointer]:
                          - /url: "#B28-sensors-24-01523"
                        - text: "], and planning ["
                        - link "29" [ref=e318] [cursor=pointer]:
                          - /url: "#B29-sensors-24-01523"
                        - text: "] systems has gained popularity. The flexibility of artificial neural networks, along with the capacity to simulate, train, and utilize them as end-to-end solutions, has garnered interest from the research community. This has motivated efforts to integrate these advancements from DRL into robotics applications. The adaptability of neural networks paired with the ability to train them through simulation makes them well suited for serving as comprehensive systems for various robot functions. RL decision making and neural network fitting are combined for planning in specific environments ["
                        - link "30" [ref=e319] [cursor=pointer]:
                          - /url: "#B30-sensors-24-01523"
                        - text: "]. However, these methods have limitations such as dimensionality issues in complex spaces, slow convergence, and lack of portability ["
                        - link "31" [ref=e320] [cursor=pointer]:
                          - /url: "#B31-sensors-24-01523"
                        - text: "]. To address these issues, Ref. ["
                        - link "32" [ref=e321] [cursor=pointer]:
                          - /url: "#B32-sensors-24-01523"
                        - text: "] introduced the Improved Dueling Deep Double Q-Network (ID3QN) algorithm tailored for nuclear environments. This algorithm, leveraging an asymmetric neural network structure and a priority experience replay mechanism, addressed overestimation issues prevalent in traditional DQN algorithms. However, while excelling in radioactive grid scenarios, it might lack adaptability across varied complex environments and might not prioritize real-time obstacle avoidance. In ["
                        - link "33" [ref=e322] [cursor=pointer]:
                          - /url: "#B33-sensors-24-01523"
                        - text: "], a novel algorithm integrating reinforcement learning with the Deep Q-Network (DQN) aimed to empower agents for real-time decision making and trajectory planning in Gazebo simulations. However, this approach, while promoting exploration, might overlook real-time obstacle avoidance during trajectory planning, potentially limiting its effectiveness in dynamic environments."
                      - generic [ref=e323]:
                        - text: To address the overestimation issue in DQN, various improved algorithms have been proposed, such as Double DQN (DDQN) by [
                        - link "34" [ref=e324] [cursor=pointer]:
                          - /url: "#B34-sensors-24-01523"
                        - text: "], which uses two networks to estimate the value of actions to reduce overestimation. Exploratory Noise DQN (EN-DQN) by ["
                        - link "35" [ref=e325] [cursor=pointer]:
                          - /url: "#B35-sensors-24-01523"
                        - text: "] adds noise during action selection and uses recurrent neural networks to capture multi-step changes affecting decision making. The competitive network method by ["
                        - link "36" [ref=e326] [cursor=pointer]:
                          - /url: "#B36-sensors-24-01523"
                        - text: "] balances Q-value updates in the online and target networks to mitigate reward bias. The dynamic fusion DDQN by ["
                        - link "37" [ref=e327] [cursor=pointer]:
                          - /url: "#B37-sensors-24-01523"
                        - text: "] incorporates prior knowledge into network training and adjusts weights to reduce overestimation. While these enhancements have improved DQN performance to some degree, issues remain with slow convergence and ineffective training. Employing only camera images, a method proposed by ["
                        - link "38" [ref=e328] [cursor=pointer]:
                          - /url: "#B38-sensors-24-01523"
                        - text: "] used a Double Deep Q-Network (DDQN) algorithm with discrete actions to navigate an environment and successfully avoid obstacles. Although this method works well in some situations, its use of discrete actions affects performance in dense or complex environments, and its reward function avoids challenges with local minima. Similarly, Ref. ["
                        - link "39" [ref=e329] [cursor=pointer]:
                          - /url: "#B39-sensors-24-01523"
                        - text: "] used a DDQN algorithm with discrete actions for navigation, rewarding objective achievement and collision avoidance based on distance. However, this approach requires the grid map occupancy as input, increasing runtime computational expenses. In contrast, our proposed approach prioritizes the design of a structured reward function that encompasses domain-specific objectives, including goal attainment, path smoothing, and obstacle avoidance. This is achieved while employing a comprehensive strategy that combines dueling architecture and Prioritized Experience Replay with shaped Rewards."
                      - generic [ref=e330]: The PMR-Dueling DQN method directly addresses the sample efficiency limitation. Prioritized Experience Replay then prioritizes experiences based on their importance, which makes sure that rare and crucial experiences are used efficiently during learning. The combination also addresses the limitation of adaptability. Dueling DQN allows the agent to quickly adapt its decision-making process to changes in the environment by focusing on learning state and action values independently. We utilize neural networks instead of Q-tables and experience replay to improve learning while reducing data correlations. Extensive simulations demonstrate the technique is effective in efficient path planning. The PMR-Dueling DQN appears to effectively address robot path planning problems. This algorithm showcases robust performance across diverse scenarios. We purposely design a shaped Reward system that is in line with planning goals, compared to a naive signal. By incorporating smoothness, obstacles, and progress-rich elements inside the optimum reward, policies are guided to overcome persistent poor local convergences in starting point schemes. Basically, the carefully shaped reinforcement signal operates as the crucial driving force for quickly learning safe, effective navigation methods. Our method addresses statistical inefficiencies that limit deep reinforcement learning for robot planning by developing rewards specifically designed for navigation dynamics tasks. With its shaped Rewards prioritizing obstacle avoidance and navigation, could offer improved real-time decision-making capabilities and mitigate overestimation issues.
                    - generic [ref=e331]:
