                      - heading "4. Methodology" [level=2] [ref=e1303]
                      - generic [ref=e1304]:
                        - text: In this section, the framework of the proposed Dueling Deep Q-Network with shaped Rewards and Prioritized Experience Replay (PMR-Dueling DQN) is described in detail with the design of the respective reward function. The path planning system for the mobile robot depicted in
                        - link "Figure 2" [ref=e1305] [cursor=pointer]:
                          - /url: "#fig_body_display_sensors-24-01523-f002"
                        - text: "is an enhanced Dueling DQN (PMR-Dueling DQN) system that prioritizes experience replay. To replace the traditional Q-table, we use a dueling network in our solution. To give the agent more information when choosing which actions to perform, the network learns two distinct representations of the state-action value function: the state value and the advantage. In comparison, the action advantage function correlates with the action and signifies the average perceived merit of the action concerning the state. It effectively addresses the reward-bias issue. With this competitive network structure, the agent can grasp a more authentic value V(s) reflective of the environmental state, devoid of any action-related influence ["
                        - link "14" [ref=e1306] [cursor=pointer]:
                          - /url: "#B14-sensors-24-01523"
                        - text: "]. While Dueling DQN provides an architectural modification to improve state value estimates, it does not fully address the underlying challenge of reward sparsity in complex tasks. In scenarios where local information is restricted, the presence of sparse and delayed rewards poses substantial challenges in the area of robotic navigation. For example, a reward structure that only acknowledges the agent upon goal attainment or penalizes collisions with obstacles can lead to various issues. In certain situations, a trained policy might exhibit movements toward the goal and actions in the opposite direction to navigate around obstacles, effectively trapping the agent at a local minimum within the environment. Additionally, acquiring effective escape strategies may necessitate exposure to a diverse set of scenarios."
                      - generic [ref=e1307]:
                        - generic [ref=e1309] [cursor=pointer]:
                          - img "Sensors 24 01523 g002" [ref=e1310]
                          - link [ref=e1311]:
                            - /url: "#fig_body_display_sensors-24-01523-f002"
                        - generic [ref=e1312]: Figure 2. The proposed algorithm’s framework.
                      - generic [ref=e1313]:
                        - text: To address this, a shaped Reward function r is introduced in
                        - link "Section 4.4" [ref=e1314] [cursor=pointer]:
                          - /url: "#sec4dot4-sensors-24-01523"
                        - text: to mitigate the limitations inherent in Dueling DQN’s improvements by offering a more structured and guided learning process. Specifically, instead of only giving a large reward for completing the entire task, intermediate rewards are introduced to reinforce incremental progress. This encourages the agent to adopt intermediate strategies, minimizing the risk of being stuck at a local minimum. By incorporating this shaped Reward function, the model receives targeted feedback, influencing the learning dynamics to emphasize crucial aspects that the network might overlook. Q(S, a) indicates the approximation function used, where S represents the current state and a represents the action inside the action space. As a result, in a given state, the action having the highest possible Q value is chosen as the optimal choice for the robot.
                      - generic [ref=e1315]:
                        - heading "4.1. Simulation Environments and Setup" [level=3] [ref=e1316]
                        - generic [ref=e1317]: "In order to verify the effectiveness of the proposed algorithm, we conducted a comparative experiment in three training environments, which are a virtual 25 by 25 grid obstacle environment and two Gazebo simulation environments named E-1, E-2, and E-3, respectively. The two Gazebo simulation environments that resemble a real-world environment are: (1) an environment with static obstacles and (2) an environment that contains both static and dynamic obstacles. We used the Turtlebot3 robot featured by Gazebo as a platform for testing in simulation environments."
                        - generic [ref=e1318]:
                          - text: A Python built-in standard library called Tkinter was used to build a GUI environmental model E-1. There is a 25 by 25 grid obstacle environment for this experiment. The white line around the outside of
                          - link "Figure 3" [ref=e1319] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-24-01523-f003"
                          - text: a represents the boundary, while the green line within the whole map represents the grid. The inside gray surface depicts areas of the map that are free of obstacles, whereas the red surface symbolizes difficulties. The beginning position in the obstacle environment is in the upper left corner (1,1), while the target point is in green, towards the bottom right corner (19,21). The obstacle environment developed consists of 51 static obstacles of the same size that are positioned on the map by the coordinates of two diagonal points according to the Tkinter toolkit. The agent is represented by the black circle drawn inside the agent’s location, and the mapping environment in the code can be customized by modifying the grid coordinates.
                        - generic [ref=e1320]:
                          - generic [ref=e1322] [cursor=pointer]:
                            - img "Sensors 24 01523 g003" [ref=e1323]
                            - link [ref=e1324]:
                              - /url: "#fig_body_display_sensors-24-01523-f003"
                          - generic [ref=e1325]: "Figure 3. Simulation Environments: (a) a 25 × 25 grid map; (b) Gazebo environment with static obstacles; and (c) Gazebo environment that contains both static and dynamic obstacles."
                        - generic [ref=e1326]:
                          - text: As shown in
                          - link "Figure 3" [ref=e1327] [cursor=pointer]:
                            - /url: "#fig_body_display_sensors-24-01523-f003"
                          - text: b,c, environment E-2 features four stationary cylindrical obstacles, while environment E-3 presents a more complicated setting with brown objects serving as static obstacles and two white cylinders positioned at the environment’s corners, serving as mobile obstacles. In both E-2 and E-3, a Turtlebot3 equipped with a laser range sensor operates as the robotic platform. A red rectangle object denotes the target. Throughout the training phase, the robot’s initial pose is set as the geometric center of the training environment’s floor. The target’s placement occurs randomly in positions devoid of obstacles within the environment. This experimental setup facilitates the investigation of the robot’s ability to navigate through diverse environments, dealing with static and dynamic obstacles. The selection of the Turtlebot3 platform and the specific range of the laser sensor contribute to a comprehensive evaluation of the proposed algorithm in varying scenarios, thereby enhancing the robustness and effectiveness of the algorithm’s path-planning capabilities. The total number of episodes in the simulation experiment is set to 3000 in the grid map environment E-1 and 1000 in the two Gazebo simulation environments E-2 and E-3. An episode is terminated after the agent either reaches the goal or collides with an obstacle. The training concludes when the agent’s average reward reaches a satisfactory and consistent level. The model used in this work was trained using the software and hardware specifications outlined in
                          - link "Table 1" [ref=e1328] [cursor=pointer]:
                            - /url: "#table_body_display_sensors-24-01523-t001"
                          - text: . The algorithm was implemented in Python 3.7 using TensorFlow as the backend for Keras to define the neural network architecture. Leveraging TensorFlow allowed the model to take advantage of GPU acceleration during training.
