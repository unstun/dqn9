                          - text: In contrast, the Gazebo simulation environments (E-2 and E-3) included a more dynamic state representation that contained the Turtlebot3 robot’s pose, information from the laser range sensor about the distances of obstacles in different directions, the coordinates and properties of both stationary and moving obstacles and the target position’s distance from the obstacle. Seven Lidar points are properly configured in the Gazebo simulation. The given value strikes a balance between the inputs required by the control system and the use of computational resources. Through careful selection of the Lidar points, the control system can maintain computational efficiency while obtaining pertinent environmental data. With this complete understanding of its surroundings, the control system may make use of the state information to assess the environment, identify any obstacles, and map out the best routes around them. The Lidar sensor’s precise and comprehensive perception significantly enhances the robot’s overall performance and makes it possible for it to safely and effectively navigate challenging environments. These state variables were carefully chosen to provide relevant environmental signals to the reinforcement learning agent so that it could make decisions and avoid obstacles in the simulated environments. The laser scanner covers a detection range of angle
