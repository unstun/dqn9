                            - text: is divided into intervals of 100 episodes each, and, for each interval, the average Q-value for each algorithm is displayed as a grouped bar. This visual representation offers insights into how these algorithms perform over time and how their Q-values evolve during training. The bar graphs show that the PMR-Dueling DQN achieves significantly higher maximum average Q-values compared to the other algorithms in both environments. In E-2, it obtains a max Q-value of 6.75 versus 2 for Q-learning, 2.8 for DQN, and 4.36 for DDQN. The advantage is even more substantial in E-3, with the PMR-Dueling DQN reaching 4.34 while Q-learning, DQN, and DDQN only achieve 0.66, 1.39, and 2.03, respectively. The consistently higher Q-values indicate the PMR-Dueling DQN’s superior ability to approximate the optimal action-value function. This leads to more informed action selection and, in turn, better rewards, as evidenced by the reward graphs. The simpler algorithms, such as Q-learning, struggle to obtain high Q-values, limiting their performance. Overall, the PMR-Dueling DQN clearly learns a better Q-function approximation resulting in superior path planning.
