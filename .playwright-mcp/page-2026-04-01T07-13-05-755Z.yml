                          - generic [ref=e3800]:
                            - text: "The mobile agent was given the responsibility of averting collisions with obstacles. Throughout the whole process, the agent could perform one of four actions: move up, move down, move right, or move left. The border and angle positions are exceptions, as one or more action options are not available. In addition, the agent could only take a step in each of the selected routes in a single action. The proposed environment is divided into cells, and some of those spaces are filled by barriers. If the mobile agent crashes into one of them, it is considered a collision (negative reward)."
                            - link "Figure 6" [ref=e3801] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-24-01523-f006"
                            - text: shows the path gained after the model was trained for the proposed PMR-Dueling DQN algorithm, DDQN algorithm, DQN algorithm, and Q-learning algorithm, respectively. As is shown, the path planning result of the PMR-Dueling DQN algorithm is better than all of the other three algorithms while DDQN performs better than DQN. DQN also performs better than the classical Q-learning algorithm.
