                          - generic [ref=e1884]: Figure 5. Architecture for the PMR-Dueling DQN network.
                        - generic [ref=e1885]: The network model has an input layer that contains key state information to inform the action selections of the output layer. The dimensions of these input and output layers differ slightly based on whether the agent is operating in the Gazebo simulation environment or the abstract grid world map.
                        - generic [ref=e1886]: In the case of the Gazebo 3D simulator, the state representation fed into the input layer consists of 10 variables describing aspects such as the agent’s current position, orientation, recent velocity, goal location, and obstacle proximity. Therefore, the input layer contains 64 neurons to match this 10-dimensional state space representation.
                        - generic [ref=e1887]: The output layer for the Gazebo environment consists of 7 neurons, each encoding one of the allowable actions. There are 2 actions for linear velocity control (forward/back) and 5 actions for angular velocity control (turning left/right and three different turn speeds). When the agent is alternatively placed in the 2D grid world map, the state representation contains only 4 dimensions—the x-y coordinates of the agent and goal. Correspondingly, the input layer has 64 neurons to match this reduced 4-dimensional state space. The grid world affords just 4 movement actions—up, down, left, right. So, the output layer consists of 4 neurons, each encoding one of these discrete navigation directions.
