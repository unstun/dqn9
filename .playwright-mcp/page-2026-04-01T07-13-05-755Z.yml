                            - text: "shows the final Q-table with their respective optimal actions from the final route for the PMR-Dueling DQN algorithm. The training process in each run generates a Q Table, which represents the desired action for each location. The four actions shown in the table are according to the following sequences: action to the up, action to the down, action to the right, and action to the left. The Q-values of the completed table indicate the optimal actions the agent decided after observing the environment. Some of the sequences of final actions to achieve the goal after the agent’s full action are shown as follows: down-down-down-down-right-down-down-right-right-right-right-down-right-down-down-right-right-right-right-down-down... etc. As is evident, the Q-table stores the reinforcement learning agent’s learned knowledge about the optimal policy through its exploration of the environment. Analyzing the table provides insights into how the states are valued and which actions were preferred in certain states. As the agent explored the states and refined the Q-values through updating rules, useful state-to-action mappings were learned. Examining tables generated at different stages of learning can provide a better understanding of how those mappings evolved from mostly random to more optimal focused policies. The learned Q-table essentially represents the summarized experiences of the agent which determine its behavioral policy."
                          - generic [ref=e3811]:
                            - generic [ref=e3812]: Table 3. The final Q-table values with their respective best actions for the PMR-Dueling DQN algorithm.
                            - generic [ref=e3814] [cursor=pointer]:
                              - img [ref=e3815]
                              - link [ref=e3816]:
                                - /url: "#table_body_display_sensors-24-01523-t003"
                          - generic [ref=e3817]: The technique for modifying the Q value is the most substantial difference between the four algorithms. The Dueling Deep Q-Network with Modified Rewards and Prioritized Experience Replay (PMR-Dueling DQN) algorithm gives more weight to experiences that provide valuable learning opportunities by combining deep neural networks, dueling architecture, shaped Rewards, and Prioritized Experience Replay, which can effectively learn control policies directly from raw sensory data in the given navigation environments resulting in improved training and potentially better action selection decisions compared to DDQN, DQN, and Q-learning. This provides much better data efficiency compared to tabular methods. The PMR-Dueling DQN also improves upon the original DQN algorithm by utilizing a dueling architecture to separately learn state value and action advantages. This helps mitigate overestimation bias, an issue that plagues both traditional Q-learning and DQN.
                          - generic [ref=e3818]: At the beginning of training, the visibility of agent movements from one place to another was intentionally slowed down to make it feasible to see and analyze its performance while adjusting the variables. A total of 35 experiments were conducted for all four algorithms with the same hyperparameters to obtain the optimal results.
                          - generic [ref=e3819]:
                            - text: As is shown in
                            - link "Figure 7" [ref=e3820] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-24-01523-f007"
                            - text: ", the PMR-Dueling DQN algorithm significantly outperformed the other methods in reaching the destination, converging in only 1000 training episodes. DDQN took 370 more episodes to locate the goal while basic DQN required 700 additional episodes. Tabular Q-learning exhibited no clear convergence trend even after being run for 3000 episodes, highlighting its poor sample efficiency. The PMR-Dueling DQN’s combination of deep neural networks, dueling architecture, Prioritized Experience Replay, and shaped Rewards enabled it to find optimal navigation policies with far greater speed and stability compared to DQN, DDQN, and tabular Q-learning."
                          - generic [ref=e3821]:
                            - generic [ref=e3823] [cursor=pointer]:
                              - img "Sensors 24 01523 g007" [ref=e3824]
                              - link [ref=e3825]:
                                - /url: "#fig_body_display_sensors-24-01523-f007"
                            - generic [ref=e3826]: "Figure 7. Training graphs of step changes over episodes: (a) for the PMR-Dueling DQN algorithm; (b) for the DDQN algorithm; (c) for the DQN algorithm; and (d) for the Q-learning algorithm."
                          - generic [ref=e3827]:
                            - link "Figure 8" [ref=e3828] [cursor=pointer]:
                              - /url: "#fig_body_display_sensors-24-01523-f008"
                            - text: shows that the PMR-Dueling DQN algorithm clearly achieved the best performance in terms of maximizing cumulative reward, reaching a maximum cumulative reward of 10 over the training episodes. This high average reward demonstrates the PMR-Dueling DQN’s ability to quickly and stably converge to an optimal navigation policy. DDQN attained a decent but lower average cumulative reward of eight, taking more episodes to learn an effective policy. DQN performed even worse, only accumulating a maximum average reward of six due to its tendency to overestimate values during training. Meanwhile, traditional Q-learning exhibited extremely poor cumulative rewards, acquiring negative costs for nearly all training episodes and completely failing to find any positive reward policies. This comparison highlights the significant advantages of the PMR-Dueling DQN, which combines innovations such as shaped Rewards and Prioritized Experience Replay with deep neural networks to substantially outperform the DQN, DDQN, and Q-learning methods in both sample efficiency and policy optimality for robot navigation.
