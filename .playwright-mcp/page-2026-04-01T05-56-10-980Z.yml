                - text: "s, this corresponds to 20 s). At each spawn event, we add 4 adults, 4 bicyclists, and 4 children, and assign them a lifetime of 80 steps. Agents whose age exceeds the lifetime are removed from the scene. New agents are sampled from a square region of width 40 m, positioned and oriented relative to the robot: we compute the unit direction vector from the robot to its goal and place the square center ahead of the robot by half of the square width along this direction. The square yaw is aligned with the same robot-to-goal direction. Start and goal positions for spawned agents are sampled on opposite edges of this oriented square (square-crossing), with rejection sampling to avoid immediate collisions with the robot, other agents, and static obstacles."
