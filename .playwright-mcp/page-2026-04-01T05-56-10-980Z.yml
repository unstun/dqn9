              - paragraph [ref=e1237]: All four graph construction methods are applicable in our HMP-DRL framework; the choice depends on the available map representation and the desired path characteristics. Occupancy grids are often preferred when maps originate from SLAM or semantic segmentation pipelines due to their simplicity and direct compatibility with sensor data. Navigation meshes provide an efficient representation for large open areas with complex obstacle shapes, enabling smooth paths through convex regions while naturally handling varying terrain costs. Voronoi-based graphs are advantageous when vector maps with polygon boundaries are available and maximum clearance from obstacles is prioritized over path length. Visibility graphs yield the shortest Euclidean paths but may require additional safety margins since trajectories can pass close to obstacle corners.
