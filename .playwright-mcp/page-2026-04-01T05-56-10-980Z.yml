          - heading "1 Introduction" [level=2] [ref=e88]:
            - generic [ref=e89]: "1"
            - text: Introduction
          - paragraph [ref=e91]:
            - text: Mobile robots are rapidly transitioning from controlled industrial settings to complex, human-centric environments. Robots designed to assist humans are increasingly being deployed across a wide range of sectors, including manufacturing and industrial automation, agriculture, space exploration, healthcare, domestic assistance, logistics and delivery, and facility and public-space services
            - generic [ref=e92]:
              - text: "["
              - generic [ref=e93]: Siegwart2011
              - text: ","
              - generic [ref=e94]: FRAGAPANE2021405
              - text: ","
              - generic [ref=e95]: AutonomousRobots
              - text: "]"
            - text: . Autonomous mobile robots combine a mobile platform, sensors, and onboard intelligence to adapt in real time to dynamic environments, rather than depending on fixed infrastructure like automated guided vehicles (AGVs). A central capability underlying these systems is autonomous navigation, which allows a robot to operate independently, perceive the environment, and act safely to achieve specified goals without operator supervision or control.
          - paragraph [ref=e97]:
            - text: Typical applications of autonomous robots include material handling in warehouses and factories; hospital logistics (e.g., transporting laboratory samples, blood components, and medications); service robots in commercial buildings and hotels for indoor delivery and visitor guidance; autonomous cleaning; security patrol and inspection; and last-mile urban delivery of groceries, meals, and parcels
            - generic [ref=e98]:
              - text: "["
              - generic [ref=e99]: AutonomousRobots
              - text: ","
              - generic [ref=e100]: drew2021multi
              - text: ","
              - generic [ref=e101]: KRUSE20131726
              - text: "]"
            - text: .
          - paragraph [ref=e103]:
            - text: "The core challenge in such deployments is twofold: traversing large-scale, structurally complex environments (global planning) while safely interacting with diverse dynamic agents (local planning and collisions avoidance). Consider a sidewalk delivery robot"
            - generic [ref=e104]:
              - text: "["
              - generic [ref=e105]: SADR
              - text: "]"
            - text: "operating in an urban setting: it must travel up to several kilometers, traversing diverse surfaces such as sidewalks and crosswalks, while accounting for static obstacles like buildings, bus stops, flowerbeds and curbs. Traditional search-based planners (e.g., A*, Dijkstra) excel at finding optimal paths over these long distances using static maps but struggle to react fluidly to unmapped, moving entities."
          - paragraph [ref=e107]:
            - text: Conversely, Deep Reinforcement Learning (DRL) methods have demonstrated superior performance in local collision avoidance and crowd navigation
            - generic [ref=e108]:
              - text: "["
              - generic [ref=e109]: CADRL
              - text: ","
              - generic [ref=e110]: SARL
              - text: ","
              - generic [ref=e111]: EBCADRL
              - text: "]"
            - text: . However, pure DRL approaches typically lack global context. When applied to large environments with complex geometry, they often fail to reach distant goals, getting trapped in local minima due to the absence of global guidance.
          - paragraph [ref=e113]: Furthermore, safe navigation requires more than just treating obstacles as generic geometric shapes. A robot must navigate in a socially compliant manner, accounting for the semantic diversity of the environmental entities around it. A child, a bicyclist, an adult, and a concrete wall all impose different safety constraints and motion patterns. Treating a vulnerable pedestrian with the same safety margin as a static obstacle is insufficient for socially compliant navigation.
          - paragraph [ref=e115]:
            - text: To address these challenges, we introduce
            - emphasis [ref=e116]: Hybrid Motion Planning with Deep Reinforcement Learning
            - text: (HMP-DRL), a novel hybrid method that bridges the gap between global path planning and local motion planning with entity-aware collision avoidance. Our approach leverages a global path planner to provide long-term guidance through complex static environments (handling curbs, walls, and restricted zones), while a local DRL policy handles immediate interaction with dynamic agents and static entities. This decomposition allows the robot to navigate kilometers without losing its way, while simultaneously exhibiting sophisticated, entity-aware collision avoidance to ensure safe navigation.
          - generic [ref=e117]:
            - paragraph [ref=e118]: "Our main contributions are as follows:"
            - list [ref=e119]:
              - listitem [ref=e120]:
                - text: •
                - paragraph [ref=e122]: We propose a hybrid motion planning method that combines graph-based global search with deep RL-based local planning. This hybrid structure enables the robot to utilize map information for reaching distant goals while maintaining the reactivity required for dynamic obstacle avoidance.
              - listitem [ref=e123]:
                - text: •
                - paragraph [ref=e125]: We design a reward function that encourages the robot to follow the global path and minimize travel time. The function uses semantic awareness by penalizing the robot differently depending on the type of agent or obstacle it encounters. Specifically, the required safe distance and collision penalties are dynamically adjusted based on the entity type, resulting in safer and more socially compliant behavior.
              - listitem [ref=e126]:
                - text: •
                - paragraph [ref=e128]: We introduce a training and testing environment designed to mimic realistic outdoor settings with various static and dynamic obstacles. Our experimental results demonstrate that this new approach consistently outperforms standard navigation techniques, including state-of-the-art methods.
        - generic [ref=e129]:
          - heading "2 Related Work" [level=2] [ref=e130]:
            - generic [ref=e131]: "2"
            - text: Related Work
          - paragraph [ref=e133]: Robot navigation research has evolved from traditional rule-based methods and classical planning algorithms to learning-based approaches, with recent work focusing on crowd navigation and hybrid architectures that combine global and local planning.
          - paragraph [ref=e135]:
            - text: Classical approaches such as the Social Force Model (SFM)
            - generic [ref=e136]:
              - text: "["
              - generic [ref=e137]: social_force
              - text: "]"
            - text: and Optimal Reciprocal Collision Avoidance (ORCA)
            - generic [ref=e138]:
              - text: "["
              - generic [ref=e139]: ORCA
              - text: "]"
            - text: use hand-crafted interaction rules for collision avoidance. SFM applies attractive and repulsive forces but is prone to local minima; ORCA uses velocity constraints under reciprocal assumptions, expecting all agents to cooperate equally in avoiding collisions—an assumption rarely met in real-world settings with unpredictable pedestrians. Both methods can produce short-sighted or unnatural behavior and struggle to generalize across diverse social environments.
          - paragraph [ref=e141]:
            - text: Learning-based methods have gained significant attention as alternatives to hand-crafted rules. Imitation learning approaches derive navigation strategies from demonstrations of desired behaviors. For example,
            - generic [ref=e142]:
              - text: "["
              - generic [ref=e143]: navigation_raw_depth_inputs_2018
              - text: "]"
            - text: combines behavior cloning with generative adversarial imitation learning (GAIL) to develop a policy that operates directly on raw depth images, bypassing explicit pedestrian tracking.
            - generic [ref=e144]:
              - text: "["
              - generic [ref=e145]: Kretzschmar_2016
              - text: "]"
            - text: applies maximum entropy inverse RL to model human navigation as a mixture distribution capturing both discrete decisions (e.g., passing left or right) and continuous trajectory variance. However, these methods depend heavily on the quality and scale of demonstrations, which can be resource-intensive to collect and may limit generalization to novel scenarios.
          - paragraph [ref=e147]:
            - text: Deep reinforcement learning (DRL) offers an alternative approach by treating navigation as a sequential decision-making problem. CADRL
            - generic [ref=e148]:
              - text: "["
              - generic [ref=e149]: CADRL
              - text: "]"
            - text: formulates decentralized multi-agent collision avoidance by training a value network that estimates time-to-goal from the joint state of the robot and its neighbors, achieving faster navigation than ORCA while remaining real-time implementable. SA-CADRL
            - generic [ref=e150]:
              - text: "["
              - generic [ref=e151]: socially_aware_2017
              - text: "]"
            - text: extends this idea with norm-inducing rewards that penalize violations of social conventions (e.g., passing on the wrong side) and a symmetric network architecture with weight-sharing and max-pooling to handle variable numbers of agents, trading some efficiency for socially compliant behavior. To better scale to dense crowds, LSTM-RL
            - generic [ref=e152]:
              - text: "["
              - generic [ref=e153]: LSTM-RL
              - text: "]"
            - text: uses recurrent networks to encode an arbitrary number of neighboring agents, significantly reducing failure rates in crowded scenarios. SARL
            - generic [ref=e154]:
              - text: "["
              - generic [ref=e155]: SARL
              - text: "]"
            - text: further improves crowd modeling through an attention-based value network that jointly reasons about human-robot and human-human interactions, enhancing anticipation of crowd dynamics. More recently,
            - generic [ref=e156]:
              - text: "["
              - generic [ref=e157]: Xue2024
              - text: "]"
            - text: proposes a spatial-temporal value network and a hazard-aware reward structure that explicitly reasons about pedestrian speeds and hazardous regions to improve safety and comfort. Recently, EB-CADRL
            - generic [ref=e158]:
              - text: "["
              - generic [ref=e159]: EBCADRL
              - text: "]"
            - text: introduced entity-type awareness into the state representation and reward function, enabling differentiated safety margins for various agent types. The method demonstrated superior safety for vulnerable agents in dense crowds and achieved significant training speedups through parallelized experience collection.
          - paragraph [ref=e161]: A significant limitation of pure DRL methods is that they focus primarily on local collision avoidance and are typically trained and evaluated in small, bounded environments. When applied to large-scale maps or long-range navigation tasks, these methods fail to reach distant goals, often getting stuck or exhibiting suboptimal behavior due to the absence of global path guidance. Furthermore, they neglect static environmental structures such as buildings, walls, and terrain boundaries. To bridge this gap, recent research has explored hybrid approaches that combine classical path planning with learning-based local control.
          - paragraph [ref=e163]:
            - text: DRL-based hybrid methods integrate global planners with learned local policies. SARL*
            - generic [ref=e164]:
              - text: "["
              - generic [ref=e165]: SARL_STAR
              - text: "]"
            - text: extends SARL by using Dijkstra’s algorithm for dynamic local goal setting and a map-based safe action space; however, it rebuilds paths every time step (computationally inefficient) and relies on rule-based action filtering rather than learned obstacle avoidance. G2RL
            - generic [ref=e166]:
              - text: "["
              - generic [ref=e167]: G2RL
              - text: "]"
            - text: incorporates a static A* path as a guidance channel into the DRL state space, but the fixed global path becomes problematic when obstacles block the path, and the coarse discretization (4-directional actions on
            - math [ref=e168]:
              - generic [ref=e170]:
                - generic [ref=e171]: "200"
                - generic [ref=e172]: ×
                - generic [ref=e173]: "200"
            - text: grids) limits real-world applicability. Similarly,
            - generic [ref=e174]:
              - text: "["
              - generic [ref=e175]: Yurtsever2020
              - text: "]"
            - text: integrates A* with a DQN agent for automated driving, demonstrating faster convergence, but lacks pedestrian awareness and uses discrete actions resulting in jerky control. GDAE
            - generic [ref=e176]:
              - text: "["
              - generic [ref=e177]: GDAE
              - text: "]"
            - text: combines frontier-based waypoint selection with TD3 for unknown environments but does not utilize a global path and lacks dynamic obstacle handling. VDPF-TD3
            - generic [ref=e178]:
              - text: "["
              - generic [ref=e179]: VDPF_TD3
              - text: "]"
            - text: uses TD3 to optimize the balance between modified potential field forces, effectively escaping local optima, but relies on geometric obstacle representations and lacks real-world validation.
          - paragraph [ref=e181]:
            - text: Classical hybrid planners combine global path planning with reactive local control. Zhong et al.
            - generic [ref=e182]:
              - text: "["
              - generic [ref=e183]: SafeAStar_DWA
              - text: "]"
            - text: propose Safe A* with risk-aware costs combined with an Adaptive Window Approach, while IAB-A*
            - generic [ref=e184]:
              - text: "["
              - generic [ref=e185]: IAB_AStar
              - text: "]"
            - text: introduces bidirectional search with B-spline smoothing integrated with DWA. Both methods achieve computational efficiency but depend heavily on manually tuned parameters and do not differentiate between obstacle types. The RC-Map approach
            - generic [ref=e186]:
              - text: "["
              - generic [ref=e187]: RCMap
              - text: "]"
            - text: uses rectangular decomposition for fast topological planning (10ms vs 740ms for grid methods) but produces sub-optimal paths and struggles with non-orthogonal environments.
          - paragraph [ref=e189]:
            - text: Sampling-based hybrids improve path search efficiency. RRTstar-RL
            - generic [ref=e190]:
              - text: "["
              - generic [ref=e191]: RRTstar_RL
              - text: "]"
            - text: replaces uniform RRT* sampling with a learned probability distribution, achieving 28% shorter paths and 2x speedup, but requires extensive training data and lacks mechanisms for dynamic obstacle avoidance.
          - paragraph [ref=e193]: Our HMP-DRL approach addresses these limitations by (i) computing a single global path per episode and using its checkpoints in both the reward and the network input to provide path guidance at low cost, (ii) learning collision avoidance directly through the reward with a fine-grained discrete action space that still enables smooth motion, and (iii) encoding entity types in the state and reward to achieve socially compliant navigation with type-dependent safety margins.
