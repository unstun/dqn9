        - generic [ref=e4976]:
          - heading "6 Conclusion" [level=2] [ref=e4977]:
            - generic [ref=e4978]: "6"
            - text: Conclusion
          - paragraph [ref=e4980]:
            - text: In this work, we proposed
            - emphasis [ref=e4981]: Hybrid Motion Planning with Deep Reinforcement Learning
            - text: (HMP-DRL), a hybrid navigation approach that couples a graph-based global planner with a local DRL policy. The global level computes global path and converts it into a sequence of distance-spaced checkpoints. The local level extends an attention-based, entity-aware value network with checkpoint features and trains it with reward shaping that encourages progress along the route while enforcing type-dependent safety margins and collision penalties for different entities.
          - paragraph [ref=e4983]: "Experiments in a large-scale urban simulator derived from OpenStreetMap, with dense ORCA-controlled traffic, show that HMP-DRL improves both reliability and safety. On the main test set, it achieves a success rate of 0.836 (vs. 0.649 for EB-CADRL and 0.524 for SARL) with a lower overall collision rate of 0.123 and faster traversal time (72.03 s on average). The largest gain is for the most vulnerable entity type: collisions with children drop to 0.004, yielding the best weighted safety score (0.685). An ablation study further confirms the role of route guidance: disabling checkpoint rewards reduces the success rate from 0.836 to 0.615 and the weighted score from 0.685 to 0.432."
          - paragraph [ref=e4985]: Future research directions include integrating dynamic occupancy maps with online graph re-planning, adding additional entity types (e.g., cars and motorcycles), training policies for complex scenarios—such as road crossings with dynamic vehicles, and real-world testing.
