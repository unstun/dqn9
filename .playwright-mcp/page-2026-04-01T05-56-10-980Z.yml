        - heading "Hybrid Motion Planning with Deep Reinforcement Learning for Mobile Robot Navigation" [level=1] [ref=e57]
        - generic [ref=e60]:
          - text: Yury Kolomeytsev
          - text: Department of Computational Mathematics and Cybernetics Lomonosov Moscow State University
          - generic [ref=e61]: yury.kolomeytsev@gmail.com
