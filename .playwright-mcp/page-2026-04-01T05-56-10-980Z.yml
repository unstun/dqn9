            - paragraph [ref=e3876]: The global path is computed once per episode, avoiding the computational overhead of replanning at every step. Since each episode has a unique start-goal pair, the robot learns to follow diverse paths through the environment. The checkpoint features provide the local planner with global context, enabling navigation over long distances while the attention-based value network handles dynamic obstacle avoidance.
