              - text: ". Enabling checkpoint rewards substantially improves navigation performance: the success rate increases from 0.615 to 0.836 and the weighted score increases from 0.432 to 0.685. The policy also reaches the goal faster on average (72.03 s vs. 79.59 s), indicating more efficient progress and fewer stalled trajectories. Safety improves primarily for the most challenging dynamic entities: collisions with bicycles decrease (0.054"
