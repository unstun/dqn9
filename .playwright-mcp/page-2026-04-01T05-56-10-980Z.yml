          - heading "4 Proposed Approach" [level=2] [ref=e883]:
            - generic [ref=e884]: "4"
            - text: Proposed Approach
          - paragraph [ref=e886]: In this section, we introduce our new approach which we call Hybrid Motion Planning with Deep Reinforcement Learning (HMP-DRL). HMP-DRL combines a global graph-based path planner with a local deep reinforcement learning policy, enabling long-range navigation through complex environments with static and dynamic obstacles while maintaining entity-aware collision avoidance for safe, socially compliant interaction with dynamic agents.
          - generic [ref=e887]:
            - heading "4.1 Global Planning" [level=3] [ref=e888]:
              - generic [ref=e889]: "4.1"
              - text: Global Planning
            - paragraph [ref=e891]: Global path planning determines an optimal collision-free path from a starting position to a goal within a known or partially known environment. The core idea is to construct a graph representation of the navigable space and then apply a search algorithm to find the best path through this graph. The global planner considers the map and known static obstacles. Dynamic agents and static obstacles not present on the map are unknown at global planning time but are detected by the robot’s sensors during navigation and handled by the local planner in real time.
            - generic [ref=e892]:
              - heading "Graph Construction Methods." [level=4] [ref=e893]
              - paragraph [ref=e895]: "A fundamental aspect of global planning is the construction of a graph that captures the connectivity of free space. Different methods can be used to build such graphs, each with distinct advantages:"
              - list [ref=e897]:
                - listitem [ref=e898]:
                  - text: •
                  - paragraph [ref=e900]: Occupancy Grids. The environment is discretized into a regular grid of cells, where each cell is marked as occupied or free based on the presence of obstacles. Nodes are placed at the centers of free cells, and edges connect adjacent nodes, enabling grid-based pathfinding algorithms. This method is straightforward, widely used in 2D environments, and integrates seamlessly with sensor data such as occupancy maps.
                - listitem [ref=e901]:
                  - text: •
                  - paragraph [ref=e903]:
                    - text: Navigation Meshes. Free space can be partitioned into a set of connected polygons, most commonly triangles or quadrangles, using cell decomposition methods
                    - generic [ref=e904]:
                      - text: "["
                      - generic [ref=e905]: Latombe2012
                      - text: "]"
                    - text: . Unlike uniform grids, mesh-based representations such as Irregular Triangular Meshes (ITM) and Varying-size ITMs (VITM) can better conform to obstacle boundaries. In particular, VITM enables local refinement in narrow passages while maintaining coarser cells in open areas, providing a balance between geometric fidelity and computational complexity
                    - generic [ref=e906]:
                      - text: "["
                      - generic [ref=e907]: Kallmann2005
                      - text: "]"
                    - text: . Quadrangle (QUAD) representations, although less flexible in approximating irregular or oblique obstacle boundaries, offer a simple and structured topology with predictable neighbor relationships. When an inflation layer is applied to account for robot size, QUAD meshes are generally less sensitive than fixed-size triangular meshes, but they may fail to preserve connectivity in narrow or cluttered environments unless a fine resolution is used. In contrast, varying-size triangular meshes demonstrate greater robustness under inflation, particularly in environments with narrow passages, online map updates, or multiple robots with differing dimensions, making them more suitable for such scenarios
                    - generic [ref=e908]:
                      - text: "["
                      - generic [ref=e909]: Meysami2022
                      - text: "]"
                    - text: .
                - listitem [ref=e910]:
                  - text: •
                  - paragraph [ref=e912]:
                    - text: Voronoi Diagrams. Given a vectorized map with polygonal obstacle boundaries, a Generalized Voronoi Diagram (GVD) of the free space can be constructed
                    - generic [ref=e913]:
                      - text: "["
                      - generic [ref=e914]: Choset1997GVG
                      - text: ","
                      - generic [ref=e915]: Aurenhammer1991
                      - text: "]"
                    - text: . The GVD edges consist of points equidistant to two or more obstacles, forming a sparse skeleton of the navigable space. The Voronoi vertices (where edges meet) serve as nodes, and the edges themselves serve as paths in the planning graph. Paths computed on Voronoi-based graphs locally maximize clearance from obstacles, improving safety in cluttered or narrow environments, albeit often at the cost of increased path length compared to shortest-path methods.
                - listitem [ref=e916]:
                  - text: •
                  - paragraph [ref=e918]:
                    - text: Visibility Graphs. In environments with polygonal obstacles, nodes can represent the start, goal, and obstacle vertices, with edges connecting mutually visible pairs
                    - generic [ref=e919]:
                      - text: "["
                      - generic [ref=e920]: LozanoPerez1979
                      - text: ","
                      - generic [ref=e921]: VG_path_planning_2023
                      - text: "]"
                    - text: . This yields the shortest path in terms of Euclidean distance but may produce trajectories that pass too close to obstacle corners.
